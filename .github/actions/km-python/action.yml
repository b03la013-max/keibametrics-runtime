name: KeibaMetrics Python (hosted or Owner Mac)
description: >
  On GitHub-hosted runners this is a no-op (ubuntu ships Python 3.12).
  On the Owner's self-hosted Mac it selects Python >= 3.12 (3.9 changes float sums and breaks
  replays), creates a venv, puts it first on PATH and points urllib at certifi's CA bundle.
runs:
  using: composite
  steps:
    - if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        PYBIN=""
        for c in python3.14 python3.13 python3.12 \
                 /Library/Frameworks/Python.framework/Versions/3.14/bin/python3 \
                 /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 \
                 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 /opt/homebrew/bin/python3 python3; do
          if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)'; then
            PYBIN="$c"; break
          fi
        done
        [ -n "$PYBIN" ] || { echo "PYTHON_3_12_REQUIRED on the Mac (python.org or Homebrew)"; exit 1; }
        "$PYBIN" -m venv "$RUNNER_TEMP/kmjra-venv"
        echo "$RUNNER_TEMP/kmjra-venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/kmjra-venv/bin/python" -m pip install -q --disable-pip-version-check certifi
        echo "SSL_CERT_FILE=$("$RUNNER_TEMP/kmjra-venv/bin/python" -m certifi)" >> "$GITHUB_ENV"
    - if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      shell: bash
      env:
        GH_CLI_VERSION: "2.62.0"
      run: |
        set -euo pipefail
        if command -v gh >/dev/null 2>&1; then gh --version | head -1; exit 0; fi
        case "$(uname -m)" in arm64) ARCH=arm64 ;; *) ARCH=amd64 ;; esac
        DIR="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/gh/${GH_CLI_VERSION}"
        NAME="gh_${GH_CLI_VERSION}_macOS_${ARCH}"
        if [ ! -x "$DIR/$NAME/bin/gh" ]; then
          mkdir -p "$DIR"
          curl -fsSL --retry 3 -o "$DIR/gh.zip" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${NAME}.zip"
          (cd "$DIR" && unzip -q -o gh.zip && rm -f gh.zip)
        fi
        echo "$DIR/$NAME/bin" >> "$GITHUB_PATH"
        "$DIR/$NAME/bin/gh" --version | head -1
