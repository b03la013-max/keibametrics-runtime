name: JRA Source Objective v0.3 Acceptance
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - "runtime/jra_source_objective_evaluator.py"
      - "tests/test_jra_source_objective_evaluator.py"
      - ".github/workflows/km-jra-source-objective-v03-acceptance.yml"
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q pytest
      - name: Verify objective shadow DCR fail-closed
        run: |
          python -m py_compile runtime/jra_source_objective_evaluator.py
          python -m pytest -q tests/test_jra_source_objective_evaluator.py
          python - <<'PY'
          from pathlib import Path
          src=Path("runtime/jra_source_objective_evaluator.py").read_text(encoding="utf-8")
          assert 'PROFILE = "KM-JRA-SOURCE-OBJECTIVE-EVALUATOR-v0.3-20260926"' in src
          assert "def _dcr_readiness" in src
          assert '"formal_production_ready":bool(base_ready and dcr_ready["ready"])' in src
          assert "for k in []" not in src
          assert "NO-AUTO-PROMOTION" in src
          print("OBJECTIVE_V03_DCR_FAIL_CLOSED=PASS")
          PY
      - name: Persist acceptance
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={
            "profile":"KM-JRA-SOURCE-OBJECTIVE-v0.3-ACCEPTANCE-20260926",
            "status":"PASS",
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "source_sha":os.environ["GITHUB_SHA"],
            "objective_evaluator":"KM-JRA-SOURCE-OBJECTIVE-EVALUATOR-v0.3-20260926",
            "dcr_fail_closed":True,
            "production_effect":"NONE / SHADOW ONLY",
            "unknown_future_empirical_acceptance":"PENDING"
          }
          p=Path("runtime/acceptance/jra_source_objective_v03.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2),encoding="utf-8")
          PY
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/acceptance/jra_source_objective_v03.json
          git commit -m "ci: persist JRA source objective v0.3 PASS [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
