name: JRA Horse Page Person Link Probe
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-horse-page-person-link-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Probe horse page for person profile links
        run: |
          python - <<'PY'
          import sys,re,json,urllib.request,urllib.parse
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode
          token="pw01dud002023101860/39"
          url="https://www.jra.go.jp/JRADB/accessU.html?"+urllib.parse.urlencode({"CNAME":token})
          req=urllib.request.Request(url,headers={"User-Agent":"KeibaMetrics-JRA-Person-Discovery/1.0","Accept":"text/html,*/*;q=0.1","Accept-Language":"ja,en;q=0.4"})
          with urllib.request.urlopen(req,timeout=30) as r:
            raw=r.read(3000000); h={str(k).lower():str(v) for k,v in r.headers.items()}
          s=_decode(raw,h.get("content-type",""))
          out={}
          for key,page in [("jockey","accessK"),("trainer","accessC")]:
            vals=[]
            pats=[
              r"""href=["'][^"']*"""+page+r"""\.html[^"']*CNAME=([^"'&<>\s]+)[^"']*["'][^>]*>(.*?)</a>""",
              r"""doAction\(\s*["'][^"']*"""+page+r"""\.html["']\s*,\s*["']([^"']+)["']\s*\)""",
            ]
            for pat in pats:
              for m in re.finditer(pat,s,re.I|re.S):
                token2=urllib.parse.unquote(m.group(1))
                label=""
                if m.lastindex and m.lastindex>=2:
                  label=re.sub(r"<[^>]+>","",m.group(2)); label=re.sub(r"\s+"," ",label).strip()
                x={"token":token2,"label":label}
                if x not in vals: vals.append(x)
            out[key]=vals
          hrefs=sorted(set(re.findall(r"""href=["']([^"']*JRADB[^"']*)["']""",s,re.I)))
          print(json.dumps({"person_tokens":out,"jradb_hrefs":hrefs[:100]},ensure_ascii=False,indent=2))
          PY
