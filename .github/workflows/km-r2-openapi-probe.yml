name: KM R2 E2E Acceptance Probe
on:
  push:
    branches:
      - km-r2-e2e-probe-20260920
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Run corrected R2 acceptance test
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, sys

          BASE='https://quorumprobe-production.up.railway.app'
          SEED=20260920

          def http(method, path, obj=None, label=''):
              data=None if obj is None else json.dumps(obj,separators=(',',':')).encode()
              req=urllib.request.Request(BASE+path,data=data,method=method,headers={'content-type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=180) as r:
                      raw=r.read().decode('utf-8','replace')
                      try: parsed=json.loads(raw)
                      except Exception: parsed=raw
                      print('HTTP',label or path,r.status)
                      return r.status, parsed
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: parsed=json.loads(raw)
                  except Exception: parsed=raw
                  print('HTTP',label or path,e.code)
                  return e.code, parsed
              except Exception as e:
                  print('HTTP',label or path,'EXCEPTION',repr(e))
                  return 0, {'exception':repr(e)}

          def receipt_status(env):
              if not isinstance(env,dict): return None
              r=env.get('receipt')
              return r.get('status') if isinstance(r,dict) else env.get('status')

          def verify(label, envelope):
              st,r=http('POST','/verify',envelope,label='VERIFY_'+label)
              valid=(st in (200,201) and isinstance(r,dict) and r.get('valid') is True)
              print(label+'_VERIFY_RESULT',json.dumps(r,ensure_ascii=False) if isinstance(r,dict) else str(r))
              return valid,r

          # Health
          hs,hr=http('GET','/health',label='HEALTH')
          print('HEALTH_BODY',json.dumps(hr,ensure_ascii=False) if isinstance(hr,dict) else str(hr))

          # Negative gate: krs_executable stays true; UNRESOLVED alone must block.
          neg_race='KM-R2-E2E-ACCEPT-20260920-T02-NEG'
          neg={
            'race_id':neg_race,
            'test_fixture':True,
            'runner_universe':[
              {'horse_no':1,'name':'R2-NEG-1'},
              {'horse_no':2,'name':'R2-NEG-2'},
              {'horse_no':3,'name':'R2-NEG-3'}
            ],
            'required_indices':[
              {'name':'SRI','status':'CALCULATED','value':50,'runner_id':'1','source_fact':'fixture','calculation_rule_id':'TEST-SRI','rule_version':'R2'},
              {'name':'HPI','status':'UNRESOLVED','runner_id':'2','source_fact':'fixture-missing','calculation_rule_id':'TEST-HPI','rule_version':'R2'},
              {'name':'TPI','status':'CALCULATED','value':50,'runner_id':'3','source_fact':'fixture','calculation_rule_id':'TEST-TPI','rule_version':'R2'}
            ],
            'required_index_manifest':{
              'required_count':3,'terminal_count':2,'unresolved_count':1,'status':'INDEX-BLOCKED'
            },
            'static_prediction':{'ranking':[1,2,3],'roles':{'1':['W'],'2':['P2'],'3':['P3']}},
            'prediction_cutoff':'2026-09-20T10:40:00+09:00',
            'krs_required':True,
            'krs_executable':True
          }
          neg_status,neg_env=http('POST','/pre-krs',neg,label='NEG_PRE_KRS')
          neg_stat=receipt_status(neg_env)
          neg_errors=(neg_env.get('receipt',{}).get('errors',[]) if isinstance(neg_env,dict) else [])
          neg_blocked = not (neg_status in (200,201) and neg_stat=='PASS')
          print('NEG_PRE_KRS_STATUS',neg_stat)
          print('NEG_PRE_KRS_ERRORS',json.dumps(neg_errors,ensure_ascii=False))
          print('NEGATIVE_INDEX_GATE_BLOCKED',neg_blocked)

          # Positive PRE_KRS
          race='KM-R2-E2E-ACCEPT-20260920-T02'
          runners=[
            {'horse_no':1,'name':'R2-ACC-1'},
            {'horse_no':2,'name':'R2-ACC-2'},
            {'horse_no':3,'name':'R2-ACC-3'}
          ]
          req=[]
          for h in runners:
              n=str(h['horse_no'])
              req.extend([
                {'name':'SRI','status':'CALCULATED','value':60-h['horse_no'],'runner_id':n,'source_fact':'fixture','calculation_rule_id':'TEST-SRI','rule_version':'R2'},
                {'name':'HPI','status':'CALCULATED','value':55-h['horse_no'],'runner_id':n,'source_fact':'fixture','calculation_rule_id':'TEST-HPI','rule_version':'R2'},
                {'name':'TPI','status':'CALCULATED','value':50-h['horse_no'],'runner_id':n,'source_fact':'fixture','calculation_rule_id':'TEST-TPI','rule_version':'R2'}
              ])
          pre={
            'race_id':race,
            'test_fixture':True,
            'runner_universe':runners,
            'required_indices':req,
            'required_index_manifest':{
              'required_count':len(req),'terminal_count':len(req),'unresolved_count':0,'status':'PASS'
            },
            'static_prediction':{'ranking':[1,2,3],'roles':{'1':['W'],'2':['P2'],'3':['P3']}},
            'prediction_cutoff':'2026-09-20T10:40:00+09:00',
            'krs_required':True,
            'krs_executable':True
          }
          pre_status,pre_env=http('POST','/pre-krs',pre,label='PRE_KRS')
          pre_stat=receipt_status(pre_env)
          print('PRE_KRS_STATUS',pre_stat)
          print('PRE_KRS_RECEIPT_SHA',pre_env.get('receipt_sha256') if isinstance(pre_env,dict) else None)
          pre_verified=False
          if pre_status in (200,201) and isinstance(pre_env,dict):
              pre_verified,_=verify('PRE_KRS',pre_env)
          print('PRE_KRS_VERIFIED',pre_verified)

          # KRS 5000
          krs_payload={
            'race_id':race,
            'input_data':{
              'race':{'race_id':race,'test_fixture':True},
              'environment':{},
              'horses':[
                {'horse_no':1,'name':'R2-ACC-1','hsv':{},'static_roles':['W']},
                {'horse_no':2,'name':'R2-ACC-2','hsv':{},'static_roles':['P2']},
                {'horse_no':3,'name':'R2-ACC-3','hsv':{},'static_roles':['P3']}
              ],
              'simulation':{'run_count':5000,'master_seed':SEED}
            },
            'mode':'SIM-STD',
            'seed':SEED,
            'input_class':'MINIMUM-EXECUTABLE'
          }
          krs_status,krs_env=http('POST','/krs/execute',krs_payload,label='KRS')
          run_env=krs_env.get('run_receipt',{}) if isinstance(krs_env,dict) else {}
          rr=run_env.get('receipt',{}) if isinstance(run_env,dict) else {}
          actual=rr.get('actual_run_count')
          requested=rr.get('requested_run_count')
          print('KRS_STATUS',rr.get('status'))
          print('KRS_MODE',rr.get('mode'))
          print('KRS_REQUESTED',requested)
          print('KRS_ACTUAL',actual)
          print('KRS_ENGINE_SHA',rr.get('engine_sha256'))
          print('KRS_PARAM_SHA',rr.get('parameter_map_sha256'))
          print('KRS_INPUT_SHA',rr.get('input_sha256'))
          print('KRS_OUTPUT_SHA',rr.get('output_sha256'))
          print('KRS_RECEIPT_SHA',run_env.get('receipt_sha256') if isinstance(run_env,dict) else None)
          run_count_ok=isinstance(actual,int) and actual>=5000 and actual==requested
          krs_verified=False
          if krs_status in (200,201) and isinstance(run_env,dict) and run_env:
              krs_verified,_=verify('KRS',run_env)
          print('KRS_5000_OK',run_count_ok)
          print('KRS_VERIFIED',krs_verified)

          # Final prediction/ticket/capital
          outsha=rr.get('output_sha256')
          tickets=[
            {'bet_type':'WIN','selection':[1],'stake':100},
            {'bet_type':'PLACE','selection':[2],'stake':100},
            {'bet_type':'QUINELLA','selection':[1,2],'stake':100},
            {'bet_type':'WIDE','selection':[1,2],'stake':100},
            {'bet_type':'EXACTA','selection':[1,2],'orientation':'1>2','stake':100},
            {'bet_type':'TRIO','selection':[1,2,3],'stake':100},
            {'bet_type':'TRIFECTA','selection':[1,2,3],'orientation':'1>2>3','stake':100}
          ]
          decisions=[
            {'bet_type':'WIN','selection_key':'1','decision_status':'PURCHASED','stake':100},
            {'bet_type':'PLACE','selection_key':'2','decision_status':'PURCHASED','stake':100},
            {'bet_type':'QUINELLA','selection_key':'1-2','decision_status':'PURCHASED','stake':100},
            {'bet_type':'WIDE','selection_key':'1-2','decision_status':'PURCHASED','stake':100},
            {'bet_type':'EXACTA','selection_key':'1>2','decision_status':'PURCHASED','stake':100},
            {'bet_type':'TRIO','selection_key':'1-2-3','decision_status':'PURCHASED','stake':100},
            {'bet_type':'TRIFECTA','selection_key':'1>2>3','decision_status':'PURCHASED','stake':100},
            {'bet_type':'BRACKET_QUINELLA','selection_key':'NA','decision_status':'NOT-APPLICABLE','stake':0}
          ]
          final_payload={
            'race_id':race,
            'test_fixture':True,
            'no_bet':False,
            'krs_required':True,
            'krs_executable':True,
            'krs_run_receipt':run_env,
            'final_prediction_package':{
              'ranking':[1,2,3],
              'roles':{'1':['W'],'2':['P2'],'3':['P3']},
              'prediction_source':'PRE_KRS+KRS_SIM_STD_5000',
              'krs_output_sha256':outsha
            },
            'ticket_transport':tickets,
            'ticket_decisions':decisions,
            'capital':{'budget':700,'allocated':700,'unallocated':0,'status':'PASS'},
            'final_ticket':{
              'finalized':True,
              'frozen_at':'2026-09-20T10:41:00+09:00',
              'no_bet':False,
              'total_investment':700,
              'tickets':tickets
            },
            'final_freeze_timestamp':'2026-09-20T10:41:00+09:00'
          }
          final_status,final_env=http('POST','/final',final_payload,label='FINAL')
          final_stat=receipt_status(final_env)
          final_errors=(final_env.get('receipt',{}).get('errors',[]) if isinstance(final_env,dict) else [])
          print('FINAL_STATUS',final_stat)
          print('FINAL_ERRORS',json.dumps(final_errors,ensure_ascii=False))
          print('FINAL_RECEIPT_SHA',final_env.get('receipt_sha256') if isinstance(final_env,dict) else None)
          final_verified=False
          if final_status in (200,201) and isinstance(final_env,dict):
              final_verified,_=verify('FINAL',final_env)
          print('FINAL_VERIFIED',final_verified)

          pre_pass=(pre_status in (200,201) and pre_stat=='PASS')
          krs_exec=(krs_status in (200,201) and rr.get('status')=='EXECUTED')
          final_pass=(final_status in (200,201) and final_stat=='PASS')

          summary={
            'negative_index_gate_blocked':neg_blocked,
            'pre_krs_pass':pre_pass,
            'pre_krs_verified':pre_verified,
            'krs_executed':krs_exec,
            'krs_5000_ok':run_count_ok,
            'krs_verified':krs_verified,
            'final_pass':final_pass,
            'final_verified':final_verified
          }
          acceptance=all(summary.values())
          print('SUMMARY_JSON',json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print('R2_E2E_ACCEPTANCE','PASS' if acceptance else 'FAIL')
          if not acceptance:
              sys.exit(2)
          PY
