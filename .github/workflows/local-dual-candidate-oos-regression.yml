name: LOCAL Dual Candidate OOS Regression

on:
  push:
    branches: [main]
    paths:
      - 'runtime/local_candidate_postresult.py'
      - 'runtime/local_candidate_dual_oos_tracker.py'
      - 'runtime/calibration/local_weight_calibration_v0.2_20260923_urw_day_summary.json'
      - 'tests/test_local_candidate_postresult_dual.py'
      - 'tests/test_local_candidate_dual_oos_tracker.py'
      - 'tests/test_local_dual_shadow_workflow_contract.py'
      - '.github/workflows/km-family-non-jra-formal-runner.yml'
      - '.github/workflows/km-local-result-from-signed-final.yml'
      - '.github/workflows/local-dual-candidate-oos-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile dual-candidate modules
        run: |
          python -m py_compile             runtime/local_candidate_postresult.py             runtime/local_candidate_dual_oos_tracker.py             runtime/krs_prediction_utility.py
      - name: Run dual-candidate post-result and OOS regression
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q             tests/test_local_candidate_postresult_dual.py             tests/test_local_candidate_dual_oos_tracker.py \
            tests/test_local_dual_shadow_workflow_contract.py
