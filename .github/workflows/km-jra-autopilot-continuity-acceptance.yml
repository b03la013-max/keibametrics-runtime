name: JRA Autopilot continuity acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tools/persist_local_checkpoints.py'
      - '.github/workflows/km-formal-result-runner.yml'
      - 'tests/test_jra_result_persistence.py'
  pull_request:
    paths:
      - 'tools/persist_local_checkpoints.py'
      - '.github/workflows/km-formal-result-runner.yml'
      - 'tests/test_jra_result_persistence.py'
      - 'runtime/jra_source_runtime/jra_race_day_autopilot.py'
      - 'runtime/jra_race_day_registration.py'
      - 'runtime/jra_autopilot_start.py'
      - 'runtime/jra_delivery.py'
      - 'tests/test_jra_p0_20261018.py'
      - '.github/workflows/km-jra-race-day-autopilot.yml'
      - '.github/workflows/km-jra-autopilot-failure-recovery.yml'
      - 'tests/test_jra*autopilot*'
      - 'tests/test_jra_real_race_failure_regressions.py'
      - 'tests/test_jra_day_status_settlement_pfs_delivery.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q pytest beautifulsoup4 cryptography PyMuPDF
      - run: python -m pytest -q tests/test_jra_race_day_autopilot.py tests/test_jra_autopilot_continuity.py tests/test_jra_autopilot_failure_recovery.py tests/test_jra_real_race_failure_regressions.py tests/test_jra_day_status_settlement_pfs_delivery.py tests/test_jra_p0_20261018.py
      - run: python -m pytest -q tests/test_jra_result_persistence.py tests/test_persist_local_checkpoints_scratch.py
