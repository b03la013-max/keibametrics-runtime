name: LOCAL NAR Source Adapter Live Acceptance

on:
  push:
    branches: [ main ]
    paths:
      - 'governance/KM-LOCAL-NAR-SOURCE-ADAPTER-ACTIVATION-20260923-R1.json'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify NAR manifest -> official fetch -> signed source -> formal
        shell: bash
        run: |
          python - <<'PY'
          import copy, datetime, hashlib, json, sys, urllib.error, urllib.request
          sys.path.insert(0,"runtime")
          from minimum_efficient_coverage import build_mec_plan, validate_mec_plan
          from capital_policy import resolve_capital_policy

          BASE="https://witnessstrictimage-production.up.railway.app"
          RID="KM-LOCAL-NAR-ADAPTER-ACCEPT-20260923-T01"
          HSV=["base_competitive_ability","class_strength","condition_fit","distance_fit","surface_fit","gate_reliability","initial_acceleration","position_intent","inside_cut_ability","outside_press_ability","leader_need","stalk_acceptance","crowd_tolerance","early_position_hold","midrace_hold","progression_ceiling","progression_timing","corner_acceleration","traffic_escape","sustained_speed","pressure_tolerance","front_friction_tolerance","long_move_tolerance","final_reserve","deceleration_risk","training_state","bodyweight_state","layoff_uncertainty","comment_state","data_confidence"]
          STATIC=["tpi","zai_win","zai_place","sri","t3i","f3s","w_aki","p2_aki","p3_aki","asi","rsi"]

          def call(path,payload=None,method="POST",timeout=600):
              data=None if payload is None else json.dumps(payload,separators=(",",":"),ensure_ascii=False).encode()
              headers={"content-type":"application/json"} if payload is not None else {}
              req=urllib.request.Request(BASE+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as x:
                      raw=x.read().decode()
                      return x.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: body=json.loads(raw)
                  except Exception: body={"raw":raw}
                  return e.code,body

          def sha(x):
              return hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()).hexdigest()

          hc,h=call("/health",None,"GET",60)
          print("HEALTH",hc,json.dumps(h,ensure_ascii=False))
          assert hc==200 and h["status"]=="READY"
          assert h["runtime_revision"]=="KM-LOCAL-PHYSICAL-RUNTIME-v1.5-REV.1-20260923-NAR-SOURCE-ADAPTER"
          assert h["nar_source_manifest_profile"]=="KM-LOCAL-NAR-SOURCE-MANIFEST-v1.0-20260923"
          assert "SOURCE_MANIFEST_LOCAL_NAR" in h["capabilities"]

          mc,manifest=call("/source/manifest/local",{
            "family_id":"LOCAL",
            "race_id":RID,
            "venue_id":"KCH",
            "race_date":"2026-09-13",
            "race_no":3,
            "prediction_cutoff":"2099-01-01T00:00:00+00:00",
            "include_same_day_results":True,
            "include_odds":True
          },60)
          print("MANIFEST",mc,json.dumps({
            "profile":manifest.get("manifest_profile"),
            "venue":manifest.get("venue_id"),
            "source_count":len(manifest.get("sources") or []),
            "required":[x.get("source_id") for x in manifest.get("sources",[]) if x.get("required")]
          },ensure_ascii=False))
          assert mc==200
          assert manifest["nar_baba_code"]=="31"
          assert manifest["venue_name"]=="高知"
          assert manifest["sources"][0]["required"] is True
          assert "DebaTable" in manifest["sources"][0]["url"]
          assert "k_babaCode=31" in manifest["sources"][0]["url"]
          assert any("ODDS-TANFUKU" in x["source_id"] for x in manifest["sources"])
          assert any("R01-RESULT" in x["source_id"] for x in manifest["sources"])
          assert any("R02-RESULT" in x["source_id"] for x in manifest["sources"])

          sc,source=call("/source/acquire",manifest,timeout=180)
          print("SOURCE",sc,(source.get("receipt") or {}).get("status"),source.get("receipt_sha256"))
          assert sc==200 and (source.get("receipt") or {}).get("status")=="SOURCE_FROZEN",source
          art=source["artifact"]
          assert art["formal_ready"] is True
          assert art["missing_required_sources"]==[]
          card=next(x for x in art["sources"] if x["required"])
          assert card["http_status"]==200,card
          assert card["raw_sha256"] and card["raw_gzip_b64"]
          tables=(card.get("extracted_evidence") or {}).get("race_card_tables")
          assert isinstance(tables,list) and len(tables)>0,card
          assert art["source_snapshot_sha256"]
          assert art["raw_source_bundle_sha256"]

          vc,v=call("/source/verify",source,timeout=60)
          assert vc==200 and v["valid"] is True,v
          gc,g=call("/verify",source,timeout=60)
          assert gc==200 and g["valid"] is True,g

          def horse(no,base):
              return {
                "horse_no":no,"name":f"NAR-ADAPTER-{no}","gate_no":no,
                "hsv":{k:base+((i%5)-2) for i,k in enumerate(HSV)},
                "static":{k:base+((i%3)-1) for i,k in enumerate(STATIC)},
                "pzr":{"aggressive":1,"standard":2,"conservative":3},
                "static_roles":["W"] if no==1 else (["P2"] if no==2 else ["P3"])
              }

          krs_input={
            "race":{"race_id":RID,"prediction_id":RID+"-P1","revision_no":1,"engine_version":"1.1.0","parameter_map_version":"0.1-provisional"},
            "environment":{"course_family":"LOCAL-KCH","surface":"dirt","distance":1400,"going":"good","field_size":3,"gci_confidence":80,"similar_condition_confidence":80,"freshness_confidence":100},
            "simulation":{"run_count":5000,"master_seed":20260923,"seed_replicates":1,"seed_stability_runs":500,"scenario_runs":500},
            "horses":[horse(1,72),horse(2,64),horse(3,58)]
          }
          sem={
            "race_id":RID,"family_id":"LOCAL",
            "available_bet_types":["EXACTA","TRIO","TRIFECTA"],
            "role_registry":[
              {"runner_id":"1","column":"W","status":"CORE"},
              {"runner_id":"2","column":"P2","status":"CORE"},
              {"runner_id":"3","column":"P3","status":"CORE"}],
            "pair_dispositions":[{"head":"1","second":"2","status":"PURCHASE","reason":"NAR_ADAPTER_ACCEPT_PRIMARY_PAIR"}],
            "third_dispositions":[{"head":"1","second":"2","third":"3","status":"PURCHASE","reason":"NAR_ADAPTER_ACCEPT_PRIMARY_THIRD"}],
            "orientation_exclusions":[],"head_nonselection_reasons":{},
            "capital_policy":{"mode":"RECOMMENDATION_ONLY"}
          }
          mec=build_mec_plan(sem,strict_head_closure=True,min_stake=100)
          assert validate_mec_plan(mec)["mec_verified"] is True
          capital=resolve_capital_policy(sem,mec)
          freeze=datetime.datetime.now(datetime.timezone.utc).isoformat()
          fpp={
            "ranking":[1,2,3],
            "roles":{"1":["W"],"2":["P2"],"3":["P3"]},
            "source":"LOCAL_NAR_ADAPTER_LIVE_ACCEPTANCE",
            "source_snapshot_sha256":art["source_snapshot_sha256"]
          }
          tickets=copy.deepcopy(mec["tickets"])
          trace={
            "fpp_sha256":sha(fpp),
            "mec_sha256":mec["sha256"],
            "candidate_count":mec["ticket_count"],
            "selected_count":len(tickets),
            "capital_decision_sha256":capital["sha256"]
          }
          stages=[{"stage":x,"timestamp":freeze} for x in [
            "SOURCE_FREEZE","RUNNER_UNIVERSE","NUMERICAL_MATERIALIZATION","INDEX_PROVENANCE",
            "STATIC_FREEZE","PRE_KRS","KRS","KRS_UTILITY","MEC","CAPITAL","FINAL_TICKET_FREEZE"]]
          formal={
            "family_id":"LOCAL","race_id":RID,
            "source_receipt":source,
            "required_index_unresolved":0,
            "full_numerical_calculation":True,
            "static_prediction_frozen":True,
            "krs_input_data":krs_input,
            "run_count":5000,"seed":20260923,
            "final_prediction_package":fpp,
            "final_ticket":{"finalized":True,"no_bet":False,"total_investment":mec["minimum_required_capital"],"tickets":tickets,"frozen_at":freeze},
            "minimum_efficient_coverage":mec,
            "capital_policy_decision":capital,
            "ticket_transport_trace":trace,
            "execution_stage_manifest":stages,
            "final_freeze_timestamp":freeze
          }
          fc,fout=call("/formal",formal,timeout=900)
          print("FORMAL",fc,(fout.get("receipt") or {}).get("status"),fout.get("receipt_sha256"))
          assert fc==200 and (fout.get("receipt") or {}).get("status")=="FULL_FORMAL_E2E_PASS",fout
          assert fout["artifact"]["source_receipt_sha256"]==source["receipt_sha256"]
          assert fout["artifact"]["source_snapshot_sha256"]==art["source_snapshot_sha256"]
          assert fout["artifact"]["actual_run_count"]==5000

          for label,env in [
            ("SOURCE",source),
            ("PRE_KRS",fout["artifact"]["pre_krs_receipt"]),
            ("KRS_RUN",fout["artifact"]["krs_run_receipt"]),
            ("FINAL",fout["artifact"]["final_receipt"]),
            ("FORMAL",fout)]:
              xcode,xout=call("/verify",env,timeout=60)
              assert xcode==200 and xout["valid"] is True,(label,xcode,xout)

          optional_failures=[
            {"source_id":x.get("source_id"),"status":x.get("status"),"http_status":x.get("http_status")}
            for x in art["sources"] if not x.get("required") and (x.get("status")=="FETCH_FAILED" or int(x.get("http_status") or 200)>=400)
          ]
          print("LOCAL_NAR_SOURCE_ADAPTER_ACCEPTANCE_PASS="+json.dumps({
            "runtime_revision":h["runtime_revision"],
            "manifest_profile":manifest["manifest_profile"],
            "source_count":len(art["sources"]),
            "optional_failures_nonblocking":optional_failures,
            "required_race_card_url":card["final_url"],
            "race_card_raw_sha256":card["raw_sha256"],
            "race_card_table_count":len(tables),
            "source_receipt":source["receipt_sha256"],
            "source_snapshot_sha256":art["source_snapshot_sha256"],
            "pre_krs_receipt":fout["artifact"]["pre_krs_receipt"]["receipt_sha256"],
            "krs_receipt":fout["artifact"]["krs_run_receipt"]["receipt_sha256"],
            "final_receipt":fout["artifact"]["final_receipt"]["receipt_sha256"],
            "formal_receipt":fout["receipt_sha256"],
            "actual_run_count":fout["artifact"]["actual_run_count"]
          },ensure_ascii=False,separators=(",",":")))
          PY
