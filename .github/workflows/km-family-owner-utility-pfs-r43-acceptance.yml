name: Family Owner Utility PFS R43 Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'governance/KM-FAMILY-OWNER-UTILITY-PFS-CONTINUOUS-IMPROVEMENT-20261007-R1.md'
      - 'profiles/family_owner_utility_pfs_improvement_20261007_R1.json'
      - 'profiles/KM_FAMILY_CURRENT_AUTHORITY_20261007_R43.json'
      - 'runtime/family_pfs_improvement.py'
      - 'runtime/family_pfs_promotion_gate.py'
      - 'runtime/family_pfs_owner_scorecard.py'
      - 'runtime/family_pfs_regression_readout.py'
      - 'tests/test_family_pfs_regression_readout.py'
      - 'research/common/KM-FAMILY-OHI-20261008-DAY-REGRESSION-R1.json'
      - 'runtime/post_result_learning.py'
      - 'runtime/local_aki_columns.py'
      - 'runtime/family_conversion_diagnostics.py'
      - 'tools/kaw_v25_day_regression.py'
      - 'tools/kaw_v25_official_acquire.py'
      - 'tools/local_aki_matched_comparison.py'
      - 'tools/local_aki_comparison.py'
      - 'profiles/local_aki_columns_20261012_R1.json'
      - 'profiles/family_integrated_shadow_20261016_R1.json'
      - 'tests/test_kaw_v26_integrated.py'
      - 'runtime/race_day_fast_reflection.py'
      - 'runtime/acceptance/family_owner_utility_pfs_r43.json'
      - 'tests/test_family_pfs_improvement.py'
      - 'tests/test_family_owner_utility_r43.py'
      - 'tests/test_family_pfs_governance_runtime.py'
      - '.github/workflows/km-family-owner-utility-pfs-r43-acceptance.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest cryptography PyMuPDF fastapi httpx pyyaml
      - name: Owner utility and PFS improvement tests
        run: >-
          python -m pytest -q
          tests/test_family_pfs_improvement.py
          tests/test_family_owner_utility_r43.py
          tests/test_family_pfs_governance_runtime.py
          tests/test_family_pfs_regression_readout.py
          tests/test_family_authority_guard.py
          tests/test_race_day_fast_path.py
      - name: Compile post-result integration
        run: >-
          python -m py_compile
          runtime/family_pfs_improvement.py
          runtime/family_pfs_promotion_gate.py
          runtime/family_pfs_owner_scorecard.py
          runtime/family_pfs_regression_readout.py
          runtime/post_result_learning.py
          runtime/race_day_fast_reflection.py
      - name: Signed KAW integrated regression and rejected-arm boundaries
        run: python -m pytest -q tests/test_kaw_v26_integrated.py tests/test_family_conversion_diagnostics.py tests/test_capital_policy.py tests/test_krs_prediction_utility.py
      - name: Preserve all portfolios without new signatures
        run: python tools/kaw_v25_day_regression.py --out evidence/kaw_v26_20261016/ci_regression.json
      - name: Read-only official 12-race result corroboration
        if: github.event_name == 'pull_request'
        run: python tools/kaw_v25_official_acquire.py --date 2026-10-16 --out evidence/kaw_v26_20261016/official_readonly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaw-v26-integrated-audit
          path: evidence/kaw_v26_20261016/
      - name: R43 authority selftest
        run: python runtime/family_authority_guard.py --selftest --authority-path profiles/KM_FAMILY_CURRENT_AUTHORITY_20261007_R43.json
