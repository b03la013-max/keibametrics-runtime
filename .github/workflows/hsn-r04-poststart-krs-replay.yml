name: HSN R04 Post-Start KRS Replay

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/hsn-r04-poststart-krs-replay.yml"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen 10:49 snapshot through repaired PRE_KRS and KRS 5000
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, sys
          sys.path.insert(0,"runtime")
          from prekrs_terminal_compat import adapt_calculator_output

          CALC="https://jra-validation-sandbox-production.up.railway.app"
          KRS="https://quorumprobe-production.up.railway.app"
          RID="KM-JRA-HSN-20260920-R04-POSTSTART-REPLAY"
          horses=[
            (1,"ナムラモモタロー",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE"}),
            (2,"ベルウッドスーパー",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE"}),
            (3,"テリオスベラ",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE","pedigree_physical":"POSITIVE"}),
            (4,"ダイユウエゾフジ",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE"}),
            (5,"スイートモンブラン",{"gate":"STRONG","dash_position_acquisition":"POSITIVE","distance_fit":"STRONG","pedigree_physical":"POSITIVE","stable_trainer_state":"POSITIVE"}),
            (6,"レタートゥブリッジ",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE","pedigree_physical":"POSITIVE"}),
            (7,"リュコス",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE"}),
            (8,"ペンタクルクイーン",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE","workout_capability":"STRONG","distance_fit":"POSITIVE","stable_trainer_state":"STRONG"}),
            (9,"ホットハニーラグ",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE","workout_capability":"POSITIVE"}),
            (10,"フィリップヴィル",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE","workout_capability":"STRONG","distance_fit":"STRONG","sustain_reserve":"STRONG","stable_trainer_state":"STRONG"}),
            (11,"キタノゲートウェイ",{"gate":"POSITIVE"}),
            (12,"レグルスロウ",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE","workout_capability":"POSITIVE","distance_fit":"POSITIVE","sustain_reserve":"STRONG"}),
            (13,"トリオハピネス",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE","workout_capability":"POSITIVE","distance_fit":"STRONG","stable_trainer_state":"POSITIVE"}),
            (14,"バトゥル",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE"}),
            (15,"エスアンヴィユ",{"gate":"POSITIVE","dash_position_acquisition":"POSITIVE","workout_capability":"POSITIVE","pedigree_physical":"POSITIVE"})
          ]
          ranking=[10,8,13,5,12,6,9,3,15,1,2,14,4,7,11]
          roles={"10":["W","P2"],"8":["W","P2"],"13":["W","P2","P3"],"5":["P2","P3"],"12":["P2","P3"],"6":["P3"],"9":["P3"],"3":["P3"],"15":["P3"]}
          def call(base,path,payload=None,method="POST",timeout=180):
              data=None if payload is None else json.dumps(payload,separators=(",",":")).encode()
              headers={"content-type":"application/json"} if payload is not None else {}
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode()
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: body=json.loads(raw)
                  except: body={"raw":raw}
                  return e.code,body

          ccode,c=call(CALC,"/calculate-jra-base",{"race_id":RID,"runners":[{"runner_id":str(n),"name":nm,"newcomer":True,"raw_evidence":ev} for n,nm,ev in horses]})
          assert ccode==200 and c["status"]=="PASS" and c["required_count"]==300 and c["unresolved_count"]==0
          required=adapt_calculator_output(c)
          pre={"race_id":RID,"runner_universe":[{"horse_no":n,"name":nm} for n,nm,_ in horses],"required_indices":required,
               "static_prediction":{"ranking":ranking,"roles":roles,"status":"EVIDENCE-LED / FROZEN-1049 / POST-START-REPLAY"},
               "prediction_cutoff":"2026-09-20T10:50:00+09:00","krs_required":True,"krs_executable":True}
          pcode,p=call(KRS,"/pre-krs",pre,timeout=60)
          assert pcode<300 and p.get("receipt",{}).get("status")=="PASS"
          vcode,v=call(KRS,"/verify",p,timeout=30)
          assert vcode<300 and v.get("valid") is True

          by_runner={r["runner_id"]:{i["index_name"]:i.get("transport_value",50) for i in r["items"]} for r in c["runners"]}
          krs_horses=[]
          for n,nm,_ in horses:
              krs_horses.append({"horse_no":n,"name":nm,"hsv":by_runner[str(n)],"static_roles":roles.get(str(n),[])})
          kp={"race_id":RID,
              "input_data":{"race":{"race_id":RID,"venue":"阪神","distance":1200,"surface":"dirt","going":"good","temporal_status":"POST-START-REPLAY"},
                            "environment":{},"horses":krs_horses,
                            "simulation":{"run_count":5000,"master_seed":20260920}},
              "mode":"SIM-STD","seed":20260920,"input_class":"REAL-RACE-FROZEN-SNAPSHOT-RULED-HOLD-TRANSPORT"}
          kcode,k=call(KRS,"/krs/execute",kp,timeout=240)
          print("KRS_HTTP",kcode)
          run=k.get("run_receipt",{})
          rr=run.get("receipt",{})
          print("KRS_RECEIPT",json.dumps(rr,ensure_ascii=False))
          assert kcode<300 and rr.get("status")=="EXECUTED"
          assert int(rr.get("actual_run_count",0))>=5000
          kvcode,kv=call(KRS,"/verify",run,timeout=30)
          print("KRS_VERIFY",kvcode,json.dumps(kv,ensure_ascii=False))
          assert kvcode<300 and kv.get("valid") is True
          print("HSN_R04_POSTSTART_KRS_REPLAY_PASS",json.dumps({
              "race_id":RID,
              "temporal_status":"POST-START-REPLAY / NOT-PRE-RACE-FORMAL",
              "required_count":c["required_count"],
              "semantic_ruled_hold":c["ruled_hold_count"],
              "unresolved":c["unresolved_count"],
              "pre_krs_receipt":p.get("receipt_sha256"),
              "requested_run_count":rr.get("requested_run_count"),
              "actual_run_count":rr.get("actual_run_count"),
              "engine_sha256":rr.get("engine_sha256"),
              "parameter_map_sha256":rr.get("parameter_map_sha256"),
              "input_sha256":rr.get("input_sha256"),
              "output_sha256":rr.get("output_sha256"),
              "krs_receipt_sha256":run.get("receipt_sha256")
          },ensure_ascii=False))
          PY
