name: JRA Production Source-only Real Evidence Closure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-production-source-closure-real.yml"
      - "runtime/jra_official_fact_evaluator_production.py"
      - "runtime/jra_source_to_evidence_features.py"
      - "runtime/jra_pedigree_corpus.py"
      - "runtime/jra_owner_authorized_feature_rules.py"
      - "runtime/jra_source_runtime/jra_pedigree_harvest.py"
      - "runtime/jra_execution_maturity_bridge.py"
      - "runtime/jra_static_owner_executable.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-production-source-closure-real.yml"
      - "runtime/jra_official_fact_evaluator_production.py"
      - "runtime/jra_source_to_evidence_features.py"
      - "runtime/jra_pedigree_corpus.py"
      - "runtime/jra_owner_authorized_feature_rules.py"
      - "runtime/jra_source_runtime/jra_pedigree_harvest.py"
      - "runtime/jra_execution_maturity_bridge.py"
      - "runtime/jra_static_owner_executable.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test registered feature and Static Owner implementation
        run: |
          python -m pip install --disable-pip-version-check -q pytest cryptography PyMuPDF fastapi beautifulsoup4
          python -m pytest -q tests/test_jra_official_fact_evaluator_production.py tests/test_jra_static_owner_executable.py tests/test_jra_single_entry_exact_gap.py tests/test_jra_owner_authorized_rules.py tests/test_jra_pedigree_harvest_backfill.py
      - name: Execute Production numerical preparation on immutable Tokyo R05 JRA SOURCE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=runtime python - <<'PY'
          import json
          from pathlib import Path
          from runtime.jra_execution_maturity_bridge import prepare_production_numerical

          race = "KM-JRA-TKY-20261010-R05"
          execution = race + "-LIVE-R1"
          intent = json.loads(Path("runtime/jra_formal_intents/" + execution + ".json").read_text())
          src_path = Path("runtime/executions") / execution / "SOURCE" / "runs" / "38019477297" / "source_receipt_envelope.json"
          source = json.loads(src_path.read_text())
          assert source["artifact"]["race_id"] == race
          assert source["artifact"]["prediction_cutoff"] == intent["prediction_cutoff"]

          report = prepare_production_numerical(intent, source, source_execution_id=execution)
          assert report["race_id"] == race
          assert report["required_index_count"] == 240
          assert len(report["runner_universe"]) == 12
          result = {
              "race_id": race,
              "classification": "POST-START / HISTORICAL PRODUCTION EVIDENCE DIAGNOSTIC / NO-OOS / NO-BET",
              "source_execution_id": execution,
              "source_snapshot_sha256": report["source_checkpoint_manifest"]["source_snapshot_sha256"],
              "production_full_numerical_ready": report["production_full_numerical_ready"],
              "source_only_full_numerical_ready": report["source_only_full_numerical_ready"],
              "partial_base_calculated_count": report["partial_base_calculated_count"],
              "partial_base_blocked_count": report["partial_base_blocked_count"],
              "required_index_count": report["required_index_count"],
              "full_index_count": report["verified_full_index_count"],
              "exact_gap_count": report["exact_gap_count"],
              "production_closure_summary": report["production_closure_summary"],
              "source_only_coverage_repair_plan": report["source_only_coverage_repair_plan"],
              "first_blocked_stage": report["first_blocked_stage"],
              "pedigree_corpus_manifest": (report.get("source_feature_report") or {}).get("pedigree_corpus_manifest"),
              "static_owner_executable": bool(report["static_owner_executable_diagnostic"]),
              "static_owner_error": report["static_owner_executable_error"],
              "production_full_pipeline_ready": report["production_full_pipeline_ready"],
              "source_only_status": "PASS" if report["source_only_full_numerical_ready"] else "BLOCKED",
              "signed_final_verified": False,
              "purchase_authority": False,
          }
          dest = Path("jra-production-closure-report.json")
          dest.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Recompute source-verified real Kyoto R09 Production evidence after new evaluators
        env:
          PYTHONPATH: runtime:runtime/jra_source_runtime
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from execution_store import materialize_phase
          from verify_source_envelope import verify
          from jra_execution_maturity_bridge import prepare_production_numerical
          exec_id="KM-JRA-KYO-20261010-R09-LIVE-R1"
          src=Path("runtime_out/kyoto_source")
          phase=materialize_phase(exec_id,"SOURCE",src)
          assert phase is not None, "REAL_KYO_R09_SIGNED_SOURCE_UNAVAILABLE"
          env_path=src/"source_receipt_envelope.json"
          assert verify(str(env_path))["valid"] is True,"KYO_R09_ED25519_SOURCE_FAIL"
          envelope=json.loads(env_path.read_text(encoding="utf-8"))
          intent_path=Path("runtime/jra_formal_intents")/(exec_id+".json")
          intent=json.loads(intent_path.read_text(encoding="utf-8"))
          report=prepare_production_numerical(intent,envelope,source_execution_id=exec_id)
          assert report["family_id"]=="JRA"
          assert report["race_id"]=="KM-JRA-KYO-20261010-R09"
          source=envelope["artifact"]
          features=report.get("source_feature_report") or {}
          names=Counter(
              k for data in (features.get("runners") or {}).values()
              for k in (data.get("generated_production_features") or {})
          )
          detail=source.get("jra_official_race_card_detail") or {}
          history=source.get("jra_official_horse_history") or {}
          persons=source.get("jra_official_person_stats") or {}
          before=json.loads((Path("runtime/exact_gaps")/(exec_id+".json")).read_text(encoding="utf-8"))
          result={
              "race_id":report["race_id"],
              "classification":"POSTSTART RECOMPUTE / HISTORICAL DIAGNOSTIC / NO OOS / NO BET",
              "signed_source_sha256":source["source_snapshot_sha256"],
              "runner_count":len(report["runner_universe"]),
              "detail_runner_count":len(detail.get("runners") or []),
              "history_runner_count":len(history.get("runners") or {}),
              "matched_jockey_count":persons.get("matched_jockey_count"),
              "matched_trainer_count":persons.get("matched_trainer_count"),
              "previous_calculated_base_cells":before.get("partial_base_calculated_count"),
              "new_calculated_base_cells":report.get("partial_base_calculated_count"),
              "new_blocked_base_cells":report.get("partial_base_blocked_count"),
              "generated_registered_production_features":dict(sorted(names.items())),
              "pedigree_corpus_manifest":features.get("pedigree_corpus_manifest"),
              "required_full20_indices":report["required_index_count"],
              "full20_ready":report["production_full_numerical_ready"],
          }
          Path("jra-production-kyoto-r09-repair.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\\n")
          print("JRA_REAL_KYO_R09_EVIDENCE_REPAIR="+json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-tokyo-r05-real-source-production-closure
          path: |
            jra-production-closure-report.json
            jra-production-kyoto-r09-repair.json
          if-no-files-found: warn
