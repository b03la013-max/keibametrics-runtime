name: LOCAL Runtime Live Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'runtime/live_acceptance_requests/*.json'
      - '.github/workflows/local-runtime-live-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed runtime through canonical gateway
        run: |
          set -euo pipefail
          mkdir -p runtime_out
          python runtime/execution_gateway.py health-check \
            --family LOCAL \
            --output runtime_out/runtime_health_acceptance.json
          python - <<'PY'
          import json
          x=json.load(open("runtime_out/runtime_health_acceptance.json",encoding="utf-8"))
          a=x["assessment"]
          h=x["health"]
          assert a["status"]=="PASS",a
          assert not a["bundle_mismatches"],a
          assert h["status"]=="READY",h
          print("RUNTIME_SYNC_PASS",a["runtime_profile_actual"],a["bundle_fingerprint_actual"])
          PY

      - name: Verify real Urawa R8 declared-active universe and scratch state
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request
          endpoint="https://witnessstrictimage-production.up.railway.app"
          def post(path,payload):
              data=json.dumps(payload,ensure_ascii=False,separators=(",",":")).encode()
              q=urllib.request.Request(endpoint+path,data=data,headers={"content-type":"application/json"},method="POST")
              with urllib.request.urlopen(q,timeout=180) as r:
                  return json.loads(r.read().decode())
          manifest=post("/source/manifest/local",{
              "family_id":"LOCAL",
              "race_id":"URW-20260923-R08-ACTIVE-UNIVERSE-LIVE-ACCEPTANCE",
              "venue_id":"URW","race_date":"2026-09-23","race_no":8,
              "prediction_cutoff":"2099-01-01T00:00:00+09:00",
              "include_same_day_results":False,
              "include_odds":True,
              "require_active_runner_universe":True
          })
          source=post("/source/acquire",manifest)
          assert (source.get("receipt") or {}).get("status")=="SOURCE_FROZEN",source
          art=source["artifact"]
          dec=art["declared_runner_universe"]
          act=art["active_runner_universe"]
          statuses={str(x["runner_id"]):x for x in art["runner_status_registry"]}
          declared_ids=[str(x["runner_id"]) for x in dec["runners"]]
          active_ids=[str(x["runner_id"]) for x in act["runners"]]
          assert "7" in declared_ids,(declared_ids,statuses)
          assert "7" not in active_ids,(active_ids,statuses)
          assert statuses["7"]["status"] in {"CANCELLED","INACTIVE"},statuses["7"]
          assert len(declared_ids)==12,(declared_ids,statuses)
          assert len(active_ids)==11,(active_ids,statuses)
          out={
            "declared_count":len(declared_ids),"active_count":len(active_ids),
            "declared_ids":declared_ids,"active_ids":active_ids,
            "runner7":statuses["7"],
            "declared_sha256":art["official_declared_runner_universe_sha256"],
            "active_sha256":art["official_runner_universe_sha256"],
            "source_receipt_sha256":source["receipt_sha256"],
          }
          pathlib.Path("runtime_out").mkdir(exist_ok=True)
          json.dump(out,open("runtime_out/urw_r8_active_universe_acceptance.json","w"),ensure_ascii=False,sort_keys=True)
          print("URW_R8_ACTIVE_UNIVERSE_PASS",json.dumps(out,ensure_ascii=False))
          PY

      - name: Persist acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: km-local-runtime-live-acceptance-${{ github.sha }}
          path: runtime_out/*.json
          if-no-files-found: error
          retention-days: 90
