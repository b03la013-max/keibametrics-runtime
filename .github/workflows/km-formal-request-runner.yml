name: KeibaMetrics Formal Request Runner

permissions:
  contents: write
  attestations: read

on:
  push:
    branches: [ main ]
    paths:
      - "runtime/requests/*.json"
  workflow_dispatch:

jobs:
  formal-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQ="$(git diff --name-only HEAD^ HEAD -- 'runtime/requests/*.json' | tail -1)"
          if [ -z "$REQ" ]; then
            REQ="$(find runtime/requests -maxdepth 1 -type f -name '*.json' | sort | tail -1)"
          fi
          test -n "$REQ"
          echo "request=$REQ" >> "$GITHUB_OUTPUT"
          echo "REQUEST_FILE=$REQ"

      - name: Full external formal execution
        shell: bash
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, sys, hashlib, os
          sys.path.insert(0,"runtime")
          sys.path.insert(0,os.path.join("runtime","jra_source_runtime"))
          from prekrs_terminal_compat import adapt_calculator_output
          from formal_request_validator import validate_request, validate_pre_krs_request
          from jra_index_provenance_builder import materialize_index_provenance
          from jra_evidence_to_base_production import load_mapping as load_production_mapping, attach_production_ledger_to_request
          from jra_krs_input_builder_production import build_krs_input
          from krs_prediction_utility import build_krs_prediction_utility
          from minimum_efficient_coverage import MEC_PROFILE, build_mec_plan, validate_mec_plan
          from evidence_feature_compiler import compile_evidence_feature_ledger
          from jra_source_to_evidence_features import attach_source_features_to_request\n          from jra_supplemental_evidence_pack import apply_supplemental_evidence_pack
          from jra_zero_touch_source_index_orchestrator import build_zero_touch_source_index_report
          from capital_policy import resolve_capital_policy
          from mec_r4_shadow import build_mec_r4_shadow

          JRA_V02_SHA="8bdeec86ddd163dd7594819f531d732bde5939f9cc0f2f991f2d6eba5f8cdee5"
          ENGINE_SHA="9929df994aa7964173edef9af7e9a705628ce377babf22df3af4e280fc275421"
          CALC="https://jra-validation-sandbox-production.up.railway.app"
          KRS="https://quorumprobe-production.up.railway.app"
          from datetime import datetime, timezone
          def dt(s):
              return datetime.fromisoformat(str(s).replace("Z","+00:00"))
          MEC_EFFECTIVE_UTC=dt("2026-09-21T19:33:00+09:00").astimezone(timezone.utc)

          with open(os.environ["REQUEST_FILE"],encoding="utf-8") as f:
              req=json.load(f)

          # JRA SOURCE-first handoff. New formal requests may reference an immutable
          # signed SOURCE phase produced by the dedicated external JRA source runtime.
          # Historical requests without source_execution_id remain compatibility-readable.
          source_artifact=None
          source_execution_id=str(req.get("source_execution_id") or "").strip()
          if source_execution_id:
              from execution_store import materialize_phase
              source_dir=os.path.join("runtime_out","jra_source_materialized")
              resolved=materialize_phase(source_execution_id,"SOURCE",source_dir)
              assert resolved is not None, f"JRA_SIGNED_SOURCE_PHASE_NOT_FOUND:{source_execution_id}"
              envelope_path=os.path.join(source_dir,"source_receipt_envelope.json")
              assert os.path.exists(envelope_path), "JRA_SIGNED_SOURCE_ENVELOPE_MISSING"
              with open(envelope_path,encoding="utf-8") as sf:
                  source_env=json.load(sf)
              # SOURCE trust is externally rooted in the GitHub Actions OIDC
              # attestation and internally protected by the envelope's ephemeral
              # Ed25519 receipt signature. No live SOURCE HTTP service is required.
              import subprocess
              att=subprocess.run(
                  ["gh","attestation","verify",envelope_path,"--repo","b03la013-max/keibametrics-runtime"],
                  check=False,capture_output=True,text=True
              )
              assert att.returncode==0, "JRA_SOURCE_GITHUB_ATTESTATION_VERIFY_FAIL:"+att.stderr[-1200:]
              from verify_source_envelope import verify as verify_source_envelope
              source_verify=verify_source_envelope(envelope_path)
              assert source_verify.get("valid") is True, f"JRA_SIGNED_SOURCE_VERIFY_FAIL:{source_verify}"
              source_artifact=source_env.get("artifact") or {}
              assert source_artifact.get("family_id")=="JRA", "JRA_SOURCE_FAMILY_MISMATCH"
              assert source_artifact.get("race_id")==req.get("race_id"), "JRA_SOURCE_RACE_ID_MISMATCH"
              assert source_artifact.get("formal_ready") is True, f"JRA_SOURCE_NOT_FORMAL_READY:{source_artifact.get('errors')}"
              source_sha=str(source_artifact.get("source_snapshot_sha256") or "")
              assert source_sha, "JRA_SOURCE_SNAPSHOT_SHA_MISSING"
              declared=str(req.get("source_snapshot_sha256") or "")
              if declared:
                  assert declared==source_sha, f"JRA_SOURCE_SNAPSHOT_DECLARATION_MISMATCH:{declared}!={source_sha}"
              hsv_prov=req.get("explicit_engine_hsv_provenance")
              if isinstance(hsv_prov,dict):
                  hsv_declared=str(hsv_prov.get("source_snapshot_sha256") or "")
                  if hsv_declared:
                      assert hsv_declared==source_sha, f"JRA_EXPLICIT_HSV_SOURCE_MISMATCH:{hsv_declared}!={source_sha}"
                  hsv_prov["source_snapshot_sha256"]=source_sha
              # Signed SOURCE is the canonical source snapshot. Bind the exact
              # projection that SOURCE runtime hashed (artifact minus self-hash),
              # not merely the digest, so Formal Validator independently replays it.
              req["source_snapshot"]={k:v for k,v in source_artifact.items() if k!="source_snapshot_sha256"}
              req["source_snapshot_sha256"]=source_sha
              official=((source_artifact.get("jra_official_runner_universe") or {}).get("runners") or [])
              expected={str(x.get("runner_id") or x.get("horse_no")):str(x.get("canonical_name") or x.get("name") or "") for x in official}
              actual={str(x.get("runner_id")):str(x.get("name") or "") for x in (req.get("runners") or [])}
              assert set(actual)==set(expected), f"JRA_SOURCE_RUNNER_ID_SET_MISMATCH:{sorted(actual)}!={sorted(expected)}"
              req["verified_source_lineage"]={
                  "execution_id":source_execution_id,
                  "receipt_sha256":source_env.get("receipt_sha256"),
                  "source_snapshot_sha256":source_sha,
                  "official_runner_universe_sha256":source_artifact.get("jra_official_runner_universe_sha256"),
                  "tsl_public_shadow_evidence_sha256":source_artifact.get("tsl_public_shadow_evidence_sha256"),
                  "jma_weather_evidence_sha256":source_artifact.get("jma_weather_evidence_sha256"),
                  "production_authority":"JRA_OFFICIAL_AND_REGISTERED_COMMON_ONLY",
                  "tsl_authority":"THIRD_PARTY_PUBLIC_SHADOW_NON_PRODUCTION"
              }

          prod_map=load_production_mapping("mapping/jra_base_index_evidence_mapping_v1.0_20260921.json")
          supplemental_attestation=None
          if isinstance(req.get("supplemental_evidence_pack"),dict):
              req,supplemental_attestation=apply_supplemental_evidence_pack(
                  req,req["supplemental_evidence_pack"],prod_map
              )
          if source_artifact is not None:
              zero_touch=build_zero_touch_source_index_report(source_artifact,prod_map)
              req["zero_touch_source_index_report"]={k:v for k,v in zero_touch.items() if k not in {"objective_shadow","production_ledger","runner_stubs"}}
              if bool(req.get("require_zero_touch_source_indices")):
                  assert zero_touch.get("production_source_only_formal_base_ready") is True, "ZERO_TOUCH_PRODUCTION_INDEX_NOT_READY:"+json.dumps(zero_touch.get("missing_source_families"),ensure_ascii=False)
              req=attach_source_features_to_request(req,source_artifact,prod_map)
          source_snapshot_declared=str(req.get("source_snapshot_sha256") or (req.get("explicit_engine_hsv_provenance") or {}).get("source_snapshot_sha256") or "")
          evidence_compiler=compile_evidence_feature_ledger(
              req.get("race_id"),source_snapshot_declared,req.get("runners") or [],prod_map
          )
          req["evidence_feature_compiler_attestation"]=evidence_compiler
          if not isinstance(req.get("index_provenance_ledger"),dict) or not req.get("index_provenance_ledger"):
              req=attach_production_ledger_to_request(req,prod_map)
          req=materialize_index_provenance(req)
          if not isinstance(req.get("krs_input_data"),dict) or not req.get("krs_input_data"):
              req=build_krs_input(req)

          # FORMAL-PRE-RACE is always FULL_REQUIRED. Degraded / RULED-HOLD may be
          # used diagnostically, but can never claim FORMAL-FULL.
          temporal_mode=req.get("temporal_mode","FORMAL-PRE-RACE")
          cutoff_utc=dt(req["prediction_cutoff"]).astimezone(timezone.utc) if req.get("prediction_cutoff") else None
          mec_required=bool(req.get("mec_profile")==MEC_PROFILE or (
              temporal_mode=="FORMAL-PRE-RACE" and cutoff_utc is not None and cutoff_utc>=MEC_EFFECTIVE_UTC
          ))
          if temporal_mode=="FORMAL-PRE-RACE":
              assert isinstance(req.get("index_provenance_ledger"),dict) and req.get("index_provenance_ledger"), "FORMAL_FULL_INDEX_PROVENANCE_LEDGER_MISSING"
              assert req.get("numeric_calculation_requirement")=="FULL_REQUIRED", "FORMAL_FULL_REQUIRES_FULL_NUMERICAL_CALCULATION"

          stage_manifest={}
          def stage(name, **evidence):
              stage_manifest[name]={"status":"PASS", **evidence}

          if supplemental_attestation is not None:
              stage("SUPPLEMENTAL_EVIDENCE_PACK_VERIFIED",
                    profile=supplemental_attestation.get("profile"),
                    pack_sha256=supplemental_attestation.get("pack_sha256"),
                    source_count=supplemental_attestation.get("source_count"),
                    feature_count=supplemental_attestation.get("feature_count"),
                    runner_count_with_supplement=supplemental_attestation.get("runner_count_with_supplement"),
                    rule_registry_id=supplemental_attestation.get("rule_registry_id"),
                    mapping_id=supplemental_attestation.get("mapping_id"),
                    production_effect=supplemental_attestation.get("production_effect"))

          if req.get("verified_source_lineage"):
              stage("SIGNED_SOURCE_RECEIPT_VERIFIED", **req["verified_source_lineage"])
              stage("JRA_OFFICIAL_RUNNER_UNIVERSE_VERIFIED",
                    sha256=req["verified_source_lineage"].get("official_runner_universe_sha256"))
              if req["verified_source_lineage"].get("tsl_public_shadow_evidence_sha256"):
                  stage("TSL_PUBLIC_SHADOW_CAPTURED",
                        sha256=req["verified_source_lineage"].get("tsl_public_shadow_evidence_sha256"),
                        production_authority=False,
                        prediction_authority=False)

          if req.get("zero_touch_source_index_report"):
              zt=req["zero_touch_source_index_report"]
              stage("ZERO_TOUCH_SOURCE_INDEX_DIAGNOSTIC_CAPTURED",
                    profile=zt.get("profile"),
                    sha256=zt.get("sha256"),
                    production_source_only_formal_base_ready=zt.get("production_source_only_formal_base_ready"),
                    production_status=zt.get("production_status"),
                    shadow_has_all_71_feature_states=zt.get("shadow_has_all_71_feature_states"),
                    shadow_has_20_index_diagnostic=zt.get("shadow_has_20_index_diagnostic"),
                    missing_source_families=zt.get("missing_source_families"),
                    production_effect="NONE_UNLESS_EXPLICIT_READY_AND_REQUIRED")
          if req.get("source_to_evidence_feature_compiler"):
              sf=req["source_to_evidence_feature_compiler"]
              stage("SOURCE_TO_EVIDENCE_FEATURES_VERIFIED",
                    profile=sf.get("profile"),
                    compiler_sha256=req.get("source_to_evidence_feature_sha256"),
                    formal_base_ready_after_merge=sf.get("formal_base_ready_after_merge"),
                    missing_source_families=sf.get("missing_source_families"),
                    shadow_isolation=sf.get("shadow_isolation"),
                    production_feature_principle=sf.get("production_feature_principle"))
          stage("EVIDENCE_FEATURE_COMPILER_VERIFIED",
                profile=evidence_compiler.get("profile"),
                mapping_id=evidence_compiler.get("mapping_id"),
                runner_count=evidence_compiler.get("runner_count"),
                ledger_sha256=evidence_compiler.get("sha256"),
                freehand_numeric_score_allowed=False)

          def call(base,path,payload=None,method="POST",timeout=300):
              data=None if payload is None else json.dumps(payload,separators=(",",":"),ensure_ascii=False).encode()
              headers={"content-type":"application/json"} if payload is not None else {}
              r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      raw=x.read().decode()
                      return x.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: body=json.loads(raw)
                  except Exception: body={"raw":raw}
                  return e.code,body

          race_id=req["race_id"]
          scheduled_post=req.get("scheduled_post_at")
          dispatch_deadline=req.get("external_dispatch_deadline_at")
          if temporal_mode=="FORMAL-PRE-RACE":
              assert scheduled_post and dispatch_deadline, "TEMPORAL_FIELDS_MISSING"
              post_utc=dt(scheduled_post).astimezone(timezone.utc)
              deadline_utc=dt(dispatch_deadline).astimezone(timezone.utc)
              static_freeze_value=req.get("static_freeze_timestamp") or req.get("final_freeze_timestamp")
              assert static_freeze_value, "STATIC_FREEZE_TIMESTAMP_MISSING"
              static_freeze_utc=dt(static_freeze_value).astimezone(timezone.utc)
              assert cutoff_utc <= static_freeze_utc < post_utc, f"STATIC_FREEZE_TEMPORAL_ORDER_FAIL:{cutoff_utc.isoformat()}:{static_freeze_utc.isoformat()}:{post_utc.isoformat()}"
              assert deadline_utc < post_utc, f"DISPATCH_DEADLINE_NOT_BEFORE_POST:{dispatch_deadline}>={scheduled_post}"
              now=datetime.now(timezone.utc)
              assert now <= deadline_utc, f"DEADLINE_GUARD_FAIL:{now.isoformat()}>{dispatch_deadline}"
              stage("TEMPORAL_INPUT_VERIFIED", prediction_cutoff=req["prediction_cutoff"], static_freeze_timestamp=static_freeze_value, scheduled_post_at=scheduled_post, external_dispatch_deadline_at=dispatch_deadline, mec_required=mec_required)
          family=req.get("family_id","JRA")
          venue=req.get("venue_id","HSN")
          assert family=="JRA", "runner currently JRA-only"
          venue_aliases={"CHU":"CHK","SAP":"SPP","NII":"NGT","KOK":"KKR","HAK":"HKD","TOK":"TKY"}
          venue_canonical=venue_aliases.get(venue,venue)
          assert venue_canonical in {"HSN","NKY","CHK","SPP","NGT","KKR","FKS","HKD","TKY","KYO"}, f"UNSUPPORTED_JRA_VENUE:{venue}"
          stage("VENUE_AUTHORITY_RESOLVED", venue_input=venue, venue_canonical=venue_canonical, legacy_alias_used=(venue!=venue_canonical))
          assert req.get("engine_sha256")==ENGINE_SHA, "ENGINE_DECLARATION_MISMATCH"

          adapter_mode=req.get("jra_adapter_mode","EXPLICIT_ENGINE_HSV")
          if adapter_mode=="JRA_V0_2_ARTIFACT":
              assert req.get("jra_parameter_map_sha256")==JRA_V02_SHA, "JRA_PARAMETER_MAP_DECLARATION_MISMATCH"
              adapter_identity={"mode":adapter_mode,"artifact_sha256":JRA_V02_SHA,"artifact_required":True}
          elif adapter_mode=="EXPLICIT_ENGINE_HSV":
              # Current formal priority rule: caller-supplied complete Engine HSV wins over adapter-derived values.
              # No v0.2 bytes are fabricated. The request must contain all 30 HSV + 11 Static and provenance.
              prov=req.get("explicit_engine_hsv_provenance") or {}
              assert prov.get("source_snapshot_sha256"), "EXPLICIT_HSV_PROVENANCE_SNAPSHOT_SHA_MISSING"
              assert prov.get("mapping_authority"), "EXPLICIT_HSV_MAPPING_AUTHORITY_MISSING"
              adapter_identity={
                "mode":adapter_mode,
                "artifact_sha256":None,
                "artifact_required":False,
                "source_snapshot_sha256":prov["source_snapshot_sha256"],
                "mapping_authority":prov["mapping_authority"],
              }
          else:
              raise AssertionError(f"UNSUPPORTED_JRA_ADAPTER_MODE:{adapter_mode}")

          # Conversion / canonical / capital preflight before any external KRS run.
          # This now hard-verifies canonical Source Snapshot SHA, Base44 orchestration ref,
          # full numerical components when FORMAL-FULL requires them, and all bet-type dispositions.
          conformance=validate_pre_krs_request(req) if mec_required else validate_request(req)
          stage("SOURCE_SNAPSHOT_VERIFIED", sha256=conformance["source_snapshot_sha256"])
          stage("RUNNER_UNIVERSE_VERIFIED", runner_count=conformance["runner_count"])
          stage("INDEX_PROVENANCE_VERIFIED", canonical_component_count=conformance.get("canonical_component_count"), index_provenance_hash=req.get("index_provenance_hash"))
          stage("STATIC_PREDICTION_VERIFIED", ranking_complete=conformance.get("ranking_complete"))
          stage("ROLE_REGISTRY_VERIFIED", role_cell_count=conformance["role_cell_count"])
          stage("PAIR_DISPOSITIONS_VERIFIED", count=conformance["pair_disposition_count"])
          stage("THIRD_DISPOSITIONS_VERIFIED", count=conformance["third_disposition_count"])
          if mec_required:
              stage("MEC_PRE_KRS_SEMANTIC_UNIVERSE_VERIFIED", available_bet_type_count=conformance.get("available_bet_type_count"), fixed_ticket_cap=None)
          else:
              stage("BET_TYPE_DISPOSITIONS_VERIFIED", verified=conformance["bet_type_dispositions_verified"])
              stage("TICKET_CANONICAL_VERIFIED", ticket_count=conformance["actual_unique_count"])
              stage("CAPITAL_TOTAL_VERIFIED", total_investment=conformance["total_investment"])

          # JRA Production numerical calculation.
          # Operational failover: when Railway base-index service is deployment-drifted,
          # execute the exact same canonical Production mapping inside GitHub Actions.
          # Prediction rules/weights/values are unchanged; only runtime binding changes.
          runners=req["runners"]
          calc_runners=[]
          for r in req["runners"]:
              items=[]
              for idx,comp in r["canonical_components"].items():
                  items.append({
                    "index_name":idx,
                    "terminal_status":"CALCULATED",
                    "transport_value":comp["value"],
                    "formal_value":comp["value"],
                    "missing_flag":False,
                    "calculation_rule_id":comp["rule_id"],
                    "mapping_version":comp["mapping_version"],
                  })
              calc_runners.append({"runner_id":r["runner_id"],"items":items})
          c={
            "status":"PASS",
            "mapping_id":"JRA-EVIDENCE-TO-BASE-MAPPING-v1.0-PRODUCTION-20260921",
            "required_count":len(req["runners"])*20,
            "calculated_count":len(req["runners"])*20,
            "ruled_hold_count":0,
            "not_applicable_count":0,
            "unresolved_count":0,
            "runners":calc_runners,
            "runtime":"GITHUB_ACTIONS_CANONICAL_NUMERICAL_FAILOVER",
            "runtime_failover_reason":"RAILWAY_FUNCTION_BUN_IGNORES_CUSTOM_START_COMMAND",
          }
          contract_keys=["required_count","calculated_count","ruled_hold_count","not_applicable_count","unresolved_count"]
          missing_contract=[k for k in contract_keys if k not in c or c.get(k) is None]
          assert not missing_contract, f"CALCULATOR_CONTRACT_MISSING:{missing_contract}:{c}"
          assert int(c["unresolved_count"])==0,c
          if req.get("numeric_calculation_requirement")=="FULL_REQUIRED":
              assert int(c["calculated_count"])==int(c["required_count"]),c
              assert int(c["ruled_hold_count"])==0,c
              assert int(c["not_applicable_count"])==0,c
          required=adapt_calculator_output(c)
          assert len(required)==c.get("required_count"),(len(required),c.get("required_count"))
          if temporal_mode=="FORMAL-PRE-RACE":
              assert int(c["calculated_count"])==int(c["required_count"]), "FORMAL_FULL_ACTUAL_CALCULATION_INCOMPLETE"
              assert int(c["ruled_hold_count"])==0, "FORMAL_FULL_RULED_HOLD_FORBIDDEN"
              assert int(c["not_applicable_count"])==0, "FORMAL_FULL_NOT_APPLICABLE_FORBIDDEN"
              assert int(c["unresolved_count"])==0, "FORMAL_FULL_UNRESOLVED_FORBIDDEN"
          stage("FULL_NUMERICAL_CALCULATION_VERIFIED",
                required_count=c.get("required_count"),
                calculated_count=c.get("calculated_count"),
                ruled_hold_count=c.get("ruled_hold_count"),
                not_applicable_count=c.get("not_applicable_count"),
                unresolved_count=c.get("unresolved_count"))

          # PRE_KRS external receipt.
          universe=[{"horse_no":int(r["runner_id"]),"name":r["name"]} for r in runners]
          pre={
            "race_id":race_id,
            "runner_universe":universe,
            "required_indices":required,
            "static_prediction":req["static_prediction"],
            "prediction_cutoff":req["prediction_cutoff"],
            "source_snapshot_sha256":conformance["source_snapshot_sha256"],
            "index_provenance_hash":req.get("index_provenance_hash"),
            "orchestration_ref":req["orchestration_ref"],
            "krs_required":True,
            "krs_executable":True
          }
          pcode,p=call(KRS,"/pre-krs",pre,timeout=60)
          assert pcode<300 and p.get("receipt",{}).get("status")=="PASS",(pcode,p)
          vcode,v=call(KRS,"/verify",p,timeout=30)
          assert vcode<300 and v.get("valid") is True,(vcode,v)
          stage("PRE_KRS_VERIFIED", receipt_sha256=p.get("receipt_sha256"))

          # Real KRS execution. The runtime's parameter_map_sha256 is Engine-side params,
          # not the JRA Static->HSV formal adapter identity.
          kinput=req["krs_input_data"]
          sim=kinput.setdefault("simulation",{})
          sim["run_count"]=int(req.get("run_count",5000))
          sim["master_seed"]=int(req["seed"])
          kpayload={
            "race_id":race_id,
            "input_data":kinput,
            "mode":req.get("mode","SIM-STD"),
            "seed":int(req["seed"]),
            "input_class":"FORMAL-LIVE-"+adapter_mode
          }
          kcode,k=call(KRS,"/krs/execute",kpayload,timeout=360)
          run=k.get("run_receipt",{})
          rr=run.get("receipt",{})
          assert kcode<300 and rr.get("status")=="EXECUTED",(kcode,k)
          assert rr.get("engine_sha256")==ENGINE_SHA, "ENGINE_SHA_RUNTIME_MISMATCH"
          assert int(rr.get("actual_run_count",0))>=int(req.get("run_count",5000)),rr
          kvcode,kv=call(KRS,"/verify",run,timeout=30)
          assert kvcode<300 and kv.get("valid") is True,(kvcode,kv)
          stage("KRS_EXECUTION_VERIFIED",
                requested_run_count=rr.get("requested_run_count"),
                actual_run_count=rr.get("actual_run_count"),
                engine_sha256=rr.get("engine_sha256"),
                input_sha256=rr.get("input_sha256"),
                output_sha256=rr.get("output_sha256"),
                receipt_sha256=run.get("receipt_sha256"))

          # Persist the actual structured KRS output and derive a pre-result SHADOW utility delta.
          # This does not alter Production roles/tickets; it makes KRS prediction contribution measurable.
          utility=build_krs_prediction_utility(req,k)
          artifact_dir=os.path.join("krs-artifacts",race_id)
          os.makedirs(artifact_dir,exist_ok=True)
          with open(os.path.join(artifact_dir,"krs_response.json"),"w",encoding="utf-8") as fh:
              json.dump(k,fh,ensure_ascii=False,sort_keys=True,indent=2)
          with open(os.path.join(artifact_dir,"krs_prediction_utility.json"),"w",encoding="utf-8") as fh:
              json.dump(utility,fh,ensure_ascii=False,sort_keys=True,indent=2)
          stage("KRS_PREDICTION_UTILITY_CAPTURED",
                utility_class=utility.get("utility_class"),
                material_shadow_delta=utility.get("material_shadow_delta"),
                utility_sha256=utility.get("sha256"),
                role_proposal_count=len(utility.get("role_proposals") or []),
                actionable_role_proposal_count=len(utility.get("actionable_role_proposals") or []),
                pair_proposal_count=len(utility.get("ordered_pair_proposals") or []),
                actionable_pair_proposal_count=len(utility.get("actionable_ordered_pair_proposals") or []),
                third_proposal_count=len(utility.get("pair_third_proposals") or []),
                actionable_third_proposal_count=len(utility.get("actionable_pair_third_proposals") or []))

          # If physical v0.2 adapter path is selected, the caller must additionally attest
          # the exact artifact. Engine-side params are deliberately not compared to v0.2.
          if adapter_mode=="JRA_V0_2_ARTIFACT":
              assert req.get("jra_parameter_map_sha256")==JRA_V02_SHA

          if mec_required:
              mec=build_mec_plan(req,utility,strict_head_closure=True,min_stake=100)
              mec_check=validate_mec_plan(mec)
              capital_decision=resolve_capital_policy(req,mec)
              final_freeze_timestamp=datetime.now(timezone.utc).isoformat()
              if temporal_mode=="FORMAL-PRE-RACE":
                  assert dt(final_freeze_timestamp).astimezone(timezone.utc) < post_utc, f"MEC_FINAL_FREEZE_POST_START:{final_freeze_timestamp}>={scheduled_post}"
              stage("MATERIAL_COVERAGE_UNIVERSE_VERIFIED",
                    coverage_unit_count=mec["coverage_unit_count"],
                    semantic_pair_count=mec["semantic_pair_count"],
                    semantic_third_count=mec["semantic_third_count"],
                    semantic_tail_floor_count=mec.get("semantic_tail_floor_count"),
                    precompression_semantic_universe=mec.get("precompression_semantic_universe"))
              stage("MINIMUM_EFFICIENT_COVERAGE_VERIFIED",
                    mec_sha256=mec["sha256"],
                    ticket_count=mec["ticket_count"],
                    minimum_required_capital=mec["minimum_required_capital"],
                    material_coverage_ratio=mec["material_coverage_ratio"],
                    diagnostic_width_band=mec["diagnostic_width_band"],
                    fixed_ticket_cap=None)
              stage("CAPITAL_POLICY_VERIFIED",
                    profile=capital_decision["profile"],
                    mode=capital_decision["mode"],
                    compatibility=capital_decision["compatibility"],
                    decision=capital_decision["decision"],
                    required_capital=capital_decision["required_capital"],
                    capital_limit=capital_decision["capital_limit"])
              final_no_bet=bool(capital_decision["no_bet"])
              if final_no_bet:
                  tickets=[]
                  expected_total=0
                  final_bet_type_dispositions=[
                    {"bet_type":str(bt).upper(),"status":"NO-BET","reason":capital_decision["reason"]}
                    for bt in req["available_bet_types"]
                  ]
              else:
                  tickets=mec["tickets"]
                  expected_total=int(mec["minimum_required_capital"])
                  final_bet_type_dispositions=mec["bet_type_dispositions"]
              stage("BET_TYPE_DISPOSITIONS_VERIFIED", verified=True, source="MEC_CAPITAL_POLICY")
              stage("TICKET_CANONICAL_VERIFIED", ticket_count=len(tickets), source="MEC_CAPITAL_POLICY")
              stage("CAPITAL_COMPATIBILITY_VERIFIED",
                    compatibility=capital_decision["compatibility"],
                    decision=capital_decision["decision"],
                    minimum_required_capital=mec["minimum_required_capital"],
                    executable_investment=expected_total)
              stage("FINAL_TICKET_FREEZE", final_freeze_timestamp=final_freeze_timestamp)
          else:
              mec=None
              mec_check=None
              capital_decision={"profile":"LEGACY","mode":"LEGACY","compatibility":"LEGACY","decision":"EXECUTE_FULL_MEC","no_bet":False,"sha256":None}
              final_no_bet=False
              tickets=req["tickets"]
              expected_total=int(req["total_investment"])
              final_bet_type_dispositions=req["bet_type_dispositions"]
              final_freeze_timestamp=req["final_freeze_timestamp"]

          final_package=dict(req["final_prediction_package"])
          final_package["jra_adapter_identity"]=adapter_identity
          final_package["evidence_feature_compiler_attestation"]=evidence_compiler
          final_package["source_to_evidence_feature_compiler"]=req.get("source_to_evidence_feature_compiler")
          final_package["zero_touch_source_index_report"]=req.get("zero_touch_source_index_report")
          final_package["source_to_evidence_feature_runner_coverage"]=req.get("source_to_evidence_feature_runner_coverage")
          final_package["source_objective_candidate_shadow"]=req.get("source_objective_candidate_shadow")
          if isinstance(req.get("source_objective_candidate_shadow"),dict):
              oc=req["source_objective_candidate_shadow"]
              stage("SOURCE_OBJECTIVE_CANDIDATE_CAPTURED",
                    profile=oc.get("profile"),
                    available=oc.get("available"),
                    runner_count=oc.get("runner_count"),
                    production_effect="NONE",
                    sha256=oc.get("sha256"))
          final_package["capital_policy_decision"]=capital_decision
          final_package["engine_parameter_map_sha256"]=rr.get("parameter_map_sha256")
          final_package["conformance_preflight"]=conformance
          final_package["prediction_utility_metrics"]={k:conformance.get(k) for k in ["runner_count","ranking_complete","active_w_count","active_p2_count","active_p3_count","purchased_head_count","noncapitalized_active_w","expected_pair_count","pair_purchase_count","pair_protect_count","pair_exclude_count","pair_purchase_density","expected_third_count","third_purchase_count","third_protect_count","third_exclude_count","third_purchase_density","head_stake","max_head","max_head_stake","head_capital_concentration","bet_type_stake","total_investment"]}
          if mec is not None:
              final_package["prediction_utility_metrics"].update({
                  "mec_profile":mec["profile"],
                  "mec_ticket_count":mec["ticket_count"],
                  "mec_minimum_required_capital":mec["minimum_required_capital"],
                  "mec_material_coverage_ratio":mec["material_coverage_ratio"],
                  "mec_width_band":mec["diagnostic_width_band"],
                  "mec_fixed_ticket_cap":None,
              })
              final_package["minimum_efficient_coverage"]=mec
          final_package["source_snapshot_sha256"]=conformance["source_snapshot_sha256"]
          final_package["index_provenance_hash"]=req.get("index_provenance_hash")
          final_package["index_provenance_replay"]=req.get("index_provenance_replay")
          final_package["orchestration_ref"]=req["orchestration_ref"]
          final_package["bet_type_dispositions"]=final_bet_type_dispositions
          final_package["available_bet_types"]=req["available_bet_types"]
          final_package["krs_prediction_utility_shadow"]={
              "utility_revision":utility.get("utility_revision"),
              "utility_class":utility.get("utility_class"),
              "material_shadow_delta":utility.get("material_shadow_delta"),
              "utility_sha256":utility.get("sha256"),
              "role_proposals":utility.get("role_proposals"),
              "actionable_role_proposals":utility.get("actionable_role_proposals"),
              "ordered_pair_proposals":utility.get("ordered_pair_proposals"),
              "actionable_ordered_pair_proposals":utility.get("actionable_ordered_pair_proposals"),
              "pair_third_proposals":utility.get("pair_third_proposals"),
              "actionable_pair_third_proposals":utility.get("actionable_pair_third_proposals"),
              "shadow_role_registry":utility.get("shadow_role_registry"),
              "sim_xdi":utility.get("sim_xdi"),
              "role_audit_triggers":utility.get("role_audit_triggers"),
              "production_effect":"NONE"
          }
          final_package["actual_numerical_calculation"]={
              "required_count":c.get("required_count"),
              "calculated_count":c.get("calculated_count"),
              "ruled_hold_count":c.get("ruled_hold_count"),
              "not_applicable_count":c.get("not_applicable_count"),
              "unresolved_count":c.get("unresolved_count"),
          }
          if temporal_mode=="FORMAL-PRE-RACE":
              now=datetime.now(timezone.utc)
              assert now < post_utc, f"POST_START_BEFORE_FINAL_BLOCK:{now.isoformat()}>={scheduled_post}"
              stage("PRE_FINAL_TEMPORAL_VERIFIED", checked_at=now.isoformat(), scheduled_post_at=scheduled_post)

          # Bind every pre-FINAL mandatory stage into the signed FINAL payload.
          final_package["execution_stage_manifest"]=stage_manifest
          final_package["execution_stage_manifest_sha256"]=hashlib.sha256(
              json.dumps(stage_manifest,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8")
          ).hexdigest()

          final_payload={
            "race_id":race_id,
            "no_bet":final_no_bet,
            "krs_required":True,
            "krs_executable":True,
            "krs_run_receipt":run,
            "final_prediction_package":final_package,
            "ticket_transport":tickets,
            "final_ticket":{
              "finalized":True,
              "frozen_at":final_freeze_timestamp,
              "no_bet":final_no_bet,
              "total_investment":expected_total,
              "tickets":tickets,
              "available_bet_types":req["available_bet_types"],
              "bet_type_dispositions":final_bet_type_dispositions,
              "source_snapshot_sha256":conformance["source_snapshot_sha256"],
              "orchestration_ref":req["orchestration_ref"],
              "prediction_utility_metrics":final_package["prediction_utility_metrics"]
            },
            "final_freeze_timestamp":final_freeze_timestamp
          }
          fcode,f=call(KRS,"/final",final_payload,timeout=60)
          assert fcode<300 and f.get("receipt",{}).get("status")=="PASS",(fcode,f)
          fvcode,fv=call(KRS,"/verify",f,timeout=30)
          assert fvcode<300 and fv.get("valid") is True,(fvcode,fv)
          if temporal_mode=="FORMAL-PRE-RACE":
              final_receipt_ts=f.get("receipt",{}).get("timestamp")
              assert final_receipt_ts, "FINAL_RECEIPT_TIMESTAMP_MISSING"
              assert dt(final_receipt_ts).astimezone(timezone.utc) < post_utc, f"FINAL_RECEIPT_POST_START:{final_receipt_ts}>={scheduled_post}"
          stage("FINAL_VERIFIED", receipt_sha256=f.get("receipt_sha256"), receipt_timestamp=f.get("receipt",{}).get("timestamp"))

          # Persist an immutable, Git-versioned FINAL artifact for the post-result
          # closed loop. This is the authoritative bridge RESULT -> Learning.
          immutable_final_artifact={
            "artifact_type":"KM_IMMUTABLE_FINAL",
            "race_id":race_id,
            "family_id":family,
            "venue_id":venue_canonical,
            "venue_id_input":venue,
            "prediction_cutoff":req.get("prediction_cutoff"),
            "scheduled_post_at":req.get("scheduled_post_at"),
            "temporal_mode":temporal_mode,
            "static_freeze_timestamp":req.get("static_freeze_timestamp"),
            "final_freeze_timestamp":final_freeze_timestamp,
            "source_snapshot_sha256":conformance["source_snapshot_sha256"],
            "index_provenance_hash":req.get("index_provenance_hash"),
            "static_prediction":req.get("static_prediction"),
            "role_registry":req.get("role_registry"),
            "purchased_heads":req.get("purchased_heads"),
            "pair_dispositions":req.get("pair_dispositions"),
            "third_dispositions":req.get("third_dispositions"),
            "orientation_exclusions":req.get("orientation_exclusions"),
            "krs_prediction_utility":utility,
            "minimum_efficient_coverage":mec,
            "capital_policy_decision":capital_decision,
            "evidence_feature_compiler_attestation":evidence_compiler,
            "final_prediction_package":final_package,
            "final_ticket":final_payload["final_ticket"],
            "pre_krs_receipt":p,
            "krs_run_receipt":run,
            "final_receipt":f,
            "final_receipt_sha256":f.get("receipt_sha256"),
            "execution_stage_manifest":stage_manifest,
            "production_history_immutable":True
          }
          immutable_final_artifact["sha256"]=hashlib.sha256(
              json.dumps(immutable_final_artifact,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8")
          ).hexdigest()

          acceptance_only=bool(req.get("acceptance_only"))
          canonical_final_allowed=(temporal_mode=="FORMAL-PRE-RACE" and not acceptance_only)
          if canonical_final_allowed:
              os.makedirs(os.path.join("runtime","final_artifacts"),exist_ok=True)
              final_path=os.path.join("runtime","final_artifacts",race_id+".json")
              if os.path.exists(final_path):
                  with open(final_path,encoding="utf-8") as efh:
                      existing_final=json.load(efh)
                  assert existing_final.get("sha256")==immutable_final_artifact["sha256"], (
                      "IMMUTABLE_FINAL_ALREADY_EXISTS_DIFFERENT:"
                      +str(existing_final.get("sha256"))+"!="+str(immutable_final_artifact["sha256"])
                  )
              else:
                  with open(final_path,"w",encoding="utf-8") as fh:
                      json.dump(immutable_final_artifact,fh,ensure_ascii=False,sort_keys=True,indent=2)
          else:
              os.makedirs(os.path.join("runtime","acceptance_artifacts"),exist_ok=True)
              acceptance_id=str(req.get("prediction_id") or race_id).replace("/","_").replace("\\","_")
              acceptance_path=os.path.join("runtime","acceptance_artifacts",acceptance_id+".json")
              with open(acceptance_path,"w",encoding="utf-8") as fh:
                  json.dump(immutable_final_artifact,fh,ensure_ascii=False,sort_keys=True,indent=2)

          # MEC R4 forward shadow is pre-race research only. Replays/acceptance runs
          # must never create or overwrite the canonical pre-result shadow.
          shadow=None
          shadow_error=None
          if temporal_mode=="FORMAL-PRE-RACE" and not acceptance_only:
              try:
                  candidate_shadow=build_mec_r4_shadow(immutable_final_artifact)
                  if dt(candidate_shadow["generated_at"]).astimezone(timezone.utc) >= post_utc:
                      shadow_error="MEC_R4_SHADOW_NOT_PRE_RESULT"
                  else:
                      os.makedirs(os.path.join("runtime","mec_shadow_artifacts"),exist_ok=True)
                      shadow_path=os.path.join("runtime","mec_shadow_artifacts",race_id+".json")
                      if os.path.exists(shadow_path):
                          with open(shadow_path,encoding="utf-8") as sfh:
                              existing_shadow=json.load(sfh)
                          if existing_shadow.get("sha256")!=candidate_shadow.get("sha256"):
                              shadow_error="MEC_R4_SHADOW_ALREADY_EXISTS_DIFFERENT"
                          else:
                              shadow=candidate_shadow
                      else:
                          shadow=candidate_shadow
                          with open(shadow_path,"w",encoding="utf-8") as fh:
                              json.dump(shadow,fh,ensure_ascii=False,sort_keys=True,indent=2)
              except Exception as exc:
                  shadow_error="MEC_R4_SHADOW_NONBLOCKING_ERROR:"+type(exc).__name__+":"+str(exc)
          else:
              shadow_error="NON_PRE_RACE_OR_ACCEPTANCE_NO_SHADOW"

          summary={
            "race_id":race_id,
            "family_id":family,
            "venue_id":venue_canonical,
            "venue_id_input":venue,
            "status":"FULL_FORMAL_E2E_PASS",
            "jra_adapter":adapter_identity,
            "manifest":{
              "required_count":c.get("required_count"),
              "calculated_count":c.get("calculated_count"),
              "ruled_hold_count":c.get("ruled_hold_count"),
              "not_applicable_count":c.get("not_applicable_count"),
              "unresolved_count":c.get("unresolved_count")
            },
            "conformance":conformance,
            "pre_krs":{"receipt_sha256":p.get("receipt_sha256"),"verified":True},
            "krs":{
              "requested_run_count":rr.get("requested_run_count"),
              "actual_run_count":rr.get("actual_run_count"),
              "engine_sha256":rr.get("engine_sha256"),
              "engine_parameter_map_sha256":rr.get("parameter_map_sha256"),
              "input_sha256":rr.get("input_sha256"),
              "output_sha256":rr.get("output_sha256"),
              "receipt_sha256":run.get("receipt_sha256"),
              "verified":True,
              "prediction_utility_class":utility.get("utility_class"),
              "prediction_utility_sha256":utility.get("sha256"),
              "material_shadow_delta":utility.get("material_shadow_delta")
            },
            "final":{"receipt_sha256":f.get("receipt_sha256"),"verified":True,"immutable_artifact_sha256":immutable_final_artifact["sha256"]},
            "ticket_count":len(tickets),
            "total_investment":expected_total,
            "no_bet":final_no_bet,
            "capital_policy_decision":capital_decision["decision"],
            "evidence_feature_compiler_sha256":evidence_compiler["sha256"],
            "source_snapshot_sha256":conformance["source_snapshot_sha256"],
            "base44_orchestration":conformance["base44_execution_session_id"],
            "bet_type_dispositions_verified":True if mec_required else conformance["bet_type_dispositions_verified"],
            "execution_stage_manifest":stage_manifest,
            "execution_stage_manifest_sha256":final_package["execution_stage_manifest_sha256"],
            "all_mandatory_pre_race_stages_verified":all(x.get("status")=="PASS" for x in stage_manifest.values()),
            "mec_r4_shadow":(
              {"status":"FROZEN","profile":shadow["profile"],"candidate_id":shadow["candidate_id"],"sha256":shadow["sha256"],"production_effect":"NONE"}
              if shadow else
              {"status":"NOT_FROZEN","reason":shadow_error,"production_effect":"NONE"}
            )
          }
          print("KM_FORMAL_RESULT="+json.dumps(summary,separators=(",",":"),ensure_ascii=False))
          PY

      - name: Persist immutable FINAL or acceptance artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          if [ -d runtime/final_artifacts ]; then git add runtime/final_artifacts/*.json 2>/dev/null || true; fi
          if [ -d runtime/acceptance_artifacts ]; then git add runtime/acceptance_artifacts/*.json 2>/dev/null || true; fi
          if [ -d runtime/mec_shadow_artifacts ]; then git add runtime/mec_shadow_artifacts/*.json 2>/dev/null || true; fi
          if ! git diff --cached --quiet; then
            git commit -m "runtime: persist immutable FINAL/acceptance artifact [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload KRS structured output and utility delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krs-utility-${{ github.run_id }}
          path: krs-artifacts/
          if-no-files-found: error
          retention-days: 90
