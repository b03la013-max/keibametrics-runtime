name: KeibaMetrics JRA Autopilot Failure Recovery

# A GitHub schedule can be delayed or skipped. On 2026-10-12 the JRA
# race-day worker failed while persisting conflicted status JSON; the next
# worker did not start until after Kyoto R11's dispatch window.
# Recovery is independent of the unreliable cron and cannot backdate FINAL.
on:
  workflow_run:
    workflows: ["KeibaMetrics JRA Race-Day Autopilot", "KeibaMetrics JRA Race Intent Resolver"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: km-jra-autopilot-failure-recovery
  cancel-in-progress: false

jobs:
  restart-worker:
    if: >-
      ${{
        github.event.workflow_run.path == '.github/workflows/km-jra-race-day-autopilot.yml' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'timed_out')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart after abnormal termination, bounded by race day and retry count
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          D="$(TZ=Asia/Tokyo date +%F)"
          HHMM="$(TZ=Asia/Tokyo date +%H%M)"
          # Nothing to start outside the official JRA day-run window.
          if (( 10#$HHMM < 830 || 10#$HHMM >= 1730 )); then
            echo "RECOVERY_NOT_IN_RACE_DAY_WINDOW date=$D time=$HHMM"
            exit 0
          fi
          # Bound consecutive failures; no infinite workflow_dispatch loop.
          RUNS="$(gh run list --repo "${{ github.repository }}" \
            --workflow km-jra-race-day-autopilot.yml --limit 60 \
            --json conclusion,createdAt)"
          RECENT_FAILURES="$(RUNS="$RUNS" python3 - <<'PY'
          import datetime as dt
          import json
          import os
          cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(minutes=60)
          failures = 0
          for entry in json.loads(os.environ["RUNS"]):
              if entry.get("conclusion") not in ("failure", "timed_out"):
                  continue
              when = dt.datetime.fromisoformat(entry["createdAt"].replace("Z", "+00:00"))
              if when >= cutoff:
                  failures += 1
          print(failures)
          PY
          )"
          if (( RECENT_FAILURES >= 3 )); then
            echo "RECOVERY_LIMIT_REACHED failures_in_last_hour=$RECENT_FAILURES"
            exit 0
          fi
          echo "RECOVERING_JRA_DAY_LOOP date=$D time=$HHMM failures=$RECENT_FAILURES"
          gh workflow run km-jra-race-day-autopilot.yml \
            --repo "${{ github.repository }}" --ref main \
            -f race_date="$D" -f mode=loop
          echo "JRA_DAY_LOOP_RECOVERY_DISPATCHED date=$D"

  reconcile-resolver:
    if: >-
      ${{ github.event.workflow_run.path == '.github/workflows/km-jra-race-intent-resolver.yml' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request canonical status reconciliation after Resolver completion
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          # The day worker observes actual workflow outcomes even if the
          # Resolver's own status writer/push failed. It never infers FINAL.
          D="$(python - <<'PYCODE'
          import os,re,datetime as dt
          title=os.environ['RUN_TITLE']
          match=re.fullmatch(r'JRA intent \S+ (\d{4}-\d{2}-\d{2}|today|) R\d{1,2}',title)
          if not match:raise SystemExit('RESOLVER_RUN_IDENTITY_UNRESOLVED')
          day=match.group(1)
          if day in ('','today'):
              day=dt.datetime.fromisoformat(os.environ['RUN_CREATED_AT'].replace('Z','+00:00')).astimezone(dt.timezone(dt.timedelta(hours=9))).date().isoformat()
          print(dt.date.fromisoformat(day).isoformat())
          PYCODE
          )"
          gh workflow run km-jra-race-day-autopilot.yml \
            --repo "${{ github.repository }}" --ref main \
            -f race_date="$D" -f mode=tick
