name: KM LOCAL Result From Signed Final

on:
  push:
    branches: [main]
    paths:
      - 'runtime/family_result_requests/*.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Result request JSON path'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: km-local-result-oos-ledger
  cancel-in-progress: false

jobs:
  result-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Synchronize latest measurement and execution base
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Resolve RESULT execution metadata
        id: execution_meta
        shell: bash
        run: |
          set -euo pipefail
          REQ="${{ inputs.request_path }}"
          if [ -z "$REQ" ]; then
            mapfile -t REQS < <(
              git diff-tree --no-commit-id --diff-filter=AM --name-only -r "${{ github.sha }}" |
              grep '^runtime/family_result_requests/.*\.json$' || true
            )
            if [ "${#REQS[@]}" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${#REQS[@]}" -ne 1 ]; then
              echo "Expected exactly one changed RESULT request; found ${#REQS[@]}" >&2
              printf '%s\n' "${REQS[@]}" >&2
              exit 2
            fi
            REQ="${REQS[0]}"
          fi
          case "$REQ" in
            runtime/family_result_requests/*.json) ;;
            *) echo "Invalid RESULT request path: $REQ" >&2; exit 2 ;;
          esac
          test -f "$REQ"
          REQUEST_FILE="$REQ" python - <<'PY'
          import json,os,sys
          sys.path.insert(0,"runtime")
          from execution_gateway import load_gateway, normalize_request, artifact_name
          raw=json.load(open(os.environ["REQUEST_FILE"],encoding="utf-8"))
          gateway=load_gateway()
          _,ctx=normalize_request(raw,gateway)
          art=artifact_name(ctx["execution_id"],"RESULT",gateway,"LOCAL")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"request_file={os.environ['REQUEST_FILE']}\n")
              out.write(f"execution_id={ctx['execution_id']}\n")
              out.write(f"artifact_name={art}\n")
          print(json.dumps({
              "request_file":os.environ["REQUEST_FILE"],
              "execution_id":ctx["execution_id"],
              "artifact_name":art
          },ensure_ascii=False))
          PY

      - name: Verify canonical gateway and runtime before RESULT
        if: steps.execution_meta.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_out
          python runtime/execution_gateway.py health-check --family LOCAL --output runtime_out/execution_gateway_result_preflight.json

      - name: Resolve signed FINAL and execute RESULT gate
        if: steps.execution_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REQ="${{ steps.execution_meta.outputs.request_file }}"
          test -n "$REQ"
          python runtime/formal_execution_orchestrator.py --intent "$REQ" --phase RESULT

      - name: Persist canonical RESULT execution phase
        if: success() && steps.execution_meta.outputs.skip != 'true'
        shell: bash
        env:
          EXECUTION_ID: ${{ steps.execution_meta.outputs.execution_id }}
        run: |
          set -euo pipefail

          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "runtime/executions/$EXECUTION_ID/RESULT"
          git diff --cached --quiet || git commit -m "execution: persist $EXECUTION_ID RESULT [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Unable to persist RESULT phase after retries" >&2
          exit 1

      - name: Persist LOCAL forward measurement ledgers
        if: success() && steps.execution_meta.outputs.skip != 'true' && hashFiles('runtime_out/acceptance_only.flag') == ''
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          if [ -f runtime/local_initial_forward_acceptance.json ]; then git add runtime/local_initial_forward_acceptance.json; fi
          if [ -d runtime/local_candidate_forward_measurements ]; then git add runtime/local_candidate_forward_measurements; fi
          if [ -f runtime/local_candidate_forward_status.json ]; then git add runtime/local_candidate_forward_status.json; fi
          if [ -d runtime/local_candidate_dual_oos_measurements ]; then git add runtime/local_candidate_dual_oos_measurements/*.json runtime/local_candidate_dual_oos_status.json 2>/dev/null || true; fi
          if [ -d runtime/local_candidate_v03_oos_measurements ]; then git add runtime/local_candidate_v03_oos_measurements/*.json runtime/local_candidate_v03_oos_status.json 2>/dev/null || true; fi
          if [ -d runtime/mec_shadow_artifacts ]; then git add runtime/mec_shadow_artifacts/*.json 2>/dev/null || true; fi
          if [ -d runtime/mec_shadow_results ]; then git add runtime/mec_shadow_results/*.json 2>/dev/null || true; fi
          if [ -d runtime/mec_shadow_lineage ]; then git add runtime/mec_shadow_lineage/*.json 2>/dev/null || true; fi
          if [ -f runtime/mec_r4_oos_status.json ]; then git add runtime/mec_r4_oos_status.json; fi
          if [ -d runtime/local_mec_r5_shadow_artifacts ]; then git add runtime/local_mec_r5_shadow_artifacts/*.json 2>/dev/null || true; fi
          if [ -d runtime/local_mec_r5_shadow_results ]; then git add runtime/local_mec_r5_shadow_results/*.json 2>/dev/null || true; fi
          if [ -d runtime/local_mec_r5_shadow_lineage ]; then git add runtime/local_mec_r5_shadow_lineage/*.json 2>/dev/null || true; fi
          if [ -f runtime/local_mec_r5_oos_status.json ]; then git add runtime/local_mec_r5_oos_status.json; fi
          if [ -d runtime/common_exact_continuity_shadow_artifacts ]; then git add runtime/common_exact_continuity_shadow_artifacts/*.json 2>/dev/null || true; fi
          if [ -d runtime/common_exact_continuity_shadow_results ]; then git add runtime/common_exact_continuity_shadow_results/*.json 2>/dev/null || true; fi
          if [ -d runtime/common_exact_continuity_shadow_lineage ]; then git add runtime/common_exact_continuity_shadow_lineage/*.json 2>/dev/null || true; fi
          if [ -f runtime/common_exact_continuity_oos_status.json ]; then git add runtime/common_exact_continuity_oos_status.json; fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "measurement: persist LOCAL forward OOS state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Unable to persist measurement state after retries" >&2
          exit 1

      - name: Persist successful signed RESULT envelope
        if: success() && steps.execution_meta.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execution_meta.outputs.artifact_name }}
          path: runtime_out/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist RESULT failure diagnostics
        if: failure() && hashFiles('runtime_out/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: km-local-result-failure-${{ steps.execution_meta.outputs.execution_id }}-${{ github.run_id }}
          path: runtime_out/*.json
          if-no-files-found: warn
          retention-days: 30
