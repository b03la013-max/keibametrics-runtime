name: JRA Race Card Person Token Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-race-card-person-token-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Probe current person token markup
        run: |
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from jra_race_card_detail import _discover_and_fetch
          from source_acquisition import _decode
          raw,h,final,tokens=_discover_and_fetch("2026-09-26","0920260408",12)
          dec=_decode(raw,h.get("content-type",""))
          names=["三浦 皇成","武 豊","大野 拓弥","松若 風馬","藤懸 貴志","武井 亮","庄野 靖志"]
          out={"final":final,"names":{},"accessK_samples":[],"accessC_samples":[]}
          for name in names:
            compact=re.sub(r"\s+","",name)
            hits=[]
            for m in re.finditer(re.escape(compact),re.sub(r"\s+","",dec)):
              # compact offsets do not map back exactly; use direct loose regex too.
              break
            parts=name.split()
            pat=r"\s*".join(re.escape(x) for x in parts)
            for m in list(re.finditer(pat,dec,re.I))[:6]:
              hits.append(dec[max(0,m.start()-600):m.end()+900])
            out["names"][name]=hits
          for key,target in [("accessK_samples","accessK"),("accessC_samples","accessC")]:
            arr=[]
            for m in list(re.finditer(target,dec,re.I))[:30]:
              arr.append(dec[max(0,m.start()-500):m.end()+1000])
            out[key]=arr
          p=Path("runtime/diagnostics/jra_race_card_person_token_probe.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"name_hit_counts":{k:len(v) for k,v in out["names"].items()},
                            "accessK":len(out["accessK_samples"]),"accessC":len(out["accessC_samples"])},ensure_ascii=False))
          PY
      - name: Persist
        run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/jra_race_card_person_token_probe.json
          git commit -m "diagnostic: persist JRA race-card person token markup [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
