name: JRA Netkeiba Table Shape Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-table-shape.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode,_html_tables
          urls={
            "oikiri":"https://race.netkeiba.com/race/oikiri.html?race_id=202609040812&type=2",
            "speed_past":"https://race.netkeiba.com/race/speed.html?mode=past&race_id=202609040812&type=shutuba",
            "course_jockey":"https://race.netkeiba.com/race/data_list.html?race_id=202609040812&mode=courseanalysis&cid=2",
            "course_trainer":"https://race.netkeiba.com/race/data_list.html?race_id=202609040812&mode=courseanalysis&cid=3",
            "course_sire":"https://race.netkeiba.com/race/surf_summary.html?race_id=202609040812&range=4&key1=KettoNumF",
          }
          out={}
          for key,url in urls.items():
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja"})
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(8000000); ct=r.headers.get("content-type","")
            dec=_decode(raw,ct); tabs=_html_tables(dec)
            out[key]={
              "table_count":len(tabs),
              "tables":[{"header":t[0] if t else [],"rows":t[1:21] if len(t)>1 else []} for t in tabs[:5]]
            }
          p=Path("runtime/diagnostics/netkeiba_table_shapes.json")
          p.write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_table_shapes.json
          git commit -m "diagnostic: netkeiba table shapes [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*2)); done
          exit 1
