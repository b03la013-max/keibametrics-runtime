name: JRA Source v1.7 Correctness Acceptance
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-source-v17-correctness.yml"
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt pytest
      - name: Unit acceptance
        run: |
          python -m py_compile runtime/jra_source_runtime/*.py
          pytest -q tests/test_jra_source_runtime.py tests/test_jra_same_day_results.py
      - name: Live post-start mechanical acceptance
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from jra_same_day_results import enrich_with_same_day_results
          art={
            "family_id":"JRA",
            "race_id":"KM-JRA-HSN-20260926-R12-V17-POSTSTART-MECHANICAL",
            "source_race_context":{"family_id":"JRA","venue_id":"HSN","race_date":"2026-09-26","race_no":12},
            "jra_meeting_key_discovered":"0920260408",
            "sources":[]
          }
          art,errs=enrich_with_same_day_results(
            art,"2026-09-27T00:00:00+09:00",require_same_day_results=True
          )
          p=art["jra_official_same_day_results"]
          assert not errs,errs
          assert p["status"]=="PASS",p
          assert p["race_count"]==11,p
          assert set(p["races"])==set(str(i) for i in range(1,12)),p
          assert "12" not in p["races"],p
          assert all((x.get("runner_count") or 0)>0 for x in p["races"].values()),p
          out={
            "profile":"KM-JRA-SOURCE-v1.7-CORRECTNESS-ACCEPTANCE-20260926",
            "status":"PASS",
            "classification":"POST-START / MECHANICAL / NO-OOS-PREDICTION-EFFECT",
            "runtime_profile":"KM-JRA-SOURCE-RUNTIME-v1.7-20260926",
            "target_race":"HSN-20260926-R12",
            "prior_race_count":p["race_count"],
            "target_race_excluded":("12" not in p["races"]),
            "all_prior_results_nonempty":all((x.get("runner_count") or 0)>0 for x in p["races"].values()),
            "source_class":"JRA_OFFICIAL",
            "production_prediction_change":False,
            "numerical_weight_change":False,
            "mec_change":False,
            "capital_change":False
          }
          Path("runtime/acceptance/jra_source_v17_correctness.json").write_text(
            json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2),encoding="utf-8"
          )
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist acceptance marker
        run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/acceptance/jra_source_v17_correctness.json
          git commit -m "ci: persist JRA source v1.7 correctness PASS [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
