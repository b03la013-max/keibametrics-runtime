name: Benter second-stage offline analysis regression
on:
  push:
    branches: [main]
    paths:
      - 'runtime/analysis/**'
      - 'tests/analysis/**'
      - '.github/workflows/km-benter-second-stage-offline.yml'
  pull_request:
    paths:
      - 'runtime/analysis/benter_second_stage.py'
      - 'tests/analysis/test_benter_second_stage.py'
      - '.github/workflows/km-benter-second-stage-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==8.4.2
      - run: python -m pytest -q tests/analysis/test_benter_second_stage.py
