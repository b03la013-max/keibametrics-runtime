name: JRA Netkeiba Data Key Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-key-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,html
          from pathlib import Path
          rid="202609040812"
          urls=[
            f"https://race.netkeiba.com/race/data.html?race_id={rid}",
            f"https://race.netkeiba.com/race/surf_summary.html?race_id={rid}&key1=KettoNumF&range=4",
          ]
          out={}
          for url in urls:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"ja"})
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(5000000).decode("euc-jp","ignore")
            keys=sorted(set(re.findall(r"key1=([A-Za-z0-9_]+)",raw)))
            hrefs=sorted(set(html.unescape(x) for x in re.findall(r'href=["\']([^"\']*surf_summary[^"\']*)',raw,re.I)))
            out[url]={"keys":keys,"hrefs":hrefs[:100],"bytes":len(raw)}
          p=Path("runtime/diagnostics/netkeiba_data_keys.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_data_keys.json
          git commit -m "diagnostic: netkeiba data keys [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
