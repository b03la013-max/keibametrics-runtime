name: JRA Full20 PRE_KRS KRS FINAL SIM-HIGH 20000 Acceptance

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/km-jra-full20-high20000-signed-final-acceptance.yml"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/km-jra-full20-high20000-signed-final-acceptance.yml"
  workflow_dispatch:

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: BaseIndex PRE_KRS KRS FINAL real acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, sys
          sys.path.insert(0,"runtime")
          from prekrs_terminal_compat import adapt_calculator_output

          CALC="https://jra-validation-sandbox-production.up.railway.app"
          KRS="https://quorumprobe-production.up.railway.app"
          RID="KM-ACCEPT-JRA-FULL20-SIMHIGH-20000-20261010-T01"
          CUTOFF="2026-09-20T14:30:00+09:00"

          # Use the actual JRA Production 13 Base + 7 Derived mapping,
          # not the legacy /calculate-jra-base compatibility output, which
          # can be 60 RULED-HOLD with zero formal numerical calculations.
          import runpy
          fixture=runpy.run_path("tests/test_jra_production_fullnumerical_to_krs.py")
          numeric=fixture["req"]
          runners=numeric["runners"]
          assert len(runners)==3
          ranking=[1,2,3]
          roles={"1":["W","P2","P3"],"2":["W","P2","P3"],"3":["P2","P3"]}
          required=[]
          for r in runners:
              rid=r["runner_id"]
              comp=r["canonical_components"]
              assert len(comp)==20 and all(
                  isinstance(x.get("value"),(int,float))
                  and x.get("rule_id") and x.get("mapping_version")
                  and x.get("evidence_refs") and x.get("source_fact")
                  for x in comp.values()
              )
              for name,item in sorted(comp.items()):
                  required.append({
                      "runner_id":rid,"name":name,
                      "status":"CALCULATED","terminal_status":"CALCULATED",
                      "value":item["value"],"formal_value":item["value"],
                      "missing_flag":False,
                      "rule_id":item["rule_id"],
                      "mapping_version":item["mapping_version"],
                  })
          assert len(required)==60
          c={
              "status":"PASS",
              "registry_id":"JRA-EVIDENCE-TO-BASE-MAPPING-v1.0-PRODUCTION-20260921",
              "required_count":60,
              "calculated_count":60,
              "ruled_hold_count":0,
              "not_applicable_count":0,
              "unresolved_count":0,
          }

          def call(base,path,payload=None,method="POST",timeout=240):
              data=None if payload is None else json.dumps(payload,separators=(",",":")).encode()
              headers={"content-type":"application/json"} if payload is not None else {}
              rq=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(rq,timeout=timeout) as response:
                      raw=response.read().decode()
                      return response.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode(errors="replace")
                  try: body=json.loads(raw)
                  except Exception: body={"raw":raw}
                  return exc.code,body
          pre={
            "race_id":RID,
            "runner_universe":[{"horse_no":int(r["runner_id"]),"name":r["name"]} for r in runners],
            "required_indices":required,
            "static_prediction":{"ranking":ranking,"roles":roles,"status":"FROZEN-ACCEPTANCE"},
            "prediction_cutoff":CUTOFF,
            "krs_required":True,
            "krs_executable":True
          }
          pcode,p=call(KRS,"/pre-krs",pre,timeout=60)
          assert c["calculated_count"]==c["required_count"]==60
          assert pcode<300 and p.get("receipt",{}).get("status")=="PASS",(pcode,p)
          vcode,v=call(KRS,"/verify",p,timeout=30)
          assert vcode<300 and v.get("valid") is True,(vcode,v)

          # This is a real external KRS execution using the official JRA
          # 20→30HSV/11Static bridge on *synthetic* evidence inputs.
          kinput=numeric["krs_input_data"]
          assert len(kinput["horses"])==3
          assert all(len(h["hsv"])==30 and len(h["static"])==11 for h in kinput["horses"])
          kinput["simulation"]={"run_count":20000,"master_seed":20260920}
          kpayload={
              "race_id":RID,"input_data":kinput,
              "mode":"SIM-HIGH","seed":20260920,
              "input_class":"FULL-E2E-ACCEPTANCE",
          }
          kcode,k=call(KRS,"/krs/execute",kpayload,timeout=300)
          run=k.get("run_receipt",{})
          rr=run.get("receipt",{})
          assert kcode<300 and rr.get("status")=="EXECUTED",(kcode,k)
          assert rr.get("mode")=="SIM-HIGH",rr
          assert rr.get("requested_run_count")==20000,rr
          assert rr.get("actual_run_count")==20000,rr
          assert rr.get("seed")==20260920,rr
          assert rr.get("input_class")=="FULL-E2E-ACCEPTANCE",rr
          kvcode,kv=call(KRS,"/verify",run,timeout=30)
          assert kvcode<300 and kv.get("valid") is True,(kvcode,kv)

          tickets=[
            {"bet_type":"EXACTA","selection":[1,2],"orientation":"1>2","stake":100},
            {"bet_type":"TRIO","selection":[1,2,3],"stake":100},
            {"bet_type":"TRIFECTA","selection":[1,2,3],"orientation":"1>2>3","stake":100}
          ]
          frozen="2026-09-20T14:30:30+09:00"
          final_payload={
            "race_id":RID,"no_bet":False,"krs_required":True,"krs_executable":True,"krs_run_receipt":run,
            "final_prediction_package":{
              "ranking":ranking,"roles":roles,
              "prediction_source":"FULL_E2E_ACCEPTANCE",
              "krs_output_sha256":rr.get("output_sha256")
            },
            "ticket_transport":tickets,
            "final_ticket":{"finalized":True,"frozen_at":frozen,"no_bet":False,"total_investment":300,"tickets":tickets},
            "final_freeze_timestamp":frozen
          }
          fcode,f=call(KRS,"/final",final_payload,timeout=60)
          assert fcode<300 and f.get("receipt",{}).get("status")=="PASS",(fcode,f)
          fvcode,fv=call(KRS,"/verify",f,timeout=30)
          assert fvcode<300 and fv.get("valid") is True,(fvcode,fv)

          summary={
            "race_id":RID,
            "calc":{
              "status":c.get("status"),
              "registry_id":c.get("registry_id"),
              "required_count":c.get("required_count"),
              "calculated_count":c.get("calculated_count"),
              "ruled_hold_count":c.get("ruled_hold_count"),
              "not_applicable_count":c.get("not_applicable_count"),
              "unresolved_count":c.get("unresolved_count")
            },
            "pre_krs":{"receipt_sha256":p.get("receipt_sha256"),"verified":v.get("valid")},
            "krs":{
              "requested_run_count":rr.get("requested_run_count"),
              "actual_run_count":rr.get("actual_run_count"),
              "engine_version":rr.get("engine_version"),
              "engine_sha256":rr.get("engine_sha256"),
              "parameter_map_sha256":rr.get("parameter_map_sha256"),
              "input_sha256":rr.get("input_sha256"),
              "output_sha256":rr.get("output_sha256"),
              "receipt_sha256":run.get("receipt_sha256"),
              "verified":kv.get("valid"),
              "mode":rr.get("mode")
            },
            "final":{"receipt_sha256":f.get("receipt_sha256"),"verified":fv.get("valid"),"status":f.get("receipt",{}).get("status")},
            "ticket_count":len(tickets),
            "total_investment":300,
            "classification":"SYNTHETIC_HISTORICAL_MECHANICAL / NOT_PRODUCTION / NOT_OOS / NOT_PURCHASE",
            "status":"FULL_E2E_SIMHIGH_20000_PASS"
          }
          from pathlib import Path
          out=Path("runtime_out/jra_full20_high20000_signed_final_acceptance.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+chr(10))
          print("KM_FULL_E2E_SUMMARY="+json.dumps(summary,separators=(",",":"),ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-full20-high20000-signed-final-acceptance
          path: runtime_out/jra_full20_high20000_signed_final_acceptance.json
          if-no-files-found: warn
