name: LOCAL Full Numerical Candidate Regression

on:
  push:
    branches: [main]
    paths:
      - 'mapping/local_evidence_feature_rule_registry_v0.1_candidate_20260923.json'
      - 'mapping/local_full_numerical_mapping_v0.1_candidate_20260923.json'
      - 'mapping/local_evidence_feature_rule_registry_v0.2_candidate_20260923_urw_day_calibrated.json'
      - 'mapping/local_full_numerical_mapping_v0.2_candidate_20260923_urw_day_calibrated.json'
      - 'runtime/local_nar_evidence_candidate.py'
      - 'runtime/local_fullnumerical_candidate.py'
      - 'runtime/local_krs_bridge_candidate.py'
      - 'runtime/local_candidate_numerical_authority.py'
      - 'runtime/local_candidate_walkforward.py'
      - 'runtime/local_candidate_weight_calibrator.py'
      - 'runtime/calibration/local_weight_calibration_v0.2_20260923_urw_day_summary.json'
      - 'tests/test_local_fullnumerical_candidate_v01.py'
      - '.github/workflows/local-full-numerical-candidate-regression.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile candidate modules
        run: |
          python -m py_compile \
            runtime/local_nar_evidence_candidate.py \
            runtime/local_fullnumerical_candidate.py \
            runtime/local_krs_bridge_candidate.py \
            runtime/local_candidate_numerical_authority.py \
            runtime/local_candidate_walkforward.py \
            runtime/local_candidate_weight_calibrator.py
      - name: Run candidate numerical regression
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_local_fullnumerical_candidate_v01.py \
            tests/test_local_numerical_authority_gate.py \
            tests/test_local_production_numerical_closure.py
      - name: Print candidate authority
        run: python runtime/local_candidate_numerical_authority.py
