name: JRA Supplemental Evidence Closure Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/km-formal-request-runner.yml'
      - '.github/workflows/km-jra-supplemental-evidence-acceptance.yml'
      - 'governance/KM-JRA-SUPPLEMENTAL-EVIDENCE-CLOSURE-20260926-R1.json'
      - 'mapping/jra_base_index_evidence_mapping_v1.0_20260921.json'
      - 'mapping/jra_evidence_feature_rule_registry_v1.1_20260922.json'
      - 'mapping/jra_evidence_feature_rule_registry_v1.3_20261010.json'
      - 'runtime/evidence_feature_compiler.py'
      - 'runtime/jra_evidence_to_base_production.py'
      - 'runtime/jra_index_provenance_builder.py'
      - 'runtime/jra_supplemental_evidence_pack.py'
      - 'tests/test_jra_supplemental_evidence_pack.py'
      - 'tests/test_jra_supplemental_full_numerical_closure.py'
      # ci_paths:end
  push:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/km-formal-request-runner.yml'
      - '.github/workflows/km-jra-supplemental-evidence-acceptance.yml'
      - 'governance/KM-JRA-SUPPLEMENTAL-EVIDENCE-CLOSURE-20260926-R1.json'
      - 'mapping/jra_base_index_evidence_mapping_v1.0_20260921.json'
      - 'mapping/jra_evidence_feature_rule_registry_v1.1_20260922.json'
      - 'mapping/jra_evidence_feature_rule_registry_v1.3_20261010.json'
      - 'runtime/evidence_feature_compiler.py'
      - 'runtime/jra_evidence_to_base_production.py'
      - 'runtime/jra_index_provenance_builder.py'
      - 'runtime/jra_supplemental_evidence_pack.py'
      - 'tests/test_jra_supplemental_evidence_pack.py'
      - 'tests/test_jra_supplemental_full_numerical_closure.py'
      # ci_paths:end
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q pytest
      - name: Unit and full numerical closure
        run: |
          python tests/test_jra_supplemental_evidence_pack.py
          python tests/test_jra_supplemental_full_numerical_closure.py
      - name: Formal runner integration assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/km-formal-request-runner.yml").read_text()
          assert "apply_supplemental_evidence_pack" in p
          assert "SUPPLEMENTAL_EVIDENCE_PACK_VERIFIED" in p
          assert "supplemental_evidence_pack" in p
          print("FORMAL_RUNNER_SUPPLEMENTAL_INTEGRATION_PASS")
          PY
