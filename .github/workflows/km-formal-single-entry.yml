name: KeibaMetrics Formal Single Entry

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [ main ]
    paths:
      - "runtime/formal_intents/*.json"
  workflow_dispatch:
    inputs:
      intent_path:
        description: "Single-entry Formal intent JSON"
        required: true
        type: string

jobs:
  orchestrate:
    concurrency:
      group: km-formal-${{ inputs.intent_path || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve single intent
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          INTENT="${{ inputs.intent_path }}"
          if [ -z "$INTENT" ]; then
            mapfile -t INTENTS < <(
              git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" |
              grep '^runtime/formal_intents/.*\.json$' || true
            )
            if [ "${#INTENTS[@]}" -ne 1 ]; then
              echo "Expected exactly one Formal intent; found ${#INTENTS[@]}" >&2
              printf '%s\n' "${INTENTS[@]}" >&2
              exit 2
            fi
            INTENT="${INTENTS[0]}"
          fi
          case "$INTENT" in
            runtime/formal_intents/*.json) ;;
            *) echo "Invalid intent path: $INTENT" >&2; exit 2 ;;
          esac
          test -f "$INTENT"
          INTENT_FILE="$INTENT" python - <<'PY'
          import json,os
          import sys
          sys.path.insert(0,"runtime")
          from execution_gateway import derive_execution_id
          req=json.load(open(os.environ["INTENT_FILE"],encoding="utf-8"))
          family=str(req.get("family_id") or "").upper()
          if family!="LOCAL":
              raise SystemExit("Single-entry currently supports LOCAL only")
          execution_id=derive_execution_id(req)
          race=req.get("race") if isinstance(req.get("race"),dict) else {}
          venue=str(req.get("venue_id") or race.get("venue_id") or "UNKNOWN")
          date=str(req.get("race_date") or race.get("race_date") or race.get("date") or "UNKNOWN")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"intent_file={os.environ['INTENT_FILE']}\n")
              out.write(f"execution_id={execution_id}\n")
              out.write(f"family_id={family}\n")
              out.write(f"cache_prefix=km-raceday-fast-v1-{venue}-{date}-\n")
          print(json.dumps({"execution_id":execution_id,"family_id":family},ensure_ascii=False))
          PY

      - name: Restore deterministic race-day cache
        uses: actions/cache/restore@v4
        with:
          path: .km_fast_cache
          key: ${{ steps.meta.outputs.cache_prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.meta.outputs.cache_prefix }}

      - name: Current Authority and scope guard
        shell: bash
        env:
          REQUEST_FILE: ${{ steps.meta.outputs.intent_file }}
        run: |
          set -euo pipefail
          python runtime/family_authority_guard.py --request "$REQUEST_FILE"

      - name: Verify canonical Runtime before orchestration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_out
          python runtime/execution_gateway.py health-check --family LOCAL --output runtime_out/execution_gateway_preflight.json

      - name: Verify Formal import closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_out
          python runtime/formal_import_closure.py \
            --entry runtime/non_jra_formal_runner.py \
            --output runtime_out/formal_import_closure.json

      - name: Execute SOURCE to FORMAL as one lifecycle
        id: execute
        shell: bash
        run: |
          set +e
          python runtime/formal_execution_orchestrator.py \
            --intent "${{ steps.meta.outputs.intent_file }}" \
            --run-id "${{ github.run_id }}" \
            --github-sha "${{ github.sha }}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist pre-result SOURCE and FINAL before waiting
        if: always() && steps.meta.outputs.execution_id != ''
        shell: bash
        env:
          EXECUTION_ID: ${{ steps.meta.outputs.execution_id }}
          PERSIST_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -d "runtime/executions/$EXECUTION_ID" || exit 0
          mkdir -p "runtime/execution_reports/$EXECUTION_ID"
          if [ -f runtime_out/orchestration_report.json ]; then
            cp runtime_out/orchestration_report.json "runtime/execution_reports/$EXECUTION_ID/${{ github.run_id }}-formal.json"
          fi
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "runtime/executions/$EXECUTION_ID" "runtime/execution_reports/$EXECUTION_ID"
          git diff --cached --quiet && exit 0
          git commit -m "execution: pre-result freeze $EXECUTION_ID [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$PERSIST_BRANCH" && git push origin "HEAD:$PERSIST_BRANCH"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Continue official RESULT to Settlement and Learning
        id: result
        if: steps.execute.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python runtime/formal_execution_orchestrator.py \
            --intent "${{ steps.meta.outputs.intent_file }}" \
            --resume-official-result --result-wait-seconds 10800 \
            --run-id "${{ github.run_id }}" --github-sha "${{ github.sha }}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate AKI adaptive purchase paper OOS after official RESULT
        if: steps.result.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python runtime/aki_adaptive_oos_tracker.py --root runtime/executions --output runtime/aki_adaptive_oos_status.json
          rc=$?
          if [ "$rc" != "0" ]; then
            echo "::warning::AKI paper OOS integrity HOLD; no Production modification."
          fi
          exit 0

      - name: Persist durable successful phase checkpoints
        if: always()
        shell: bash
        env:
          EXECUTION_ID: ${{ steps.meta.outputs.execution_id }}
          PERSIST_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -d "runtime/executions/$EXECUTION_ID" ]; then
            exit 0
          fi
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "runtime/executions/$EXECUTION_ID"
          if [ -d "runtime/execution_reports/$EXECUTION_ID" ]; then git add "runtime/execution_reports/$EXECUTION_ID"; fi
          # Existing RESULT workflow owns the same forward ledgers. Preserve
          # its generated state when RESULT runs as an internal continuation.
          for path in runtime/local_candidate_forward_measurements runtime/local_candidate_forward_status.json runtime/local_initial_forward_acceptance.json runtime/local_candidate_dual_oos_measurements runtime/local_candidate_dual_oos_status.json runtime/local_candidate_v03_oos_measurements runtime/local_candidate_v03_oos_status.json runtime/mec_shadow_results runtime/mec_shadow_lineage runtime/mec_r4_oos_status.json runtime/local_mec_r5_shadow_results runtime/local_mec_r5_shadow_lineage runtime/local_mec_r5_oos_status.json runtime/aki_adaptive_oos_status.json runtime/common_exact_continuity_shadow_results runtime/common_exact_continuity_shadow_lineage runtime/common_exact_continuity_oos_status.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if [ -f runtime_out/orchestration_report.json ]; then
            mkdir -p "runtime/execution_reports/$EXECUTION_ID"
            cp runtime_out/orchestration_report.json "runtime/execution_reports/$EXECUTION_ID/${{ github.run_id }}.json"
            git add "runtime/execution_reports/$EXECUTION_ID"
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "execution: checkpoint $EXECUTION_ID [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$PERSIST_BRANCH" && git push origin "HEAD:$PERSIST_BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Unable to persist orchestration checkpoints" >&2
          exit 1

      - name: Save deterministic race-day cache
        if: steps.execute.outputs.rc == '0'
        uses: actions/cache/save@v4
        with:
          path: .km_fast_cache
          key: ${{ steps.meta.outputs.cache_prefix }}${{ github.run_id }}

      - name: Upload orchestration evidence
        if: always() && hashFiles('runtime_out/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: km-formal-single-entry-${{ steps.meta.outputs.execution_id }}-${{ github.run_id }}
          path: runtime_out/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce orchestration result
        if: always()
        shell: bash
        env:
          RC: ${{ steps.execute.outputs.rc }}
          RESULT_RC: ${{ steps.result.outputs.rc }}
        run: |
          set -euo pipefail
          test "${RC:-2}" = "0"
          test "${RESULT_RC:-2}" = "0"

