name: LOCAL Source Parallel Staged Acceptance

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/local_physical/source_acquisition.py"
      - "runtime/execution_gateway.py"
      - "profiles/current_execution_gateway.json"
      - "profiles/local_source_parallel_staged_20260928_R1.json"
      - "tests/test_source_acquisition.py"
      - "tests/test_execution_gateway.py"
      - ".github/workflows/km-local-source-parallel-staged-acceptance.yml"
      - "governance/KM-LOCAL-SOURCE-PARALLEL-STAGED-20260928-R1.md"
  push:
    branches: [main]
    paths:
      - "runtime/local_physical/source_acquisition.py"
      - "runtime/execution_gateway.py"
      - "profiles/current_execution_gateway.json"
      - ".github/workflows/km-local-source-parallel-staged-acceptance.yml"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Compile
        run: |
          python -m py_compile             runtime/local_physical/source_acquisition.py             runtime/execution_gateway.py
      - name: Source and gateway regression
        run: |
          python -m pytest -q             tests/test_source_acquisition.py             tests/test_execution_gateway.py
      - name: Verify staged or promoted source-parallel state truthfully
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          gw=json.load(open("profiles/current_execution_gateway.json",encoding="utf-8"))
          st=json.load(open("profiles/local_source_parallel_staged_20260928_R1.json",encoding="utf-8"))
          cfg=gw["families"]["LOCAL"]
          active=cfg["active_bundle_sha256"]
          cand=hashlib.sha256(Path("runtime/local_physical/source_acquisition.py").read_bytes()).hexdigest()
          assert gw["policy"]["active_runtime_bundle_explicitly_frozen"] is True
          assert gw["policy"]["candidate_checkout_may_not_redefine_active_runtime_bundle"] is True
          status=str(st["status"])
          if status.startswith("STAGED / NON-PRODUCTION"):
              assert cand != active["source_acquisition_sha256"]
              state="STAGED_PENDING_LIVE_DEPLOYMENT"
          elif status.startswith("PROMOTED / HISTORY"):
              assert cand == active["source_acquisition_sha256"]
              assert cfg["runtime_profile"]==st["active_runtime_profile"]
              assert cfg["runtime_git_revision"]==st["active_runtime_git_revision"]
              assert active["source_acquisition_sha256"]==st["promotion_evidence"]["active_source_acquisition_sha256"]
              state="PROMOTED_ACTIVE_VERIFIED"
          else:
              raise AssertionError("UNKNOWN_SOURCE_PARALLEL_LIFECYCLE_STATUS:"+status)
          assert st["automatic_activation"] is False
          print(json.dumps({
            "status":"PASS",
            "lifecycle_state":state,
            "gateway_profile":gw["profile_id"],
            "current_authority":gw["parent_current_authority"],
            "runtime_profile":cfg["runtime_profile"],
            "active_source_sha256":active["source_acquisition_sha256"],
            "checkout_source_sha256":cand
          },indent=2))
          PY
