name: JRA Netkeiba CID Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-cid-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,html
          from pathlib import Path
          rid="202609040812"
          urls=[f"https://race.netkeiba.com/race/data_list.html?mode=courseanalysis&race_id={rid}"]+[f"https://race.netkeiba.com/race/data_list.html?cid={i}&mode=courseanalysis&race_id={rid}" for i in range(1,9)]
          names=["スターウェーブ","レッドレベンディス","タイセイピューマ","ザウリ","ブルーノート","ゴールデンバランス","タイセイディアマン","インディゴアスール","シュバルツガイスト","ニホンピロカラット","キャッチアシーフ","アスゴッド","ランドスター","ヒットミー","ストロングボンド","ダズリングダンス"]
          out={}
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"ja"})
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read(5000000)
                ctype=r.headers.get("content-type","")
              for enc in ["euc-jp","utf-8","cp932"]:
                try:
                  dec=raw.decode(enc); break
                except: pass
              txt=re.sub(r"<[^>]+>"," ",dec)
              txt=html.unescape(re.sub(r"\s+"," ",txt))
              cids=sorted(set(re.findall(r"(?:cid=)(\d+)",dec)))
              links=sorted(set(html.unescape(x) for x in re.findall(r'href=["\']([^"\']*data_list[^"\']*)',dec,re.I)))
              out[url]={"status":"PASS","bytes":len(raw),"cids":cids,"links":links[:120],"runner_matches":[n for n in names if n in txt],"text_head":txt[:1200]}
            except Exception as e:
              out[url]={"status":"FAIL","error":type(e).__name__+":"+str(e)}
          p=Path("runtime/diagnostics/netkeiba_cid_probe.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_cid_probe.json
          git commit -m "diagnostic: netkeiba cid probe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
