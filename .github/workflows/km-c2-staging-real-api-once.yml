name: C2 Candidate real API one-shot acceptance

on:
  workflow_dispatch:
    inputs:
      authentication_only:
        description: 'No-race pinned-model credential preflight only; no external receipt transfer'
        type: boolean
        default: true

permissions:
  contents: read

env:
  KM_CREDENTIAL_ENVIRONMENT: keibametrics-staging

jobs:
  c2-real-api:
    if: github.ref == 'refs/heads/candidate/result-learning-resume-r3'
    runs-on: ubuntu-latest
    environment: keibametrics-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen C2 Candidate and execute existing real API comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p runtime_out
          mode=--historical-comparison
          if [ "${{ inputs.authentication_only }}" = "true" ]; then mode=--authentication-only; fi
          python runtime/openai_prediction_owner_candidate.py \
            "$mode" \
            --config research/owner_candidate/KM_LOCAL_OPENAI_OWNER_CANDIDATE_v1.json \
            --output runtime_out/owner_behavioral_comparison.json
      - name: Existing Owner in two fresh historical processes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if ! python -c 'import json,sys; sys.exit(0 if json.load(open("runtime_out/owner_behavioral_comparison.json")).get("status")=="HISTORICAL_BEHAVIORAL_COMPARISON_RECORDED" else 1)'; then exit 0; fi
          set +e
          python runtime/openai_prediction_owner_candidate.py --historical-comparison --race-id KM-LOCAL-FNB-20261001-R07-LIVE-R2 --config research/owner_candidate/KM_LOCAL_OPENAI_OWNER_CANDIDATE_v1.json --output runtime_out/isolation_r07.json
          a=$?
          python runtime/openai_prediction_owner_candidate.py --historical-comparison --race-id KM-LOCAL-FNB-20261001-R08-LIVE-R1 --config research/owner_candidate/KM_LOCAL_OPENAI_OWNER_CANDIDATE_v1.json --output runtime_out/isolation_r08.json
          b=$?
          test "$a" = 0 && test "$b" = 0
      - name: Preserve sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-one-shot-real-api-${{ github.run_id }}
          path: runtime_out/*.json
          if-no-files-found: warn
