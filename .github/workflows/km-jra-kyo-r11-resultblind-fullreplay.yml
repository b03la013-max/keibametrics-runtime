      - 'mapping/jra_base_index_evidence_mapping_v1.0_20260921.json'
      - 'runtime/capital_policy.py'
      - 'runtime/executions/KM-JRA-KYO-20261012-R10-LIVE-R1/SOURCE/runs/38207250686/source_receipt_envelope.json'
      - 'runtime/formal_request_validator.py'
      - 'runtime/jra_candidate_krs_plan.py'
      - 'runtime/jra_evidence_to_base_production.py'
      - 'runtime/jra_r11_resultblind_fullreplay.py'
      - 'runtime/jra_resultblind_replay_requests/*.json'
      - 'runtime/jra_source_candidate_numerical.py'
      - 'runtime/jra_source_candidate_semantics.py'
      - 'runtime/jra_source_runtime/jra_current_environment.py'
      - 'runtime/jra_source_runtime/jra_market_observation.py'
      - 'runtime/jra_source_runtime/jra_observed_context.py'
      - 'runtime/jra_source_runtime/jra_official_pdf.py'
      - 'runtime/jra_source_runtime/jra_race_card_detail.py'
      - 'runtime/jra_source_runtime/jra_source_manifest.py'
      - 'runtime/jra_source_runtime/requirements.txt'
      - 'runtime/jra_source_runtime/source_acquisition.py'
      - 'runtime/jra_source_runtime/verify_source_envelope.py'
      - 'runtime/krs_prediction_utility.py'
      - 'runtime/minimum_efficient_coverage.py'
      - 'runtime/prekrs_terminal_compat.py'
      # ci_paths:end
  push:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/km-jra-kyo-r11-resultblind-fullreplay.yml'
      - 'mapping/jra_base_index_evidence_mapping_v1.0_20260921.json'
      - 'runtime/capital_policy.py'
      - 'runtime/executions/KM-JRA-KYO-20261012-R10-LIVE-R1/SOURCE/runs/38207250686/source_receipt_envelope.json'
      - 'runtime/formal_request_validator.py'
      - 'runtime/jra_candidate_krs_plan.py'
      - 'runtime/jra_evidence_to_base_production.py'
      - 'runtime/jra_r11_resultblind_fullreplay.py'
      - 'runtime/jra_resultblind_replay_requests/*.json'
      - 'runtime/jra_source_candidate_numerical.py'
      - 'runtime/jra_source_candidate_semantics.py'
      - 'runtime/jra_source_runtime/jra_current_environment.py'
      - 'runtime/jra_source_runtime/jra_market_observation.py'
      - 'runtime/jra_source_runtime/jra_observed_context.py'
      - 'runtime/jra_source_runtime/jra_official_pdf.py'
      - 'runtime/jra_source_runtime/jra_race_card_detail.py'
      - 'runtime/jra_source_runtime/jra_source_manifest.py'
      - 'runtime/jra_source_runtime/requirements.txt'
      - 'runtime/jra_source_runtime/source_acquisition.py'
      - 'runtime/jra_source_runtime/verify_source_envelope.py'
      - 'runtime/krs_prediction_utility.py'
      - 'runtime/minimum_efficient_coverage.py'
      - 'runtime/prekrs_terminal_compat.py'
      # ci_paths:end
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install real JRA Python dependencies
        run: python -m pip install -q -r runtime/jra_source_runtime/requirements.txt
      - name: Verify genuine pre-race R10 SOURCE OIDC and extract R11 official PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify runtime/executions/KM-JRA-KYO-20261012-R10-LIVE-R1/SOURCE/runs/38207250686/source_receipt_envelope.json --repo "${{ github.repository }}"
      - name: Execute all calculable result-blind candidate stages with external KRS
        id: execute
        continue-on-error: true
        run: |
          python runtime/jra_r11_resultblind_fullreplay.py
      - name: Attest result-blind computation evidence
        if: always()
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: runtime_out/kyo_r11_resultblind/00_status.json
      - name: Upload every completed stage and exact failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyo-r11-resultblind-fullstage-${{ github.run_id }}
          path: runtime_out/kyo_r11_resultblind/
          if-no-files-found: warn
          retention-days: 90
      - name: Return real full-stage verdict
        if: always()
        run: |
          test -f runtime_out/kyo_r11_resultblind/00_status.json
          python - <<'PY'
          import json
          x=json.load(open("runtime_out/kyo_r11_resultblind/00_status.json"))
          print(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2))
          assert x.get("complete"), "REPLAY_FULL_STAGE_INCOMPLETE"
          PY
