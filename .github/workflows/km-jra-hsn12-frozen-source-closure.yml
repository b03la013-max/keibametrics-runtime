name: JRA HSN12 Frozen SOURCE Closure Diagnostic
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-hsn12-frozen-source-closure.yml"
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Enrich frozen pre-race SOURCE with current adapters
        run: |
          python - <<'PY'
          import json,sys,copy
          from pathlib import Path
          sys.path.insert(0,"runtime")
          sys.path.insert(0,"runtime/jra_source_runtime")
          from jra_registered_common import enrich_with_registered_common
          from jra_person_stats import enrich_with_person_stats
          from jra_zero_touch_source_index_orchestrator import build_source_runner_stubs
          from jra_source_to_evidence_features import compile_source_to_features
          env=json.load(open("runtime/executions/KM-JRA-HSN-20260926-R12-LIVE-R2/SOURCE/runs/36226047250/source_receipt_envelope.json",encoding="utf-8"))
          art=copy.deepcopy(env["artifact"])
          original_sha=art["source_snapshot_sha256"]
          # POST-START parser/wiring acceptance only. A future cutoff avoids falsely
          # classifying today's diagnostic fetch as pre-race evidence.
          diagnostic_cutoff="2026-09-26T23:59:00+09:00"
          art,workout_errors=enrich_with_registered_common(art,diagnostic_cutoff,require_workout=True)
          art,person_errors=enrich_with_person_stats(art,diagnostic_cutoff,require_person_stats=False,max_workers=3)
          runners=build_source_runner_stubs(art)
          mapping=json.load(open("mapping/jra_base_index_evidence_mapping_v1.0_20260921.json",encoding="utf-8"))
          rep=compile_source_to_features(art,runners,mapping)
          rc=art.get("jra_registered_common") or {}
          ps=art.get("jra_official_person_stats") or {}
          out={
            "acceptance_only":True,
            "temporal_class":"POST-START / FROZEN-PRE-RACE-SOURCE-WIRING-DIAGNOSTIC",
            "original_signed_source_snapshot_sha256":original_sha,
            "runner_count":len(runners),
            "workout_status":rc.get("status"),
            "workout_runner_count":((rc.get("workout") or {}).get("runner_count")),
            "workout_errors":workout_errors,
            "person_status":ps.get("status"),
            "person_runner_count":ps.get("runner_count"),
            "matched_jockey_count":ps.get("matched_jockey_count"),
            "matched_trainer_count":ps.get("matched_trainer_count"),
            "direct_jockey_token_count":ps.get("direct_jockey_token_count"),
            "direct_trainer_token_count":ps.get("direct_trainer_token_count"),
            "person_errors":person_errors,
            "formal_base_ready_after_merge":rep.get("formal_base_ready_after_merge"),
            "missing_source_families":rep.get("missing_source_families"),
            "runner_coverage":{
              rid:{
                "name":rr.get("runner_name"),
                "generated":sorted((rr.get("generated_production_features") or {}).keys()),
                "present":rr.get("coverage",{}).get("present_feature_count"),
                "missing_source_families":rr.get("coverage",{}).get("missing_source_families"),
                "failed_indices":[k for k,v in (rr.get("coverage",{}).get("indices") or {}).items() if not v.get("pass")],
                "index_coverage":{k:v.get("covered_weight") for k,v in (rr.get("coverage",{}).get("indices") or {}).items()}
              } for rid,rr in rep.get("runners",{}).items()
            }
          }
          assert out["runner_count"]==16,out
          assert out["workout_status"]=="PASS",out
          assert out["workout_runner_count"]==16,out
          p=Path("runtime/diagnostics/hsn12_frozen_source_closure.json")
          p.write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist diagnostic
        run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/hsn12_frozen_source_closure.json
          git commit -m "diagnostic: HSN12 frozen SOURCE closure [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*2)); done
          exit 1
