name: KM LOCAL quarter-hour autonomous maintenance guard (non-production)

# Cron is best-effort; no assertion of guaranteed starts.
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/km-local-quarter-hour-maintenance.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: km-local-quarter-hour-maintenance
  cancel-in-progress: false

jobs:
  observe-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Sparse checkout immutable LOCAL guard inputs
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/km-local-race-key-entry.yml
            .github/workflows/km-local-quarter-hour-maintenance.yml
            runtime/local_race_entry.py
            runtime/local_race_day_dispatcher.py
            runtime/local_race_key_gate.py
            runtime/local_numerical_authority_gate.py
            profiles/local_production_static_owner_20261014_v1.json
            mapping/local_full_numerical_mapping_v1.0_production_20261008.json
            mapping/local_evidence_feature_rule_registry_v1.0_20260922.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate runtime surface, 29-index contract and previous workflow outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/km-local-15m"
          python - <<'PY'
          import ast, hashlib, json, os, pathlib, time
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          paths = [
              'runtime/local_race_entry.py',
              'runtime/local_race_day_dispatcher.py',
              'runtime/local_race_key_gate.py',
              'runtime/local_numerical_authority_gate.py',
              'profiles/local_production_static_owner_20261014_v1.json',
              'mapping/local_full_numerical_mapping_v1.0_production_20261008.json',
              'mapping/local_evidence_feature_rule_registry_v1.0_20260922.json',
              '.github/workflows/km-local-race-key-entry.yml',
          ]
          errors, checks = [], []
          for rel in paths:
              path = root / rel
              if not path.is_file():
                  checks.append({'path': rel, 'status': 'MISSING'})
                  errors.append('REQUIRED_FILE_MISSING:' + rel)
                  continue
              data = path.read_bytes()
              item = {'path': rel, 'status': 'PRESENT', 'sha256': hashlib.sha256(data).hexdigest()}
              if rel.endswith('.py'):
                  try: ast.parse(data, filename=rel)
                  except SyntaxError:
                      item['syntax'] = 'FAIL'
                      errors.append('PYTHON_SYNTAX:' + rel)
                  else: item['syntax'] = 'PASS'
              checks.append(item)

          authority = {'status': 'UNKNOWN', 'reason': 'CONFIG_NOT_VERIFIED'}
          try:
              owner = json.loads((root / paths[4]).read_text(encoding='utf-8'))
              mapping = json.loads((root / paths[5]).read_text(encoding='utf-8'))
              indices = mapping['required_indices']
              exact29 = isinstance(indices,list) and len(indices)==29 and len(set(indices))==29
              if not exact29: errors.append('INDEX_MANIFEST_NOT_29_UNIQUE')
              flags = ('numerical_prediction_consumption','krs_numeric_consumption',
                       'ticket_numeric_consumption','capital_numeric_consumption')
              authority = {
                  'status':'CONFIG_INSPECTED_ONLY_NOT_RUNTIME_VERIFIED',
                  'owner_enabled': owner.get('enabled') is True,
                  'venues': owner.get('venues',[]),
                  'production_suite': owner.get('production_suite','UNKNOWN'),
                  'index_manifest':'29_DECLARED_NOT_29_CALCULATED' if exact29 else 'INVALID',
                  'consumer_flags': {k:owner.get(k) is True for k in flags},
                  'signed_source': 'NOT_VERIFIED',
                  'private_store_checkpoint': 'NOT_VERIFIED',
                  'signed_final_delivery': 'NOT_VERIFIED',
              }
          except (OSError, ValueError, KeyError, TypeError) as exc:
              errors.append('AUTHORITY_CONFIG_UNREADABLE:' + type(exc).__name__)

          now = datetime.now(timezone.utc)
          actions = {'status': 'UNKNOWN', 'reason': 'API_NOT_READ'}
          repo = os.environ.get('GITHUB_REPOSITORY','')
          token = os.environ.get('GH_TOKEN','')
          if token and repo and repo.count('/') == 1:
              url = f'https://api.github.com/repos/{repo}/actions/workflows/km-local-race-key-entry.yml/runs?per_page=30'
              req = Request(url,headers={'Accept':'application/vnd.github+json',
                                    'Authorization':'Bearer '+token,
                                    'X-GitHub-Api-Version':'2022-11-28',
                                    'User-Agent':'km-local-15m-readonly'})
              for attempt in range(2):
                  try:
                      with urlopen(req,timeout=8) as resp: payload=json.load(resp)
                      if not isinstance(payload.get('workflow_runs'),list): raise ValueError('INVALID_SCHEMA')
                      recent = []
                      for run in payload['workflow_runs']:
                          try:
                              created = datetime.fromisoformat(run['created_at'].replace('Z','+00:00'))
                              if now-timedelta(hours=24) <= created <= now+timedelta(minutes=2):
                                  recent.append({'id':run['id'],'conclusion':run.get('conclusion'),
                                                 'status':run.get('status'),'url':run.get('html_url','')})
                          except (KeyError,TypeError,ValueError): continue
                      failures = [r for r in recent if r['conclusion'] in ('failure','timed_out','action_required')]
                      actions = {'status':'OBSERVED','recent_24h':len(recent),
                                 'failed_24h':len(failures),'failures':failures[:10],
                                 'race_prediction_verified':False}
                      break
                  except HTTPError as exc:
                      if attempt or exc.code not in (429,500,502,503,504):
                          actions={'status':'UNKNOWN','reason':'HTTP_'+str(exc.code)}
                          break
                  except (OSError,ValueError,URLError) as exc:
                      if attempt:
                          actions={'status':'UNKNOWN','reason':'API_READ_'+type(exc).__name__}
                          break
                  time.sleep(1)

          if errors: blocker = 'LOCAL_STATIC_GUARD_FAILURE'
          elif actions.get('failed_24h',0): blocker = 'EXISTING_WORKFLOW_FAILED_TRIAGE_REQUIRED'
          elif not all(authority.get('consumer_flags',{}).values()):
              blocker = 'OWNER_CONSUMER_NOT_ALL_ENABLED'
          else: blocker = 'NO_STATIC_BLOCKER_FORMAL_STILL_UNVERIFIED'

          report = {'schema':'KM-LOCAL-15M-MAINTENANCE-GUARD-v1',
                    'timestamp_utc':now.isoformat(), 'github_sha':os.getenv('GITHUB_SHA','UNKNOWN'),
                    'classification':'NON-PRODUCTION/READ-ONLY/NOT-OOS',
                    'first_observed_blocker':blocker,
                    'required_files':checks,'authority':authority,'actions':actions,'errors':errors,
                    'mutations':0,'live_dispatch':0,'attempted_formal_retries':0,
                    'signed_receipts_verified':0,'actual_bets':0,'repair_commits':0,
                    'note':'No AI code modifications; approved deterministic repair recipes not connected.'}
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'km-local-15m'/'observation.json'
          output.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          summary = os.getenv('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a') as fh:
                  fh.write('## LOCAL 15-minute maintenance guard\n\n')
                  fh.write(f'- Check: {now.isoformat()}\n- First blocker: {blocker}\n')
                  fh.write(f'- Static errors: {len(errors)}\n')
                  fh.write(f'- Race-Key failed runs observed: {actions.get("failed_24h","UNKNOWN")}\n')
                  fh.write('- Formal SOURCE/FINAL/Delivery: NOT VERIFIED\n')
                  fh.write('- Mutations/dispatch/merge/deploy/purchase: NONE\n')
          print(json.dumps({'blocker':blocker,'errors':errors,'actions':actions},ensure_ascii=False))
          if errors: raise SystemExit(1)
          PY
      - name: Preserve public-safe observation only, never official raw or Private Store
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km-local-15m-${{ github.run_id }}
          path: ${{ runner.temp }}/km-local-15m/observation.json
          if-no-files-found: warn
          retention-days: 7
