name: Netkeiba R12 Structured Tables
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-netkeiba-r12-structured-tables.yml"
jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,urllib.request,sys
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode,_html_tables,_html_text
          urls={
           "oikiri":"https://race.sp.netkeiba.com/?pid=oikiri&race_id=202609040812&rf=rs",
           "sire_course":"https://race.netkeiba.com/race/surf_summary.html?key1=KettoNumF&race_id=202609040812&range=4",
           "speed_band":"https://race.netkeiba.com/race/surf_summary.html?key1=SpeedIdxScore&race_id=202609040812&range=4",
           "ranking":"https://race.netkeiba.com/race/data.html?mode=ranking&race_id=202609040812",
           "bias":"https://race.netkeiba.com/race/bias.html?race_id=202609040812"
          }
          out={}
          for k,u in urls.items():
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja,en;q=0.3"})
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(6000000);ct=r.headers.get("content-type","")
            dec=_decode(raw,ct)
            out[k]={"url":u,"sha256":__import__("hashlib").sha256(raw).hexdigest(),"tables":_html_tables(dec)[:12],"text_head":_html_text(dec)[:1200]}
          p=Path("runtime/diagnostics/netkeiba_r12_structured_tables.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PASS",[(k,len(v["tables"])) for k,v in out.items()])
          PY
      - run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_r12_structured_tables.json
          git commit -m "diagnostic: persist netkeiba R12 tables [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
