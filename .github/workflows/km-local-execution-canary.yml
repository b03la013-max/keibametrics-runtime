name: KM LOCAL Execution Gateway Canary

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
  pull_request:
    paths:
      - 'profiles/current_execution_gateway.json'
      - 'profiles/family_runtime_contracts_*.json'
      - 'runtime/execution_gateway.py'
      - 'runtime/execution_store.py'
      - 'runtime/family_runtime_contract.py'
      - 'runtime/non_jra_formal_runner.py'
      - 'runtime/local_result_from_signed_final.py'
      - 'runtime/local_physical/**'
      - 'tests/test_execution_gateway.py'
      - 'tests/test_execution_store.py'
      - 'tests/test_execution_workflow_contract.py'
      - '.github/workflows/km-local-execution-canary.yml'
      - '.github/workflows/km-family-non-jra-formal-runner.yml'
      - '.github/workflows/km-local-result-from-signed-final.yml'
  push:
    branches: [main]
    paths:
      - 'profiles/current_execution_gateway.json'
      - 'profiles/family_runtime_contracts_*.json'
      - 'runtime/execution_gateway.py'
      - 'runtime/execution_store.py'
      - 'runtime/family_runtime_contract.py'
      - 'runtime/non_jra_formal_runner.py'
      - 'runtime/local_result_from_signed_final.py'
      - 'runtime/local_physical/**'
      - 'tests/test_execution_gateway.py'
      - 'tests/test_execution_store.py'
      - 'tests/test_execution_workflow_contract.py'
      - '.github/workflows/km-local-execution-canary.yml'
      - '.github/workflows/km-family-non-jra-formal-runner.yml'
      - '.github/workflows/km-local-result-from-signed-final.yml'

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Lint execution workflows
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color \
            .github/workflows/km-family-non-jra-formal-runner.yml \
            .github/workflows/km-local-result-from-signed-final.yml \
            .github/workflows/km-local-execution-canary.yml

      - name: Compile and unit-test execution gateway
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            runtime/execution_gateway.py \
            runtime/execution_store.py \
            runtime/family_runtime_contract.py \
            runtime/non_jra_formal_runner.py \
            runtime/local_result_from_signed_final.py
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_execution_gateway.py \
            tests/test_execution_store.py \
            tests/test_execution_workflow_contract.py

      - name: Validate gateway pointer and external runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_out
          python runtime/execution_gateway.py health-check --family LOCAL --output runtime_out/execution_gateway_canary.json

      - name: Verify family runtime contract resolves through pointer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, "runtime")
          from family_runtime_contract import load_contracts, resolve_family_runtime
          c=load_contracts()
          r=resolve_family_runtime({"family_id":"LOCAL"},c)
          assert r["executable"] is True
          assert r["external_endpoint"]=="https://witnessstrictimage-production.up.railway.app"
          print("KM_LOCAL_GATEWAY_CONTRACT_RESOLVE=PASS")
          PY

      - name: Persist latest successful canary status to canonical repo
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,os
          pre=json.load(open("runtime_out/execution_gateway_canary.json",encoding="utf-8"))
          gw=json.load(open("profiles/current_execution_gateway.json",encoding="utf-8"))
          a=pre.get("assessment") or {}
          h=pre.get("health") or {}
          out={
            "schema":"KM-LOCAL-EXECUTION-GATEWAY-CANARY-STATUS-v1",
            "status":"PASS",
            "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "github_actions_run_id":os.environ["RUN_ID"],
            "github_sha":os.environ["GITHUB_SHA_VALUE"],
            "gateway_profile":gw.get("profile_id"),
            "active_correctness_closure":gw.get("active_correctness_closure"),
            "runtime_profile":h.get("runtime_revision"),
            "runtime_git_revision":h.get("github_revision"),
            "runtime_app_sha256":h.get("runtime_app_sha256"),
            "engine_sha256":h.get("engine_sha256"),
            "parameter_map_sha256":h.get("parameter_map_sha256"),
            "receipt_signer_key_id":h.get("receipt_signer_key_id"),
            "bundle_fingerprint_expected":a.get("bundle_fingerprint_expected"),
            "bundle_fingerprint_actual":a.get("bundle_fingerprint_actual"),
            "bundle_mismatches":a.get("bundle_mismatches"),
            "missing_capabilities":a.get("missing_capabilities"),
            "assessment_status":a.get("status"),
            "production_numerical_authority":"NOT_READY / 63 REQUIRED COMPONENT SCORE RULES UNBOUND",
            "strict_formal_full_numerical_readiness":"NO"
          }
          json.dump(out,open("runtime/execution_gateway_canary_status.json","w",encoding="utf-8"),
                    ensure_ascii=False,sort_keys=True,indent=2)
          PY
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/execution_gateway_canary_status.json
          git commit -m "canary: persist latest LOCAL execution gateway PASS [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Unable to persist canary status" >&2
          exit 1

      - name: Persist canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km-local-execution-gateway-canary-${{ github.run_id }}
          path: runtime_out/*.json
          if-no-files-found: warn
          retention-days: 30
