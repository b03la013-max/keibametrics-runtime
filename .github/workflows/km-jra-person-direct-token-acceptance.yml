name: JRA Current Person Direct Token Acceptance
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-person-direct-token-acceptance.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from tsl_public_shadow_evidence import discover_tsl_race_url
          from jra_race_card_detail import fetch_and_enrich_race_card_detail
          from jra_horse_history import enrich_with_horse_histories
          from jra_person_stats import enrich_with_person_stats
          _,key,_=discover_tsl_race_url("HSN","2026-09-26",12)
          art={"sources":[],"source_race_context":{"race_date":"2026-09-26"}}
          art=fetch_and_enrich_race_card_detail(art,"2026-09-26T23:59:00+09:00",race_date="2026-09-26",meeting_key=key,race_no=12)
          art,_=enrich_with_horse_histories(art,"2026-09-26T23:59:00+09:00",require_history=True)
          art,errs=enrich_with_person_stats(art,"2026-09-26T23:59:00+09:00",require_person_stats=False)
          p=art["jra_official_person_stats"]
          out={"meeting_key":key,"runner_count":p["runner_count"],"direct_jockey_token_count":p["direct_jockey_token_count"],
               "direct_trainer_token_count":p["direct_trainer_token_count"],"matched_jockey_count":p["matched_jockey_count"],
               "matched_trainer_count":p["matched_trainer_count"],"errors":errs,"runners":{
                 rid:{"jockey":x["current_jockey"],"trainer":x["current_trainer"],
                      "jockey_matched":x["jockey_matched"],"trainer_matched":x["trainer_matched"]}
                 for rid,x in p["runners"].items()}}
          Path("runtime/diagnostics/jra_person_direct_token_acceptance.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"; git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/jra_person_direct_token_acceptance.json
          git commit -m "acceptance: JRA current person direct-token binding [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*2)); done
          exit 1
