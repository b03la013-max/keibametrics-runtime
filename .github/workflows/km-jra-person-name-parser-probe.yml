name: JRA Person Name Parser Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-person-name-parser-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Probe official person-name structure
        run: |
          python - <<'PY'
          import json,re,sys,urllib.parse,urllib.request
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode,_html_tables,_html_text
          samples={
            "jockey":("https://www.jra.go.jp/JRADB/accessK.html","pw04kmk005586/E4"),
            "trainer":("https://www.jra.go.jp/JRADB/accessC.html","pw05cmk001187/E7"),
          }
          out={}
          for kind,(base,token) in samples.items():
            url=base+"?"+urllib.parse.urlencode({"CNAME":token})
            req=urllib.request.Request(url,headers={"User-Agent":"KeibaMetrics-JRA-Person-Name-Probe/1.0","Accept-Language":"ja"})
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(3000000);ct=r.headers.get("content-type","")
            dec=_decode(raw,ct)
            text=_html_text(dec)
            title=re.findall(r"<title[^>]*>(.*?)</title>",dec,re.I|re.S)
            htags=re.findall(r"<h[1-4][^>]*>(.*?)</h[1-4]>",dec,re.I|re.S)
            htags=[re.sub(r"<[^>]+>","",x).strip() for x in htags[:30]]
            # Keep only short snippets around person-related terms, never the full page.
            snippets=[]
            for term in ["騎手情報","調教師情報","プロフィール","氏名","所属"]:
              i=text.find(term)
              if i>=0: snippets.append(text[max(0,i-180):i+420])
            tables=_html_tables(dec)
            short_tables=[]
            for i,t in enumerate(tables[:40]):
              if not t: continue
              head=" | ".join(str(x) for x in t[0])
              if any(k in head for k in ["騎乗回数","出走回数","1着","勝率","氏名","所属"]):
                short_tables.append({"i":i,"rows":len(t),"head":t[:5]})
            out[kind]={
              "url":url,
              "title":[re.sub(r"<[^>]+>","",x).strip() for x in title[:5]],
              "htags":htags,
              "snippets":snippets,
              "tables":short_tables,
            }
          p=Path("runtime/diagnostics/jra_person_name_parser_probe.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist probe
        run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/jra_person_name_parser_probe.json
          git commit -m "diagnostic: persist JRA person name parser probe [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
