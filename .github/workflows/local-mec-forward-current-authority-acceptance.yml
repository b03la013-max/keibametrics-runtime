name: LOCAL MEC Forward Measurement Current Authority Acceptance

on:
  pull_request:
    paths:
      - 'profiles/current_execution_gateway.json'
      - 'profiles/KM_FAMILY_CURRENT_AUTHORITY_*.json'
      - 'profiles/KM_LOCAL_SUITE_MANIFEST_*.json'
      - 'profiles/venue_chat_routes_*.json'
      - 'research/mec/KM-LOCAL-MEC-R4-20260923-POLICY-FROZEN-RETROSPECTIVE-REPLAY-R1.json'
      - 'research/mec/KM-LOCAL-MEC-R5-20260923-TRAINING-REPLAY-R1.json'
      - 'governance/KM-LOCAL-MEC-FORWARD-MEASUREMENT-CLOSURE-20260924-R1.json'
      - 'runtime/local_mec_r4_bridge.py'
      - 'runtime/local_mec_r5_shadow.py'
      - 'runtime/local_mec_r5_oos_tracker.py'
      - 'runtime/local_mec_r5_oos_status.json'
      - 'runtime/common_exact_continuity_shadow.py'
      - 'runtime/common_exact_continuity_oos_tracker.py'
      - 'research/common/KM-COMMON-EXACT-CONTINUITY-FORWARD-SHADOW-20260930-R1.json'
      - 'tests/test_common_exact_continuity_shadow.py'
      - 'runtime/non_jra_formal_runner.py'
      - 'runtime/local_result_from_signed_final.py'
      - '.github/workflows/local-mec-forward-current-authority-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify current MEC authority graph and noninterference
        run: |
          python - <<'PY'
          import glob, json, pathlib
          from datetime import datetime, timezone

          def j(p):
              return json.load(open(p,encoding="utf-8"))

          now=datetime.now(timezone.utc)
          candidates=[]
          for p in glob.glob("profiles/KM_FAMILY_CURRENT_AUTHORITY_*.json"):
              try:
                  x=j(p)
                  if "CURRENT-AUTHORITY" not in str(x.get("status") or ""):
                      continue
                  d=datetime.fromisoformat(str(x["effective_at"]).replace("Z","+00:00")).astimezone(timezone.utc)
                  if d<=now:
                      candidates.append((d,str(x.get("manifest_id") or ""),p,x))
              except Exception:
                  pass
          assert candidates, "CURRENT_AUTHORITY_RESOLUTION_EMPTY"
          _,_,auth_path,auth=max(candidates,key=lambda z:(z[0],z[1]))
          cc=auth["common_family_components"]

          gateway=j("profiles/current_execution_gateway.json")
          suite=j(cc["local_suite_manifest_profile"])
          route=j(cc["venue_routing_profile"])
          r4=j("research/mec/KM-LOCAL-MEC-R4-20260923-POLICY-FROZEN-RETROSPECTIVE-REPLAY-R1.json")
          r5=j("research/mec/KM-LOCAL-MEC-R5-20260923-TRAINING-REPLAY-R1.json")
          closure=j("governance/KM-LOCAL-MEC-FORWARD-MEASUREMENT-CLOSURE-20260924-R1.json")
          r5status=j("runtime/local_mec_r5_oos_status.json")

          assert gateway["parent_current_authority"]==auth["manifest_id"]
          assert gateway["venue_routing"]==route["profile_id"]
          assert gateway["policy"]["production_prediction_policy_changed"] is False
          assert gateway["policy"]["production_numerical_policy_changed"] is False
          assert gateway["policy"]["production_mec_policy_changed"] is False
          assert gateway["policy"]["capital_policy_changed"] is False

          assert cc["mec"]=="KM-FAMILY-MINIMUM-EFFICIENT-COVERAGE-20260921-R3"
          assert cc["venue_routing"]==route["profile_id"]
          assert cc["local_suite_manifest"]==suite["manifest_id"]
          L=auth["family_scoped_authority"]["LOCAL"]
          assert L["mec"]=="KM-FAMILY-MINIMUM-EFFICIENT-COVERAGE-20260921-R3"
          assert L["mec_status"]=="ACTIVE / PRODUCTION / UNCHANGED"
          assert L["production_suite"]=="KM-LOCAL-RENDERED-INTEGRITY-20260827-R3"
          assert L["production_numeric_status"]=="FROZEN / NO NUMERICAL CHANGE"
          assert L["suite_manifest"]==suite["manifest_id"]
          assert L["numerical_authority_status"].startswith("NOT_READY")
          assert L["mec_measurement"]["r4_local"]["result"]=="LOCAL_PROMOTION_REJECTED"
          assert L["mec_measurement"]["r5_local"]["automatic_promotion"] is False
          assert L["mec_measurement"]["r5_local"]["target_eligible_races"]==30

          assert suite["family_current_authority"]==auth["manifest_id"]
          assert suite["decision_execution"]["mec"]=="KM-FAMILY-MINIMUM-EFFICIENT-COVERAGE-20260921-R3"
          assert suite["production_numeric_suite"]["status"]=="FROZEN"
          assert suite["production_numeric_suite"]["numerical_change"] is False
          assert suite["decision_execution"]["mec_forward_measurement"]["signed_final_binding_required"] is True

          lr=route["family_routes"]["LOCAL"]
          assert lr["mec_profile"]=="KM-FAMILY-MINIMUM-EFFICIENT-COVERAGE-20260921-R3"
          assert lr["suite_manifest"]==suite["manifest_id"]
          assert lr["runtime_contract"]==cc["family_runtime_contracts"]
          pm=lr["parallel_mec_measurement"]
          assert pm["production_effect"]=="NONE"
          assert pm["nonblocking"] is True
          assert pm["signed_final_digest_binding_required"] is True
          assert pm["r5"]["target_eligible_races"]==30
          assert route["family_routes"]["BAN"]["runtime_status"]=="FAMILY_CONTRACT_READY_PHYSICAL_ENDPOINT_REQUIRED"

          assert r4["temporal_classification"]["forward_oos_eligible"] is False
          assert r4["conclusion"]["local_promotion"]=="REJECT"
          assert r4["aggregates"]["PRODUCTION_BASELINE_R3"]["pfs"]==49.026946
          assert r4["aggregates"]["CORE_PROTECTION"]["pfs"]==34.989474

          assert r5["status"].startswith("RESULT-INFORMED-DESIGN")
          assert r5["aggregates"]["SET_ONLY"]["pfs"]==102.431373
          assert r5["aggregates"]["SET_PAIR_EXACT_TOP5"]["pfs"]==144.340949
          assert r5["forward_measurement"]["automatic_promotion"] is False
          assert r5["forward_measurement"]["target_eligible_races"]==30

          assert closure["production_mec"]["profile"]=="KM-FAMILY-MINIMUM-EFFICIENT-COVERAGE-20260921-R3"
          assert closure["production_mec"]["changed"] is False
          assert closure["r4"]["local_promotion"]=="REJECT"
          assert closure["r5"]["status"].startswith("SHADOW")
          assert closure["r5"]["automatic_promotion"] is False

          assert r5status["profile"]=="KM-LOCAL-MEC-R5-FORWARD-OOS-TRACKER-v1.0-20260924"
          assert r5status["status"] in {"WAITING_30","HUMAN_REVIEW_REQUIRED"}
          # Authority carries an enactment snapshot, not the mutable OOS ledger.
          # Rebuild with the unchanged tracker/eligibility rules instead of
          # requiring live observations to equal the historical snapshot count.
          import sys
          sys.path.insert(0,"runtime")
          from local_mec_r5_oos_tracker import build_status
          rebuilt=build_status()
          assert r5status["eligible_races"]==rebuilt["eligible_races"]
          assert 0<=L["mec_measurement"]["r5_local"]["current_oos_count"]<=r5status["target_eligible_races"]
          assert r5status["remaining_races"]==max(0,r5status["target_eligible_races"]-r5status["eligible_races"])
          assert r5status["production_effect"]=="NONE"
          assert r5status["automatic_promotion"] is False
          assert set(r5status["training_exclusion"])=={
              "URW-20260923-R07-FORMAL-R1","URW-20260923-R10-FORMAL-R1",
              "URW-20260923-R11-FORMAL-R1","URW-20260923-R12-FORMAL-R1"
          }

          formal=pathlib.Path("runtime/non_jra_formal_runner.py").read_text(encoding="utf-8")
          result=pathlib.Path("runtime/local_result_from_signed_final.py").read_text(encoding="utf-8")
          assert "MEC_R4_SHADOW_PRE_RESULT_FREEZE" in formal
          assert "LOCAL_MEC_R5_SHADOW_PRE_RESULT_FREEZE" in formal
          assert "COMMON_EXACT_CONTINUITY_SHADOW_PRE_RESULT_FREEZE" in formal
          assert "mec_r4_shadow_binding" in formal
          assert "local_mec_r5_shadow_binding" in formal
          assert "common_exact_continuity_shadow_binding" in formal
          assert "COMMON_EXACT_CONTINUITY_SIGNED_FINAL_BOUND" in result
          assert "LOCAL_SIGNED_FINAL_BOUND" in result
          assert "LOCAL_MEC_R5_SIGNED_FINAL_BOUND" in result

          print("LOCAL_MEC_FORWARD_CURRENT_AUTHORITY_PASS",auth_path,auth["manifest_id"])
          PY

      - name: Verify Common exact-continuity shadow isolation
        run: |
          python -m pip install -q pytest
          python -m py_compile runtime/common_exact_continuity_shadow.py runtime/common_exact_continuity_oos_tracker.py
          python -m pytest -q tests/test_common_exact_continuity_shadow.py
          python - <<'PY'
          import json
          x=json.load(open("research/common/KM-COMMON-EXACT-CONTINUITY-FORWARD-SHADOW-20260930-R1.json",encoding="utf-8"))
          assert "NON-PRODUCTION" in x["status"]
          assert x["production_effect"]=="NONE"
          assert x["candidate_definition"]["automatic_purchase"] is False
          assert x["oos"]["automatic_promotion"] is False
          assert x["capital_width_hypothesis"]["status"].startswith("SHADOW-HOLD")
          assert x["capital_width_hypothesis"]["production_effect"]=="NONE"
          print("COMMON_EXACT_CONTINUITY_SHADOW_ISOLATION_PASS")
          PY
