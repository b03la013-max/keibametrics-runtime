name: JRA Person Directory Asset Probe
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-person-directory-asset-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - run: |
          python - <<'PY'
          import urllib.request,re,json,sys
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode
          for kind,url in [("jockey","https://www.jra.go.jp/datafile/meikan/jockey.html"),("trainer","https://www.jra.go.jp/datafile/meikan/trainer.html")]:
            req=urllib.request.Request(url,headers={"User-Agent":"KeibaMetrics-JRA-Directory-Asset-Probe/1.0","Accept":"text/html,*/*;q=0.1","Accept-Language":"ja,en;q=0.4"})
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(3000000); h={str(k).lower():str(v) for k,v in r.headers.items()}
            s=_decode(raw,h.get("content-type",""))
            scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I)
            assets=sorted(set(re.findall(r'[^"\'\s<>]+\.(?:json|js|csv)(?:\?[^"\'\s<>]*)?',s,re.I)))
            snippets=[]
            for kw in ("jockey","trainer","meikan","json","ajax","api"):
              for m in re.finditer(kw,s,re.I):
                snippets.append(s[max(0,m.start()-250):m.start()+500])
                if len(snippets)>=30: break
              if len(snippets)>=30: break
            print(kind,json.dumps({"scripts":scripts,"assets":assets[:200],"snippets":snippets[:30]},ensure_ascii=False,indent=2))
          PY
