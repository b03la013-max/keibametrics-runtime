name: LOCAL Race-Key Ingress Acceptance

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/local_race_day_dispatcher.py"
      - "runtime/local_reference_day.py"
      - "runtime/local_reference_delivery.py"
      - "runtime/local_reference_delivery/**"
      - "runtime/urw_reference_source_policy.py"
      - "runtime/local_reference/**"
      - "runtime/local_reference_start_requests/**"
      - "scripts/urw_candidate_krs_replay.py"
      - "tests/test_local_reference_day.py"
      - "tests/test_local_reference_delivery.py"
      - "tests/test_urw_reference_source_policy.py"
      - "tests/test_reference_pre_generation_sync.py"
      - "tests/urw_reference_fixture_support.py"
      - "tests/fixtures/urw_reference_synthetic/**"
      - "tests/test_local_race_day_dispatcher.py"
      - "tests/test_local_south_kanto.py"
      - "runtime/jra_next_race_learning_binding_audit.py"
      - "runtime/formal_failure_diagnostics.py"
      - "tests/test_formal_failure_diagnostics.py"
      - "runtime/local_race_key_intake.py"
      - "runtime/local_race_key_shadow_owner.py"
      - "runtime/local_production_static_owner.py"
      - "profiles/local_production_static_owner_20261014_v1.json"
      - "tests/test_local_production_static_owner.py"
      - "runtime/local_race_entry.py"
      - "tools/persist_local_checkpoints.py"
      - "tests/test_persist_local_checkpoints_scratch.py"
      - "runtime/local_race_key_gate.py"
      - "runtime/jra_ticket_tree_renderer.py"
      - "tests/test_local_race_key_ingress.py"
      - "tests/test_local_race_key_shadow_owner.py"
      - "tests/test_urw_owner_candidate.py"
      - "tests/fixtures/urw_20260923_r12_source.json.gz"
      - ".github/workflows/km-local-race-key-entry.yml"
      - ".github/workflows/km-local-race-key-acceptance.yml"
  workflow_dispatch:

jobs:
  race-key-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install testing dependencies
        run: python -m pip install --disable-pip-version-check -q pytest cryptography PyYAML
      - name: Compile source-key execution modules
        run: python -m py_compile runtime/local_race_key_intake.py runtime/local_race_key_gate.py runtime/local_race_key_shadow_owner.py runtime/local_production_static_owner.py runtime/local_race_entry.py runtime/formal_execution_orchestrator.py
      - name: Validate GitHub workflow syntax and entry scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path(".github/workflows/km-local-race-key-entry.yml")
          w = yaml.load(p.read_text(), Loader=yaml.BaseLoader)
          assert w["on"]["workflow_dispatch"]["inputs"]
          assert w["on"]["repository_dispatch"]["types"] == ["km_local_race_key"]
          assert w["permissions"]["contents"] == "write"
          assert set(w["jobs"]) == {"resolve", "entry", "result", "local-day", "reference-day"}
          assert "needs.resolve.outputs.has_requests" in w["jobs"]["result"]["if"]
          assert w["jobs"]["resolve"]["if"] == "github.ref == 'refs/heads/main' && github.event_name != 'schedule'"
          PY
      - name: Smoke test exact GitHub Actions CLI invocation imports
        run: |
          PYTHONPATH=runtime:. python -m runtime.local_race_key_intake --help >/dev/null
          PYTHONPATH=runtime:. python -m runtime.local_race_entry --help >/dev/null
          PYTHONPATH=runtime:. python -m runtime.local_race_key_gate --help >/dev/null
          PYTHONPATH=runtime:. python -m runtime.local_reference_day --help >/dev/null
      - name: LOCAL race-key and existing formal regression
        run: python -m pytest -q tests/test_local_reference_delivery.py tests/test_urw_reference_source_policy.py tests/test_reference_pre_generation_sync.py tests/test_local_reference_day.py tests/test_urw_owner_candidate.py tests/test_local_south_kanto.py tests/test_local_race_day_dispatcher.py tests/test_jra_ticket_tree_renderer.py tests/test_persist_local_checkpoints_scratch.py tests/test_local_production_static_owner.py tests/test_local_race_key_shadow_owner.py tests/test_local_race_key_ingress.py tests/test_local_source_first_entry.py tests/test_formal_execution_orchestrator.py tests/test_recovery_result_entry.py tests/test_formal_failure_diagnostics.py tests/test_aki_adaptive_oos_tracker.py tests/test_jra_next_race_learning_binding_audit.py

      - name: Verify synthetic twelve-race readback contracts without new capture
        run: |
          PYTHONPATH=runtime:. python - <<'PY_URW'
          import json
          from pathlib import Path
          from runtime.local_reference_day import load_plan,verified_readback
          import sys
          sys.path.insert(0,str(Path('tests').resolve()))
          from urw_reference_fixture_support import fixture_root
          folder=fixture_root()/'runtime/local_reference/2026-10-20'
          plan=load_plan(folder,'2026-10-20');rows=[]
          for race in plan['races']:
              n=race['fields']['race_no']
              expected={'family_id':'LOCAL','venue_id':'URW','race_date':'2026-10-20','race_no':n}
              publication,body=verified_readback(folder/f'R{n:02d}',expected)
              rows.append({'race_no':n,'runner_count':publication['reference_runner_count'],
                  'answer_sha256':publication['answer_sha256'],'scope':'TEST_SYNTHETIC_ONLY_NOT_OFFICIAL_OR_CHAT_ACCEPTANCE'})
          assert len(rows)==12 and sum(r['runner_count'] for r in rows)==131
          Path('urw-reference-cohort-verification.json').write_text(json.dumps({
              'TEST_SYNTHETIC_ONLY':True,'plan_sha256':plan['plan_sha256'],
              'races':rows,'runtime_posts':0,'new_captures':0,'live_acceptance':False},indent=2))
          PY_URW
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-urw-prestart-evidence
          path: |
            urw-reference-cohort-verification.json
          if-no-files-found: ignore
