name: Netkeiba Key Token Diagnostic
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-netkeiba-key-token-diagnostic.yml"
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,html
          from pathlib import Path
          urls=[
            "https://race.netkeiba.com/race/data.html?race_id=202609040812",
            "https://race.netkeiba.com/race/surf_summary.html?key1=KettoNumF&race_id=202609040812&range=4"
          ]
          out={}
          for url in urls:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja,en;q=0.3"})
            with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(5000000)
            s=raw.decode("euc-jp","ignore")
            toks=sorted(set(re.findall(r'key1(?:=|%3D|["\']\s*:\s*["\'])([A-Za-z0-9_]+)',s,re.I)))
            around=[]
            for m in re.finditer(r'key1',s,re.I):
                z=re.sub(r"\s+"," ",html.unescape(s[max(0,m.start()-180):m.start()+300]))
                around.append(z[:480])
            out[url]={"tokens":toks,"around":around[:80]}
          p=Path("runtime/diagnostics/netkeiba_key_tokens.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False)[:20000])
          PY
      - run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_key_tokens.json
          git commit -m "diagnostic: netkeiba key tokens [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
