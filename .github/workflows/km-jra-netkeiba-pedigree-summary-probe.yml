name: JRA Netkeiba Pedigree Surface Summary Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-pedigree-summary-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,urllib.request,re,html
          from pathlib import Path
          urls={
            "pedigree":"https://race.netkeiba.com/race/surf_summary.html?race_id=202609040812&range=4&key1=KettoNumF",
            "speed":"https://race.netkeiba.com/race/surf_summary.html?race_id=202609040812&range=4&key1=SpeedIdxScore",
            "odds":"https://race.netkeiba.com/race/surf_summary.html?race_id=202609040812&range=4&key1=OddsZone"
          }
          out={}
          for k,url in urls.items():
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"ja"})
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(5000000); ct=r.headers.get("content-type","")
            dec=raw.decode("euc-jp","ignore")
            text=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",dec)))
            trs=re.findall(r"<tr[^>]*>(.*?)</tr>",dec,re.I|re.S)
            rows=[]
            for tr in trs:
              cells=[html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",x))).strip() for x in re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>",tr,re.I|re.S)]
              if cells:rows.append(cells)
            out[k]={"url":url,"bytes":len(raw),"rows":rows[:80],"text_head":text[:5000]}
          p=Path("runtime/diagnostics/netkeiba_pedigree_summary_probe.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime";git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_pedigree_summary_probe.json
          git commit -m "diagnostic: netkeiba pedigree summary [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
