name: Netkeiba Horse Sire Resolution
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-netkeiba-horse-sire-resolution.yml"
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,html,time
          from pathlib import Path
          UA={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja,en;q=0.3"}
          u="https://race.netkeiba.com/race/shutuba.html?race_id=202609040812"
          with urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30) as r: raw=r.read(5000000)
          s=raw.decode("utf-8","ignore")
          # horse profile links carry the JRA/netkeiba horse id.
          pairs=[]
          for m in re.finditer(r'href=["\']https?://db\.netkeiba\.com/horse/(\d{10})/?["\'][^>]*>(.*?)</a>',s,re.I|re.S):
              hid=m.group(1); name=re.sub(r"<[^>]+>"," ",m.group(2)); name=re.sub(r"\s+","",html.unescape(name))
              if name and (hid,name) not in pairs:pairs.append((hid,name))
          out={"shutuba_sha256":__import__("hashlib").sha256(raw).hexdigest(),"horses":[]}
          for hid,name in pairs[:20]:
              row={"horse_id":hid,"horse_name":name}
              try:
                  pu=f"https://db.netkeiba.com/horse/ped/{hid}/"
                  with urllib.request.urlopen(urllib.request.Request(pu,headers=UA),timeout=20) as r: pr=r.read(3000000)
                  ps=pr.decode("euc-jp","ignore")
                  # first pedigree horse link in pedigree body is normally sire.
                  links=re.findall(r'href=["\']/horse/((?:ped/)?[0-9a-zA-Z]+?)/?["\'][^>]*>(.*?)</a>',ps,re.I|re.S)
                  clean=[]
                  for sid,txt in links:
                      nm=re.sub(r"<[^>]+>"," ",txt);nm=re.sub(r"\s+","",html.unescape(nm))
                      if nm:clean.append((sid.replace("ped/",""),nm))
                  row["pedigree_sha256"]=__import__("hashlib").sha256(pr).hexdigest()
                  row["pedigree_links"]=clean[:12]
              except Exception as e: row["error"]=type(e).__name__+":"+str(e)
              out["horses"].append(row)
              time.sleep(.15)
          p=Path("runtime/diagnostics/netkeiba_horse_sire_resolution.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"horse_count":len(out["horses"]),"sample":out["horses"][:3]},ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_horse_sire_resolution.json
          git commit -m "diagnostic: resolve netkeiba sire ids [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
