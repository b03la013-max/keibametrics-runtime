name: LOCAL SBO Public Shadow Current Authority Acceptance

on:
  pull_request:
    paths:
      - 'profiles/KM_FAMILY_CURRENT_AUTHORITY_20260924_R11.json'
      - 'profiles/family_runtime_contracts_20260924_R10.json'
      - 'profiles/KM_LOCAL_SUITE_MANIFEST_20260924_R9.json'
      - 'profiles/local_information_source_registry_v1.10_20260924.json'
      - 'governance/KM-LOCAL-INPUT-SOURCE-OPS-v1.7-20260924.md'
      - 'governance/KM-LOCAL-SBO-PUBLIC-SHADOW-SOURCE-ACTIVATION-20260924-R1.json'
      - '.github/workflows/local-sbo-public-shadow-current-authority-acceptance.yml'
  workflow_dispatch:

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate authority graph and production boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from runtime.execution_gateway import load_gateway, family_config, fetch_health, assess_runtime_health
          from runtime.family_authority_guard import resolve_current_authority

          def j(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          a=j("profiles/KM_FAMILY_CURRENT_AUTHORITY_20260924_R11.json")
          c=j("profiles/family_runtime_contracts_20260924_R10.json")
          s=j("profiles/KM_LOCAL_SUITE_MANIFEST_20260924_R9.json")
          r=j("profiles/local_information_source_registry_v1.10_20260924.json")
          x=j("governance/KM-LOCAL-SBO-PUBLIC-SHADOW-SOURCE-ACTIVATION-20260924-R1.json")

          assert a["manifest_id"]=="KM-FAMILY-CURRENT-AUTHORITY-20260924-R11"
          assert a["common_family_components"]["family_runtime_contracts"]==c["profile_id"]
          assert a["common_family_components"]["venue_routing"]=="KM-VENUE-CHAT-FORMAL-ROUTING-20260924-R12"
          L=a["family_scoped_authority"]["LOCAL"]
          assert L["production_suite"]=="KM-LOCAL-RENDERED-INTEGRITY-20260827-R3"
          assert L["production_numeric_status"]=="FROZEN / NO NUMERICAL CHANGE"
          assert "NOT_READY" in L["numerical_authority_status"]
          assert L["suite_manifest"]==s["manifest_id"]
          assert L["information_source_registry"]==r["profile_id"]
          assert L["runtime_contract"]==c["profile_id"]
          assert L["runtime"]=="KM-LOCAL-PHYSICAL-RUNTIME-v1.5-REV.7-20260924-SBO-PUBLIC-SHADOW-EVIDENCE"
          assert L["sbo_public_shadow_authority"].startswith("THIRD_PARTY_PUBLIC_SHADOW")

          assert s["family_current_authority"]==a["manifest_id"]
          assert s["information_source_registry"]["profile"]==r["profile_id"]
          assert s["input_source_ops"]["profile"]=="KM-LOCAL-INPUT-SOURCE-OPS-v1.7-20260924"
          assert s["runtime"]["contract"]==c["profile_id"]
          assert "SOURCE_SBO_PUBLIC_SHADOW" in s["runtime"]["capabilities"]
          assert s["source_enrichment_v3"]["sbo_public_shadow"]["production_authority"] is False
          assert s["source_enrichment_v3"]["sbo_public_shadow"]["prediction_authority"] is False

          LC=c["families"]["LOCAL"]
          assert LC["runtime_version"]==L["runtime"]
          assert LC["information_source_registry"]==r["profile_id"]
          assert LC["suite_manifest"]==s["manifest_id"]
          assert LC["venue_routing"]=="KM-VENUE-CHAT-FORMAL-ROUTING-20260924-R12"
          assert LC["sbo_public_shadow"]["production_authority"] is False
          assert LC["sbo_public_shadow"]["prediction_authority"] is False

          assert r["sbo_public_shadow"]["production_authority"] is False
          assert r["sbo_public_shadow"]["prediction_authority"] is False
          assert r["sbo_public_shadow"]["source_priority"].startswith("BELOW_NAR_OFFICIAL")
          assert r["sbo_public_shadow"]["storage_policy"].startswith("NORMALIZED_EXTRACTED_DATA")
          assert r["sbo_public_shadow"]["acceptance"]["tamper_rejected"] is True

          assert x["production_authority"] is False
          assert x["prediction_authority"] is False
          assert x["numerical_change"] is False
          assert x["production_suite_change"] is False
          assert x["krs_change"] is False
          assert x["mec_change"] is False
          assert x["capital_change"] is False
          assert x["acceptance"]["production_runtime_conclusion"]=="SUCCESS"

          # R11 is an immutable historical authority graph. Its snapshot count
          # must not be compared to the continuously updated OOS ledgers.
          assert L["mec_measurement"]["r4_local"]["current_local_oos_count"]==3
          assert L["mec_measurement"]["r5_local"]["current_oos_count"]==3

          # Check the live runtime against the current approved bundle rather
          # than requiring the historical September deployment to stay live.
          _,current=resolve_current_authority()
          gateway=load_gateway()
          assert current["common_family_components"]["local_execution_gateway"]==gateway["profile_id"]
          h=fetch_health(family_config("LOCAL",gateway)["external_endpoint"])
          acceptance=assess_runtime_health(h,"LOCAL",gateway)
          assert acceptance["status"]=="PASS",acceptance
          assert h["sbo_public_shadow_profile"]=="KM-LOCAL-SBO-PUBLIC-SHADOW-EVIDENCE-v1.0-20260924",h
          assert h["sbo_public_shadow_sha256"]=="998cec5d9b426efaa1a6d8411b2125fd797e39f66ee5bf5dfb46fd8d15148c53",h
          assert "SOURCE_SBO_PUBLIC_SHADOW" in h["capabilities"],h

          print("LOCAL_SBO_PUBLIC_SHADOW_AUTHORITY_PASS="+json.dumps({
              "historical_authority":a["manifest_id"],
              "current_authority":current["manifest_id"],
              "historical_runtime_contract":c["profile_id"],
              "historical_suite_manifest":s["manifest_id"],
              "information_registry":r["profile_id"],
              "runtime":h["runtime_revision"],
              "runtime_git_revision":h["github_revision"],
              "sbo_profile":h["sbo_public_shadow_profile"],
              "sbo_sha256":h["sbo_public_shadow_sha256"],
              "production_authority":False,
              "historical_numerical_authority":L["numerical_authority_status"],
              "production_suite":L["production_suite"],
              "historical_r4_oos":L["mec_measurement"]["r4_local"]["current_local_oos_count"],
              "historical_r5_oos":L["mec_measurement"]["r5_local"]["current_oos_count"],
              "runtime_acceptance":acceptance,
          },ensure_ascii=False,separators=(",",":")))
          PY
