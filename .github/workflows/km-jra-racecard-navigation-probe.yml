name: JRA RaceCard Navigation Probe

on:
  pull_request:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/km-jra-racecard-navigation-probe.yml'
      - 'runtime/jra_source_runtime/**'
      - 'runtime/jra_source_runtime/jra_race_card_navigation_probe.py'
      - 'runtime/jra_source_runtime/source_acquisition.py'
      # ci_paths:end
  push:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/km-jra-racecard-navigation-probe.yml'
      - 'runtime/jra_source_runtime/**'
      - 'runtime/jra_source_runtime/jra_race_card_navigation_probe.py'
      - 'runtime/jra_source_runtime/source_acquisition.py'
      # ci_paths:end
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python runtime/jra_source_runtime/jra_race_card_navigation_probe.py
