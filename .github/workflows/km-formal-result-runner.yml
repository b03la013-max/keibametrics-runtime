name: KeibaMetrics Formal Result Runner

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - "runtime/results/*.json"
      - "runtime/source_candidate_results/*.json"
  workflow_dispatch:

jobs:
  result-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve result request
        id: result
        shell: bash
        run: |
          set -euo pipefail
          REQ="$(git diff --name-only HEAD^ HEAD -- 'runtime/results/*.json' 'runtime/source_candidate_results/*.json' | tail -1)"
          if [ -z "$REQ" ]; then
            REQ="$(find runtime/results runtime/source_candidate_results -maxdepth 1 -type f -name '*.json' 2>/dev/null | sort | tail -1)"
          fi
          test -n "$REQ"
          echo "request=$REQ" >> "$GITHUB_OUTPUT"
          echo "RESULT_FILE=$REQ"
      - name: Submit and verify RESULT receipt
        shell: bash
        env:
          RESULT_FILE: ${{ steps.result.outputs.request }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, sys
          sys.path.insert(0,"runtime")
          from post_result_learning import build_post_result_review, build_learning_state
          from krs_oos_promotion_gate import build_oos_measurement, evaluate_r30
          from mec_r4_shadow import settle_mec_r4_shadow
          from mec_r4_oos_tracker import write_status as write_mec_r4_oos_status
          from pfs_grand_review import write_report as write_pfs_grand_review
          from family_prediction_utility import write_snapshot as write_family_prediction_utility_snapshot
          from race_day_fast_reflection import build_fast_reflection
          from jra_source_candidate_oos import evaluate_result as evaluate_source_candidate_result
          from jra_local_week_transfer_shadow import evaluate_jra_week_transfer_shadow_result
          from jra_source_candidate_promotion_gate import bind_result as bind_source_candidate_result, evaluate as evaluate_source_candidate_gate
          BASE="https://quorumprobe-production.up.railway.app"
          with open(os.environ["RESULT_FILE"],encoding="utf-8") as f:
              p=json.load(f)
          required=["race_id","official_result","settlement","frozen_prediction_ref","learning_event"]
          missing=[k for k in required if not p.get(k)]
          assert not missing, f"RESULT_REQUIRED_MISSING:{missing}"
          assert p["settlement"].get("status")=="SETTLED","SETTLEMENT_STATUS_MUST_BE_SETTLED"

          def call(path,payload,timeout=60):
              req=urllib.request.Request(BASE+path,data=json.dumps(payload,separators=(",",":"),ensure_ascii=False).encode(),
                                         headers={"content-type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode()
                      return r.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: body=json.loads(raw)
                  except Exception: body={"raw":raw}
                  return e.code,body

          code,res=call("/result",p)
          assert code<300,(code,res)
          rec=res.get("receipt",{})
          assert rec.get("phase")=="RESULT",res
          assert rec.get("status")=="PASS",res
          assert not rec.get("errors"),res
          vcode,v=call("/verify",res)
          assert vcode<300 and v.get("valid") is True,(vcode,v)

          # Closed-loop authority separation:
          # Production RESULT requires Production Immutable FINAL.
          # Source-Derived Candidate RESULT is allowed to bind only to its
          # immutable pre-result Candidate sidecar and MUST NOT fabricate or
          # substitute a Production FINAL.
          candidate_only=str(p.get("result_lane") or "").upper()=="SOURCE_DERIVED_CANDIDATE"
          final_artifact=None
          shadow_settlement=None
          review=None
          learning=None
          oos=None
          fast_reflection=None

          final_path=os.path.join("runtime","final_artifacts",p["race_id"]+".json")
          if not candidate_only:
              assert os.path.exists(final_path), f"IMMUTABLE_FINAL_ARTIFACT_MISSING:{final_path}"
              with open(final_path,encoding="utf-8") as fh:
                  final_artifact=json.load(fh)

              # Settle the separately frozen pre-result MEC R4 SHADOW, if available.
              # Never mutate the shadow artifact or Production FINAL.
              shadow_path=os.path.join("runtime","mec_shadow_artifacts",p["race_id"]+".json")
              if os.path.exists(shadow_path):
                  with open(shadow_path,encoding="utf-8") as fh:
                      shadow=json.load(fh)
                  assert shadow.get("source_immutable_final_sha256")==final_artifact.get("sha256"), "MEC_R4_SHADOW_FINAL_LINEAGE_MISMATCH"
                  shadow_settlement=settle_mec_r4_shadow(shadow,p)
                  os.makedirs(os.path.join("runtime","mec_shadow_results"),exist_ok=True)
                  with open(os.path.join("runtime","mec_shadow_results",p["race_id"]+".json"),"w",encoding="utf-8") as fh:
                      json.dump(shadow_settlement,fh,ensure_ascii=False,sort_keys=True,indent=2)

              review=build_post_result_review(p,final_artifact)
              learning=build_learning_state(review)
              oos=build_oos_measurement(review,final_artifact,p)
              fast_reflection=build_fast_reflection({
                  "race_id":p["race_id"],
                  "settlement":p.get("settlement") or {},
                  "automatic_post_result_review":review,
                  "failure_localization":review.get("failure_localization") or {},
                  "learning_event":learning,
              },race_id=p["race_id"])

          # Source-derived Candidate closed loop. This branch is independent
          # of Production FINAL availability and uses only the immutable
          # pre-result Candidate sidecar. Production effect remains NONE.
          source_candidate_result=None
          source_candidate_gate=None
          candidate_pre_path=os.path.join("runtime","source_candidate_oos",p["race_id"],"pre_result.json")
          if candidate_only:
              assert os.path.exists(candidate_pre_path), f"SOURCE_CANDIDATE_PRE_RESULT_MISSING:{candidate_pre_path}"
          if os.path.exists(candidate_pre_path):
              with open(candidate_pre_path,encoding="utf-8") as fh:
                  candidate_pre=json.load(fh)
              assert candidate_pre.get("race_id")==p["race_id"], "SOURCE_CANDIDATE_RACE_ID_MISMATCH"
              declared_candidate_receipt=str((p.get("frozen_prediction_ref") or {}).get("final_receipt_sha256") or "")
              frozen_candidate_receipt=str(candidate_pre.get("candidate_final_receipt_sha256") or "")
              if declared_candidate_receipt:
                  assert declared_candidate_receipt==frozen_candidate_receipt, "SOURCE_CANDIDATE_FINAL_RECEIPT_MISMATCH"
              top3=(p.get("official_result") or {}).get("top3")
              if not isinstance(top3,list) or len(top3)<3:
                  finish=(p.get("official_result") or {}).get("finish_order") or []
                  top3=finish[:3]
              assert isinstance(top3,list) and len(top3)>=3, "SOURCE_CANDIDATE_TOP3_MISSING"
              candidate_eval=evaluate_source_candidate_result(candidate_pre,[int(x) for x in top3[:3]])
              # Attribute observed result only to the immutable pre-result trace.
              frozen_transfer_sha=candidate_pre.get("jra_local_week_transfer_shadow_sha256")
              if frozen_transfer_sha:
                  transfer_path=os.path.join(os.path.dirname(candidate_pre_path),"jra_local_week_transfer_shadow_pre_result.json")
                  assert os.path.isfile(transfer_path), "JRA_TRANSFER_FROZEN_PRE_RESULT_SHADOW_MISSING"
                  signed_candidate_path=os.path.join(os.path.dirname(candidate_pre_path),"candidate_final.json")
                  assert os.path.isfile(signed_candidate_path), "JRA_TRANSFER_SIGNED_CANDIDATE_FINAL_MISSING"
                  with open(signed_candidate_path,encoding="utf-8") as fh:
                      candidate_final_frozen=json.load(fh)
                  final_transfer_binding=candidate_final_frozen.get("jra_local_week_transfer_shadow_binding") or {}
                  assert final_transfer_binding.get("sha256")==frozen_transfer_sha, "JRA_TRANSFER_FINAL_BINDING_MISMATCH"
                  assert final_transfer_binding.get("source_basis_sha256")==candidate_pre.get("source_snapshot_sha256"), "JRA_TRANSFER_FINAL_SOURCE_MISMATCH"
                  assert final_transfer_binding.get("semantic_freeze_sha256")==candidate_pre.get("candidate_semantic_freeze_sha256"), "JRA_TRANSFER_FINAL_SEMANTIC_MISMATCH"
                  assert candidate_final_frozen.get("oos_pre_result_record_sha256")==candidate_pre.get("sha256"), "JRA_TRANSFER_FINAL_OOS_RECORD_MISMATCH"
                  with open(transfer_path,encoding="utf-8") as fh:
                      frozen_transfer=json.load(fh)
                  transfer_eval=evaluate_jra_week_transfer_shadow_result(
                      frozen_transfer,candidate_pre,[int(x) for x in top3[:3]])
                  candidate_eval["jra_local_week_transfer_shadow_result"]=transfer_eval
                  candidate_eval["sha256"]=__import__("hashlib").sha256(
                      json.dumps({k:v for k,v in candidate_eval.items() if k!="sha256"},
                                 ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8")
                  ).hexdigest()
              source_candidate_result=bind_source_candidate_result(candidate_pre,candidate_eval)
              source_candidate_result["result_receipt_sha256"]=res.get("receipt_sha256")
              source_candidate_result["result_receipt_verified"]=True
              source_candidate_result["result_receipt_signer_key_id"]=res.get("signer_key_id")
              source_candidate_result["result_receipt_signature_alg"]=res.get("signature_alg")
              source_candidate_result["result_lane"]="SOURCE_DERIVED_CANDIDATE" if candidate_only else "PRODUCTION_WITH_CANDIDATE_SHADOW"
              source_candidate_result["sha256"]=__import__("hashlib").sha256(
                  json.dumps({k:v for k,v in source_candidate_result.items() if k!="sha256"},
                             ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8")
              ).hexdigest()
              cdir=os.path.join("runtime","source_candidate_oos",p["race_id"])
              os.makedirs(cdir,exist_ok=True)
              with open(os.path.join(cdir,"result_evaluation.json"),"w",encoding="utf-8") as fh:
                  json.dump(source_candidate_result,fh,ensure_ascii=False,sort_keys=True,indent=2)

              candidate_shadow_path=os.path.join(cdir,"mec_r4_shadow_pre_result.json")
              if os.path.exists(candidate_shadow_path):
                  with open(candidate_shadow_path,encoding="utf-8") as fh:
                      candidate_shadow=json.load(fh)
                  candidate_final_path=os.path.join(cdir,"candidate_final.json")
                  assert os.path.exists(candidate_final_path), "SOURCE_CANDIDATE_FINAL_MISSING_FOR_MEC_R4"
                  with open(candidate_final_path,encoding="utf-8") as fh:
                      candidate_final=json.load(fh)
                  assert candidate_shadow.get("source_immutable_final_sha256")==candidate_final.get("sha256"), "SOURCE_CANDIDATE_MEC_R4_FINAL_LINEAGE_MISMATCH"
                  candidate_shadow_result=settle_mec_r4_shadow(candidate_shadow,p)
                  with open(os.path.join(cdir,"mec_r4_shadow_result.json"),"w",encoding="utf-8") as fh:
                      json.dump(candidate_shadow_result,fh,ensure_ascii=False,sort_keys=True,indent=2)
                  shadow_settlement=candidate_shadow_result

              candidate_records=[]
              root=os.path.join("runtime","source_candidate_oos")
              if os.path.isdir(root):
                  for d in sorted(os.listdir(root)):
                      rp=os.path.join(root,d,"result_evaluation.json")
                      if not os.path.exists(rp): continue
                      try:
                          with open(rp,encoding="utf-8") as fh:
                              candidate_records.append(json.load(fh))
                      except Exception:
                          continue
              source_candidate_gate=evaluate_source_candidate_gate(candidate_records)
              with open(os.path.join("runtime","source_candidate_oos_status.json"),"w",encoding="utf-8") as fh:
                  json.dump(source_candidate_gate,fh,ensure_ascii=False,sort_keys=True,indent=2)

          if not candidate_only:
              os.makedirs("runtime/reviews_auto",exist_ok=True)
              os.makedirs("runtime/learning_states",exist_ok=True)
              os.makedirs("runtime/krs_oos_measurements",exist_ok=True)
              os.makedirs("runtime/jra_fast_reflections",exist_ok=True)
              with open(os.path.join("runtime","reviews_auto",p["race_id"]+"-AUTO.json"),"w",encoding="utf-8") as fh:
                  json.dump(review,fh,ensure_ascii=False,sort_keys=True,indent=2)
              with open(os.path.join("runtime","learning_states",p["race_id"]+".json"),"w",encoding="utf-8") as fh:
                  json.dump(learning,fh,ensure_ascii=False,sort_keys=True,indent=2)
              with open(os.path.join("runtime","krs_oos_measurements",p["race_id"]+".json"),"w",encoding="utf-8") as fh:
                  json.dump(oos,fh,ensure_ascii=False,sort_keys=True,indent=2)
              with open(os.path.join("runtime","jra_fast_reflections",p["race_id"]+".json"),"w",encoding="utf-8") as fh:
                  json.dump(fast_reflection,fh,ensure_ascii=False,sort_keys=True,indent=2)

              measurements=[]
              for fn in sorted(os.listdir(os.path.join("runtime","krs_oos_measurements"))):
                  if not fn.endswith(".json"): continue
                  with open(os.path.join("runtime","krs_oos_measurements",fn),encoding="utf-8") as fh:
                      measurements.append(json.load(fh))
              r30=evaluate_r30(measurements)
              with open(os.path.join("runtime","krs_oos_status.json"),"w",encoding="utf-8") as fh:
                  json.dump(r30,fh,ensure_ascii=False,sort_keys=True,indent=2)

              # Forward MEC-R4 OOS and canonical Production PFS measurement.
              mec_r4_oos=write_mec_r4_oos_status()
              pfs_grand=write_pfs_grand_review()
          else:
              r30={}
              mec_r4_oos={}
              # Candidate OOS PFS is refreshed into a strictly separate block;
              # Production/Formal PFS cohorts are not altered.
              pfs_grand=write_pfs_grand_review()

          # Rebuild Family Prediction Utility current state after every closed-loop
          # update. Dynamic trackers, not authority-enactment snapshots, are truth.
          family_utility=write_family_prediction_utility_snapshot()

          summary={
            "race_id":p["race_id"],
            "result_lane":"SOURCE_DERIVED_CANDIDATE" if candidate_only else "PRODUCTION",
            "status":"CANDIDATE_RESULT_E2E_PASS" if candidate_only else "RESULT_E2E_PASS",
            "receipt_sha256":res.get("receipt_sha256"),
            "artifact_sha256":rec.get("artifact_sha256"),
            "signer_key_id":res.get("signer_key_id"),
            "signature_alg":res.get("signature_alg"),
            "verified":True,
            "settlement_status":p["settlement"]["status"],
            "frozen_prediction_ref":p["frozen_prediction_ref"],
            "automatic_review_sha256":review.get("sha256") if review else None,
            "learning_state_sha256":learning.get("sha256") if learning else None,
            "first_material_failure":review.get("failure_localization",{}).get("first_material_failure") if review else None,
            "pfs":review.get("capital",{}).get("pfs") if review else None,
            "krs_post_result_classification":review.get("krs",{}).get("post_result_evaluation",{}).get("classification") if review else None,
            "krs_oos_eligible":oos.get("eligible") if oos else None,
            "krs_oos_measurement_sha256":oos.get("sha256") if oos else None,
            "krs_r30_status":r30.get("status") if r30 else None,
            "krs_r30_eligible_races":r30.get("eligible_races") if r30 else None,
            "mec_r4_shadow_settlement_sha256":shadow_settlement.get("sha256") if shadow_settlement else None,
            "mec_r4_oos_status":mec_r4_oos.get("status") if mec_r4_oos else None,
            "mec_r4_oos_eligible_races":mec_r4_oos.get("eligible_races") if mec_r4_oos else None,
            "mec_r4_oos_remaining_races":mec_r4_oos.get("remaining_races") if mec_r4_oos else None,
            "mec_r4_oos_sha256":mec_r4_oos.get("sha256") if mec_r4_oos else None,
            "pfs_grand_review_sha256":pfs_grand.get("sha256") if pfs_grand else None,
            "source_candidate_oos_evaluated":source_candidate_result is not None,
            "source_candidate_oos_eligible":(
                source_candidate_result.get("oos_eligible") if source_candidate_result else None
            ),
            "source_candidate_result_sha256":(
                source_candidate_result.get("sha256") if source_candidate_result else None
            ),
            "jra_local_week_transfer_result_sha256":(
                (((source_candidate_result or {}).get("result_evaluation") or {})
                 .get("jra_local_week_transfer_shadow_result") or {}).get("sha256")
            ),
            "source_candidate_r30_status":(
                source_candidate_gate.get("status") if source_candidate_gate else None
            ),
            "source_candidate_r30_eligible_races":(
                source_candidate_gate.get("eligible_race_count") if source_candidate_gate else None
            ),
            "source_candidate_r30_sha256":(
                source_candidate_gate.get("sha256") if source_candidate_gate else None
            ),
            "family_prediction_utility_contract":family_utility.get("contract_id"),
            "family_prediction_utility_status":family_utility.get("status"),
            "family_prediction_utility_sha256":family_utility.get("sha256"),
            "race_day_fast_reflection_sha256":fast_reflection.get("sha256") if fast_reflection else None,
            "race_day_first_material_failure":fast_reflection.get("first_material_failure") if fast_reflection else None
          }
          print("KM_RESULT_RESULT="+json.dumps(summary,separators=(",",":"),ensure_ascii=False))
          PY

      - name: Persist automatic review and learning state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/reviews_auto/*.json runtime/learning_states/*.json runtime/krs_oos_measurements/*.json runtime/krs_oos_status.json runtime/mec_r4_oos_status.json
          if [ -d runtime/jra_fast_reflections ]; then git add runtime/jra_fast_reflections/*.json 2>/dev/null || true; fi
          if [ -d runtime/source_candidate_oos ]; then git add runtime/source_candidate_oos; fi
          if [ -f runtime/source_candidate_oos_status.json ]; then git add runtime/source_candidate_oos_status.json; fi
          if [ -f runtime/pfs_grand_review/current.json ]; then git add runtime/pfs_grand_review/current.json; fi
          if [ -f runtime/family_prediction_utility/current.json ]; then git add runtime/family_prediction_utility/current.json; fi
          if [ -d runtime/mec_shadow_results ]; then git add runtime/mec_shadow_results/*.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "learning: persist automatic post-result state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
