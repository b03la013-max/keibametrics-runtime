name: JRA Netkeiba Horse Pedigree Link Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-horse-ped-link.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - run: |
          python - <<'PY'
          import json,urllib.request,sys,re,html
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode
          race_id="202609040812"
          url=f"https://race.netkeiba.com/race/oikiri.html?race_id={race_id}"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja"})
          with urllib.request.urlopen(req,timeout=25) as r:
            raw=r.read(5000000);ct=r.headers.get("content-type","")
          dec=_decode(raw,ct)
          links=[]
          for href,body in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',dec,re.I|re.S):
            label=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",body))).strip()
            if re.search(r'db\.netkeiba\.com/horse/[0-9a-zA-Z]+/?',href):
              links.append({"href":html.unescape(href),"label":label})
          # Follow first few horse pages and find pedigree horse links.
          follows=[]
          for x in links[:4]:
            hurl=x["href"]
            req=urllib.request.Request(hurl,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja"})
            with urllib.request.urlopen(req,timeout=25) as r:
              hraw=r.read(5000000);hct=r.headers.get("content-type","")
            hdec=_decode(hraw,hct)
            hlinks=[]
            for href,body in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',hdec,re.I|re.S):
              label=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",body))).strip()
              if "/horse/" in href and label:
                hlinks.append({"href":html.unescape(href),"label":label})
            follows.append({"horse":x,"pedigree_links":hlinks[:30]})
          out={"horse_links":links,"follows":follows}
          p=Path("runtime/diagnostics/netkeiba_horse_ped_link.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime";git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_horse_ped_link.json
          git commit -m "diagnostic: horse pedigree link resolver [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
