name: KeibaMetrics LOCAL Race-Day Autopilot
run-name: LOCAL autopilot ${{ inputs.race_date || 'today' }} ${{ inputs.mode || 'loop' }}

# NAR (all local venues except ばんえい) race-day autopilot, the LOCAL counterpart
# of km-jra-race-day-autopilot.yml (PAPER research implementation, not Formal).
#  * Source: public Rakuten keiba race cards / results. robots.txt (RFC 9309)
#    checked; >=61 s between requests, persisted across runs; 403/429 -> 30 min
#    hold, never retried in a loop. Raw pages are never committed.
#  * Code runs from main; OUTPUT is committed to the separate branch
#    `local-autopilot-data` (main stays free of generated commits). A commit is
#    made only when a prediction/state/result actually changed.
#  * Continuous self-chaining worker (hands off before the 6 h job limit), so
#    it does not depend on GitHub cron (which did not fire for this workflow on
#    13 Nov). It only contacts the provider when work is due: today's editions
#    and results, tomorrow's 朝版 pre-build from 21:00, venue re-check from 06:00.
#    Scheduled runs below are restarts only (queued behind a live worker).
# PAPER only: no purchase, no Formal/Production claim. The only outbound message is the
# Owner-approved pre-start comment on this repository's issue #424.
# (former line) no external notification, no Formal/Production
# claim; formal Owner/consumers/Runner/Signer/Private Store are not touched.
permissions:
  contents: write
  actions: write
  issues: write   # pre-start Owner delivery comments on issue #424 (Owner decision 2026-11-15)

on:
  schedule:
    # 07:07-21:57 JST restarts (22-23 UTC previous day, 00-12 UTC).
    - cron: "7,27,47 22,23,0-12 * * *"
  workflow_dispatch:
    inputs:
      race_date:
        description: "YYYY-MM-DD (empty = today JST)"
        required: false
        type: string
      mode:
        description: "loop (worker until done/23:30 JST) or tick (one pass)"
        required: false
        default: loop
        type: choice
        options: [loop, tick]
      runner:
        description: "mac = Owner's Mac (self-hosted, default, no Actions minutes) / github = GitHub-hosted fallback"
        required: false
        default: mac
        type: choice
        options: [mac, github]

concurrency:
  group: km-local-race-day-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    # Owner decision 2026-11-18: run on the Owner's Mac (self-hosted runner, no billed minutes).
    # Fallback: dispatch with -f runner=github.
    # Pinned to the LOCAL Mac runner (label km-local) so a LOCAL loop never occupies the JRA runner (km-jra), Owner decision 2026-11-20 02:03.
    runs-on: ${{ (inputs.runner || 'mac') == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","km-local"]') }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /runtime/local_autopilot/*.py
            /runtime/local_nar_evidence_candidate.py
            /runtime/local_fullnumerical_candidate.py
            /runtime/local_fullnumerical_production.py
            /runtime/local_bvi_bloodline_research.py
            /runtime/local_krs_bridge_candidate.py
            /runtime/family_runtime_contract.py
            /runtime/local_production_static_owner.py
            /runtime/local_physical/nar_source_manifest.py
            /runtime/minimum_efficient_coverage.py
            /runtime/capital_policy.py
            /runtime/family_authority_guard.py
            /runtime/jra_next_race_learning_binding_audit.py
            /runtime/krs_prediction_utility.py
            /profiles/KM_FAMILY_CURRENT_AUTHORITY_*.json
            /profiles/family_user_capital_default_20261003_R1.json
            /profiles/local_production_static_owner_20261116_v1_1.json
            /profiles/KM_LOCAL_FORWARD_OOS_PREREG_*.json
            /research/kametani/sire_rules.json
            /research/kametani/sire_rules_v2.json
            /research/kametani/sire_rules_v3.json
            /research/nankan/sire_course_rules.json
            /runtime/execution_gateway.py
            /profiles/current_execution_gateway.json
            /profiles/family_runtime_contracts_*.json
            /mapping/local_evidence_feature_rule_registry_v0.1_candidate_20260923.json
            /mapping/local_evidence_feature_rule_registry_v1.1_production_numerical_20261008.json
            /mapping/local_full_numerical_mapping_v0.1_candidate_20260923.json
            /mapping/local_full_numerical_mapping_v1.0_production_20261008.json
            /research/local_bvi/
            /runtime/banei_autopilot/*.py
            /runtime/banei_autopilot/speed_model.json
            /runtime/banei_autopilot/candidates_queue.json
      - uses: actions/checkout@v4
        with:
          ref: local-autopilot-data
          path: data
          fetch-depth: 5
      - name: Run autopilot worker
        env:
          GH_TOKEN: ${{ github.token }}
          KM_LOCAL_DELIVERY_ISSUE: "424"
          KM_BAN_DELIVERY_ISSUE: "429"   # ばんえい専用 (Owner decision 2026-11-18)
          RACE_DATE: ${{ inputs.race_date }}
          RUNNER_CHOICE: ${{ inputs.runner || 'mac' }}
          MODE: ${{ inputs.mode || 'loop' }}
        run: |
          set -uo pipefail
          # Python >= 3.12 is required: float sum() changed in 3.12 and Full29 values must match the Linux runs
          # to the 6th decimal. GitHub-hosted ubuntu has it; on the Mac use python.org / Homebrew 3.12+.
          PYBIN=""
          for c in python3.14 python3.13 python3.12 /Library/Frameworks/Python.framework/Versions/3.14/bin/python3 \
                   /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 \
                   /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 /opt/homebrew/bin/python3 python3 python; do
            if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)'; then PYBIN="$c"; break; fi
          done
          [ -n "$PYBIN" ] || { echo "PYTHON_3_12_REQUIRED (install from python.org on the Mac, or dispatch -f runner=github)"; exit 1; }
          "$PYBIN" -m venv "$RUNNER_TEMP/kmvenv" && . "$RUNNER_TEMP/kmvenv/bin/activate"
          python --version
          # python.org builds do not use the macOS keychain: use certifi's CA bundle for urllib (no Owner step needed)
          python -m pip install -q certifi && export SSL_CERT_FILE="$(python -m certifi)"
          python -m pip install -q cryptography || echo "cryptography install failed (formal signature checks will HOLD)"
          python -m pip install -q pdfplumber || echo "pdfplumber install failed (ばんえい キンタロー feed -> REFERENCE)"
          export KM_LOCAL_AUTOPILOT_OUT="$GITHUB_WORKSPACE/data/output"
          # NAR official CSVs (Owner-downloaded ZIPs, extracted on the Mac; not in Git) and the private cache for
          # the formal EXT connection (Owner 2026-11-21 13:09「接続しなさい」)
          if [ -d "$HOME/Downloads/km_nar/hist/nar" ]; then export KM_NAR_ROOT="$HOME/Downloads/km_nar"; fi
          export KM_PRIVATE_CACHE="$HOME/.km_private_cache"
          git -C data config user.name "keibametrics-runtime"
          git -C data config user.email "actions@users.noreply.github.com"
          START=$(date +%s)
          publish() {
            git -C data add -A output output_ban 2>/dev/null || git -C data add -A output
            if ! git -C data diff --cached --quiet; then
              git -C data commit -q -m "LOCAL autopilot $(TZ=Asia/Tokyo date '+%F %H:%M')"
              for i in 1 2 3; do
                git -C data pull -q --rebase origin local-autopilot-data && git -C data push -q origin HEAD:local-autopilot-data && return 0
                sleep 5
              done
              echo "PUSH_FAILED"
            fi
          }
          while :; do
            D="${RACE_DATE:-$(TZ=Asia/Tokyo date +%F)}"
            python -m runtime.local_autopilot.run --date "$D" --budget 420 || echo "tick exit $?"
            # ばんえい（帯広）v4.0-BAN: one pass per loop on the same worker / same 楽天 throttle state (non-fatal)
            KM_BAN_OUT="$GITHUB_WORKSPACE/data/output_ban" KM_BAN_SOURCE_STATE="$KM_LOCAL_AUTOPILOT_OUT/source_state.json" \
              KM_BAN_NAR_DIR="$HOME/actions-runner/km_ban/nar" KM_BAN_FEED_DIR="$HOME/actions-runner/km_ban/feed" KM_BAN_CACHE="$HOME/.km_ban_cache" \
              python runtime/banei_autopilot/run.py --day "$D" || echo "ban tick exit $?"
            publish
            [ "$MODE" = "loop" ] || break
            HM=$(TZ=Asia/Tokyo date +%H%M)
            if python -m runtime.local_autopilot.run --date "$D" --pending; then PENDING=1; else PENDING=0; fi
            if [ "$PENDING" = 0 ] && [ "$HM" -ge 2100 ] && [ -z "$RACE_DATE" ]; then
              # Pre-build tomorrow's 朝版 tonight (cards are published the day before).
              T=$(python -c "import datetime as d; print((d.datetime.now(d.timezone(d.timedelta(hours=9))) + d.timedelta(days=1)).date())")
              if python -m runtime.local_autopilot.run --date "$T" --pending; then
                python -m runtime.local_autopilot.run --date "$T" --budget 420 || echo "prebuild exit $?"
                publish
                PENDING=1
              fi
            fi
            # Historical result backfill (Owner approval 2026-11-19; learning data, not Forward OOS): only when no
            # race work is due within 12 min and at night; same Rakuten client / 61 s spacing as the race worker.
            BF=0
            # Weekly re-estimation of the EXT weights on NAR (adopted only if the hold-out weeks improve; Owner
            # 2026-11-21「常に改善させなさい」). Night only, no race work due; checks its own 7-day interval.
            if [ "$PENDING" = 0 ] && [ -z "$RACE_DATE" ] && { [ "$HM" -ge 2200 ] || [ "$HM" -lt 600 ]; }; then
              T2=$(python -c "import datetime as d; print((d.datetime.now(d.timezone(d.timedelta(hours=9))) + d.timedelta(days=1)).date())")
              python -m runtime.local_autopilot.ext_connect --refit --day "$T2" || echo "ext refit exit $?"
            fi
            if [ "$PENDING" = 0 ] && [ -z "$RACE_DATE" ]; then
              if [ "$RUNNER_CHOICE" = "mac" ] && [ -d "$HOME/Downloads" ]; then export KM_BACKFILL_PROBE_DIR="$HOME/Downloads/km_probe"; fi
              if python -m runtime.local_autopilot.backfill --budget 420 | tee /dev/stderr | grep -q '^BACKFILL '; then BF=1; fi
              publish
            fi
            # Self-chaining worker: GitHub cron for this workflow has not been
            # firing (0 scheduled runs on 13 Nov), so continuity must not
            # depend on it. Hand off to a fresh run before the 6 h job limit.
            if [ $(( $(date +%s) - START )) -gt 19500 ]; then
              # curl instead of gh (the Mac runner has no gh CLI); keeps the same runner choice
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/km-local-race-day-autopilot.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"loop\",\"runner\":\"$RUNNER_CHOICE\"}}" && echo "HANDOFF"
              break
            fi
            if [ "$PENDING" = 1 ] || [ "$BF" = 1 ]; then sleep 15; else sleep 120; fi
          done
