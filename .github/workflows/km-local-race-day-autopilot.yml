name: KeibaMetrics LOCAL Race-Day Autopilot
run-name: LOCAL autopilot ${{ inputs.race_date || 'today' }} ${{ inputs.mode || 'loop' }}

# NAR (all local venues except ばんえい) race-day autopilot, the LOCAL counterpart
# of km-jra-race-day-autopilot.yml (PAPER research implementation, not Formal).
#  * Source: public Rakuten keiba race cards / results. robots.txt (RFC 9309)
#    checked; >=61 s between requests, persisted across runs; 403/429 -> 30 min
#    hold, never retried in a loop. Raw pages are never committed.
#  * Code runs from main; OUTPUT is committed to the separate branch
#    `local-autopilot-data` (main stays free of generated commits). A commit is
#    made only when a prediction/state/result actually changed.
#  * Continuous self-chaining worker (hands off before the 6 h job limit), so
#    it does not depend on GitHub cron (which did not fire for this workflow on
#    13 Nov). It only contacts the provider when work is due: today's editions
#    and results, tomorrow's 朝版 pre-build from 21:00, venue re-check from 06:00.
#    Scheduled runs below are restarts only (queued behind a live worker).
# PAPER only: no purchase, no external notification, no Formal/Production
# claim; formal Owner/consumers/Runner/Signer/Private Store are not touched.
permissions:
  contents: write
  actions: write

on:
  schedule:
    # 07:07-21:57 JST restarts (22-23 UTC previous day, 00-12 UTC).
    - cron: "7,27,47 22,23,0-12 * * *"
  workflow_dispatch:
    inputs:
      race_date:
        description: "YYYY-MM-DD (empty = today JST)"
        required: false
        type: string
      mode:
        description: "loop (worker until done/23:30 JST) or tick (one pass)"
        required: false
        default: loop
        type: choice
        options: [loop, tick]

concurrency:
  group: km-local-race-day-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /runtime/local_autopilot/*.py
            /runtime/local_nar_evidence_candidate.py
            /runtime/local_fullnumerical_candidate.py
            /runtime/local_fullnumerical_production.py
            /runtime/local_bvi_bloodline_research.py
            /runtime/local_krs_bridge_candidate.py
            /mapping/local_evidence_feature_rule_registry_v0.1_candidate_20260923.json
            /mapping/local_evidence_feature_rule_registry_v1.1_production_numerical_20261008.json
            /mapping/local_full_numerical_mapping_v0.1_candidate_20260923.json
            /mapping/local_full_numerical_mapping_v1.0_production_20261008.json
            /research/local_bvi/
      - uses: actions/checkout@v4
        with:
          ref: local-autopilot-data
          path: data
          fetch-depth: 5
      - name: Run autopilot worker
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_DATE: ${{ inputs.race_date }}
          MODE: ${{ inputs.mode || 'loop' }}
        run: |
          set -uo pipefail
          export KM_LOCAL_AUTOPILOT_OUT="$GITHUB_WORKSPACE/data/output"
          git -C data config user.name "keibametrics-runtime"
          git -C data config user.email "actions@users.noreply.github.com"
          START=$(date +%s)
          publish() {
            git -C data add -A output
            if ! git -C data diff --cached --quiet; then
              git -C data commit -q -m "LOCAL autopilot $(TZ=Asia/Tokyo date '+%F %H:%M')"
              for i in 1 2 3; do
                git -C data pull -q --rebase origin local-autopilot-data && git -C data push -q origin HEAD:local-autopilot-data && return 0
                sleep 5
              done
              echo "PUSH_FAILED"
            fi
          }
          while :; do
            D="${RACE_DATE:-$(TZ=Asia/Tokyo date +%F)}"
            python -m runtime.local_autopilot.run --date "$D" --budget 420 || echo "tick exit $?"
            publish
            [ "$MODE" = "loop" ] || break
            HM=$(TZ=Asia/Tokyo date +%H%M)
            if python -m runtime.local_autopilot.run --date "$D" --pending; then PENDING=1; else PENDING=0; fi
            if [ "$PENDING" = 0 ] && [ "$HM" -ge 2100 ] && [ -z "$RACE_DATE" ]; then
              # Pre-build tomorrow's 朝版 tonight (cards are published the day before).
              T=$(TZ=Asia/Tokyo date -d tomorrow +%F)
              if python -m runtime.local_autopilot.run --date "$T" --pending; then
                python -m runtime.local_autopilot.run --date "$T" --budget 420 || echo "prebuild exit $?"
                publish
                PENDING=1
              fi
            fi
            # Self-chaining worker: GitHub cron for this workflow has not been
            # firing (0 scheduled runs on 13 Nov), so continuity must not
            # depend on it. Hand off to a fresh run before the 6 h job limit.
            if [ $(( $(date +%s) - START )) -gt 19500 ]; then
              gh workflow run km-local-race-day-autopilot.yml --ref main -f mode=loop && echo "HANDOFF"
              break
            fi
            if [ "$PENDING" = 1 ]; then sleep 15; else sleep 120; fi
          done
