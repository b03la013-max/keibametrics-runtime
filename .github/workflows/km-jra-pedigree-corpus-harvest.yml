name: KeibaMetrics JRA Official Pedigree Corpus Harvest
run-name: JRA pedigree harvest ${{ inputs.dates || 'scheduled' }} ${{ inputs.mode || 'auto' }}

# Official www.jra.go.jp only (robots.txt allows all paths). Builds the
# point-in-time pedigree corpus that closes BVI with JRA official facts.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

on:
  schedule:
    # 06:20 JST Sat/Sun/Mon: upcoming race cards of the day.
    - cron: "20 21 * * 5,6,0"
    # 21:20 JST Sat/Sun/Mon: official results of the day just finished.
    - cron: "20 12 * * 6,0,1"
  workflow_dispatch:
    inputs:
      dates:
        description: "Comma separated YYYY-MM-DD (empty = today JST)"
        required: false
        type: string
      mode:
        description: "results (past days) or cards (upcoming days)"
        required: false
        default: results
        type: choice
        options: [results, cards]

concurrency:
  group: km-jra-pedigree-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install JRA SOURCE runtime dependencies
        run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Harvest official pedigree identity and race histories
        env:
          DATES: ${{ inputs.dates }}
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -z "${DATES:-}" ]; then DATES="$(TZ=Asia/Tokyo date +%F)"; fi
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "20 21 * * 5,6,0" ]; then MODE=cards; else MODE=results; fi
          fi
          MODE="${MODE:-results}"
          ARGS=()
          IFS=',' read -ra DS <<< "$DATES"
          for d in "${DS[@]}"; do ARGS+=(--date "$(echo "$d" | xargs)"); done
          cd runtime/jra_source_runtime
          python jra_pedigree_harvest.py "${ARGS[@]}" --mode "$MODE" --out-dir ../pedigree_corpus \
            --max-races 3 --start-race 0 --delay 1.3
      - name: Select exactly newly collected pedigree files
        id: new_corpus
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git ls-files --others --exclude-standard runtime/pedigree_corpus/ | grep '\.json
        run: |
          set -euo pipefail
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/pedigree_corpus/*.json
          git diff --cached --quiet && exit 0
          git commit -m "corpus: JRA official pedigree harvest [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*3))
          done
          exit 1
 || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<END_PATHS"
            printf '%s\\n' "${FILES[@]}"
            echo "END_PATHS"
          } >> "$GITHUB_OUTPUT"
      - name: Attest newly harvested official pedigree facts via GitHub OIDC
        if: steps.new_corpus.outputs.exists == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.new_corpus.outputs.paths }}
      - name: Reverify signer for each output before git persistence
        if: steps.new_corpus.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.new_corpus.outputs.paths }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            test -f "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
               --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/km-jra-pedigree-corpus-harvest.yml"
          done <<< "$FILES"
      - name: Persist corpus files
        run: |
          set -euo pipefail
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/pedigree_corpus/*.json
          git diff --cached --quiet && exit 0
          git commit -m "corpus: JRA official pedigree harvest [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*3))
          done
          exit 1
