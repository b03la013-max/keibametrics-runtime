name: KeibaMetrics JRA Official Pedigree Corpus Harvest
run-name: JRA pedigree harvest ${{ inputs.dates || 'scheduled' }} ${{ inputs.mode || 'auto' }}
# Public normalized facts and SHA references only; robots is not a copyright license.
permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
on:
  schedule:
    - cron: "20 21 * * 5,6,0"
    - cron: "20 12 * * 6,0,1"
  workflow_dispatch:
    inputs:
      dates:
        description: "One YYYY-MM-DD (empty = today JST); completed batches are not reacquired"
        required: false
        type: string
      mode:
        required: false
        default: results
        type: choice
        options: [results, cards]
concurrency:
  group: km-jra-pedigree-harvest
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /runtime/*.py
            /runtime/jra_source_runtime/
            /scripts/jra_weekend_bvi_intake.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q beautifulsoup4 cryptography
      - name: Resolve every official race without acquiring horse pages
        id: plan
        env:
          DATES: ${{ inputs.dates }}
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: runtime:runtime/jra_source_runtime
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          from datetime import datetime,timedelta,timezone
          from urllib.robotparser import RobotFileParser
          from scripts.jra_weekend_bvi_intake import day_plan,resolve_scheduled_target
          ua='KeibaMetrics-JRA-Official-Pedigree-Harvest/1.0'
          now=datetime.now(timezone(timedelta(hours=9)))
          mode=os.environ.get('MODE') or 'results'
          schedule_target=None
          if os.environ['EVENT']=='schedule':
              # GitHub may start this job after JST midnight or retry it days
              # later. Only its immutable ORIGINAL run metadata anchors the
              # target. This is not a Source acquisition or evidence timestamp.
              run_id=int(os.environ['GITHUB_RUN_ID'])
              request=urllib.request.Request(
                  'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+str(run_id),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':ua,
                           'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:run=json.load(response)
              assert (run['id']==run_id and run['event']=='schedule'
                      and run['head_sha']==os.environ['GITHUB_SHA']),'SCHEDULE_RUN_REFERENCE_MISMATCH'
              schedule_target=resolve_scheduled_target(os.environ['SCHEDULE'],
                  run_created_at=datetime.fromisoformat(run['created_at'].replace('Z','+00:00')),
                  observed_at=now)
              targets=[(schedule_target['date'],schedule_target['mode'])]
          elif os.environ['EVENT']=='push':
              # Isolated owner-requested live pilot. NEVER writes main or predicts.
              assert now.date().isoformat()=='2026-10-24','DATED_PILOT_EXPIRED'
              targets=[('2026-10-24','results'),('2026-10-25','cards')]
          else:
              day=os.environ.get('DATES') or now.date().isoformat()
              assert ',' not in day,'SINGLE_DATE_ONLY'
              targets=[(day,mode)]
          with urllib.request.urlopen(urllib.request.Request('https://www.jra.go.jp/robots.txt',headers={'User-Agent':ua}),timeout=20) as r:
              rules=RobotFileParser();rules.parse(r.read(30000).decode().splitlines())
          assert all(rules.can_fetch(ua,'https://www.jra.go.jp/JRADB/'+p) for p in ('accessD.html','accessS.html','accessU.html'))
          windows=[]
          for day,mode in targets:windows.extend(day_plan(day,mode))
          for i,w in enumerate(windows):w['index']=i
          p=Path('runtime_out/pedigree_day_plan.json');p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps({'include':windows,'planned_at':now.isoformat(),
              'schedule_target':schedule_target,'production_effect':'NONE'},ensure_ascii=False,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('matrix='+json.dumps({'include':[{'index':w['index']} for w in windows]},separators=(',',':'))+'\n')
          print('OFFICIAL_TARGET_RACES',sum(len(w['race_ids']) for w in windows),'BOUNDED_BATCHES',len(windows))
          if schedule_target:print('SCHEDULING_REFERENCE_ONLY',json.dumps(schedule_target,separators=(',',':')))
          PY
      - uses: actions/attest@v4
        with:
          subject-path: runtime_out/pedigree_day_plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: jra-pedigree-day-plan
          path: runtime_out/pedigree_day_plan.json
  harvest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /runtime/*.py
            /runtime/jra_source_runtime/
            /runtime/pedigree_corpus/
            /runtime/pedigree_intake_receipts/
            /scripts/jra_weekend_bvi_intake.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q beautifulsoup4 cryptography
      - uses: actions/download-artifact@v4
        with:
          name: jra-pedigree-day-plan
          path: runtime_out
      - name: Resume one three-race window; preserve previously verified bytes
        id: acquire
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: runtime:runtime/jra_source_runtime
        run: |
          python scripts/jra_weekend_bvi_intake.py collect-window \
            --plan runtime_out/pedigree_day_plan.json --index '${{ matrix.index }}' \
            --run-id '${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Attest original producer bytes
        if: steps.acquire.outputs.new == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.acquire.outputs.file }}
      - name: Verify OIDC and prove the unchanged Production Corpus Reader consumes this batch
        id: admission
        if: steps.acquire.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.acquire.outputs.file }}
          PYTHONPATH: runtime:runtime/jra_source_runtime
        run: |
          set -euo pipefail
          gh attestation verify "$FILE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/km-jra-pedigree-corpus-harvest.yml"
          python scripts/jra_weekend_bvi_intake.py admit --file "$FILE" \
            --receipt "runtime/pedigree_intake_receipts/$(basename "$FILE" .json)-admitted-${{ github.run_id }}.json"
      - name: Persist independently verified facts or isolated acquisition failure
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
          NEW: ${{ steps.acquire.outputs.new }}
          ADMISSION_OUTCOME: ${{ steps.admission.outcome }}
        run: |
          set -euo pipefail
          test "$ACQUIRE_OUTCOME" = success || exit 1
          if [ "$NEW" = true ];then test "$ADMISSION_OUTCOME" = success || exit 1;fi
          case "$TARGET_BRANCH" in main|candidate/jra-bvi-full-day-20261024) ;; *) echo UNAPPROVED_PUBLICATION_REF;exit 1 ;; esac
          git config user.name keibametrics-runtime
          git config user.email actions@users.noreply.github.com
          git add runtime/pedigree_corpus runtime/pedigree_intake_receipts
          git diff --cached --quiet && exit 0
          git commit -m 'corpus: verified bounded JRA full-day intake [skip ci]'
          for n in 1 2 3; do
            if git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH";then exit 0;fi
            git rebase --abort 2>/dev/null || true
            sleep $((n*4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-pedigree-window-${{ matrix.index }}-${{ github.run_attempt }}
          path: |
            runtime/pedigree_intake_receipts/*${{ github.run_id }}*.json
            ${{ steps.acquire.outputs.file }}
  summarize:
    needs: [plan, harvest]
    if: ${{ always() && needs.plan.result == 'success' && needs.harvest.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q beautifulsoup4 cryptography
      - uses: actions/download-artifact@v4
        with:
          name: jra-pedigree-day-plan
          path: runtime_out
      - name: Measure actual OIDC Reader intake, duplicates and frozen BVI once per whole day
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUMMARY="runtime/pedigree_intake_receipts/day-audit-${{ github.run_id }}-${{ github.run_attempt }}.json"
          python scripts/jra_pedigree_inventory.py --official-audit \
            --plan runtime_out/pedigree_day_plan.json --output runtime_out/jra_bvi_full_day_audit.json \
            --summary-output "$SUMMARY"
          echo "file=$SUMMARY" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@v4
        with:
          subject-path: |
            runtime_out/jra_bvi_full_day_audit.json
            ${{ steps.summary.outputs.file }}
      - name: Independently verify the daily measurement receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.summary.outputs.file }}
        run: gh attestation verify "$SUMMARY" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/km-jra-pedigree-corpus-harvest.yml"
      - name: Persist only daily aggregate measurement, never rewrite a prediction
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          SUMMARY: ${{ steps.summary.outputs.file }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in main|candidate/jra-bvi-full-day-20261024) ;; *) exit 1 ;; esac
          git config user.name keibametrics-runtime
          git config user.email actions@users.noreply.github.com
          git add "$SUMMARY"
          git commit -m "pedigree: signed daily collection and BVI measurement [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-pedigree-full-day-measurement
          path: |
            runtime_out/jra_bvi_full_day_audit.json
            runtime/pedigree_intake_receipts/day-audit-*.json
          retention-days: 90
