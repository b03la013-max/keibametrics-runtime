name: KeibaMetrics KRS Utility Acceptance

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/km-krs-utility-acceptance.yml"
      - "runtime/krs_prediction_utility.py"
      - "scripts/*jra_day_review.py"
      - "scripts/jra_full_day_postrace_review.py"
      - "tests/test_jra_day_review.py"
      - "evidence/jra_day_review_20261017/payload*"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/km-krs-utility-acceptance.yml"
      - "runtime/krs_prediction_utility.py"
      - "tests/test_krs_prediction_utility.py"
      - ".github/workflows/km-formal-request-runner.yml"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate formal workflow and KRS utility gateway
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml pytest cryptography beautifulsoup4
          python - <<'PY'
          import re, yaml
          from pathlib import Path
          p=Path(".github/workflows/km-formal-request-runner.yml")
          obj=yaml.safe_load(p.read_text())
          assert isinstance(obj,dict) and "jobs" in obj
          text=p.read_text()
          assert "KRS_PREDICTION_UTILITY_CAPTURED" in text
          assert 'final_package["krs_prediction_utility_shadow"]' in text
          assert "Upload KRS structured output and utility delta" in text
          m=re.search(r"python - <<'PY'\n(.*?)\n\s*PY\n",text,re.S)
          assert m, "INLINE_PYTHON_NOT_FOUND"
          body="\n".join(line[10:] if line.startswith("          ") else line for line in m.group(1).splitlines())
          compile(body,"formal-inline.py","exec")
          print("FORMAL_WORKFLOW_SYNTAX_PASS")
          PY
          python tests/test_krs_prediction_utility.py
          python -m pytest -q tests/test_jra_day_review.py tests/test_krs_oos_promotion_gate.py tests/test_jra_production_krs_contract.py tests/test_jra_production_postresult.py tests/test_jra_no_bet_postresult_learning.py tests/test_pfs_grand_review.py tests/test_jra_production_fullnumerical_to_krs.py tests/test_jra_candidate_postresult_closedloop.py
