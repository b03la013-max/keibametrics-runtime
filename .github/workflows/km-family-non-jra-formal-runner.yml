name: KeibaMetrics Non-JRA Family Formal Bridge

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [ main ]
    paths:
      - "runtime/family_requests/*.json"
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Formal/SOURCE request JSON path'
        required: false
        type: string

jobs:
  formal-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve execution metadata
        id: execution_meta
        shell: bash
        run: |
          set -euo pipefail
          REQ="${{ inputs.request_path }}"
          if [ -z "$REQ" ]; then
            mapfile -t REQS < <(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep '^runtime/family_requests/.*\.json          REQUEST_FILE="$REQ" python - <<'PY'
          import json,os,sys,re
          sys.path.insert(0,"runtime")
          from execution_gateway import load_gateway, normalize_request, execution_phase, artifact_name, derive_execution_id
          req=json.load(open(os.environ["REQUEST_FILE"],encoding="utf-8"))
          fam=str(req.get("family_id") or "").upper()
          if fam=="LOCAL":
              gateway=load_gateway()
              normalized,ctx=normalize_request(req,gateway)
              execution_id=ctx["execution_id"]
              phase=ctx["phase"]
              art=artifact_name(execution_id,phase,gateway,"LOCAL")
          else:
              execution_id=derive_execution_id(req)
              phase=execution_phase(req)
              art=re.sub(r"[^A-Za-z0-9._-]+","-",f"km-ban-execution-{execution_id}-{phase}")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"request_file={os.environ['REQUEST_FILE']}\n")
              out.write(f"execution_id={execution_id}\n")
              out.write(f"phase={phase}\n")
              out.write(f"artifact_name={art}\n")
          print(json.dumps({"request_file":os.environ["REQUEST_FILE"],"execution_id":execution_id,"phase":phase,"artifact_name":art},ensure_ascii=False))
          PY
      - name: Verify canonical gateway and runtime before race execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_out
          python runtime/execution_gateway.py health-check --family LOCAL --output runtime_out/execution_gateway_preflight.json

      - name: Resolve and execute family-isolated external runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REQ="${{ steps.execution_meta.outputs.request_file }}"
          test -n "$REQ"
          REQUEST_FILE="$REQ" python -m runtime.non_jra_formal_runner

      - name: Persist canonical signed execution phase
        if: success() && hashFiles('runtime_out/*.json') != ''
        shell: bash
        env:
          EXECUTION_ID: ${{ steps.execution_meta.outputs.execution_id }}
          EXECUTION_PHASE: ${{ steps.execution_meta.outputs.phase }}
        run: |
          set -euo pipefail
          python runtime/execution_store.py persist \
            --execution-id "$EXECUTION_ID" \
            --phase "$EXECUTION_PHASE" \
            --run-id "${{ github.run_id }}" \
            --source-dir runtime_out \
            --github-sha "${{ github.sha }}"
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "runtime/executions/$EXECUTION_ID/$EXECUTION_PHASE"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "execution: persist $EXECUTION_ID $EXECUTION_PHASE [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Unable to persist canonical execution phase after retries" >&2
          exit 1

      - name: Persist successful signed LOCAL execution envelopes
        if: success() && hashFiles('runtime_out/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execution_meta.outputs.artifact_name }}
          path: runtime_out/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist LOCAL execution failure diagnostics
        if: failure() && hashFiles('runtime_out/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: km-local-execution-failure-${{ steps.execution_meta.outputs.execution_id }}-${{ github.run_id }}
          path: runtime_out/*.json
          if-no-files-found: warn
          retention-days: 30

 || true)
            if [ "${#REQS[@]}" -ne 1 ]; then
              echo "Expected exactly one changed formal request; found ${#REQS[@]}" >&2
              printf '%s\n' "${REQS[@]}" >&2
              exit 2
            fi
            REQ="${REQS[0]}"
          fi
          case "$REQ" in
            runtime/family_requests/*.json) ;;
            *) echo "Invalid request path: $REQ" >&2; exit 2 ;;
          esac
          test -f "$REQ"
          REQUEST_FILE="$REQ" python - <<'PY'
          import json,os,sys,re
          sys.path.insert(0,"runtime")
          from execution_gateway import load_gateway, normalize_request, execution_phase, artifact_name, derive_execution_id
          req=json.load(open(os.environ["REQUEST_FILE"],encoding="utf-8"))
          fam=str(req.get("family_id") or "").upper()
          if fam=="LOCAL":
              gateway=load_gateway()
              normalized,ctx=normalize_request(req,gateway)
              execution_id=ctx["execution_id"]
              phase=ctx["phase"]
              art=artifact_name(execution_id,phase,gateway,"LOCAL")
          else:
              execution_id=derive_execution_id(req)
              phase=execution_phase(req)
              art=re.sub(r"[^A-Za-z0-9._-]+","-",f"km-ban-execution-{execution_id}-{phase}")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"request_file={os.environ['REQUEST_FILE']}\n")
              out.write(f"execution_id={execution_id}\n")
              out.write(f"phase={phase}\n")
              out.write(f"artifact_name={art}\n")
          print(json.dumps({"request_file":os.environ["REQUEST_FILE"],"execution_id":execution_id,"phase":phase,"artifact_name":art},ensure_ascii=False))
          PY
      - name: Resolve and execute family-isolated external runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REQ="${{ steps.execution_meta.outputs.request_file }}"
          test -n "$REQ"
          REQUEST_FILE="$REQ" python -m runtime.non_jra_formal_runner

      - name: Persist successful signed LOCAL execution envelopes
        if: success() && hashFiles('runtime_out/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execution_meta.outputs.artifact_name }}
          path: runtime_out/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Persist LOCAL execution failure diagnostics
        if: failure() && hashFiles('runtime_out/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: km-local-execution-failure-${{ steps.execution_meta.outputs.execution_id }}-${{ github.run_id }}
          path: runtime_out/*.json
          if-no-files-found: warn
          retention-days: 30

