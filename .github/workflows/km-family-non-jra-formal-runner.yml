name: KeibaMetrics Non-JRA Family Formal Bridge

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ main ]
    paths:
      - "runtime/family_requests/*.json"
  workflow_dispatch:

jobs:
  formal-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve execution metadata
        id: execution_meta
        shell: bash
        run: |
          set -euo pipefail
          REQ="$(git diff --name-only HEAD^ HEAD -- 'runtime/family_requests/*.json' | tail -1)"
          if [ -z "$REQ" ]; then
            REQ="$(find runtime/family_requests -maxdepth 1 -type f -name '*.json' | sort | tail -1)"
          fi
          test -n "$REQ"
          REQUEST_FILE="$REQ" python - <<'PY'
          import json,os,sys,re
          sys.path.insert(0,"runtime")
          from execution_gateway import load_gateway, normalize_request, execution_phase, artifact_name, derive_execution_id
          req=json.load(open(os.environ["REQUEST_FILE"],encoding="utf-8"))
          fam=str(req.get("family_id") or "").upper()
          if fam=="LOCAL":
              gateway=load_gateway()
              normalized,ctx=normalize_request(req,gateway)
              execution_id=ctx["execution_id"]
              phase=ctx["phase"]
              art=artifact_name(execution_id,phase,gateway,"LOCAL")
          else:
              execution_id=derive_execution_id(req)
              phase=execution_phase(req)
              art=re.sub(r"[^A-Za-z0-9._-]+","-",f"km-ban-execution-{execution_id}-{phase}")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"request_file={os.environ['REQUEST_FILE']}\n")
              out.write(f"execution_id={execution_id}\n")
              out.write(f"phase={phase}\n")
              out.write(f"artifact_name={art}\n")
          print(json.dumps({"request_file":os.environ["REQUEST_FILE"],"execution_id":execution_id,"phase":phase,"artifact_name":art},ensure_ascii=False))
          PY
      - name: Resolve and execute family-isolated external runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REQ="${{ steps.execution_meta.outputs.request_file }}"
          test -n "$REQ"
          REQUEST_FILE="$REQ" python - <<'PY'
          import json,os,sys,urllib.request,urllib.error,urllib.parse,hashlib,datetime,copy,pathlib,io,zipfile
          from zoneinfo import ZoneInfo
          sys.path.insert(0,"runtime")
          from family_runtime_contract import load_contracts, resolve_family_runtime
          from execution_gateway import (
              load_gateway, normalize_request, family_config, assess_runtime_health,
              artifact_name as gateway_artifact_name, derive_execution_id,
          )

          def sha_obj(x):
              return hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()).hexdigest()

          def parse_dt(s):
              return datetime.datetime.fromisoformat(str(s).replace("Z","+00:00"))

          with open(os.environ["REQUEST_FILE"],encoding="utf-8") as f:
              raw_req=json.load(f)

          fam=str(raw_req.get("family_id") or "").upper()
          assert fam in {"LOCAL","BAN"}, f"NON_JRA_BRIDGE_FAMILY_INVALID:{fam}"
          gateway=None
          execution_context=None
          if fam=="LOCAL":
              gateway=load_gateway()
              req,execution_context=normalize_request(raw_req,gateway)
          else:
              req=raw_req
              execution_context={
                  "execution_id":derive_execution_id(req),
                  "family_id":fam,
                  "phase":str(req.get("execution_phase") or req.get("phase") or "FORMAL").upper(),
              }
          execution_id=str(execution_context["execution_id"])
          resolved=resolve_family_runtime(req,load_contracts())
          assert resolved["executable"] is True
          endpoint=resolved["external_endpoint"]

          os.makedirs("runtime_out",exist_ok=True)
          def persist(name,obj):
              with open(os.path.join("runtime_out",name),"w",encoding="utf-8") as wf:
                  json.dump(obj,wf,ensure_ascii=False,sort_keys=True,separators=(",",":"))

          def fail_closed(code,details=None):
              payload={
                "status":"FAIL_CLOSED",
                "code":code,
                "details":details,
                "request_file":os.environ.get("REQUEST_FILE"),
                "timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              }
              persist("failure_diagnostic.json",payload)
              raise AssertionError((code,details))

          def get_json(path,timeout=60):
              rq=urllib.request.Request(endpoint+path,headers={"accept":"application/json"},method="GET")
              with urllib.request.urlopen(rq,timeout=timeout) as x:
                  raw=x.read().decode()
                  return x.status,json.loads(raw) if raw else {}

          # Current execution gateway is the single operational pointer.
          # Git commit equality is diagnostic only when the executable bundle
          # fingerprint and runtime profile are compatible.
          if fam=="LOCAL":
              cfg=family_config("LOCAL",gateway)
              if str(cfg.get("external_endpoint") or "").rstrip("/") != str(endpoint).rstrip("/"):
                  fail_closed("GATEWAY_CONTRACT_ENDPOINT_MISMATCH",{
                      "gateway_endpoint":cfg.get("external_endpoint"),
                      "contract_endpoint":endpoint,
                  })
              hc,health=get_json("/health",60)
              if hc>=300:
                  fail_closed("RUNTIME_HEALTH_HTTP_FAILED",{"http":hc,"health":health})
              assessment=assess_runtime_health(health,"LOCAL",gateway,pathlib.Path("."))
              persist("execution_context.json",execution_context)
              persist("runtime_preflight.json",{
                  "execution_id":execution_id,
                  "request_diagnostics":execution_context.get("request_diagnostics"),
                  "health":health,
                  "assessment":assessment,
              })
              if assessment.get("status")!="PASS":
                  fail_closed("RUNTIME_GATEWAY_COMPATIBILITY_FAILED",assessment)

          def call(path,payload,timeout=600):
              data=json.dumps(payload,separators=(",",":"),ensure_ascii=False).encode()
              rq=urllib.request.Request(endpoint+path,data=data,headers={"content-type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(rq,timeout=timeout) as x:
                      raw=x.read().decode()
                      return x.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: body=json.loads(raw)
                  except Exception: body={"raw":raw}
                  return e.code,body

          def verify_envelope(env,label):
              vc,v=call("/verify",env,60)
              assert vc<300 and v.get("valid") is True,(label,vc,v)
              return env.get("receipt_sha256")

          phase=str(req.get("execution_phase") or req.get("phase") or "FORMAL").upper()

          # LOCAL two-phase intake: acquire and verify signed official SOURCE
          # before Venue Static is built. This reuses the existing Formal Runner
          # and External Runtime; it is not a new prediction or numerical layer.
          if phase in {"SOURCE","SOURCE_ONLY","SOURCE-FREEZE","SOURCE_FREEZE"}:
              if fam!="LOCAL":
                  fail_closed("SOURCE_ONLY_LOCAL_REQUIRED",{"family_id":fam})
              rid=str(req.get("race_id") or "")
              assert rid,"RACE_ID_REQUIRED"
              race_meta=req.get("race") if isinstance(req.get("race"),dict) else {}
              source_req=req.get("source_acquisition_request")
              if not isinstance(source_req,dict) and isinstance(req.get("required_source_manifest"),list):
                  source_req={
                    "family_id":"LOCAL",
                    "race_id":rid,
                    "prediction_cutoff":req.get("prediction_cutoff"),
                    "sources":copy.deepcopy(req["required_source_manifest"])
                  }
              if not isinstance(source_req,dict):
                  venue_id=req.get("venue_id") or race_meta.get("venue_id")
                  race_date=req.get("race_date") or race_meta.get("race_date") or race_meta.get("date")
                  race_no=req.get("race_no") or race_meta.get("race_no")
                  cutoff=req.get("prediction_cutoff") or race_meta.get("prediction_cutoff")
                  if venue_id and race_date and race_no and cutoff:
                      mc,manifest=call("/source/manifest/local",{
                        "family_id":"LOCAL","race_id":rid,
                        "venue_id":venue_id,"race_date":race_date,"race_no":race_no,
                        "prediction_cutoff":cutoff,
                        "include_same_day_results":True,
                        "include_odds":True,
                        "require_active_runner_universe":True
                      },60)
                      assert mc<300,(mc,manifest)
                      source_req=manifest
              assert isinstance(source_req,dict),"SOURCE_ACQUISITION_REQUEST_REQUIRED"
              source_req=copy.deepcopy(source_req)
              source_req["family_id"]="LOCAL"
              source_req["race_id"]=rid
              source_req.setdefault("prediction_cutoff",req.get("prediction_cutoff"))
              assert isinstance(source_req.get("sources"),list) and source_req["sources"],"REQUIRED_SOURCE_MANIFEST_REQUIRED"
              sc,source=call("/source/acquire",source_req,180)
              persist("source_receipt_envelope.json",source)
              if sc>=300 or (source.get("receipt") or {}).get("status")!="SOURCE_FROZEN":
                  fail_closed("SOURCE_ACQUISITION_NOT_FROZEN",{"http":sc,"source":source})
              svc,sv=call("/source/verify",source,60)
              persist("source_verification.json",sv)
              if svc>=300 or sv.get("valid") is not True:
                  fail_closed("SOURCE_SIGNATURE_OR_ARTIFACT_VERIFY_FAILED",{"http":svc,"verify":sv})
              source_artifact=source.get("artifact") or {}
              if source_artifact.get("formal_ready") is not True:
                  fail_closed("SOURCE_NOT_FORMAL_READY",source_artifact)
              off=source_artifact.get("official_runner_universe") or {}
              print("KM_NON_JRA_FORMAL_RESULT="+json.dumps({
                "race_id":rid,"family_id":"LOCAL","execution_id":execution_id,"execution_phase":"SOURCE",
                "status":"SOURCE_VERIFIED","external_endpoint":endpoint,
                "source_receipt":source.get("receipt_sha256"),
                "source_snapshot_sha256":source_artifact.get("source_snapshot_sha256"),
                "official_runner_universe_sha256":source_artifact.get("official_runner_universe_sha256"),
                "official_runner_count":off.get("runner_count"),
                "source_freeze_at":source_artifact.get("source_freeze_at"),
                "verified":True
              },separators=(",",":"),ensure_ascii=False))
              raise SystemExit(0)


          # Post-race path: RESULT endpoint performs settlement-safe PFS,
          # automatic failure localization, and next-race learning state.
          if phase in {"RESULT","POST_RACE","POST-RACE","SETTLEMENT"}:
              code,res=call("/result",req,180)
              assert code<300,(code,res)
              assert (res.get("receipt") or {}).get("status")=="PASS",res
              verify_envelope(res,"RESULT")
              print("KM_NON_JRA_FORMAL_RESULT="+json.dumps({
                "race_id":req.get("race_id"),"family_id":fam,
                "execution_phase":"RESULT","status":"RESULT_PASS",
                "external_endpoint":endpoint,
                "receipt_sha256":res.get("receipt_sha256"),
                "verified":True,
                "pfs":((res.get("artifact") or {}).get("settlement") or {}).get("pfs"),
                "learning_state_id":((res.get("artifact") or {}).get("learning_event") or {}).get("state_id"),
              },separators=(",",":"),ensure_ascii=False))
              raise SystemExit(0)

          # BAN retains its current isolated formal contract.
          if fam=="BAN":
              code,res=call("/formal",req)
              assert code<300,(code,res)
              receipt=res.get("receipt") or {}
              assert receipt.get("status") in {"PASS","FULL_FORMAL_E2E_PASS"},res
              verify_envelope(res,"BAN_FORMAL")
              print("KM_NON_JRA_FORMAL_RESULT="+json.dumps({
                "race_id":req.get("race_id"),"family_id":fam,
                "execution_phase":"FORMAL","status":"FULL_FORMAL_E2E_PASS",
                "external_endpoint":endpoint,
                "receipt_sha256":res.get("receipt_sha256"),
                "verified":True
              },separators=(",",":"),ensure_ascii=False))
              raise SystemExit(0)

          # LOCAL staged full-pipeline execution.
          from local_evidence_to_base_production import materialize_request
          from local_index_provenance_builder import build as build_local_provenance
          from local_krs_input_builder_production import build as build_local_krs
          from krs_prediction_utility import build_krs_prediction_utility
          from minimum_efficient_coverage import build_mec_plan, validate_mec_plan, MEC_PROFILE
          from capital_policy import resolve_capital_policy
          from local_numerical_authority_gate import assess as assess_numerical_authority
          from local_candidate_numerical_authority import assess as assess_candidate_numerical
          from local_nar_evidence_candidate import compile_candidate_evidence
          from local_evidence_routing_candidate_v03 import compile_candidate_evidence_v03
          from local_fullnumerical_candidate import materialize_candidate
          from local_krs_bridge_candidate import build_candidate_prediction, build_candidate_krs
          from local_candidate_postresult import evaluate_dual
          from local_candidate_v03_postresult import evaluate_v03
          from local_mec_r4_bridge import build_pre_result_shadow, bind_shadow_to_trace, verify_signed_final_binding, build_basis as build_mec_shadow_basis
          from local_mec_r5_shadow import (
              build_shadow as build_local_mec_r5_shadow,
              bind_shadow_to_trace as bind_local_mec_r5_shadow_to_trace,
              verify_signed_final_binding as verify_local_mec_r5_signed_final_binding,
          )

          rid=str(req.get("race_id") or "")
          assert rid,"RACE_ID_REQUIRED"

          temporal_mode=str(req.get("temporal_mode") or "FORMAL-PRE-RACE").upper()
          scheduled=req.get("scheduled_post_at")
          release_deadline=req.get("release_deadline_at")
          formal_release_deadline_utc=None
          if temporal_mode=="FORMAL-PRE-RACE":
              if not scheduled:
                  fail_closed("SCHEDULED_POST_AT_REQUIRED")
              post_dt=parse_dt(scheduled).astimezone(datetime.timezone.utc)
              if release_deadline:
                  deadline_dt=parse_dt(release_deadline).astimezone(datetime.timezone.utc)
              else:
                  deadline_dt=post_dt-datetime.timedelta(seconds=int(req.get("release_buffer_seconds") or 120))
              now=datetime.datetime.now(datetime.timezone.utc)
              persist("deadline_preflight.json",{
                  "checked_at":now.isoformat(),
                  "scheduled_post_at":scheduled,
                  "release_deadline_at":deadline_dt.isoformat(),
                  "release_buffer_seconds":int((post_dt-deadline_dt).total_seconds()),
              })
              formal_release_deadline_utc=deadline_dt
              if now>=deadline_dt:
                  fail_closed("DEADLINE_INSUFFICIENT_AT_EXECUTION_START",{
                      "now":now.isoformat(),"release_deadline":deadline_dt.isoformat()
                  })

          def deadline_guard(stage_name):
              if temporal_mode=="FORMAL-PRE-RACE" and formal_release_deadline_utc is not None:
                  now=datetime.datetime.now(datetime.timezone.utc)
                  if now>=formal_release_deadline_utc:
                      fail_closed("DEADLINE_INSUFFICIENT:"+stage_name,{
                          "now":now.isoformat(),
                          "release_deadline":formal_release_deadline_utc.isoformat(),
                      })

          # Source Acquisition is an external signed execution phase.
          # Preferred route: SOURCE_ONLY first, then reuse the verified signed
          # receipt after Static is frozen. The Chat/GitHub handoff may reference
          # the SOURCE_ONLY Actions artifact by id so the signed envelope does not
          # need to be copied into the next request JSON.
          provided_source=req.get("source_receipt")
          source_receipt_artifact_id=req.get("source_receipt_artifact_id")

          # Preferred handoff: resolve the deterministic SOURCE artifact from
          # the lifecycle execution_id. Explicit artifact ids remain supported
          # only for backward compatibility.
          if not isinstance(provided_source,dict) and not source_receipt_artifact_id:
              repo=os.environ.get("GITHUB_REPOSITORY") or ""
              token=os.environ.get("GITHUB_TOKEN") or ""
              if not repo or not token:
                  fail_closed("SOURCE_ARTIFACT_AUTO_RESOLUTION_CONTEXT_MISSING",{
                      "repository_present":bool(repo),"token_present":bool(token)
                  })
              source_artifact_name=gateway_artifact_name(execution_id,"SOURCE",gateway,"LOCAL")
              list_url=(
                  f"https://api.github.com/repos/{repo}/actions/artifacts"
                  f"?name={urllib.parse.quote(source_artifact_name)}&per_page=100"
              )
              list_req=urllib.request.Request(list_url,headers={
                  "accept":"application/vnd.github+json",
                  "authorization":f"Bearer {token}",
                  "x-github-api-version":"2022-11-28",
                  "user-agent":"keibametrics-execution-gateway",
              })
              try:
                  with urllib.request.urlopen(list_req,timeout=60) as x:
                      artifact_listing=json.loads(x.read().decode())
              except Exception as e:
                  fail_closed("SOURCE_ARTIFACT_AUTO_RESOLUTION_FAILED",{
                      "artifact_name":source_artifact_name,"error":str(e)
                  })
              candidates=[
                  a for a in (artifact_listing.get("artifacts") or [])
                  if not a.get("expired") and str(a.get("name") or "")==source_artifact_name
              ]
              if not candidates:
                  fail_closed("SOURCE_ARTIFACT_NOT_FOUND_FOR_EXECUTION_ID",{
                      "execution_id":execution_id,"artifact_name":source_artifact_name
                  })
              candidates.sort(key=lambda a:str(a.get("created_at") or ""),reverse=True)
              chosen=candidates[0]
              source_receipt_artifact_id=chosen.get("id")
              persist("source_artifact_resolution.json",{
                  "mode":"EXECUTION_ID_AUTO_RESOLVE",
                  "execution_id":execution_id,
                  "artifact_name":source_artifact_name,
                  "artifact_id":source_receipt_artifact_id,
                  "workflow_run_id":((chosen.get("workflow_run") or {}).get("id")),
                  "created_at":chosen.get("created_at"),
              })

          if not isinstance(provided_source,dict) and source_receipt_artifact_id:
              try:
                  artifact_id=int(source_receipt_artifact_id)
              except Exception:
                  fail_closed("SOURCE_RECEIPT_ARTIFACT_ID_INVALID",source_receipt_artifact_id)
              repo=os.environ.get("GITHUB_REPOSITORY") or ""
              token=os.environ.get("GITHUB_TOKEN") or ""
              if not repo or not token:
                  fail_closed("SOURCE_RECEIPT_ARTIFACT_DOWNLOAD_CONTEXT_MISSING",{
                      "repository_present":bool(repo),"token_present":bool(token)
                  })
              url=f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip"
              rq=urllib.request.Request(url,headers={
                  "accept":"application/vnd.github+json",
                  "authorization":f"Bearer {token}",
                  "x-github-api-version":"2022-11-28",
                  "user-agent":"keibametrics-non-jra-formal-bridge",
              },method="GET")
              class _NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,headers,newurl):
                      return None
              try:
                  opener=urllib.request.build_opener(_NoRedirect)
                  try:
                      with opener.open(rq,timeout=120) as x:
                          raw_zip=x.read()
                  except urllib.error.HTTPError as e:
                      if e.code not in {301,302,303,307,308}:
                          raise
                      location=e.headers.get("Location")
                      if not location:
                          raise
                      blob_req=urllib.request.Request(location,headers={
                          "user-agent":"keibametrics-non-jra-formal-bridge"
                      },method="GET")
                      with urllib.request.urlopen(blob_req,timeout=120) as x:
                          raw_zip=x.read()
              except urllib.error.HTTPError as e:
                  fail_closed("SOURCE_RECEIPT_ARTIFACT_DOWNLOAD_FAILED",{
                      "artifact_id":artifact_id,"http":e.code,
                      "body":e.read().decode(errors="replace")[:2000],
                  })
              except Exception as e:
                  fail_closed("SOURCE_RECEIPT_ARTIFACT_DOWNLOAD_FAILED",{
                      "artifact_id":artifact_id,"error":str(e),
                  })
              try:
                  with zipfile.ZipFile(io.BytesIO(raw_zip)) as zf:
                      names=[n for n in zf.namelist() if n.endswith("source_receipt_envelope.json")]
                      if not names:
                          fail_closed("SOURCE_RECEIPT_ENVELOPE_NOT_FOUND_IN_ARTIFACT",{
                              "artifact_id":artifact_id,"entries":zf.namelist()[:100]
                          })
                      selected=sorted(names,key=lambda n:(n.count("/"),len(n)))[0]
                      provided_source=json.loads(zf.read(selected).decode("utf-8"))
              except AssertionError:
                  raise
              except Exception as e:
                  fail_closed("SOURCE_RECEIPT_ARTIFACT_INVALID",{
                      "artifact_id":artifact_id,"error":str(e)
                  })
              expected_source_sha=str(req.get("source_receipt_sha256") or "").strip()
              actual_source_sha=str(provided_source.get("receipt_sha256") or "").strip()
              if expected_source_sha and actual_source_sha!=expected_source_sha:
                  fail_closed("SOURCE_RECEIPT_ARTIFACT_SHA_MISMATCH",{
                      "artifact_id":artifact_id,
                      "expected":expected_source_sha,
                      "actual":actual_source_sha,
                  })
              persist("source_handoff_reference.json",{
                  "mode":"GITHUB_ACTIONS_ARTIFACT_REFERENCE",
                  "artifact_id":artifact_id,
                  "entry":selected,
                  "receipt_sha256":actual_source_sha,
                  "request_file":os.environ.get("REQUEST_FILE"),
              })
          if isinstance(provided_source,dict):
              source=copy.deepcopy(provided_source)
              persist("source_receipt_envelope.json",source)
              svc,sv=call("/source/verify",source,60)
              persist("source_verification.json",sv)
              if svc>=300 or sv.get("valid") is not True:
                  fail_closed("SOURCE_SIGNATURE_OR_ARTIFACT_VERIFY_FAILED",{"http":svc,"verify":sv})
              rec=source.get("receipt") or {}
              if str(rec.get("race_id") or "")!=rid:
                  fail_closed("SOURCE_RECEIPT_RACE_ID_MISMATCH",{
                      "source_race_id":rec.get("race_id"),"request_race_id":rid
                  })
              source_artifact=source.get("artifact") or {}
              if source_artifact.get("formal_ready") is not True:
                  fail_closed("SOURCE_NOT_FORMAL_READY",source_artifact)
              static_freeze=((req.get("temporal_separation") or {}).get("static_prediction_freeze_at")
                             if isinstance(req.get("temporal_separation"),dict) else None)
              source_freeze=source_artifact.get("source_freeze_at")
              if static_freeze and source_freeze and parse_dt(source_freeze)>parse_dt(static_freeze):
                  fail_closed("PREDICTION_SOURCE_AFTER_STATIC_FREEZE",{
                      "source_freeze_at":source_freeze,
                      "static_prediction_freeze_at":static_freeze,
                      "policy":"SIGNED_PREDICTION_SOURCE_MUST_PRECEDE_STATIC_FREEZE"
                  })
          else:
              source_req=req.get("source_acquisition_request")
              if not isinstance(source_req,dict) and isinstance(req.get("required_source_manifest"),list):
                  source_req={
                    "family_id":"LOCAL",
                    "race_id":rid,
                    "prediction_cutoff":req.get("prediction_cutoff"),
                    "sources":copy.deepcopy(req["required_source_manifest"])
                  }
              if not isinstance(source_req,dict):
                  race_meta=req.get("race") if isinstance(req.get("race"),dict) else {}
                  venue_id=req.get("venue_id") or race_meta.get("venue_id")
                  race_date=req.get("race_date") or race_meta.get("race_date") or race_meta.get("date")
                  race_no=req.get("race_no") or race_meta.get("race_no")
                  cutoff=req.get("prediction_cutoff") or race_meta.get("prediction_cutoff")
                  if venue_id and race_date and race_no and cutoff:
                      mc,manifest=call("/source/manifest/local",{
                        "family_id":"LOCAL","race_id":rid,
                        "venue_id":venue_id,"race_date":race_date,"race_no":race_no,
                        "prediction_cutoff":cutoff,
                        "include_same_day_results":True,
                        "include_odds":True,
                        "require_active_runner_universe":True
                      },60)
                      assert mc<300,(mc,manifest)
                      source_req=manifest
              assert isinstance(source_req,dict),"SOURCE_ACQUISITION_REQUEST_REQUIRED"
              source_req=copy.deepcopy(source_req)
              source_req["family_id"]="LOCAL"
              source_req["race_id"]=rid
              source_req.setdefault("prediction_cutoff",req.get("prediction_cutoff"))
              assert isinstance(source_req.get("sources"),list) and source_req["sources"],"REQUIRED_SOURCE_MANIFEST_REQUIRED"
              sc,source=call("/source/acquire",source_req,180)
              persist("source_receipt_envelope.json",source)
              if sc>=300 or (source.get("receipt") or {}).get("status")!="SOURCE_FROZEN":
                  fail_closed("SOURCE_ACQUISITION_NOT_FROZEN",{"http":sc,"source":source})
              svc,sv=call("/source/verify",source,60)
              persist("source_verification.json",sv)
              if svc>=300 or sv.get("valid") is not True:
                  fail_closed("SOURCE_SIGNATURE_OR_ARTIFACT_VERIFY_FAILED",{"http":svc,"verify":sv})
              source_artifact=source.get("artifact") or {}
              if source_artifact.get("formal_ready") is not True:
                  fail_closed("SOURCE_NOT_FORMAL_READY",source_artifact)

          source_receipt_sha=source.get("receipt_sha256")
          source_artifact=source.get("artifact") or {}

          # Official start time is authoritative for temporal identity.
          ev=source_artifact.get("normalized_evidence") or {}
          official_start=((ev.get("start_time") or {}).get("value") if isinstance(ev.get("start_time"),dict) else None)
          race_meta=req.get("race") if isinstance(req.get("race"),dict) else {}
          if temporal_mode=="FORMAL-PRE-RACE":
              official_going=((ev.get("track_condition") or {}).get("value") if isinstance(ev.get("track_condition"),dict) else None)
              request_going=race_meta.get("going") or ((req.get("environment") or {}).get("going") if isinstance(req.get("environment"),dict) else None)
              going_map={
                  "good":"良","firm":"良","良":"良",
                  "muddy":"稍重","slightly_heavy":"稍重","稍重":"稍重",
                  "heavy":"重","重":"重",
                  "sloppy":"不良","very_heavy":"不良","不良":"不良",
              }
              og=going_map.get(str(official_going).strip().lower(),str(official_going).strip()) if official_going else None
              rg=going_map.get(str(request_going).strip().lower(),str(request_going).strip()) if request_going else None
              persist("official_current_state_preflight.json",{
                  "official_track_condition":official_going,
                  "normalized_official_track_condition":og,
                  "request_track_condition":request_going,
                  "normalized_request_track_condition":rg,
                  "source_receipt_sha256":source_receipt_sha,
              })
              if og and rg and og!=rg:
                  fail_closed("OFFICIAL_TRACK_CONDITION_MISMATCH_REFORECAST_REQUIRED",{
                      "official_track_condition":official_going,
                      "request_track_condition":request_going,
                      "normalized_official":og,
                      "normalized_request":rg,
                      "source_receipt_sha256":source_receipt_sha,
                  })
          if temporal_mode=="FORMAL-PRE-RACE" and official_start:
              race_date=str(req.get("race_date") or race_meta.get("race_date") or race_meta.get("date") or "")
              if race_date:
                  hh,mm=[int(x) for x in str(official_start).split(":")[:2]]
                  local_date=datetime.date.fromisoformat(race_date.replace("/","-"))
                  official_post_local=datetime.datetime.combine(local_date,datetime.time(hh,mm),tzinfo=ZoneInfo("Asia/Tokyo"))
                  request_post=parse_dt(scheduled).astimezone(ZoneInfo("Asia/Tokyo"))
                  delta=abs((official_post_local-request_post).total_seconds())
                  persist("race_identity_preflight.json",{
                      "official_start_time":official_start,
                      "official_post_at":official_post_local.isoformat(),
                      "request_scheduled_post_at":request_post.isoformat(),
                      "delta_seconds":delta,
                  })
                  if delta>30:
                      fail_closed("OFFICIAL_POST_TIME_MISMATCH",{
                          "official_post_at":official_post_local.isoformat(),
                          "request_scheduled_post_at":request_post.isoformat(),
                          "delta_seconds":delta,
                      })
                  official_deadline=official_post_local.astimezone(datetime.timezone.utc)-datetime.timedelta(seconds=int(req.get("release_buffer_seconds") or 120))
                  now=datetime.datetime.now(datetime.timezone.utc)
                  if now>=official_deadline:
                      fail_closed("DEADLINE_INSUFFICIENT_AFTER_OFFICIAL_SOURCE",{
                          "now":now.isoformat(),
                          "official_release_deadline":official_deadline.isoformat(),
                      })
          req["source_receipt"]=source
          req["source_snapshot_sha256"]=source_artifact.get("source_snapshot_sha256")
          assert req["source_snapshot_sha256"],"SOURCE_SNAPSHOT_SHA_REQUIRED"

          runners=req.get("runners")
          assert isinstance(runners,list) and len(runners)>=2,"FULL_RUNNER_UNIVERSE_REQUIRED"
          ids=[str(x.get("runner_id")) for x in runners]
          assert len(ids)==len(set(ids)),"RUNNER_UNIVERSE_DUPLICATE_ID"

          official_universe=source_artifact.get("official_runner_universe")
          if source_artifact.get("source_manifest_profile")=="KM-LOCAL-NAR-SOURCE-MANIFEST-v1.0-20260923":
              assert isinstance(official_universe,dict),"OFFICIAL_RUNNER_UNIVERSE_REQUIRED"
              off_rows=official_universe.get("runners")
              assert isinstance(off_rows,list) and off_rows,"OFFICIAL_RUNNER_UNIVERSE_EMPTY"
              import unicodedata,re
              norm=lambda s:re.sub(r"\\s+","",unicodedata.normalize("NFKC",str(s or ""))).strip()
              off={str(x.get("runner_id") or x.get("horse_no")):norm(x.get("name")) for x in off_rows}
              got={str(x.get("runner_id")):norm(x.get("name")) for x in runners}
              universe_diag={
                  "declared_runner_universe":source_artifact.get("declared_runner_universe"),
                  "active_runner_universe":source_artifact.get("active_runner_universe"),
                  "runner_status_registry":source_artifact.get("runner_status_registry"),
                  "request_runners":runners,
                  "official_active_ids":sorted(off),
                  "request_ids":sorted(got),
              }
              persist("runner_universe_diagnostic.json",universe_diag)
              if set(off)!=set(got):
                  fail_closed("RUNNER_UNIVERSE_ID_MISMATCH",universe_diag)
              bad={rr:(got[rr],off[rr]) for rr in off if got[rr]!=off[rr]}
              if bad:
                  fail_closed("RUNNER_UNIVERSE_NAME_MISMATCH",{"bad":bad,**universe_diag})
          assert isinstance(req.get("static_prediction"),dict),"STATIC_PREDICTION_REQUIRED"
          assert req.get("static_prediction_frozen") is True,"STATIC_PREDICTION_FREEZE_REQUIRED"

          temporal_mode=str(req.get("temporal_mode") or "FORMAL-PRE-RACE").upper()
          scheduled=req.get("scheduled_post_at")
          if temporal_mode=="FORMAL-PRE-RACE":
              assert scheduled,"SCHEDULED_POST_AT_REQUIRED"
              assert datetime.datetime.now(datetime.timezone.utc) < parse_dt(scheduled).astimezone(datetime.timezone.utc),"POST_START_BEFORE_EXECUTION"

          stage_manifest=[]
          def stage(name,**kw):
              stage_manifest.append({"stage":name,"timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat(),**kw})

          stage("SOURCE_FREEZE",
                source_receipt_sha256=source_receipt_sha,
                source_snapshot_sha256=req["source_snapshot_sha256"],
                required_source_manifest_sha256=source_artifact.get("required_source_manifest_sha256"),
                raw_source_bundle_sha256=source_artifact.get("raw_source_bundle_sha256"),
                normalized_evidence_sha256=source_artifact.get("normalized_evidence_sha256"),
                official_runner_universe_sha256=source_artifact.get("official_runner_universe_sha256"),
                official_runner_count=((official_universe or {}).get("runner_count") if isinstance(official_universe,dict) else None),
                source_freeze_at=source_artifact.get("source_freeze_at"))
          stage("RUNNER_UNIVERSE",runner_count=len(runners))

          # Always-on LOCAL numerical candidate DUAL SHADOW.
          # v0.1 is the frozen uncalibrated baseline. v0.2 is the same-day calibrated
          # non-OOS arm. Both are computed from the same Signed SOURCE before result.
          candidate_shadow_q=None
          candidate_shadow_q_v02=None
          candidate_shadow_q_v03=None
          candidate_shadow_summary=None
          candidate_v03_summary=None
          try:
              ce=compile_candidate_evidence(source_artifact,req)

              cq=materialize_candidate(copy.deepcopy(ce))
              cq=build_candidate_prediction(cq)
              cq=build_candidate_krs(cq)
              ca=assess_candidate_numerical()
              candidate_shadow_q=cq

              def compact_candidate_arm(label,q):
                  return {
                      "label":label,
                      "production_authority":False,
                      "source_receipt_sha256":source_receipt_sha,
                      "source_snapshot_sha256":source_artifact.get("source_snapshot_sha256"),
                      "candidate_current_state":q.get("candidate_current_state"),
                      "candidate_environment":q.get("candidate_environment"),
                      "candidate_full_numerical_summary":q.get("candidate_full_numerical_summary"),
                      "candidate_static_prediction":q.get("candidate_static_prediction"),
                      "candidate_krs_input_sha256":q.get("candidate_krs_input_sha256"),
                      "runner_indices":{
                          str(r.get("runner_id")):{k:v.get("value") for k,v in (r.get("canonical_components") or {}).items()}
                          for r in (q.get("runners") or [])
                      },
                      "runner_component_coverage":{
                          str(r.get("runner_id")):{
                              "real_component_coverage_ratio":r.get("candidate_feature_coverage_ratio"),
                              "missing_component_count":r.get("candidate_missing_count"),
                              "missing_components":r.get("candidate_missing_components"),
                          } for r in (q.get("runners") or [])
                      },
                  }

              v01_summary=compact_candidate_arm("v0.1-BASELINE",cq)
              persist("candidate_numerical_shadow_summary.json",{
                  "status":"FROZEN_PRE_RESULT_NUMERICAL_CANDIDATE_SHADOW",
                  "candidate_authority":ca,
                  **v01_summary,
              })
              persist("candidate_krs_input_preresult.json",cq.get("candidate_krs_input_data"))

              v02_summary=None
              v02_failure=None
              try:
                  cq2=materialize_candidate(
                      copy.deepcopy(ce),
                      "mapping/local_evidence_feature_rule_registry_v0.2_candidate_20260923_urw_day_calibrated.json",
                      "mapping/local_full_numerical_mapping_v0.2_candidate_20260923_urw_day_calibrated.json"
                  )
                  cq2=build_candidate_prediction(cq2)
                  cq2=build_candidate_krs(cq2)
                  candidate_shadow_q_v02=cq2
                  v02_summary=compact_candidate_arm("v0.2-URW-DAY-CALIBRATED",cq2)
                  persist("candidate_krs_input_preresult_v02.json",cq2.get("candidate_krs_input_data"))
              except Exception as ve:
                  v02_failure={"status":"V02_SHADOW_FAIL_NON_BLOCKING","error_type":type(ve).__name__,"error":str(ve)}

              v01_rank=(cq.get("candidate_static_prediction") or {}).get("ranking") or []
              v02_rank=((candidate_shadow_q_v02 or {}).get("candidate_static_prediction") or {}).get("ranking") or []
              rank_changed_count=None
              if v02_rank and len(v01_rank)==len(v02_rank):
                  pos1={str(x):i for i,x in enumerate(v01_rank)}
                  pos2={str(x):i for i,x in enumerate(v02_rank)}
                  if set(pos1)==set(pos2):
                      rank_changed_count=sum(pos1[k]!=pos2[k] for k in pos1)

              candidate_shadow_summary={
                  "status":"FROZEN_PRE_RESULT_NUMERICAL_CANDIDATE_DUAL_SHADOW",
                  "production_authority":False,
                  "source_receipt_sha256":source_receipt_sha,
                  "source_snapshot_sha256":source_artifact.get("source_snapshot_sha256"),
                  "candidate_authority":ca,
                  "arms":{"v0.1":v01_summary,"v0.2":v02_summary},
                  "v0.2_failure":v02_failure,
                  "comparison":{
                      "v0.1_ranking":v01_rank,
                      "v0.2_ranking":v02_rank,
                      "rank_changed_runner_count":rank_changed_count,
                      "same_source":True,
                      "same_runner_universe":True,
                      "same_result_information":"NONE_PRE_RESULT",
                  },
                  "policy":{
                      "production_mutation":False,
                      "v0.2_status":"RETROSPECTIVE_CALIBRATED_NON_OOS",
                      "future_measurement":"PRE_RESULT_DUAL_SHADOW",
                      "automatic_promotion":False,
                  }
              }
              candidate_shadow_summary["sha256"]=sha_obj(candidate_shadow_summary)
              persist("candidate_numerical_dual_shadow_summary.json",candidate_shadow_summary)
              stage("NUMERICAL_CANDIDATE_DUAL_SHADOW",
                    status="PASS",production_authority=False,
                    v01_calculated_count=(cq.get("candidate_full_numerical_summary") or {}).get("calculated_count"),
                    v02_calculated_count=((candidate_shadow_q_v02 or {}).get("candidate_full_numerical_summary") or {}).get("calculated_count"),
                    v01_prediction_sha256=(cq.get("candidate_static_prediction") or {}).get("sha256"),
                    v02_prediction_sha256=((candidate_shadow_q_v02 or {}).get("candidate_static_prediction") or {}).get("sha256"),
                    rank_changed_runner_count=rank_changed_count)
          except Exception as e:
              candidate_shadow_summary={
                  "status":"DUAL_SHADOW_FAIL",
                  "production_authority":False,
                  "error_type":type(e).__name__,
                  "error":str(e),
                  "source_receipt_sha256":source_receipt_sha,
                  "source_snapshot_sha256":source_artifact.get("source_snapshot_sha256"),
              }
              persist("candidate_numerical_shadow_failure.json",candidate_shadow_summary)
              stage("NUMERICAL_CANDIDATE_DUAL_SHADOW",status="FAIL_NON_BLOCKING",production_authority=False,error=str(e))

          # v0.3 Evidence-Routing / Evidence-Window candidate is an independent,
          # non-Production Shadow designed on 2026-09-25. Historical races before
          # that date may be diagnostic replays only and can never enter v0.3 OOS.
          try:
              ce3=compile_candidate_evidence_v03(
                  source_artifact,req,
                  "mapping/local_evidence_feature_rule_registry_v0.3_candidate_20260925_evidence_routing.json"
              )
              cq3=materialize_candidate(
                  copy.deepcopy(ce3),
                  "mapping/local_evidence_feature_rule_registry_v0.3_candidate_20260925_evidence_routing.json",
                  "mapping/local_full_numerical_mapping_v0.3_candidate_20260925_evidence_routing.json"
              )
              cq3=build_candidate_prediction(cq3)
              cq3=build_candidate_krs(cq3)
              candidate_shadow_q_v03=cq3
              race_date_v03=str(req.get("race_date") or (req.get("race") or {}).get("race_date") or "")
              v03_arm={
                  "label":"v0.3-EVIDENCE-ROUTING",
                  "production_authority":False,
                  "source_receipt_sha256":source_receipt_sha,
                  "source_snapshot_sha256":source_artifact.get("source_snapshot_sha256"),
                  "candidate_current_state":cq3.get("candidate_current_state"),
                  "candidate_environment":cq3.get("candidate_environment"),
                  "candidate_full_numerical_summary":cq3.get("candidate_full_numerical_summary"),
                  "candidate_static_prediction":cq3.get("candidate_static_prediction"),
                  "candidate_krs_input_sha256":cq3.get("candidate_krs_input_sha256"),
                  "candidate_evidence_compiler":cq3.get("candidate_evidence_compiler"),
                  "candidate_v03_policy":cq3.get("candidate_v03_policy"),
                  "runner_indices":{
                      str(r.get("runner_id")):{k:v.get("value") for k,v in (r.get("canonical_components") or {}).items()}
                      for r in (cq3.get("runners") or [])
                  },
                  "runner_component_coverage":{
                      str(r.get("runner_id")):{
                          "real_component_coverage_ratio":r.get("candidate_feature_coverage_ratio"),
                          "missing_component_count":r.get("candidate_missing_count"),
                          "missing_components":r.get("candidate_missing_components"),
                          "missing_policy":r.get("candidate_missing_policy"),
                      } for r in (cq3.get("runners") or [])
                  },
                  "runner_context_sha256":{
                      str(r.get("runner_id")):sha_obj(r.get("candidate_context_features_v03") or {})
                      for r in (cq3.get("runners") or [])
                  },
              }
              candidate_v03_summary={
                  "status":"FROZEN_PRE_RESULT_NUMERICAL_CANDIDATE_V03_SHADOW",
                  "profile":"KM-LOCAL-NUMERICAL-EVIDENCE-ROUTING-v0.3-CANDIDATE-20260925",
                  "production_authority":False,
                  "design_freeze_date":"2026-09-25",
                  "race_id":rid,
                  "race_date":race_date_v03,
                  "retrospective_replay":bool(race_date_v03 and race_date_v03<"2026-09-25"),
                  "source_receipt_sha256":source_receipt_sha,
                  "source_snapshot_sha256":source_artifact.get("source_snapshot_sha256"),
                  "arm":v03_arm,
                  "baseline_v01_prediction_sha256":((candidate_shadow_q or {}).get("candidate_static_prediction") or {}).get("sha256"),
                  "policy":{
                      "production_mutation":False,
                      "weight_change_from_v01":False,
                      "evidence_routing_change":True,
                      "unknown_policy":"OBSERVED_ONLY_RENORMALIZE",
                      "sbo_ability_index_weight":0,
                      "future_oos_tracker":"KM-LOCAL-NUMERICAL-V03-FORWARD-OOS-TRACKER-v1.0-20260925",
                      "automatic_promotion":False,
                  },
              }
              candidate_v03_summary["sha256"]=sha_obj(candidate_v03_summary)
              persist("candidate_numerical_v03_shadow_summary.json",candidate_v03_summary)
              persist("candidate_krs_input_preresult_v03.json",cq3.get("candidate_krs_input_data"))
              stage("NUMERICAL_CANDIDATE_V03_SHADOW",
                    status="PASS",production_authority=False,
                    shadow_sha256=candidate_v03_summary.get("sha256"),
                    calculated_count=(cq3.get("candidate_full_numerical_summary") or {}).get("calculated_count"),
                    prediction_sha256=(cq3.get("candidate_static_prediction") or {}).get("sha256"),
                    missing_policy=(cq3.get("candidate_full_numerical_summary") or {}).get("missing_policy"),
                    future_oos_eligible_design=not candidate_v03_summary.get("retrospective_replay"))
          except Exception as e:
              candidate_shadow_q_v03=None
              candidate_v03_summary={
                  "status":"V03_SHADOW_FAIL_NON_BLOCKING",
                  "profile":"KM-LOCAL-NUMERICAL-EVIDENCE-ROUTING-v0.3-CANDIDATE-20260925",
                  "production_authority":False,
                  "error_type":type(e).__name__,
                  "error":str(e),
                  "source_receipt_sha256":source_receipt_sha,
                  "source_snapshot_sha256":source_artifact.get("source_snapshot_sha256"),
                  "automatic_promotion":False,
              }
              persist("candidate_numerical_v03_shadow_failure.json",candidate_v03_summary)
              stage("NUMERICAL_CANDIDATE_V03_SHADOW",status="FAIL_NON_BLOCKING",production_authority=False,error=str(e))

          numerical_authority=assess_numerical_authority()
          persist("numerical_authority_preflight.json",numerical_authority)
          req["numerical_authority_preflight"]=numerical_authority
          if req.get("require_full_numerical_authority") is True and numerical_authority.get("full_numerical_authority") is not True:
              fail_closed("FULL_NUMERICAL_AUTHORITY_NOT_READY",numerical_authority)

          req_indices=req.get("required_indices") or req.get("required_index_names")
          assert isinstance(req_indices,list) and req_indices,"LOCAL_REQUIRED_INDICES_REQUIRED"
          if req_indices and isinstance(req_indices[0],dict):
              req_indices=[str(x.get("index") or x.get("index_name") or x.get("name") or "") for x in req_indices]
          req_indices=[str(x) for x in req_indices if str(x)]
          assert req_indices,"LOCAL_REQUIRED_INDEX_NAMES_EMPTY"

          req=materialize_request(req,req_indices)
          cov=req["numeric_coverage"]
          persist("numerical_materialization_summary.json",{
              "numeric_coverage":cov,
              "full_terminalization":req.get("full_terminalization"),
              "full_numerical_calculation":req.get("full_numerical_calculation"),
              "mapping_registry":req.get("local_mapping_registry"),
              "numerical_authority_preflight":numerical_authority,
          })
          if req.get("full_terminalization") is not True or int(cov.get("unresolved_count",0))!=0:
              fail_closed("LOCAL_INDEX_TERMINALIZATION_INCOMPLETE",cov)
          if req.get("full_numerical_calculation") is True and numerical_authority.get("full_numerical_authority") is not True and req.get("numerical_authority_test_override") is not True:
              fail_closed("UNAUTHORIZED_FULL_NUMERICAL_CLAIM",{
                  "numerical_authority":numerical_authority,
                  "numeric_coverage":cov,
              })
          stage("NUMERICAL_MATERIALIZATION",
                required_count=cov["required_count"],calculated_count=cov["calculated_count"],
                ruled_neutral_count=cov.get("ruled_neutral_count",0),ruled_hold_count=cov.get("ruled_hold_count",0),
                not_applicable_count=cov.get("not_applicable_count",0),unresolved_count=cov["unresolved_count"],
                full_numerical_calculation=bool(req.get("full_numerical_calculation")),
                full_terminalization=bool(req.get("full_terminalization")),
                mapping_registry=req.get("local_mapping_registry"))

          req=build_local_provenance(req)
          assert req.get("index_provenance_hash"),"LOCAL_INDEX_PROVENANCE_HASH_MISSING"
          stage("INDEX_PROVENANCE",index_provenance_hash=req["index_provenance_hash"],
                row_count=len((req.get("index_provenance_ledger") or {}).get("rows") or []))

          req=build_local_krs(req)
          assert isinstance(req.get("krs_input_data"),dict),"LOCAL_KRS_INPUT_MISSING"
          stage("STATIC_FREEZE",static_prediction_sha256=sha_obj(req["static_prediction"]))
          stage("LOCAL_KRS_INPUT",local_krs_input_sha256=req.get("local_krs_input_sha256"),
                bridge_id=req.get("local_krs_bridge_id"))

          pre_payload={
            "family_id":"LOCAL","race_id":rid,
            "source_receipt":source,
            "required_index_unresolved":0,
            "full_terminalization":bool(req.get("full_terminalization")),
            "full_numerical_calculation":bool(req.get("full_numerical_calculation")),
            "krs_input_mode":req.get("krs_input_mode"),
            "static_prediction_frozen":True,
            "krs_input_data":req["krs_input_data"]
          }
          deadline_guard("BEFORE_PRE_KRS")
          pc,pre=call("/pre-krs",pre_payload,120)
          persist("pre_krs_receipt_envelope.json",pre)
          if pc>=300 or (pre.get("receipt") or {}).get("status")!="PASS":
              fail_closed("PRE_KRS_NOT_PASS",{"http":pc,"pre_krs":pre})
          pre_sha=verify_envelope(pre,"PRE_KRS")
          stage("PRE_KRS",receipt_sha256=pre_sha)

          run_count=int(req.get("run_count") or 5000)
          seed=int(req.get("seed") or 1)
          kc,run=call("/krs/execute",{
            "family_id":"LOCAL","race_id":rid,
            "krs_input_data":req["krs_input_data"],
            "run_count":run_count,"seed":seed
          },600)
          persist("krs_receipt_envelope.json",run)
          if kc>=300 or (run.get("receipt") or {}).get("status")!="EXECUTED":
              fail_closed("KRS_NOT_EXECUTED",{"http":kc,"krs":run})
          if int((run.get("artifact") or {}).get("actual_run_count",0))<run_count:
              fail_closed("KRS_ACTUAL_RUN_COUNT_SHORT",{
                  "requested":run_count,
                  "actual":(run.get("artifact") or {}).get("actual_run_count")
              })
          run_sha=verify_envelope(run,"KRS_RUN")
          stage("KRS",receipt_sha256=run_sha,requested_run_count=run_count,
                actual_run_count=(run.get("artifact") or {}).get("actual_run_count"),
                input_sha256=(run.get("artifact") or {}).get("input_sha256"),
                output_sha256=(run.get("artifact") or {}).get("output_sha256"))

          utility=build_krs_prediction_utility(req,{
            "status":"EXECUTED",
            "output":copy.deepcopy((run.get("artifact") or {}).get("raw_output") or {})
          })
          persist("krs_prediction_utility.json",utility)
          stage("KRS_UTILITY",utility_class=utility.get("utility_class"),utility_sha256=utility.get("sha256"),
                production_effect="NONE")

          deadline_guard("AFTER_KRS")
          mec=build_mec_plan(req,utility,strict_head_closure=True,min_stake=100)
          mec_check=validate_mec_plan(mec)
          persist("mec_plan.json",mec)
          persist("mec_verification.json",mec_check)
          if mec_check["mec_verified"] is not True or mec["profile"]!=MEC_PROFILE:
              fail_closed("MEC_VERIFY_FAILED",{"mec":mec,"check":mec_check})
          stage("MEC",mec_sha256=mec["sha256"],ticket_count=mec["ticket_count"],
                minimum_required_capital=mec["minimum_required_capital"],
                material_coverage_ratio=mec["material_coverage_ratio"],
                precompression_semantic_universe=mec.get("precompression_semantic_universe"))

          capital=resolve_capital_policy(req,mec)
          persist("capital_decision.json",capital)
          stage("CAPITAL",capital_decision_sha256=capital["sha256"],mode=capital["mode"],
                compatibility=capital["compatibility"],decision=capital["decision"],
                required_capital=capital["required_capital"],capital_limit=capital["capital_limit"])

          no_bet=bool(capital["no_bet"])
          tickets=[] if no_bet else copy.deepcopy(mec["tickets"])
          total=0 if no_bet else int(mec["minimum_required_capital"])
          final_freeze=datetime.datetime.now(datetime.timezone.utc).isoformat()
          if temporal_mode=="FORMAL-PRE-RACE":
              assert datetime.datetime.now(datetime.timezone.utc) < parse_dt(scheduled).astimezone(datetime.timezone.utc),"POST_START_BEFORE_FINAL"
          stage("FINAL_TICKET_FREEZE",final_freeze_timestamp=final_freeze,ticket_count=len(tickets),total_investment=total)

          final_package=copy.deepcopy(req.get("final_prediction_package") or {})
          assert final_package,"FINAL_PREDICTION_PACKAGE_REQUIRED"
          final_package.update({
            "source_snapshot_sha256":req["source_snapshot_sha256"],
            "local_mapping_registry":req.get("local_mapping_registry"),
            "index_provenance_hash":req.get("index_provenance_hash"),
            "local_krs_bridge_id":req.get("local_krs_bridge_id"),
            "local_krs_input_sha256":req.get("local_krs_input_sha256"),
            "actual_numerical_calculation":copy.deepcopy(cov),
            "krs_prediction_utility_shadow":copy.deepcopy(utility),
            "minimum_efficient_coverage":copy.deepcopy(mec),
            "capital_policy_decision":copy.deepcopy(capital)
          })

          trace={
            "fpp_sha256":sha_obj(final_package),
            "mec_sha256":mec["sha256"],
            "candidate_count":int(mec["ticket_count"]),
            "selected_count":len(tickets),
            "capital_decision_sha256":capital["sha256"],
            "no_bet":no_bet,
            "candidate_source":"MEC_R3_PRECOMPRESSION_MATERIAL_COVERAGE",
            "selection_source":"CAPITAL_COMPATIBILITY_POLICY",
            "bet_type_dispositions":copy.deepcopy(mec.get("bet_type_dispositions") or [])
          }

          if isinstance(candidate_v03_summary,dict) and candidate_v03_summary.get("status")=="FROZEN_PRE_RESULT_NUMERICAL_CANDIDATE_V03_SHADOW":
              trace["numerical_candidate_v03_shadow"]={
                  "profile":candidate_v03_summary.get("profile"),
                  "shadow_sha256":candidate_v03_summary.get("sha256"),
                  "source_snapshot_sha256":candidate_v03_summary.get("source_snapshot_sha256"),
                  "prediction_sha256":((candidate_v03_summary.get("arm") or {}).get("candidate_static_prediction") or {}).get("sha256"),
                  "mapping_id":((candidate_v03_summary.get("arm") or {}).get("candidate_full_numerical_summary") or {}).get("mapping_id"),
                  "design_freeze_date":candidate_v03_summary.get("design_freeze_date"),
                  "production_effect":"NONE",
                  "frozen_pre_result":True,
              }
              stage("NUMERICAL_CANDIDATE_V03_FINAL_BIND",
                    shadow_sha256=candidate_v03_summary.get("sha256"),
                    production_effect="NONE")

          # Forward MEC measurements are frozen BEFORE the signed FINAL and their
          # digests are embedded in the signed FINAL transport trace. They have
          # zero Production ticket/capital authority and must never delay FINAL.
          mec_r4_shadow=None
          mec_r4_basis=None
          mec_r4_shadow_error=None
          local_mec_r5_shadow=None
          local_mec_r5_shadow_error=None
          common_mec_shadow_basis=None
          shadow_ticket=None
          if temporal_mode=="FORMAL-PRE-RACE":
              shadow_ticket={
                  "finalized":True,
                  "no_bet":no_bet,
                  "total_investment":total,
                  "tickets":copy.deepcopy(tickets),
                  "frozen_at":final_freeze
              }
              common_mec_shadow_basis=build_mec_shadow_basis(req,shadow_ticket,mec,final_package)
              try:
                  mec_r4_shadow,mec_r4_basis=build_pre_result_shadow(
                      req,shadow_ticket,mec,final_package,
                      generated_at=datetime.datetime.now(datetime.timezone.utc).isoformat()
                  )
                  trace=bind_shadow_to_trace(trace,mec_r4_shadow,mec_r4_basis)
                  persist("mec_r4_shadow_pre_result.json",mec_r4_shadow)
                  persist("mec_r4_shadow_basis.json",mec_r4_basis)
                  stage("MEC_R4_SHADOW_PRE_RESULT_FREEZE",
                        profile=mec_r4_shadow.get("profile"),
                        candidate_id=mec_r4_shadow.get("candidate_id"),
                        shadow_sha256=mec_r4_shadow.get("sha256"),
                        basis_sha256=mec_r4_basis.get("sha256"),
                        production_effect="NONE")
              except Exception as e:
                  mec_r4_shadow_error=type(e).__name__+":"+str(e)
                  persist("mec_r4_shadow_error.json",{
                      "status":"NON_BLOCKING_SHADOW_FAILURE",
                      "error":mec_r4_shadow_error,
                      "production_effect":"NONE",
                      "timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat()
                  })

              try:
                  local_mec_r5_shadow=build_local_mec_r5_shadow(
                      req,
                      {"artifact":{
                          "final_ticket":shadow_ticket,
                          "minimum_efficient_coverage":copy.deepcopy(mec),
                          "final_prediction_package":copy.deepcopy(final_package),
                      }},
                      generated_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      basis_sha256=common_mec_shadow_basis["sha256"],
                  )
                  trace=bind_local_mec_r5_shadow_to_trace(
                      trace,local_mec_r5_shadow,common_mec_shadow_basis["sha256"]
                  )
                  persist("local_mec_r5_shadow_pre_result.json",local_mec_r5_shadow)
                  stage("LOCAL_MEC_R5_SHADOW_PRE_RESULT_FREEZE",
                        profile=local_mec_r5_shadow.get("profile"),
                        candidate_id=local_mec_r5_shadow.get("candidate_id"),
                        shadow_sha256=local_mec_r5_shadow.get("sha256"),
                        basis_sha256=common_mec_shadow_basis.get("sha256"),
                        production_effect="NONE")
              except Exception as e:
                  local_mec_r5_shadow_error=type(e).__name__+":"+str(e)
                  persist("local_mec_r5_shadow_error.json",{
                      "status":"NON_BLOCKING_SHADOW_FAILURE",
                      "error":local_mec_r5_shadow_error,
                      "production_effect":"NONE",
                      "timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat()
                  })

          final_payload={
            "family_id":"LOCAL","race_id":rid,
            "source_receipt":source,
            "krs_run_receipt":run,
            "final_prediction_package":final_package,
            "final_ticket":{
              "finalized":True,
              "no_bet":no_bet,
              "total_investment":total,
              "tickets":tickets,
              "frozen_at":final_freeze
            },
            "minimum_efficient_coverage":mec,
            "capital_policy_decision":capital,
            "ticket_transport_trace":trace,
            "execution_stage_manifest":stage_manifest,
            "final_freeze_timestamp":final_freeze
          }
          deadline_guard("BEFORE_FINAL")
          fc,fin=call("/final",final_payload,180)
          persist("final_receipt_envelope.json",fin)
          if fc>=300 or (fin.get("receipt") or {}).get("status")!="PASS":
              fail_closed("FINAL_NOT_PASS",{"http":fc,"final":fin})
          final_sha=verify_envelope(fin,"FINAL")
          deadline_guard("AFTER_FINAL")

          mec_r4_binding=None
          if mec_r4_shadow is not None:
              try:
                  mec_r4_binding=verify_signed_final_binding(fin,mec_r4_shadow)
                  persist("mec_r4_shadow_binding_attestation.json",mec_r4_binding)
              except Exception as e:
                  mec_r4_shadow_error=type(e).__name__+":"+str(e)
                  persist("mec_r4_shadow_binding_error.json",{
                      "status":"INVALID_FOR_OOS_NON_BLOCKING",
                      "error":mec_r4_shadow_error,
                      "production_effect":"NONE",
                      "final_receipt_sha256":final_sha
                  })

          local_mec_r5_binding=None
          if local_mec_r5_shadow is not None:
              try:
                  local_mec_r5_binding=verify_local_mec_r5_signed_final_binding(fin,local_mec_r5_shadow)
                  persist("local_mec_r5_shadow_binding_attestation.json",local_mec_r5_binding)
              except Exception as e:
                  local_mec_r5_shadow_error=type(e).__name__+":"+str(e)
                  persist("local_mec_r5_shadow_binding_error.json",{
                      "status":"INVALID_FOR_OOS_NON_BLOCKING",
                      "error":local_mec_r5_shadow_error,
                      "production_effect":"NONE",
                      "final_receipt_sha256":final_sha
                  })

          # Candidate KRS arms run only after Production FINAL is signed. Both use the
          # same run count and seed for paired comparison. Deadline guards are per arm.
          candidate_krs_summary=None
          candidate_krs_v02_summary=None
          candidate_krs_v03_summary=None
          def run_candidate_krs_arm(label,q,legacy=False):
              if q is None:
                  return {"status":"NOT_AVAILABLE","label":label,"production_authority":False,"oos_temporal_eligible":False}
              try:
                  now=datetime.datetime.now(datetime.timezone.utc)
                  scheduled_utc=parse_dt(scheduled).astimezone(datetime.timezone.utc) if scheduled else None
                  slack=(scheduled_utc-now).total_seconds() if scheduled_utc else -1
                  if temporal_mode!="FORMAL-PRE-RACE" or slack<15:
                      return {"status":"SKIPPED_DEADLINE_GUARD","label":label,"slack_seconds":slack,
                              "production_authority":False,"oos_temporal_eligible":False}
                  candidate_rid=rid+"-NUM-CAND-"+label+"-SHADOW"
                  cand_input=copy.deepcopy(q.get("candidate_krs_input_data") or {})
                  if isinstance(cand_input.get("race"),dict):
                      cand_input["race"]["race_id"]=candidate_rid
                  cand_runs=max(5000,min(20000,int(req.get("candidate_shadow_run_count") or 5000)))
                  cand_seed=int(req.get("seed") or 1)+900001
                  cand_input.setdefault("simulation",{})["run_count"]=cand_runs
                  cand_input["simulation"]["master_seed"]=cand_seed
                  cc,crun=call("/krs/execute",{
                      "family_id":"LOCAL","race_id":candidate_rid,
                      "krs_input_data":cand_input,"run_count":cand_runs,"seed":cand_seed
                  },600)
                  persist("candidate_krs_"+label.lower()+"_receipt_envelope.json",crun)
                  if legacy:
                      persist("candidate_krs_receipt_envelope.json",crun)
                  if cc<300 and (crun.get("receipt") or {}).get("status")=="EXECUTED":
                      csha=verify_envelope(crun,"CANDIDATE_KRS_"+label)
                      complete_at=datetime.datetime.now(datetime.timezone.utc)
                      temporal_ok=bool(scheduled_utc and complete_at<scheduled_utc)
                      return {
                          "status":"EXECUTED","label":label,"receipt_sha256":csha,
                          "actual_run_count":(crun.get("artifact") or {}).get("actual_run_count"),
                          "completed_at":complete_at.isoformat(),
                          "pre_post_complete":temporal_ok,
                          "production_authority":False,
                          "oos_temporal_eligible":temporal_ok,
                          "candidate_input_sha256":sha_obj(cand_input),
                          "output_sha256":(crun.get("artifact") or {}).get("output_sha256"),
                          "paired_seed":cand_seed,
                      }
                  return {"status":"FAILED_NON_BLOCKING","label":label,"http":cc,"production_authority":False,"oos_temporal_eligible":False}
              except Exception as e:
                  return {"status":"FAILED_NON_BLOCKING","label":label,"error_type":type(e).__name__,
                          "error":str(e),"production_authority":False,"oos_temporal_eligible":False}

          if candidate_shadow_q is not None:
              candidate_krs_summary=run_candidate_krs_arm("V01",candidate_shadow_q,legacy=True)
              persist("candidate_krs_shadow_summary.json",candidate_krs_summary)
              stage("CANDIDATE_KRS_SHADOW_V01",**candidate_krs_summary)
          if candidate_shadow_q_v02 is not None:
              candidate_krs_v02_summary=run_candidate_krs_arm("V02",candidate_shadow_q_v02,legacy=False)
              persist("candidate_krs_v02_shadow_summary.json",candidate_krs_v02_summary)
              stage("CANDIDATE_KRS_SHADOW_V02",**candidate_krs_v02_summary)
          if candidate_shadow_q_v03 is not None:
              candidate_krs_v03_summary=run_candidate_krs_arm("V03",candidate_shadow_q_v03,legacy=False)
              persist("candidate_krs_v03_shadow_summary.json",candidate_krs_v03_summary)
              stage("CANDIDATE_KRS_SHADOW_V03",**candidate_krs_v03_summary)
          if candidate_shadow_q is not None or candidate_shadow_q_v02 is not None:
              paired_ok=bool(
                  isinstance(candidate_krs_summary,dict) and isinstance(candidate_krs_v02_summary,dict)
                  and candidate_krs_summary.get("status")=="EXECUTED"
                  and candidate_krs_v02_summary.get("status")=="EXECUTED"
                  and candidate_krs_summary.get("actual_run_count")==candidate_krs_v02_summary.get("actual_run_count")
                  and candidate_krs_summary.get("paired_seed")==candidate_krs_v02_summary.get("paired_seed")
              )
              persist("candidate_krs_dual_shadow_summary.json",{
                  "production_authority":False,
                  "v0.1":candidate_krs_summary,
                  "v0.2":candidate_krs_v02_summary,
                  "paired_run_count_seed":paired_ok,
                  "automatic_promotion":False,
              })
          if candidate_shadow_q is not None or candidate_shadow_q_v02 is not None or candidate_shadow_q_v03 is not None:
              triple_paired_ok=bool(
                  isinstance(candidate_krs_summary,dict)
                  and isinstance(candidate_krs_v02_summary,dict)
                  and isinstance(candidate_krs_v03_summary,dict)
                  and candidate_krs_summary.get("status")=="EXECUTED"
                  and candidate_krs_v02_summary.get("status")=="EXECUTED"
                  and candidate_krs_v03_summary.get("status")=="EXECUTED"
                  and len({candidate_krs_summary.get("actual_run_count"),candidate_krs_v02_summary.get("actual_run_count"),candidate_krs_v03_summary.get("actual_run_count")})==1
                  and len({candidate_krs_summary.get("paired_seed"),candidate_krs_v02_summary.get("paired_seed"),candidate_krs_v03_summary.get("paired_seed")})==1
              )
              persist("candidate_krs_triple_shadow_summary.json",{
                  "production_authority":False,
                  "v0.1":candidate_krs_summary,
                  "v0.2":candidate_krs_v02_summary,
                  "v0.3":candidate_krs_v03_summary,
                  "paired_run_count_seed":triple_paired_ok,
                  "automatic_promotion":False,
              })

          # Persist complete signed envelopes for immutable post-race RESULT linkage.
          os.makedirs("runtime_out",exist_ok=True)
          for nm,obj in (("source_receipt_envelope.json",source),("pre_krs_receipt_envelope.json",pre),
                         ("krs_receipt_envelope.json",run),("final_receipt_envelope.json",fin)):
              with open(os.path.join("runtime_out",nm),"w",encoding="utf-8") as wf:
                  json.dump(obj,wf,ensure_ascii=False,sort_keys=True,separators=(",",":"))

          result_summary=None
          post_result=req.get("post_result_after_final")
          if isinstance(post_result,dict):
              order=[int(x) for x in (post_result.get("finish_order") or [])]
              assert len(order)>=3,"POST_RESULT_FINISH_ORDER_REQUIRED"
              top3=order[:3]
              payouts={str(k).upper():int(v) for k,v in (post_result.get("payouts") or {}).items()}
              winning=[]
              total_return=0
              for t in tickets:
                  bt=str(t.get("bet_type") or "").upper()
                  sel=[int(x) for x in (t.get("selection") or [])]
                  hit=False
                  if bt=="EXACTA" and sel==top3[:2]:
                      hit=True
                  elif bt=="TRIO" and set(sel)==set(top3):
                      hit=True
                  elif bt=="TRIFECTA" and sel==top3:
                      hit=True
                  if hit and bt in payouts:
                      stake=int(t.get("stake") or 0)
                      payout100=int(payouts[bt])
                      ticket_return=(stake*payout100)//100
                      total_return+=ticket_return
                      winning.append({"bet_type":bt,"selection":sel,"stake":stake,"payout_per_100":payout100,"return":ticket_return})
              result_payload={
                "family_id":"LOCAL","race_id":rid,
                "final_receipt":fin,
                "official_result":{
                  "finish_order":order,
                  "result_available_at":post_result.get("result_available_at"),
                  "source":post_result.get("source") or "USER_SUPPLIED_RESULT_WITH_OFFICIAL_CROSSCHECK",
                  "payouts":payouts
                },
                "result_available_at":post_result.get("result_available_at"),
                "settlement":{
                  "status":"COMPLETE",
                  "investment":total,
                  "settled_investment":total,
                  "return":total_return,
                  "winning_tickets":winning
                },
                "pfs_authority":post_result.get("pfs_authority") or "RECON"
              }
              rc,rres=call("/result",result_payload,180)
              assert rc<300 and (rres.get("receipt") or {}).get("status")=="PASS",(rc,rres)
              result_sha=verify_envelope(rres,"RESULT")
              result_art=rres.get("artifact") or {}
              candidate_dual_postresult=None
              if isinstance(candidate_shadow_summary,dict) and candidate_shadow_summary.get("status")=="FROZEN_PRE_RESULT_NUMERICAL_CANDIDATE_DUAL_SHADOW":
                  cal_path=pathlib.Path("runtime/calibration/local_weight_calibration_v0.2_20260923_urw_day_summary.json")
                  cal=json.loads(cal_path.read_text(encoding="utf-8")) if cal_path.exists() else {}
                  candidate_dual_postresult=evaluate_dual(
                      candidate_shadow_summary,order,
                      result_available_at=post_result.get("result_available_at"),
                      race_id=rid,
                      dual_krs_summary={"v0.1":candidate_krs_summary,"v0.2":candidate_krs_v02_summary},
                      calibration_training_race_ids=cal.get("training_race_ids") or []
                  )
                  persist("candidate_dual_shadow_postresult.json",candidate_dual_postresult)
              candidate_v03_postresult=None
              if isinstance(candidate_v03_summary,dict) and candidate_v03_summary.get("status")=="FROZEN_PRE_RESULT_NUMERICAL_CANDIDATE_V03_SHADOW":
                  candidate_v03_postresult=evaluate_v03(
                      candidate_v03_summary,order,
                      result_available_at=post_result.get("result_available_at"),
                      race_id=rid,
                      krs_summary=candidate_krs_v03_summary,
                  )
                  persist("candidate_v03_shadow_postresult.json",candidate_v03_postresult)
              result_summary={
                "result_receipt":result_sha,
                "settlement":result_art.get("settlement"),
                "failure_localization":result_art.get("failure_localization"),
                "learning_event":result_art.get("learning_event"),
                "automatic_post_result_review":result_art.get("automatic_post_result_review"),
                "winning_tickets":winning,
                "candidate_dual_shadow_postresult":candidate_dual_postresult,
                "candidate_v03_shadow_postresult":candidate_v03_postresult
              }

          full_numeric=bool(req.get("full_numerical_calculation"))
          if temporal_mode=="FORMAL-PRE-RACE":
              final_status="FULL_FORMAL_E2E_PASS" if full_numeric else "EXECUTION_VERIFIED_NUMERICAL_DEGRADED"
          else:
              final_status="POST_START_REPLAY_E2E_PASS" if full_numeric else "POST_START_REPLAY_E2E_PASS_NUMERICAL_DEGRADED"
          print("KM_NON_JRA_FORMAL_RESULT="+json.dumps({
            "race_id":rid,"family_id":"LOCAL","execution_id":execution_id,"execution_phase":"FORMAL",
            "temporal_mode":temporal_mode,
            "status":final_status,
            "full_numerical_calculation":full_numeric,
            "external_endpoint":endpoint,
            "source_receipt":source_receipt_sha,
            "source_snapshot_sha256":req["source_snapshot_sha256"],
            "pre_krs_receipt":pre_sha,
            "krs_receipt":run_sha,
            "final_receipt":final_sha,
            "actual_run_count":(run.get("artifact") or {}).get("actual_run_count"),
            "numeric_coverage":cov,
            "krs_utility_class":utility.get("utility_class"),
            "mec_profile":mec.get("profile"),
            "mec_sha256":mec.get("sha256"),
            "material_coverage_ratio":mec.get("material_coverage_ratio"),
            "minimum_required_capital":mec.get("minimum_required_capital"),
            "capital_decision":capital.get("decision"),
            "ticket_count":len(tickets),
            "total_investment":total,
            "post_result":result_summary,
            "numerical_candidate_shadow":candidate_shadow_summary,
            "numerical_candidate_v03_shadow":candidate_v03_summary,
            "candidate_krs_shadow":candidate_krs_summary,
            "candidate_krs_v03_shadow":candidate_krs_v03_summary,
            "mec_r4_shadow":{
              "status":("SIGNED_FINAL_BOUND_PRE_RESULT" if mec_r4_binding else ("NOT_ELIGIBLE" if mec_r4_shadow_error else "NOT_GENERATED")),
              "shadow_sha256":(mec_r4_shadow or {}).get("sha256"),
              "binding":mec_r4_binding,
              "error":mec_r4_shadow_error,
              "production_effect":"NONE"
            },
            "local_mec_r5_shadow":{
              "status":("SIGNED_FINAL_BOUND_PRE_RESULT" if local_mec_r5_binding else ("NOT_ELIGIBLE" if local_mec_r5_shadow_error else "NOT_GENERATED")),
              "shadow_sha256":(local_mec_r5_shadow or {}).get("sha256"),
              "binding":local_mec_r5_binding,
              "error":local_mec_r5_shadow_error,
              "production_effect":"NONE"
            },
            "verified":True
          },separators=(",",":"),ensure_ascii=False))
          PY

      - name: Persist signed LOCAL execution envelopes
        if: always() && hashFiles('runtime_out/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.execution_meta.outputs.artifact_name }}
          path: runtime_out/*.json
          if-no-files-found: error
          retention-days: 90

