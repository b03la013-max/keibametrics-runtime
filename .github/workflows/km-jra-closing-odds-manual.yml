name: JRA closing odds research (manual, Owner approval required)
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'First race date (YYYY-MM-DD)'
        required: true
        type: string
      to:
        description: 'Last race date (YYYY-MM-DD)'
        required: true
        type: string
      asof:
        description: 'Research asof date (YYYY-MM-DD)'
        required: true
        type: string
      execute:
        description: 'Perform approved requests; false produces only a local plan'
        type: boolean
        default: false
      owner_approval_ref:
        description: 'Owner approval record for this date range, storage and request budget'
        type: string
        default: ''
      robots_reviewed:
        description: 'Owner has reviewed current robots.txt and allows this use'
        type: boolean
        default: false
      terms_reviewed:
        description: 'Owner has reviewed current JRA terms for this research use'
        type: boolean
        default: false
      max_requests:
        description: 'Total request ceiling (1-500, navigation/robots included)'
        type: string
        default: '300'
permissions:
  contents: read
concurrency:
  group: jra-closing-odds-manual-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATE_FROM: ${{ inputs.from }}
      DATE_TO: ${{ inputs.to }}
      ASOF: ${{ inputs.asof }}
      EXECUTE: ${{ inputs.execute }}
      OWNER_REF: ${{ inputs.owner_approval_ref }}
      ROBOTS_REVIEWED: ${{ inputs.robots_reviewed }}
      TERMS_REVIEWED: ${{ inputs.terms_reviewed }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Plan or explicitly approved collection
        run: |
          args=(--from "$DATE_FROM" --to "$DATE_TO" --asof "$ASOF" --max-requests "$MAX_REQUESTS" --interval 5)
          if [[ "$EXECUTE" == "true" ]]; then
            [[ -n "$OWNER_REF" && "$ROBOTS_REVIEWED" == "true" && "$TERMS_REVIEWED" == "true" ]] || { echo 'Owner approval and preflight attestations required'; exit 1; }
            args+=(--execute --owner-approval-ref "$OWNER_REF" --robots-reviewed --terms-reviewed)
          fi
          python runtime/analysis/closing_odds_collect.py "${args[@]}"
      - name: Preserve unsigned research evidence; no repository write
        if: always() && inputs.execute
        uses: actions/upload-artifact@v4
        with:
          name: closing-odds-research-${{ github.run_id }}
          path: |
            runtime/closing_odds/
            runtime/closing_odds_rejected/
          if-no-files-found: warn
          retention-days: 30
