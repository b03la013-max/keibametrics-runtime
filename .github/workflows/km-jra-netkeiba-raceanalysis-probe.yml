name: JRA Netkeiba Raceanalysis Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-raceanalysis-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,html
          from pathlib import Path
          rid="202609040812"; out={}
          for cid in range(10):
            url=f"https://race.netkeiba.com/race/data_list.html?race_id={rid}&mode=raceanalysis&cid={cid}"
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"ja"})
              with urllib.request.urlopen(req,timeout=20) as r: raw=r.read(4000000)
              dec=raw.decode("euc-jp","ignore")
              title=re.search(r"<title>(.*?)</title>",dec,re.S|re.I)
              txt=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",dec)))
              out[str(cid)]={"title":re.sub(r"\s+"," ",title.group(1)).strip() if title else "",
                 "bytes":len(raw),"text_focus":txt[txt.find("データ分析"):txt.find("データ分析")+900] if "データ分析" in txt else txt[:900]}
            except Exception as e: out[str(cid)]={"error":type(e).__name__+":"+str(e)}
          p=Path("runtime/diagnostics/netkeiba_raceanalysis_probe.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"; git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_raceanalysis_probe.json
          git commit -m "diagnostic: netkeiba raceanalysis probe [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*2)); done
          exit 1
