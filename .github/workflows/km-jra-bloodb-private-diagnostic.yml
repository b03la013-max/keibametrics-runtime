name: JRA BloodB Mac Subscriber Diagnostic Contract
on:
  pull_request:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/km-jra-bloodb-private-diagnostic.yml'
      - 'mapping/jra_base_index_evidence_mapping_v1.0_20260921.json'
      - 'runtime/executions/**'
      - 'runtime/jra_bloodb_browser_bridge.py'
      - 'runtime/jra_bloodb_mac_acceptance.py'
      - 'runtime/jra_bloodb_mac_automation.py'
      - 'runtime/jra_bloodb_mac_collector.py'
      - 'runtime/jra_bloodb_mac_probe.py'
      - 'runtime/jra_evidence_to_base_production.py'
      - 'runtime/jra_formal_intents/**'
      - 'scripts/jra_bloodb_browser_bvi.py'
      - 'tests/test_jra_bloodb_browser_bridge.py'
      - 'tests/test_jra_bloodb_mac_acceptance.py'
      - 'tests/test_jra_bloodb_mac_automation.py'
      - 'tests/test_jra_bloodb_mac_collector.py'
      - 'tests/test_jra_bloodb_mac_probe.py'
      - 'tests/test_jra_bloodb_signed_source_queue_sync.py'
      # ci_paths:end
  push:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/km-jra-bloodb-private-diagnostic.yml'
      - 'mapping/jra_base_index_evidence_mapping_v1.0_20260921.json'
      - 'runtime/executions/**'
      - 'runtime/jra_bloodb_browser_bridge.py'
      - 'runtime/jra_bloodb_mac_acceptance.py'
      - 'runtime/jra_bloodb_mac_automation.py'
      - 'runtime/jra_bloodb_mac_collector.py'
      - 'runtime/jra_bloodb_mac_probe.py'
      - 'runtime/jra_evidence_to_base_production.py'
      - 'runtime/jra_formal_intents/**'
      - 'scripts/jra_bloodb_browser_bvi.py'
      - 'tests/test_jra_bloodb_browser_bridge.py'
      - 'tests/test_jra_bloodb_mac_acceptance.py'
      - 'tests/test_jra_bloodb_mac_automation.py'
      - 'tests/test_jra_bloodb_mac_collector.py'
      - 'tests/test_jra_bloodb_mac_probe.py'
      - 'tests/test_jra_bloodb_signed_source_queue_sync.py'
      # ci_paths:end
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install safe local parser, not a subscriber login
        run: python -m pip install -q beautifulsoup4 cryptography
      - name: Test strict BloodB membership boundary, exact runner facts, no post-cutoff use
        run: |
          python -m unittest discover -s tests -p test_jra_bloodb_mac_collector.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_browser_bridge.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_automation.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_signed_source_queue_sync.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_acceptance.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_probe.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_readiness.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_final_acceptance.py -v
