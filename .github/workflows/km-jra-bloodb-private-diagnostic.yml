name: JRA BloodB Mac Subscriber Diagnostic Contract
on:
  # One-off diagnostic / probe: manual dispatch only (LOCAL A2 port, 2026-11-20).
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install safe local parser, not a subscriber login
        run: python -m pip install -q beautifulsoup4 cryptography
      - name: Test strict BloodB membership boundary, exact runner facts, no post-cutoff use
        run: |
          python -m unittest discover -s tests -p test_jra_bloodb_mac_collector.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_browser_bridge.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_automation.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_signed_source_queue_sync.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_acceptance.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_probe.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_readiness.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_final_acceptance.py -v
