name: JRA BloodB Mac Subscriber Diagnostic Contract
on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/jra_bloodb_mac_collector.py"
      - "runtime/jra_bloodb_mac_automation.py"
      - "scripts/jra_bloodb_signed_source_queue_sync.py"
      - "tests/test_jra_bloodb_mac_collector.py"
      - "tests/test_jra_bloodb_mac_automation.py"
      - "tests/test_jra_bloodb_signed_source_queue_sync.py"
      - ".github/workflows/km-jra-bloodb-private-diagnostic.yml"
  push:
    branches: [main]
    paths:
      - "runtime/jra_bloodb_mac_collector.py"
      - "tests/test_jra_bloodb_mac_collector.py"
      - ".github/workflows/km-jra-bloodb-private-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install safe local parser, not a subscriber login
        run: python -m pip install -q beautifulsoup4 cryptography
      - name: Test strict BloodB membership boundary, exact runner facts, no post-cutoff use
        run: |
          python -m unittest discover -s tests -p test_jra_bloodb_mac_collector.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_mac_automation.py -v
          python -m unittest discover -s tests -p test_jra_bloodb_signed_source_queue_sync.py -v
