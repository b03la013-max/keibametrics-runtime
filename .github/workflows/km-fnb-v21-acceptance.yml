name: Funabashi v2.1 R31 Alignment Acceptance

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "profiles/fnb_venue_canon_20260928_v2.1.json"
      - "governance/KM-FNB-VENUE-CANON-v2.1-20260928-R1.md"
      - "runtime/venue_audits/KM-LOCAL-FNB-20260928-v2.1-CANON-AUDIT-R1.json"
      - "profiles/KM_FAMILY_CURRENT_AUTHORITY_20260928_R32.json"
      - "profiles/venue_chat_routes_20260928_R32.json"
      - "profiles/KM_LOCAL_SUITE_MANIFEST_20260928_R11.json"
      - "profiles/family_runtime_contracts_20260928_R24.json"
      - "profiles/current_execution_gateway.json"
      - "tests/test_fnb_v21_current_authority.py"
      - ".github/workflows/km-fnb-v21-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "profiles/fnb_venue_canon_20260928_v2.1.json"
      - "profiles/KM_FAMILY_CURRENT_AUTHORITY_20260928_R32.json"
      - "profiles/venue_chat_routes_20260928_R32.json"
      - "profiles/current_execution_gateway.json"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Compile authority guard
        run: python -m py_compile runtime/family_authority_guard.py
      - name: Run Funabashi v2.1 acceptance
        run: python -m pytest -q tests/test_fnb_v21_current_authority.py
      - name: Resolve current Family authority
        run: |
          python runtime/family_authority_guard.py             --selftest             --authority-path profiles/KM_FAMILY_CURRENT_AUTHORITY_20260928_R32.json
      - name: Verify no Venue reclaim of Common authority
        run: |
          python - <<'PY'
          import json
          f=json.load(open("profiles/fnb_venue_canon_20260928_v2.1.json",encoding="utf-8"))
          forbidden={"TICKET_CONSTRUCTION","CAPITAL","RECEIPT_VERIFICATION","PFS_MEASUREMENT","SETTLEMENT"}
          owned=set(f["venue_owned_scopes"])
          assert not (forbidden & owned), forbidden & owned
          assert forbidden <= set(f["common_owned_scopes"])
          assert f["predictive_behavior_change"] is False
          assert f["numerical_change"] is False
          assert f["current_week_oos"]["automatic_promotion"] is False
          print("FNB_V21_SCOPE_OWNERSHIP_PASS")
          PY
