name: JRA C4 Evidence Mapping Selftest

on:
  pull_request:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/jra-c4-evidence-mapping-selftest.yml'
      - 'mapping/jra_base_index_evidence_mapping_v0.1_candidate_20260921.json'
      - 'runtime/jra_candidate_fullnumerical_materializer.py'
      - 'runtime/jra_evidence_feature_normalizer_candidate.py'
      - 'runtime/jra_evidence_to_base_candidate.py'
      - 'runtime/jra_index_provenance_builder.py'
      - 'runtime/jra_pedigree_research_intake.py'
      - 'tests/test_jra_candidate_fullnumerical_materializer.py'
      - 'tests/test_jra_evidence_feature_normalizer_candidate.py'
      - 'tests/test_jra_evidence_to_base_candidate.py'
      - 'tests/test_jra_pedigree_research_intake.py'
      # ci_paths:end
  push:
    branches: [main]
    paths:
      # ci_paths:begin (generated by tools/ci_paths.py; do not edit by hand)
      - '.github/workflows/jra-c4-evidence-mapping-selftest.yml'
      - 'mapping/jra_base_index_evidence_mapping_v0.1_candidate_20260921.json'
      - 'runtime/jra_candidate_fullnumerical_materializer.py'
      - 'runtime/jra_evidence_feature_normalizer_candidate.py'
      - 'runtime/jra_evidence_to_base_candidate.py'
      - 'runtime/jra_index_provenance_builder.py'
      - 'runtime/jra_pedigree_research_intake.py'
      - 'tests/test_jra_candidate_fullnumerical_materializer.py'
      - 'tests/test_jra_evidence_feature_normalizer_candidate.py'
      - 'tests/test_jra_evidence_to_base_candidate.py'
      - 'tests/test_jra_pedigree_research_intake.py'
      # ci_paths:end
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests/test_jra_evidence_to_base_candidate.py tests/test_jra_evidence_feature_normalizer_candidate.py tests/test_jra_candidate_fullnumerical_materializer.py tests/test_jra_pedigree_research_intake.py -q
