name: JRA Official Pedigree Backfill (Verified)
on:
  push:
    branches: [main]
    paths:
      - "runtime/pedigree_backfill_cursor.json"
      - "runtime/pedigree_weekend_intake/**"
      - "scripts/jra_weekend_bvi_intake.py"
      - ".github/workflows/km-jra-pedigree-verified-backfill.yml"
      # Re-run one bounded OFFICIAL historical collection after the corpus
      # retention/identity repair lands; never backdate a race prediction.
      - "runtime/jra_pedigree_corpus.py"
      - "runtime/pedigree_targeted_cohorts/**"
      - "runtime/jra_source_runtime/jra_pedigree_targeted_harvest.py"
  schedule:
    # 07:15 / 22:15 JST daily. Each run is limited to three JRA races;
    # single concurrency key serializes collection and prevents load bursts.
    - cron: "15 22,13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Historical JRA race date (blank: current durable cursor)"
        required: false
        type: string
      start_race:
        description: "0-based starting race slot (blank: current cursor)"
        required: false
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: km-jra-pedigree-harvest
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ !contains(github.event.head_commit.message, 'weekend BVI intake activate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install JRA parser dependencies
        run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Determine bounded historical race window
        id: window
        env:
          MANUAL_DATE: ${{ inputs.date }}
          MANUAL_START: ${{ inputs.start_race }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path("runtime/pedigree_backfill_cursor.json").read_text())
          if s["status"]=="COMPLETE" and not os.environ.get("MANUAL_DATE"):
              with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("skip=true\n")
              raise SystemExit(0)
          manual=bool(os.environ.get("MANUAL_DATE"))
          day=os.environ.get("MANUAL_DATE") or s["date"]
          start=int(os.environ.get("MANUAL_START") or s["start_race"])
          from datetime import date
          assert date.fromisoformat(day) < date.today(), "BACKFILL_REQUIRES_HISTORICAL_RACE"
          assert 0<=start<36
          filename=f"runtime/pedigree_corpus/{day.replace('-','')}-results-race{start}-r3.json"
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for k,v in dict(skip="false",date=day,start_race=start,
                              filename=filename,manual=str(manual).lower()).items():
                  out.write(f"{k}={v}\n")
          print("BACKFILL_WINDOW",day,start,"manual=",manual)
          PY
      - name: Confirm public official JRA robots permission
        if: steps.window.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import urllib.request
          from urllib.robotparser import RobotFileParser
          request=urllib.request.Request("https://www.jra.go.jp/robots.txt",
              headers={"User-Agent":"KeibaMetrics-JRA-Official-Pedigree-Harvest/1.0"})
          with urllib.request.urlopen(request,timeout=20) as r:
              assert r.status==200
              txt=r.read(30000).decode("utf-8")
          rules=RobotFileParser()
          rules.parse(txt.splitlines())
          assert rules.can_fetch("KeibaMetrics-JRA-Official-Pedigree-Harvest/1.0",
                                 "https://www.jra.go.jp/JRADB/accessU.html")
          print("JRA_ROBOTS_PERMITTED_NO_AUTH_BYPASS")
          PY
      - name: Acquire actual official horse pedigree for three JRA races
        id: harvest
        if: steps.window.outputs.skip != 'true'
        env:
          DATE: ${{ steps.window.outputs.date }}
          START: ${{ steps.window.outputs.start_race }}
          FILE: ${{ steps.window.outputs.filename }}
        run: |
          set -euo pipefail
          mkdir -p runtime_out
          if [ -f "$FILE" ]; then
            echo "EXISTING_IMMUTABLE_HARVEST_NOT_REWRITTEN"
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYTHONPATH=runtime:runtime/jra_source_runtime \
            python runtime/jra_source_runtime/jra_pedigree_harvest.py \
              --date "$DATE" --mode results --start-race "$START" \
              --max-races 3 --delay 1.3 --out-dir runtime/pedigree_corpus \
              | tee runtime_out/pedigree_harvest_window.log
          if [ -f "$FILE" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          elif grep -q '"exhausted_window": true' runtime_out/pedigree_harvest_window.log; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "COLLECTOR_NO_OUTPUT_WITHOUT_EXHAUSTION_PROOF" >&2
            exit 1
          fi
      - name: Check source identities and exact unmodified producer digest
        if: steps.harvest.outputs.new == 'true'
        env:
          FILE: ${{ steps.window.outputs.filename }}
        run: |
          python - <<'PY'
          import json,os,re,hashlib
          from pathlib import Path
          p=Path(os.environ["FILE"])
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["profile"]=="KM-JRA-OFFICIAL-PEDIGREE-HARVEST-v1.0-20261010"
          assert j["official"] is True and j["source"]=="www.jra.go.jp"
          assert 3<=j["horse_count"]==len(j["horses"])<=60
          assert j["horse_count"]/j["horse_token_count"]>=0.90, "PEDIGREE_COLLECTION_COVERAGE_BELOW_90_PERCENT"
          assert j["coverage_class"] in ("FULL","PARTIAL_WITH_EXPLICIT_MISSINGNESS")
          assert j["coverage_class"]=="FULL" or bool(j["errors"])
          assert j["mode"]=="results" and j["max_races"]==3
          assert all(h.get("horse_name") and h.get("sire") and h.get("dam") for h in j["horses"])
          assert all(re.fullmatch(r"[0-9a-f]{64}",h.get("raw_sha256") or "") for h in j["horses"])
          body={k:v for k,v in j.items() if k!="sha256"}
          digest=hashlib.sha256(json.dumps(body,ensure_ascii=False,sort_keys=True).encode()).hexdigest()
          assert digest==j["sha256"],"HARVEST_CONTENT_INTEGRITY_FAIL"
          print("JRA_HARVEST_VERIFIED_HORSES",j["horse_count"],"run_count",
                sum(len(h["runs"]) for h in j["horses"]))
          PY
      - name: Create independent GitHub OIDC provenance for corpus bytes
        id: attest
        if: steps.harvest.outputs.new == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.window.outputs.filename }}
      - name: Verify external OIDC signer before corpus publication
        if: steps.harvest.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.window.outputs.filename }}
        run: |
          gh attestation verify "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/km-jra-pedigree-verified-backfill.yml"
          echo "JRA_PEDIGREE_SIGSTORE_ATTESTATION_VERIFIED"
      - name: Revalidate previously stored corpus before moving durable cursor
        if: steps.harvest.outputs.new == 'false' && steps.harvest.outputs.exhausted != 'true' && steps.window.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.window.outputs.filename }}
        run: |
          set -euo pipefail
          test -f "$FILE"
          gh attestation verify "$FILE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/km-jra-pedigree-verified-backfill.yml"
          echo "EXISTING_CORPUS_ORIGINAL_OIDC_ATTESTATION_VERIFIED"
      - name: Advance only completed, attested windows
        if: steps.window.outputs.skip != 'true'
        env:
          MANUAL: ${{ steps.window.outputs.manual }}
          IS_NEW: ${{ steps.harvest.outputs.new }}
          EXHAUSTED: ${{ steps.harvest.outputs.exhausted }}
        run: |
          if [ "$MANUAL" = "true" ]; then exit 0; fi
          if [ "$IS_NEW" != "true" ] && [ "$EXHAUSTED" != "true" ]; then
             # Prior file already committed: advance once if it matches cursor.
             echo "CURSOR_ALREADY_PUBLISHED_WINDOW"
          fi
          python scripts/jra_pedigree_backfill_cursor.py --next \
             $([ "$EXHAUSTED" = "true" ] && echo --exhausted)
      - name: Commit verified facts plus cursor; no raw HTML or fake historic OOS
        if: steps.window.outputs.skip != 'true'
        env:
          FILE: ${{ steps.window.outputs.filename }}
        run: |
          set -euo pipefail
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/pedigree_backfill_cursor.json
          if [ -f "$FILE" ]; then git add "$FILE"; fi
          if git diff --cached --quiet; then echo "BACKFILL_ALREADY_PERSISTED"; exit 0; fi
          git commit -m "corpus: OIDC-verified JRA pedigree backfill and cursor [skip ci]"
          for n in 1 2 3; do
             git pull --rebase origin main && git push origin HEAD:main && exit 0
             git rebase --abort 2>/dev/null || true; sleep $((n*4))
          done
          exit 1

  targeted-rare-sires:
    # Invoked by the explicitly reviewed owner-curated official profile cohort.
    # Signed outputs may ONLY enter predictions whose cutoff follows capture.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'BVI targeted') }}
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install existing official JRA parser dependencies
        run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Verify official JRA robots permission
        run: |
          python - <<'PY'
          import urllib.request
          from urllib.robotparser import RobotFileParser
          ua="KeibaMetrics-JRA-Official-Pedigree-Harvest/1.0"
          req=urllib.request.Request("https://www.jra.go.jp/robots.txt",headers={"User-Agent":ua})
          with urllib.request.urlopen(req,timeout=25) as response:
              assert response.status==200
              lines=response.read(30000).decode("utf-8").splitlines()
          rules=RobotFileParser()
          rules.parse(lines)
          assert rules.can_fetch(ua,"https://www.jra.go.jp/JRADB/accessU.html")
          print("JRA_TARGETED_ROBOTS_PERMISSION_PASS")
          PY
      - name: Bounded real JRA rare-sire source acquisition
        env:
          MANIFEST: runtime/pedigree_targeted_cohorts/20261011-kyo-r09-rare-sires.json
          OUTPUT: runtime/pedigree_corpus/20261011-targeted-kyo-r09-rare-sires-r1.json
        run: |
          set -euo pipefail
          test ! -e "$OUTPUT" || { echo "TARGETED_IMMUTABLE_ALREADY_EXISTS"; exit 1; }
          PYTHONPATH=runtime:runtime/jra_source_runtime python \
            runtime/jra_source_runtime/jra_pedigree_targeted_harvest.py \
            --manifest "$MANIFEST" --output "$OUTPUT"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ["OUTPUT"])
          j=json.loads(p.read_text())
          assert j["profile"]=="KM-JRA-OFFICIAL-PEDIGREE-HARVEST-v1.0-20261010"
          assert j["official"] is True and j["source"]=="www.jra.go.jp"
          assert j["horse_count"]>=3 and j["horse_count"]/j["horse_token_count"]>=0.90
          assert j["mode"]=="targeted_official_horse_profiles"
          assert all(h["horse_name"] and h["sire"] in j["target_sires"] and h["dam"]
                     for h in j["horses"])
          payload={k:v for k,v in j.items() if k!="sha256"}
          assert hashlib.sha256(json.dumps(payload,ensure_ascii=False,sort_keys=True).encode()).hexdigest()==j["sha256"]
          print("JRA_TARGETED_REAL_HORSES",j["horse_count"],"RUNS",
                sum(len(h["runs"]) for h in j["horses"]))
          PY
      - name: Attest exact real official JRA cohort bytes with GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-path: runtime/pedigree_corpus/20261011-targeted-kyo-r09-rare-sires-r1.json
      - name: Independently verify signed corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            runtime/pedigree_corpus/20261011-targeted-kyo-r09-rare-sires-r1.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/km-jra-pedigree-verified-backfill.yml"
      - name: Persist immutable publicly derived structured facts for future BVI
        run: |
          set -euo pipefail
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/pedigree_corpus/20261011-targeted-kyo-r09-rare-sires-r1.json
          git commit -m "corpus: OIDC-signed JRA targeted rare-sire evidence, future cutoff only [skip ci]"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((n*4))
          done
          exit 1

  weekend-plan:
    needs: collect
    if: ${{ always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve owner-authorized bounded weekend windows
        id: plan
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from importlib.util import spec_from_file_location, module_from_spec
          spec=spec_from_file_location("intake","scripts/jra_weekend_bvi_intake.py")
          mod=module_from_spec(spec);spec.loader.exec_module(mod)
          plan=json.loads(Path("runtime/pedigree_weekend_intake/20261010-11.json").read_text())
          pending=mod.pending_windows(plan)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
            out.write("matrix="+json.dumps({"include":pending},separators=(",",":"))+"\n")
            out.write("pending="+str(bool(pending)).lower()+"\n")
          print("WEEKEND_PENDING_WINDOWS",len(pending))
          PYCODE

  weekend-official-bvi-intake:
    needs: weekend-plan
    if: ${{ always() && needs.weekend-plan.result == 'success' && needs.weekend-plan.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.weekend-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install existing official parser requirements
        run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Confirm JRA official robots permission
        run: |
          python - <<'PYCODE'
          import urllib.request
          from urllib.robotparser import RobotFileParser
          ua="KeibaMetrics-JRA-Official-Pedigree-Harvest/1.0"
          with urllib.request.urlopen(urllib.request.Request("https://www.jra.go.jp/robots.txt",headers={"User-Agent":ua}),timeout=25) as response:
            assert response.status==200
            lines=response.read(30000).decode().splitlines()
          parser=RobotFileParser();parser.parse(lines)
          assert parser.can_fetch(ua,"https://www.jra.go.jp/JRADB/accessU.html")
          PYCODE
      - name: Sequential official collection, never Blood-B conversion
        id: collect
        env:
          DAY: ${{ matrix.date }}
          START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          DAY_CODE="$(printf %s "$DAY" | tr -d '-')"
          FILE="runtime/pedigree_corpus/$DAY_CODE-results-race$START-r3.json"
          if [ -f "$FILE" ]; then
            # A retry creates new immutable bytes; the original partial cohort
            # and its capture time remain available for historical cutoffs.
            FILE="runtime/pedigree_corpus/$DAY_CODE-results-race$START-r3-retry-$GITHUB_RUN_ID.json"
            RETRY_DIR="$(mktemp -d)"
            PYTHONPATH=runtime:runtime/jra_source_runtime python runtime/jra_source_runtime/jra_pedigree_harvest.py \
              --date "$DAY" --mode results --start-race "$START" --max-races 3 --delay 1.3 \
              --out-dir "$RETRY_DIR"
            mv "$RETRY_DIR/$DAY_CODE-results-race$START-r3.json" "$FILE"
            echo "receipt=runtime/pedigree_intake_receipts/$DAY_CODE-race$START-retry-$GITHUB_RUN_ID.json" >> "$GITHUB_OUTPUT"
          else
            PYTHONPATH=runtime:runtime/jra_source_runtime python runtime/jra_source_runtime/jra_pedigree_harvest.py \
              --date "$DAY" --mode results --start-race "$START" --max-races 3 --delay 1.3 \
              --out-dir runtime/pedigree_corpus
            echo "receipt=runtime/pedigree_intake_receipts/$DAY_CODE-race$START.json" >> "$GITHUB_OUTPUT"
          fi
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - name: Attest exact JRA bytes using original trusted workflow identity
        if: steps.collect.outputs.new == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.collect.outputs.file }}
      - name: Admit through untouched production pedigree corpus reader
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.collect.outputs.file }}
          RECEIPT: ${{ steps.collect.outputs.receipt }}
          DAY: ${{ matrix.date }}
          START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          DAY_CODE="$(printf %s "$DAY" | tr -d '-')"
          gh attestation verify "$FILE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/km-jra-pedigree-verified-backfill.yml"
          python scripts/jra_weekend_bvi_intake.py admit --file "$FILE" \
            --receipt "$RECEIPT"
      - name: Persist independently verified facts for subsequent formal BVI runs
        env:
          FILE: ${{ steps.collect.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "$FILE" runtime/pedigree_intake_receipts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "corpus: verified weekend official BVI automatic intake [skip ci]"
          for n in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((n*4))
          done
          exit 1
