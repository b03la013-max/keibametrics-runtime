name: LOCAL Source Enrichment Discovery

on:
  pull_request:
    paths:
      - '.github/workflows/source-enrichment-discovery.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official NAR HTML link and table shapes
        run: |
          python - <<'PY'
          import re, urllib.request
          from html.parser import HTMLParser

          URL="https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/DebaTable?k_babaCode=31&k_raceDate=2026%2F09%2F13&k_raceNo=3"
          RURL="https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceMarkTable?k_babaCode=31&k_raceDate=2026%2F09%2F13&k_raceNo=1"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"KeibaMetrics-Discovery/1.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read()
                  ct=r.headers.get("content-type","")
              for enc in ("utf-8","cp932","shift_jis","euc_jp"):
                  try:return b.decode(enc)
                  except:pass
              return b.decode("utf-8","replace")
          html=get(URL)
          print("RACE_CARD_BYTES",len(html.encode()))
          hrefs=re.findall(r'href=["\']([^"\']+)["\']',html,re.I)
          for h in sorted(set(hrefs)):
              if "DataRoom" in h or "Horse" in h or "Rider" in h or "Trainer" in h:
                  print("DATAROOM_HREF",h)
          for key in ("k_lineageLoginCode","k_riderLicenseNo","k_trainerLicenseNo","HorseMark","RiderMark","TrainerMark"):
              print("COUNT",key,html.count(key))

          result=get(RURL)
          print("RESULT_BYTES",len(result.encode()))
          # print compact snippets around passing-order terms
          for term in ("通過順位","着順","馬番","馬名"):
              m=re.search(term,result)
              if m:
                  s=re.sub(r"\s+"," ",result[max(0,m.start()-500):m.start()+1500])
                  print("RESULT_SNIPPET",term,s[:2000])
          # Inspect one horse/rider/trainer profile from actual race-card links.
          base="https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/"
          abslinks=[]
          for h in hrefs:
              if h.startswith("../"):
                  abslinks.append("https://www.keiba.go.jp/KeibaWeb/"+h[3:])
              elif h.startswith("/"):
                  abslinks.append("https://www.keiba.go.jp"+h)
          for label,needle in (("HORSE","HorseMarkInfo"),("RIDER","RiderMark"),("TRAINER","TrainerMark")):
              u=next(x for x in abslinks if needle in x)
              doc=get(u)
              print(label+"_URL",u)
              print(label+"_BYTES",len(doc.encode()))
              for term in (("馬情報" if label=="HORSE" else "生涯成績"),"地方競馬年別成績","着別回数","年月日"):
                  m=re.search(term,doc)
                  if m:
                      s=re.sub(r"\\s+"," ",doc[max(0,m.start()-500):m.start()+3500])
                      print(label+"_SNIPPET",term,s[:4000])
          # Print parsed table shapes using production HTML table extractor.
          import sys
          sys.path.insert(0,"runtime/local_physical")
          from source_acquisition import _html_tables
          for label,needle in (("HORSE","HorseMarkInfo"),("RIDER","RiderMark"),("TRAINER","TrainerMark")):
              u=next(x for x in abslinks if needle in x)
              doc=get(u)
              tabs=_html_tables(doc)
              print(label+"_TABLE_COUNT",len(tabs))
              for ti,t in enumerate(tabs[:12]):
                  print(label+"_TABLE",ti,"ROWS",len(t),"HEAD",repr(t[:6])[:5000])
          # Emit complete rider/trainer performance table rows for source capability audit.
          for label,needle in (("RIDER","RiderMark"),("TRAINER","TrainerMark")):
              u=next(x for x in abslinks if needle in x)
              tabs=_html_tables(get(u))
              for ti,t in enumerate(tabs):
                  if t and any("着別回数" in str(cell) for cell in t[0]):
                      print(label+"_PERFORMANCE_ROWS",repr(t)[:16000])
          print("DISCOVERY_PASS")
          PY
