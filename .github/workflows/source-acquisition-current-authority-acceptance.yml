name: Source Acquisition Current Authority Acceptance

on:
  pull_request:
    paths:
      - 'governance/KM-FAMILY-EXECUTION-ARCHITECTURE-20260923-R6.md'
      - 'governance/KM-LOCAL-INPUT-SOURCE-OPS-v1.3-20260923.md'
      - 'profiles/local_information_source_registry_v1.6_20260923.json'
      - 'profiles/KM_LOCAL_SUITE_MANIFEST_20260923_R3.json'
      - 'profiles/venue_chat_routes_20260923_R7.json'
      - 'profiles/KM_FAMILY_CURRENT_AUTHORITY_20260923_R5.json'
      - '.github/workflows/source-acquisition-current-authority-acceptance.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source acquisition authority closure
        run: |
          python - <<'PY'
          import json, pathlib
          P=pathlib.Path("profiles")
          auth=json.loads((P/"KM_FAMILY_CURRENT_AUTHORITY_20260923_R5.json").read_text())
          suite=json.loads((P/"KM_LOCAL_SUITE_MANIFEST_20260923_R3.json").read_text())
          reg=json.loads((P/"local_information_source_registry_v1.6_20260923.json").read_text())
          route=json.loads((P/"venue_chat_routes_20260923_R7.json").read_text())

          SOURCE="KM-FAMILY-EXTERNAL-SOURCE-ACQUISITION-20260923-R1"
          RUNTIME="KM-LOCAL-PHYSICAL-RUNTIME-v1.5-20260923-SOURCE-ACQUISITION"

          assert auth["manifest_id"]=="KM-FAMILY-CURRENT-AUTHORITY-20260923-R5"
          assert auth["predecessor"]=="KM-FAMILY-CURRENT-AUTHORITY-20260923-R4"
          assert auth["common_family_components"]["execution_architecture"]=="KM-FAMILY-EXECUTION-ARCHITECTURE-20260923-R6"
          assert auth["common_family_components"]["venue_routing"]=="KM-VENUE-CHAT-FORMAL-ROUTING-20260923-R7"
          assert auth["common_family_components"]["source_acquisition"]==SOURCE
          la=auth["family_scoped_authority"]["LOCAL"]
          assert la["production_suite"]=="KM-LOCAL-RENDERED-INTEGRITY-20260827-R3"
          assert la["production_numeric_status"].startswith("FROZEN")
          assert la["common_canon"]=="ケイバメトリクス地方版 v4.13 Rev.1"
          assert la["krs"]=="v1.7-KRS Rev.1"
          assert la["krs_ops"]=="v1.7 Rev.1"
          assert la["reflection"]=="v1.4 Rev.1"
          assert la["kms"]=="v1.4-KMS Rev.1"
          assert la["csl"]=="v1.1-CSL Rev.1"
          assert la["runtime"]==RUNTIME
          assert la["source_acquisition"]==SOURCE
          assert auth["local_acceptance_evidence"]["source_acquisition_live_run"]==35765520464

          assert suite["manifest_id"]=="KM-LOCAL-SUITE-MANIFEST-20260923-R3"
          assert suite["production_numeric_suite"]["status"]=="FROZEN"
          assert suite["production_numeric_suite"]["numerical_change"] is False
          assert suite["krs"]["spec"]=="v1.7-KRS Rev.1"
          assert suite["krs"]["ops"]=="v1.7 Rev.1"
          assert suite["measurement_learning"]["reflection"]["version"]=="v1.4 Rev.1"
          assert suite["measurement_learning"]["kms"]["version"]=="v1.4-KMS Rev.1"
          assert suite["measurement_learning"]["csl"]["version"]=="v1.1-CSL Rev.1"
          assert suite["runtime"]["runtime"]==RUNTIME
          assert suite["source_acquisition"]["profile"]==SOURCE
          assert "SOURCE_ACQUIRE" in suite["runtime"]["capabilities"]

          assert reg["profile_id"]=="KM-LOCAL-INFORMATION-SOURCE-REGISTRY-v1.6-20260923"
          assert reg["input_source_ops"]=="KM-LOCAL-INPUT-SOURCE-OPS-v1.3-20260923"
          assert reg["source_acquisition"]["profile"]==SOURCE
          assert reg["source_acquisition"]["required_before_pre_krs"] is True

          assert route["profile_id"]=="KM-VENUE-CHAT-FORMAL-ROUTING-20260923-R7"
          lr=route["family_routes"]["LOCAL"]
          assert lr["runtime_revision"]==RUNTIME
          assert lr["source_acquisition_required"] is True
          assert lr["source_acquisition_profile"]==SOURCE
          assert route["formal_path"].index("EXTERNAL_SOURCE_ACQUISITION") < route["formal_path"].index("FULL_RUNNER_UNIVERSE")
          assert route["formal_path"].index("SOURCE_FREEZE_VERIFIED") < route["formal_path"].index("PRE_KRS_VERIFIED")

          for value in [
              auth["local_acceptance_evidence"]["source_receipt"],
              auth["local_acceptance_evidence"]["source_snapshot_sha256"],
              auth["local_acceptance_evidence"]["raw_source_sha256"],
              auth["local_acceptance_evidence"]["formal_receipt_after_source"],
          ]:
              assert isinstance(value,str) and len(value)==64 and all(c in "0123456789abcdef" for c in value)

          print("SOURCE_ACQUISITION_CURRENT_AUTHORITY_ACCEPTANCE_PASS")
          PY
