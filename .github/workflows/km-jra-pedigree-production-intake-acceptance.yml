name: JRA Real Signed Pedigree Corpus Production Intake Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/jra_pedigree_live_acceptance.py"
      - "scripts/jra_pedigree_inventory.py"
      - "tests/test_jra_pedigree_full_day.py"
      - "scripts/jra_bvi_pipeline_real_acceptance.py"
      - "runtime/jra_bvi_shadow_comparison.py"
      - "runtime/jra_bvi_consumption.py"
      - "runtime/jra_bvi_static_proof.py"
      - "runtime/jra_bvi_failure_attribution.py"
      - "runtime/jra_bvi_oos_metrics.py"
      - "tests/test_jra_bvi_proof_oos.py"
      - "tests/test_jra_bvi_consumption.py"
      - "runtime/jra_owner_authorized_feature_rules.py"
      - "scripts/jra_bvi_pipeline_forward_shadow.py"
      - "tests/test_jra_bvi_forward_shadow.py"
      - "runtime/jra_index_provenance_builder.py"
      - "runtime/jra_static_owner_forward_oos.py"
      - "scripts/jra_bvi_postcapture_real_closure.py"
      - "runtime/jra_pedigree_corpus.py"
      - ".github/workflows/km-jra-pedigree-production-intake-acceptance.yml"
      - "runtime/pedigree_corpus/**"
  push:
    branches: [main]
    paths:
      - "scripts/jra_pedigree_live_acceptance.py"
      - "scripts/jra_pedigree_inventory.py"
      - "tests/test_jra_pedigree_full_day.py"
      - "scripts/jra_bvi_pipeline_real_acceptance.py"
      - "runtime/jra_bvi_shadow_comparison.py"
      - "runtime/jra_bvi_consumption.py"
      - "runtime/jra_bvi_static_proof.py"
      - "runtime/jra_bvi_failure_attribution.py"
      - "runtime/jra_bvi_oos_metrics.py"
      - "tests/test_jra_bvi_proof_oos.py"
      - "tests/test_jra_bvi_consumption.py"
      - "runtime/jra_owner_authorized_feature_rules.py"
      - "scripts/jra_bvi_pipeline_forward_shadow.py"
      - "tests/test_jra_bvi_forward_shadow.py"
      - "runtime/jra_index_provenance_builder.py"
      - "runtime/jra_static_owner_forward_oos.py"
      - "scripts/jra_bvi_postcapture_real_closure.py"
      - "runtime/jra_pedigree_corpus.py"
      - ".github/workflows/km-jra-pedigree-production-intake-acceptance.yml"
      - "runtime/pedigree_corpus/**"
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q cryptography pytest beautifulsoup4
      - name: Protect live Production from historical external diagnostics during live freezes
        id: external_window
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          day=datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          allowed=day not in ('2026-10-17','2026-10-18','2026-10-25')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('allowed='+str(allowed).lower()+'\n')
          if not allowed:
              p=Path('runtime_out/jra_bvi_external_acceptance_deferred.json')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps({'status':'DEFERRED_PRODUCTION_FREEZE',
                  'jst_date':day,'external_diagnostics_executed':False,
                  'reason':'Preserve live Production KRS capacity; numerical regression still runs',
                  'full_real_acceptance_pass_claimed':False},indent=2)+'\n')
          PY
      - name: Numerical lineage and temporal regression
        run: python -m pytest -q tests/test_jra_pedigree_full_day.py tests/test_jra_bvi_proof_oos.py tests/test_jra_production_auto_handoff.py tests/test_jra_bvi_consumption.py tests/test_krs_prediction_utility.py tests/test_jra_bvi_forward_shadow.py tests/test_jra_bvi_real_pipeline.py tests/test_jra_index_provenance_trace.py tests/test_jra_static_owner_forward_oos.py tests/test_jra_static_owner_executable.py tests/test_jra_bvi_official_corpus_repair.py tests/test_jra_pedigree_harvest_backfill.py tests/test_jra_weekend_bvi_intake.py tests/test_jra_owner_authorized_rules.py
      - name: Independently verify actual all-race intake, existing Reader consumption and frozen Production BVI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jra_pedigree_inventory.py --official-audit --plan runtime/pedigree_intake_receipts/20261024-full-day-plan.json --output runtime_out/jra_bvi_full_day_audit.json --summary-output runtime_out/jra_bvi_full_day_summary.json
      - name: Verify real OIDC corpus, temporal gates and full BVI downstream diagnostics
        if: steps.external_window.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import runpy
          # Reuse the existing digest-keyed OIDC cache in one process. Each
          # cutoff is still checked against its verified witnessed timestamps.
          for path in ("scripts/jra_bvi_postcapture_real_closure.py",
                       "scripts/jra_pedigree_live_acceptance.py",
                       "scripts/jra_bvi_pipeline_real_acceptance.py"):
              runpy.run_path(path,run_name="__main__")
          PYCODE
      - name: Reverify signed forward results and retain separate policy cohorts
        if: steps.external_window.outputs.allowed == 'true'
        run: python scripts/jra_bvi_pipeline_forward_shadow.py settle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-real-signed-pedigree-corpus-intake
          path: |
            runtime_out/jra_bvi_external_acceptance_deferred.json
            runtime_out/jra_bvi_full_day_audit.json
            runtime_out/jra_bvi_full_day_summary.json
            runtime_out/jra_pedigree_verified_acceptance.json
            runtime_out/jra_bvi_postcapture_real_closure.json
            runtime_out/jra_bvi_pipeline_real_acceptance.json
            runtime/jra_static_owner_forward_oos/pedigree_pipeline_current.json
            runtime/jra_static_owner_forward_oos/**/pedigree_evaluation_*.json
          if-no-files-found: warn
