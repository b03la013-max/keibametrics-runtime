name: JRA Real Signed Pedigree Corpus Production Intake Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/jra_pedigree_live_acceptance.py"
      - "scripts/jra_bvi_pipeline_real_acceptance.py"
      - "runtime/jra_bvi_shadow_comparison.py"
      - "runtime/jra_index_provenance_builder.py"
      - "runtime/jra_static_owner_forward_oos.py"
      - "scripts/jra_bvi_postcapture_real_closure.py"
      - "runtime/jra_pedigree_corpus.py"
      - ".github/workflows/km-jra-pedigree-production-intake-acceptance.yml"
      - "runtime/pedigree_corpus/**"
  push:
    branches: [main]
    paths:
      - "scripts/jra_pedigree_live_acceptance.py"
      - "scripts/jra_bvi_pipeline_real_acceptance.py"
      - "runtime/jra_bvi_shadow_comparison.py"
      - "runtime/jra_index_provenance_builder.py"
      - "runtime/jra_static_owner_forward_oos.py"
      - "scripts/jra_bvi_postcapture_real_closure.py"
      - "runtime/jra_pedigree_corpus.py"
      - ".github/workflows/km-jra-pedigree-production-intake-acceptance.yml"
      - "runtime/pedigree_corpus/**"
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q cryptography pytest beautifulsoup4
      - name: Numerical lineage and temporal regression
        run: python -m pytest -q tests/test_jra_bvi_real_pipeline.py tests/test_jra_index_provenance_trace.py tests/test_jra_static_owner_forward_oos.py tests/test_jra_static_owner_executable.py tests/test_jra_bvi_official_corpus_repair.py tests/test_jra_pedigree_harvest_backfill.py tests/test_jra_weekend_bvi_intake.py tests/test_jra_owner_authorized_rules.py
      - name: Verify actual rare-sire BVI feature coverage without retroactive race use
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jra_bvi_postcapture_real_closure.py
      - name: Verify real stored official JRA corpus OIDC and cutoff gating in Base feature loader
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jra_pedigree_live_acceptance.py
      - name: Real all-runner BVI Static and KRS-input differential acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jra_bvi_pipeline_real_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-real-signed-pedigree-corpus-intake
          path: |
            runtime_out/jra_pedigree_verified_acceptance.json
            runtime_out/jra_bvi_postcapture_real_closure.json
            runtime_out/jra_bvi_pipeline_real_acceptance.json
          if-no-files-found: warn
