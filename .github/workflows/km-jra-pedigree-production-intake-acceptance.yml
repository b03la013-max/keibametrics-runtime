  workflow_dispatch:
permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q cryptography pytest beautifulsoup4 pyyaml
      - name: Protect live Production from historical external diagnostics during live freezes
        id: external_window
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          day=datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          explicit=os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
          allowed=explicit and day not in ('2026-10-17','2026-10-18','2026-10-25')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('allowed='+str(allowed).lower()+'\n')
          if not allowed:
              p=Path('runtime_out/jra_bvi_external_acceptance_deferred.json')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps({'status':'DEFERRED_PRODUCTION_FREEZE' if explicit else 'OFFLINE_CI_ONLY',
                  'jst_date':day,'external_diagnostics_executed':False,
                  'model_training_executed':False,'model_publication_executed':False,
                  'oidc_verification_executed':False,
                  'reason':'Preserve live Production KRS capacity' if explicit else 'Live acceptance requires explicit workflow_dispatch; no automatic research publication',
                  'full_real_acceptance_pass_claimed':False},indent=2)+'\n')
          PY
      - name: Numerical lineage and temporal regression
        run: python -m pytest -q tests/test_jra_pedigree_full_day.py tests/test_jra_bvi_proof_oos.py tests/test_jra_production_auto_handoff.py tests/test_jra_bvi_consumption.py tests/test_krs_prediction_utility.py tests/test_jra_bvi_forward_shadow.py tests/test_jra_bvi_real_pipeline.py tests/test_jra_index_provenance_trace.py tests/test_jra_static_owner_forward_oos.py tests/test_jra_static_owner_executable.py tests/test_jra_bvi_official_corpus_repair.py tests/test_jra_pedigree_harvest_backfill.py tests/test_jra_weekend_bvi_intake.py tests/test_jra_owner_authorized_rules.py tests/test_jra_bvi_environment.py tests/test_jra_bvi_env_shadow.py tests/test_jra_bvi_env_comparison.py tests/test_jra_bvi_env_forward.py tests/test_jra_bvi_parallel_sidecar.py
      - name: Exact observed target environment regression
        run: python -m pytest -q tests/test_jra_bvi_env_acceptance.py
      - name: Protect automatic CI from external acceptance and model publication
        run: python -m pytest -q tests/test_jra_bvi_production_intake_ci_guard.py
      - name: Inventory tracked corpus and fixed publication evidence offline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.jra_bvi_parallel_sidecar import verify_fixed_model
          fixed={};verify_fixed_model(fixed)
          output=Path('runtime_out/jra_bvi_offline_inventory.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps({'classification':'OFFLINE_INVENTORY_NOT_SOURCE_OR_READER_READMISSION',
              'tracked_corpus_files':len(list(Path('runtime/pedigree_corpus').glob('*.json'))),
              'fixed_publication_verification':fixed,'new_source_acceptance':0,
              'new_model_publication':0,'new_forward_oos_credit':0,
              'external_runtime_calls':0,'oidc_reverification_executed':False},indent=2)+'\n')
          PY
      - name: Independently verify actual all-race intake, existing Reader consumption and frozen Production BVI
        if: github.event_name == 'workflow_dispatch' && steps.external_window.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/jra_pedigree_inventory.py --official-audit --plan runtime/pedigree_intake_receipts/20261024-full-day-plan.json --output runtime_out/jra_bvi_full_day_audit.json --summary-output runtime_out/jra_bvi_full_day_summary.json
      - name: Verify real OIDC corpus, temporal gates and full BVI downstream diagnostics
        if: github.event_name == 'workflow_dispatch' && steps.external_window.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import runpy
          # Reuse the existing digest-keyed OIDC cache in one process. Each
          # cutoff is still checked against its verified witnessed timestamps.
          for path in ("scripts/jra_bvi_postcapture_real_closure.py",
                       "scripts/jra_pedigree_live_acceptance.py",
                       "scripts/jra_bvi_pipeline_real_acceptance.py"):
              runpy.run_path(path,run_name="__main__")
          PYCODE
      - name: Reverify signed forward results and retain separate policy cohorts
        if: github.event_name == 'workflow_dispatch' && steps.external_window.outputs.allowed == 'true'
        run: python scripts/jra_bvi_pipeline_forward_shadow.py settle
      - name: Recover actual environment facts and evaluate frozen research-only ENV model
        id: env_model
        if: github.event_name == 'workflow_dispatch' && steps.external_window.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_MODEL_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/jra_bvi_env_acceptance.py --abc-artifact runtime_out/jra_bvi_pipeline_real_acceptance.json --run-external
      - name: Attest unvalidated research model publication bytes
        id: env_model_attest
        if: github.event_name == 'workflow_dispatch' && steps.external_window.outputs.allowed == 'true' && steps.env_model.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: runtime_out/bvi_env/bvi_env_model_publication.json
      - name: Independently verify research model OIDC before reporting a freeze
        if: github.event_name == 'workflow_dispatch' && steps.external_window.outputs.allowed == 'true' && steps.env_model_attest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify runtime_out/bvi_env/bvi_env_model_publication.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/km-jra-pedigree-production-intake-acceptance.yml" \
            --format json > runtime_out/bvi_env/model_oidc_verification.json
          python scripts/jra_bvi_pipeline_forward_shadow.py settle --environment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-real-signed-pedigree-corpus-intake
          path: |
            runtime_out/jra_bvi_external_acceptance_deferred.json
            runtime_out/jra_bvi_offline_inventory.json
            runtime_out/jra_bvi_full_day_audit.json
            runtime_out/jra_bvi_full_day_summary.json
            runtime_out/jra_pedigree_verified_acceptance.json
            runtime_out/jra_bvi_postcapture_real_closure.json
            runtime_out/jra_bvi_pipeline_real_acceptance.json
            runtime_out/bvi_env/
            runtime/jra_static_owner_forward_oos/pedigree_env_current.json
            runtime/jra_static_owner_forward_oos/pedigree_pipeline_current.json
            runtime/jra_static_owner_forward_oos/**/pedigree_evaluation_*.json
          if-no-files-found: warn
