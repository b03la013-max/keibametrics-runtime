name: JRA Base Index Production Selftest
on:
  push:
    branches: [ main ]
    paths:
      - "runtime/base-index-service/**"
      - "runtime/jra_evidence_to_base_production.py"
      - "runtime/jra_evidence_feature_normalizer_production.py"
      - "runtime/jra_index_provenance_builder.py"
      - "mapping/jra_base_index_evidence_mapping_v1.0_20260921.json"
      - "mapping/jra_base_index_mapping_registry_v1.0_20260921.json"
      - "tests/test_jra_production_mapping_selftest.py"
      - "tests/test_jra_production_fullnumerical_to_krs.py"
      - "runtime/jra_krs_input_builder_production.py"
      - "mapping/jra_krs_hsv_bridge_v1.0_production_20260921.json"
      - ".github/workflows/jra-base-index-selftest.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python production mapping selftest
        run: |
          python tests/test_jra_production_mapping_selftest.py
          python tests/test_jra_production_fullnumerical_to_krs.py
      - uses: oven-sh/setup-bun@v2
      - name: Start calculator and verify mixed runner profiles
        shell: bash
        run: |
          bun runtime/base-index-service/server.mjs > /tmp/km-base-index.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:3000/selftest >/tmp/selftest.json
          cat /tmp/selftest.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/selftest.json"))
          assert x["status"]=="PASS"
          assert x["profiles"]==["ESTABLISHED","LOW_CAREER","NEWCOMER"]
          assert x["required_count"]==60
          assert x["calculated_count"]==60
          assert x["ruled_hold_count"]==0
          assert x["not_applicable_count"]==0
          assert x["unresolved_count"]==0
          print("JRA_PRODUCTION_MAPPING_60_60_PASS")
          PY
