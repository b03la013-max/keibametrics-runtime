name: NKY 20260927 Postrace Review Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-nky-20260927-postrace-review-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Fetch official JRA result pages R03-R12
        run: |
          python - <<'PY'
          import json,re,urllib.request,http.cookiejar,sys
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode,_html_tables,_html_text
          from jra_race_card_detail import _calendar_url,_fetch,_post,_date8
          race_date="2026-09-27"; key="0620260409"; d=_date8(race_date)
          jar=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          out={"race_date":race_date,"meeting_key":key,"races":{}}
          try:
            u0,r0,h0=_fetch(opener,_calendar_url(race_date)); s0=_decode(r0,h0.get("content-type",""))
            entry_tokens=re.findall(r"doAction\('/JRADB/accessS\.html'\s*,\s*'([^']+)'\)",s0)
            if not entry_tokens: raise RuntimeError("NO_ACCESS_S_ENTRY")
            chosen=None
            for entry in entry_tokens:
              try:
                u1,r1,h1=_post(opener,entry,u0); s1=_decode(r1,h1.get("content-type",""))
                day_matches=re.findall(r"(pw01srl00"+re.escape(key)+re.escape(d)+r"/[0-9A-Fa-f]{2})",s1)
                if day_matches:
                  chosen=(u1,s1,day_matches[0]); break
              except Exception:
                pass
            if not chosen: raise RuntimeError("NO_DAY_TOKEN")
            u1,s1,day=chosen
            u2,r2,h2=_post(opener,day,u1); s2=_decode(r2,h2.get("content-type",""))
            for race_no in range(3,13):
              rec={"race_no":race_no}
              try:
                prefix="pw01sde01"+key+f"{race_no:02d}"+d
                race_matches=re.findall(r"("+re.escape(prefix)+r"/[0-9A-Fa-f]{2})",s2)
                if not race_matches:
                  race_matches=re.findall(r"(pw01[^'\"<>\s]+"+re.escape(key)+f"{race_no:02d}"+re.escape(d)+r"/[0-9A-Fa-f]{2})",s2)
                if not race_matches: raise RuntimeError("NO_RACE_TOKEN")
                u3,r3,h3=_post(opener,race_matches[0],u2); s3=_decode(r3,h3.get("content-type",""))
                rec["status"]="PASS"; rec["final_url"]=u3
                rec["tables"]=_html_tables(s3)
                rec["text"]=_html_text(s3)
                rec["action_tokens"]=re.findall(r"doAction\('([^']+)'\s*,\s*'([^']+)'\)",s3)
              except Exception as e:
                rec["status"]="FAIL"; rec["error"]=type(e).__name__+":"+str(e)
              out["races"][str(race_no)]=rec
            out["status"]="PASS"
          except Exception as e:
            out["status"]="FAIL"; out["error"]=type(e).__name__+":"+str(e)
          p=Path("runtime/diagnostics/NKY-20260927-postrace-review-probe.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"status":out.get("status"),"races":{k:v.get("status") for k,v in out.get("races",{}).items()}},ensure_ascii=False))
          PY
      - name: Persist probe
        run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/NKY-20260927-postrace-review-probe.json
          git commit -m "diagnostic: capture NKY 20260927 official postrace pages [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
