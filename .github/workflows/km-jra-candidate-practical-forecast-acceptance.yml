name: JRA Practical Candidate Forecast Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/jra_practical_candidate_forecast.py"
      - "tests/test_jra_practical_candidate_forecast.py"
      - ".github/workflows/km-jra-candidate-practical-forecast-acceptance.yml"
      - ".github/workflows/km-jra-source-candidate-forward-oos.yml"
  push:
    branches: [main]
    paths:
      - "runtime/jra_practical_candidate_forecast.py"
      - ".github/workflows/km-jra-candidate-practical-forecast-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-paper-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test verified immutable-race ranked and budgeted candidate forecast
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_jra_practical_candidate_forecast.py
          python -m py_compile runtime/jra_practical_candidate_forecast.py
      - name: Preview real signed pre-start Tokyo R11 Candidate
        run: |
          PYTHONPATH=runtime python - <<'PY'
          import json
          from pathlib import Path
          from jra_practical_candidate_forecast import make_forecast_brief
          race="KM-JRA-TKY-20261010-R11"
          base=Path("runtime/source_candidate_oos")/race
          pre=json.loads((base/"pre_result.json").read_text(encoding="utf-8"))
          final=json.loads((base/"candidate_final.json").read_text(encoding="utf-8"))
          preview=make_forecast_brief(pre,final,maximum_paper_budget_yen=2000)
          assert preview["production_effect"] == "NONE"
          assert preview["display_paper_total_yen"] <= 2000
          assert preview["frozen_mec_ticket_count"] == pre["candidate_mec_ticket_count"]
          assert preview["frozen_mec_capital_yen"] == pre["candidate_mec_required_capital"]
          assert preview["display_ticket_count"] < preview["frozen_mec_ticket_count"]
          out=Path("runtime_out/forecast")/(race+"-CANDIDATE-PAPER-PREVIEW.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(preview,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("JRA_REAL_CANDIDATE_PAPER_PREVIEW="+json.dumps({
             "race_id":race,
             "temporal_class":preview["display_temporal_class"],
             "ranked_top6":preview["ranked_top6"],
             "heads":preview["candidate_primary_heads"],
             "ticket_count":preview["display_ticket_count"],
             "paper_total_yen":preview["display_paper_total_yen"],
             "frozen_mec_ticket_count":preview["frozen_mec_ticket_count"],
             "frozen_mec_capital_yen":preview["frozen_mec_capital_yen"],
             "ticket_examples":preview["display_tickets_by_head"],
             "source_snapshot_sha256":preview["source_snapshot_sha256"],
             "candidate_final_receipt_sha256":preview["signed_candidate_final_receipt_sha256"],
             "production_effect":preview["production_effect"],
          },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jra-tokyo-r11-candidate-practical-paper-forecast
          path: runtime_out/forecast/*.json
          if-no-files-found: error
