name: JRA Person Session Name Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-person-session-name-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Probe official person profile after horse session
        run: |
          python - <<'PY'
          import http.cookiejar,json,re,sys,urllib.parse,urllib.request
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode,_html_tables,_html_text
          BASE="https://www.jra.go.jp"
          UA="KeibaMetrics-JRA-Person-Session-Probe/1.0"
          horse="pw01dud002022104771/CC"
          tokens={
            "jockey":[
              "pw04kmk001216/75",
              "pw04kmk001122/66",
              "pw04kmk001092/09"
            ],
            "trainer":["pw05cmk001147/3B"],
          }
          jar=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          hurl=BASE+"/JRADB/accessU.html?"+urllib.parse.urlencode({"CNAME":horse})
          req=urllib.request.Request(hurl,headers={"User-Agent":UA,"Accept-Language":"ja"})
          with op.open(req,timeout=30) as r:
            r.read(3000000);ref=str(r.geturl())
          out={}
          for kind,vals in tokens.items():
            page="accessK" if kind=="jockey" else "accessC"
            arr=[]
            for tok in vals:
              url=BASE+"/JRADB/"+page+".html"
              data=urllib.parse.urlencode({"cname":tok}).encode()
              req=urllib.request.Request(url,data=data,headers={"User-Agent":UA,"Accept-Language":"ja","Referer":ref})
              with op.open(req,timeout=30) as r:
                raw=r.read(3000000);ct=r.headers.get("content-type","")
              dec=_decode(raw,ct); txt=_html_text(dec)
              title=[re.sub(r"<[^>]+>","",x).strip() for x in re.findall(r"<title[^>]*>(.*?)</title>",dec,re.I|re.S)]
              htags=[re.sub(r"<[^>]+>","",x).strip() for x in re.findall(r"<h[1-4][^>]*>(.*?)</h[1-4]>",dec,re.I|re.S)]
              snippets=[]
              for term in ["騎手情報","調教師情報","プロフィール","所属","生年月日","免許"]:
                start=0
                while True:
                  i=txt.find(term,start)
                  if i<0: break
                  snippets.append(txt[max(0,i-220):i+500])
                  start=i+len(term)
                  if len(snippets)>=12: break
              tables=[]
              for i,t in enumerate(_html_tables(dec)[:50]):
                if not t: continue
                head=" | ".join(str(x) for x in t[0])
                if any(k in head for k in ["騎乗回数","出走回数","1着","勝率","氏名","所属"]):
                  tables.append({"i":i,"rows":len(t),"head":t[:6]})
              arr.append({"token":tok,"title":title[:3],"htags":htags[:20],"snippets":snippets[:12],"tables":tables[:10]})
            out[kind]=arr
          p=Path("runtime/diagnostics/jra_person_session_name_probe.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist
        run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/jra_person_session_name_probe.json
          git commit -m "diagnostic: persist JRA person session name probe [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
