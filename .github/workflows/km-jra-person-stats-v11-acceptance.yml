name: JRA Person Stats v1.1 Live Mechanical Acceptance
permissions:
  contents: write
on:
  pull_request:
    paths:
      - "tools/jra_live_person_stats_acceptance.py"
      - "tests/test_jra_live_person_stats_acceptance.py"
      - ".github/workflows/km-jra-person-stats-v11-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "runtime/jra_source_runtime/jra_person_stats.py"
      - "runtime/jra_source_runtime/jra_race_card_detail.py"
      - ".github/workflows/km-jra-person-stats-v11-acceptance.yml"
      - "tools/jra_live_person_stats_acceptance.py"
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt pytest
      - name: Bounded current-card selection regression
        run: python -m pytest -q tests/test_jra_live_person_stats_acceptance.py
      - name: Current-card token and person-stat mechanical acceptance
        run: python tools/jra_live_person_stats_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-jra-person-stats-${{ github.run_id }}
          path: runtime/acceptance/jra_person_stats_live/
          if-no-files-found: warn
      - name: Persist
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/acceptance/jra_person_stats_live/
          git commit -m "ci: persist current JRA person stats mechanical observation [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
