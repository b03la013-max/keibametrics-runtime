name: Formal Single Entry R3 Acceptance

permissions:
  contents: read
  actions: read

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/formal_execution_orchestrator.py"
      - "runtime/formal_import_closure.py"
      - "runtime/formal_failure_diagnostics.py"
      - "runtime/formal_oos_policy.py"
      - "runtime/local_mec_r4_bridge.py"
      - "runtime/local_mec_r5_shadow.py"
      - "runtime/local_evidence_acquisition_roundtrip.py"
      - "runtime/non_jra_formal_runner.py"
      - "runtime/execution_gateway.py"
      - "runtime/execution_store.py"
      - "tests/test_formal_execution_orchestrator.py"
      - "tests/test_formal_single_entry_intent_completeness.py"
      - "tests/test_formal_pre_race_live_acceptance_evidence.py"
      - "tests/test_krs_oos_promotion_gate.py"
      - "tests/test_local_candidate_v03_oos.py"
      - "tests/test_local_candidate_dual_oos_tracker.py"
      - "tests/test_acceptance_oos_tracker_firewall.py"
      - "tests/test_formal_pre_race_oos_isolation_evidence.py"
      - "runtime/acceptance_reports/KM-LOCAL-FORMAL-SINGLE-ENTRY-R2-PRE-RACE-20260929-T03.json"
      - "tests/test_formal_import_closure.py"
      - "tests/test_formal_failure_diagnostics.py"
      - "tests/test_formal_oos_policy.py"
      - "tests/test_local_mec_r4_bridge.py"
      - "tests/test_local_mec_r5_shadow.py"
      - "tests/test_local_evidence_acquisition_roundtrip.py"
      - "profiles/family_formal_single_entry_20261001_R3.json"
      - "profiles/family_formal_single_entry_20261001_R3.json"
      - "profiles/KM_FAMILY_CURRENT_AUTHORITY_20261001_R36.json"
      - "profiles/venue_chat_routes_20261001_R36.json"
      - "profiles/current_execution_gateway.json"
      - "runtime/entry_transport_fallback.py"
      - "tests/test_entry_transport_fallback.py"
      - "profiles/KM_FAMILY_CURRENT_AUTHORITY_20261001_R36.json"
      - "profiles/venue_chat_routes_20261001_R36.json"
      - "profiles/family_runtime_contracts_20260929_R27.json"
      - "profiles/KM_LOCAL_SUITE_MANIFEST_20261001_R15.json"
      - "profiles/KM_LOCAL_SUITE_MANIFEST_20261001_R15.json"
      - "profiles/current_execution_gateway.json"
      - ".github/workflows/km-formal-single-entry.yml"
      - ".github/workflows/km-formal-single-entry-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "runtime/formal_execution_orchestrator.py"
      - "runtime/non_jra_formal_runner.py"
      - "profiles/KM_FAMILY_CURRENT_AUTHORITY_20261001_R36.json"
      - "profiles/venue_chat_routes_20261001_R36.json"
      - "profiles/family_runtime_contracts_20260929_R27.json"
      - "profiles/KM_LOCAL_SUITE_MANIFEST_20261001_R15.json"
      - "profiles/current_execution_gateway.json"
      - ".github/workflows/km-formal-single-entry.yml"
      - ".github/workflows/km-formal-single-entry-acceptance.yml"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Compile execution path
        run: |
          set -euo pipefail
          python -m py_compile \
            runtime/formal_execution_orchestrator.py \
            runtime/formal_import_closure.py \
            runtime/formal_failure_diagnostics.py \
            runtime/formal_oos_policy.py \
            runtime/local_mec_r4_bridge.py \
            runtime/local_mec_r5_shadow.py \
            runtime/local_evidence_acquisition_roundtrip.py \
            runtime/non_jra_formal_runner.py \
            runtime/execution_gateway.py \
            runtime/execution_store.py \
            runtime/family_authority_guard.py

      - name: Orchestration unit tests
        run: python -m pytest -q tests/test_entry_transport_fallback.py tests/test_formal_execution_orchestrator.py tests/test_formal_single_entry_intent_completeness.py tests/test_formal_import_closure.py tests/test_formal_failure_diagnostics.py tests/test_local_evidence_acquisition_roundtrip.py tests/test_execution_gateway.py tests/test_formal_pre_race_live_acceptance_evidence.py tests/test_formal_oos_policy.py tests/test_local_mec_r4_bridge.py tests/test_local_mec_r5_shadow.py tests/test_formal_pre_race_oos_isolation_evidence.py tests/test_acceptance_oos_tracker_firewall.py tests/test_local_candidate_dual_oos_tracker.py tests/test_local_candidate_v03_oos.py tests/test_krs_oos_promotion_gate.py tests/test_execution_store.py tests/test_source_acquisition_consolidation.py tests/test_recovery_result_entry.py tests/test_common_exact_continuity_shadow.py tests/test_correctness_closure.py

      - name: Formal import closure guard
        run: python runtime/formal_import_closure.py --entry runtime/non_jra_formal_runner.py

      - name: Current Authority guard
        run: |
          python runtime/family_authority_guard.py \
            --selftest \
            --authority-path profiles/KM_FAMILY_CURRENT_AUTHORITY_20261001_R36.json

      - name: Verify R36 single-entry R3 checkpoint integrity, fallback and freezes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.load(open(path,encoding="utf-8"))

          ca=load("profiles/KM_FAMILY_CURRENT_AUTHORITY_20261001_R36.json")
          route=load("profiles/venue_chat_routes_20261001_R36.json")
          runtime=load("profiles/family_runtime_contracts_20260929_R27.json")
          suite=load("profiles/KM_LOCAL_SUITE_MANIFEST_20261001_R15.json")
          gateway=load("profiles/current_execution_gateway.json")
          single=load("profiles/family_formal_single_entry_20261001_R3.json")

          assert ca["manifest_id"]=="KM-FAMILY-CURRENT-AUTHORITY-20261001-R36"
          assert ca["predecessor"]=="KM-FAMILY-CURRENT-AUTHORITY-20260929-R35"
          cc=ca["common_family_components"]
          assert cc["formal_single_entry"]==single["profile_id"]
          assert cc["venue_routing"]==route["profile_id"]
          assert cc["family_runtime_contracts"]==runtime["profile_id"]
          assert cc["local_suite_manifest"]==suite["manifest_id"]

          assert route["profile_id"]=="KM-VENUE-CHAT-FORMAL-ROUTING-20261001-R36"
          handoff=route["chat_execution_handoff"]
          assert handoff["canonical_single_entry_path"]=="runtime/formal_intents/*.json"
          assert handoff["canonical_single_entry_workflow"]==".github/workflows/km-formal-single-entry.yml"
          assert "FULL-LIFECYCLE" in handoff["formal_trigger_numerical_semantics"]
          assert handoff["production_prediction_change"] is False
          assert handoff["production_numerical_change"] is False

          assert runtime["profile_id"]=="KM-FAMILY-RUNTIME-CONTRACTS-20260929-R27"
          local=runtime["families"]["LOCAL"]
          assert local["runtime"]=="KM-LOCAL-PHYSICAL-RUNTIME-v1.5-REV.8-20260928-RACE-DAY-SOURCE-PARALLEL"
          assert local["source_acquisition_sha256"]=="3311af0423ba6e8bdf5d427da7b4a9d36a76c20daa682f3ddc7523ee1545a2df"
          assert runtime["production_behavior_change"] is False
          assert runtime["production_numerical_change"] is False
          assert runtime["runtime_bundle_change"] is False

          assert suite["manifest_id"]=="KM-LOCAL-SUITE-MANIFEST-20261001-R15"
          assert suite["runtime"]["contract"]==runtime["profile_id"]
          assert suite["runtime"]["runtime"]==local["runtime"]
          assert suite["production_numeric_suite"]["numerical_change"] is False

          assert gateway["parent_current_authority"]==ca["manifest_id"]
          assert gateway["venue_routing"]==route["profile_id"]
          assert gateway["family_runtime_contracts"]=="profiles/family_runtime_contracts_20260929_R27.json"
          assert gateway["families"]["LOCAL"]["runtime_profile"]==local["runtime"]
          assert gateway["policy"]["single_entry_formal_orchestration_required_for_venue_chat"] is True
          assert gateway["policy"]["full_lifecycle_does_not_imply_full_numerical_authority"] is True
          assert gateway["policy"]["source_checkpoint_basis_required"] is True
          assert gateway["policy"]["static_signed_source_binding_required"] is True
          assert gateway["policy"]["formal_checkpoint_semantic_basis_required"] is True
          assert gateway["policy"]["immutable_formal_reuse_requires_semantic_basis_match"] is True
          assert gateway["policy"]["legacy_unbound_formal_auto_reuse_forbidden"] is True
          assert gateway["policy"]["entry_transport_fallback_required"] is True
          assert gateway["policy"]["entry_transport_fallback_may_bypass_external_safety"] is False
          assert gateway["policy"]["entry_transport_fallback_semantic_hash_required"] is True
          assert gateway["policy"]["entry_transport_fallback_same_execution_id_required"] is True
          assert gateway["policy"]["source_only_is_formal_completion"] is False

          assert single["profile_id"]=="KM-FAMILY-FORMAL-SINGLE-ENTRY-20261001-R3"
          fb=single["entry_transport_fallback"]
          assert fb["trigger"]=="PRIMARY_SINGLE_ENTRY_SUBMISSION_FAILED_BEFORE_GITHUB_COMMIT"
          assert fb["same_execution_id_required"] is True
          assert fb["durable_source_checkpoint_reuse_required"] is True
          assert fb["semantic_payload_preservation"].startswith("EXACT")
          assert fb["safety_policy"]=="DO_NOT_BYPASS_OR_OBFUSCATE_EXTERNAL_SAFETY_CONTROLS"
          assert fb["if_fallback_transport_also_rejected"].startswith("FAIL_CLOSED")
          assert single["checkpoint_policy"]["source_success_survives_formal_failure"] is True
          assert single["checkpoint_policy"]["source_checkpoint_basis_required_for_new_execution"] is True
          assert single["checkpoint_policy"]["static_prediction_signed_source_binding_required_for_single_entry"] is True
          assert single["checkpoint_policy"]["formal_checkpoint_semantic_basis_required_for_new_execution"] is True
          assert single["checkpoint_policy"]["legacy_formal_without_semantic_basis"].startswith("NO AUTOMATIC REUSE")
          assert single["numerical_truthfulness"]["full_lifecycle_does_not_imply_strict_full_numerical"] is True
          assert single["live_acceptance"]["execution_id"]=="LOCAL-SINGLE-ENTRY-LIVE-ACCEPT-20260929-T02"
          assert single["live_acceptance"]["krs_actual_run_count"]==5000
          assert single["live_acceptance"]["immutable_retry_status"]=="ALREADY_COMPLETE / REUSED_IMMUTABLE / NO KRS RERUN"
          assert single["live_acceptance"]["unknown_future_prediction_validation"] is False
          for key,value in single["production_freeze"].items():
              assert value=="UNCHANGED",(key,value)

          orch=Path("runtime/formal_execution_orchestrator.py").read_text(encoding="utf-8")
          assert "RUN_SOURCE_THEN_FORMAL" in orch
          assert "RESUME_FORMAL" in orch
          assert "RETURN_IMMUTABLE_FORMAL" in orch
          assert "require_full_numerical_authority" in orch
          assert "KM-FORMAL-CHECKPOINT-BASIS-v1" in orch
          assert "formal_checkpoint_compatibility" in orch
          assert "bind_formal_request_to_source" in orch
          assert "current_single_entry_profile" in orch
          assert "KM-FAMILY-FORMAL-SINGLE-ENTRY-20260929-R1" not in orch
          fallback=Path("runtime/entry_transport_fallback.py").read_text(encoding="utf-8")
          assert "ENTRY_FALLBACK_SEMANTIC_HASH_MISMATCH" in fallback
          assert "ENTRY_FALLBACK_SAFETY_BYPASS_FORBIDDEN" in fallback
          legacy=Path(".github/workflows/km-family-non-jra-formal-runner.yml").read_text(encoding="utf-8")
          assert "Validate entry transport fallback integrity" in legacy

          runner=Path("runtime/non_jra_formal_runner.py").read_text(encoding="utf-8")
          for token in [
              "failure_class_for",
              "last_successful_stage",
              "resume_hint",
              "RUNTIME_GATEWAY_COMPATIBILITY_FAILED",
          ]:
              assert token in runner

          workflow=Path(".github/workflows/km-formal-single-entry.yml").read_text(encoding="utf-8")
          assert "runtime/formal_intents/*.json" in workflow
          assert "Persist durable successful phase checkpoints" in workflow
          assert "family_authority_guard.py" in workflow
          assert "execution_gateway.py health-check" in workflow

          # Common Role→Pair→Third closure regression:
          # missing W×P2-Protected and Pair×P3 records must be terminalized,
          # but SEMANTIC_ONLY must not create a material Exacta pair.
          from runtime.minimum_efficient_coverage import (
              canonicalize_role_pair_third_closure,
              build_mec_plan,
              MECError,
          )
          closure_fixture={
              "family_id":"LOCAL",
              "race_id":"FNB-CLOSURE-ACCEPTANCE",
              "role_registry":[
                  {"runner_id":"6","column":"W","status":"CORE"},
                  {"runner_id":"5","column":"P2","status":"CORE"},
                  {"runner_id":"3","column":"P2","status":"PROTECTED"},
                  {"runner_id":"5","column":"P3","status":"CORE"},
                  {"runner_id":"3","column":"P3","status":"CORE"},
                  {"runner_id":"1","column":"P3","status":"PROTECTED"},
              ],
              "pair_dispositions":[
                  {"head":"6","second":"5","status":"PURCHASE","reason":"FIXTURE_MATERIAL_PAIR"}
              ],
              "third_dispositions":[
                  {"head":"6","second":"5","third":"3","status":"PURCHASE","reason":"FIXTURE_CORE_THIRD"}
              ],
              "available_bet_types":["EXACTA","TRIO","TRIFECTA"],
          }
          closed,closure_manifest=canonicalize_role_pair_third_closure(closure_fixture)
          assert closure_manifest["status"]=="PASS"
          assert closure_manifest["expected_pair_terminal_count"]==2
          assert closure_manifest["synthesized_pair_terminal_count"]==1
          assert any(
              str(x.get("head"))=="6" and str(x.get("second"))=="3"
              and x.get("status")=="SEMANTIC_ONLY"
              for x in closed["pair_dispositions"]
          )
          assert any(
              str(x.get("head"))=="6" and str(x.get("second"))=="5"
              and str(x.get("third"))=="1" and x.get("status")=="SEMANTIC_ONLY"
              for x in closed["third_dispositions"]
          )
          closure_plan=build_mec_plan(closed,None,strict_head_closure=True,min_stake=100)
          assert closure_plan["material_coverage_ratio"]==1.0
          assert not any(
              x["bet_type"]=="EXACTA" and x["selection"]==[6,3]
              for x in closure_plan["tickets"]
          )
          assert any(
              x["bet_type"]=="TRIO" and set(x["selection"])=={1,5,6}
              for x in closure_plan["tickets"]
          )

          no_material_pair={
              "family_id":"LOCAL",
              "race_id":"FNB-CLOSURE-HEAD-GUARD",
              "role_registry":[
                  {"runner_id":"7","column":"W","status":"CONDITIONAL"},
                  {"runner_id":"5","column":"P2","status":"CORE"},
              ],
              "pair_dispositions":[],
              "third_dispositions":[],
          }
          no_material_pair,_=canonicalize_role_pair_third_closure(no_material_pair)
          try:
              build_mec_plan(no_material_pair,None,strict_head_closure=True,min_stake=100)
              raise AssertionError("SEMANTIC_ONLY_MUST_NOT_SATISFY_MATERIAL_HEAD_CLOSURE")
          except MECError as exc:
              assert "ACTIVE_W_WITHOUT_MATERIAL_PAIR_CLOSURE" in str(exc)

          runner=Path("runtime/non_jra_formal_runner.py").read_text(encoding="utf-8")
          assert "canonicalize_role_pair_third_closure" in runner
          assert 'stage(' in runner and '"FINAL_ROLE_PAIR_THIRD"' in runner
          assert '"role_pair_third_closure"' in runner

          print(json.dumps({
              "status":"PASS",
              "authority":ca["manifest_id"],
              "single_entry":single["profile_id"],
              "runtime":local["runtime"],
              "prediction_change":"NONE",
              "numerical_change":"NONE",
              "resume":"SOURCE_CHECKPOINT_PLUS_IMMUTABLE_FORMAL"
          },ensure_ascii=False,indent=2))
          PY
