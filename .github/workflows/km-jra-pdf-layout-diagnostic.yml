name: KeibaMetrics JRA PDF Layout Diagnostic

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-pdf-layout-diagnostic.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q pymupdf
      - name: Print official PDF text layout
        run: |
          python - <<'PY'
          import urllib.request, fitz
          url="https://www.jra.go.jp/keiba/rpdf/pdf/20260922-04nakayama07.pdf"
          req=urllib.request.Request(url,headers={"User-Agent":"KeibaMetrics-JRA-Source-Acquisition/1.0"})
          raw=urllib.request.urlopen(req,timeout=30).read()
          doc=fitz.open(stream=raw,filetype="pdf")
          for pi,p in enumerate(doc):
              lines=[x.strip() for x in p.get_text("text").splitlines() if x.strip()]
              print(f"===PAGE {pi+1}===")
              for i,line in enumerate(lines):
                  print(f"{i:03d}: {line}")
          PY
