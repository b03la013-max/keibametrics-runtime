name: JRA BVI Research Regression

on:
  pull_request:
    paths:
      - 'research/jra_bvi_next/**'
      - 'tests/test_jra_bvi_next_candidate.py'
      - '.github/workflows/km-jra-bvi-research-regression.yml'
  push:
    branches: [main]
    paths:
      - 'research/jra_bvi_next/**'
      - 'tests/test_jra_bvi_next_candidate.py'
      - '.github/workflows/km-jra-bvi-research-regression.yml'

permissions:
  contents: read

jobs:
  offline-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q pytest cryptography beautifulsoup4
      - name: Test qualification, unknown uncertainty and research boundaries offline
        run: >-
          python -m pytest -q
          tests/test_jra_bvi_next_candidate.py
          research/jra_bvi_next/test_identity_label_audit.py
          research/jra_bvi_next/test_identity_label_times.py
