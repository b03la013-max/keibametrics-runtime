name: JRA Official Postrace Zero-Bet Learning
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-no-bet-postresult-learning.yml"
      - "runtime/jra_no_bet_postresult_learning.py"
      - "runtime/family_pfs_owner_scorecard.py"
      - "tests/test_jra_no_bet_postresult_learning.py"
      - "runtime/jra_source_runtime/jra_race_day_autopilot.py"
      - "tests/test_jra_no_bet_handoff.py"
      - "tests/test_jra_no_bet_result_binding.py"
      - "tests/test_jra_no_bet_projection.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-no-bet-postresult-learning.yml"
  schedule:
    - cron: "25 8-15 * * *"
  workflow_dispatch:
    inputs:
      race_id:
        description: "Optional exact JRA Race ID; empty keeps the existing scheduled cohort"
        required: false
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  zero-bet-learning-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify source-bound zero-stake result-learning invariants
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_jra_production_no_bet_terminal.py tests/test_jra_no_bet_postresult_learning.py tests/test_jra_no_bet_handoff.py tests/test_jra_no_bet_result_binding.py tests/test_jra_no_bet_projection.py

  official-result-ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: zero-bet-learning-regression
    runs-on: ubuntu-latest
    timeout-minutes: 22
    concurrency:
      group: jra-official-zero-stake-postresult
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Acquire actual JRA post-result facts, only after posted start
        id: capture
        env:
          PYTHONPATH: runtime:runtime/jra_source_runtime
          RACE_ID_FILTER: ${{ inputs.race_id }}
        run: |
          python - <<'PY'
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from jra_production_no_bet_terminal import verify_no_bet_terminal
          from jra_no_bet_postresult_learning import select_no_bet_paths
          from jra_same_day_results import _open_day,_fetch_race
          import json
          now=datetime.now(timezone.utc)
          selected=__import__("os").environ.get("RACE_ID_FILTER","")
          files=select_no_bet_paths(Path("runtime/jra_no_bet_terminals"),selected)
          pending=[]
          for path in files:
              target=Path("runtime/jra_no_bet_learning")/path.name
              if target.exists():continue
              intent=Path("runtime/jra_formal_intents")/path.name
              if not intent.exists():continue
              try:
                  t=json.loads(path.read_text(encoding="utf-8"))
                  verify_no_bet_terminal(t,require_live=True)
                  i=json.loads(intent.read_text(encoding="utf-8"))
                  if t["race_id"]!=i.get("race_id") or (selected and t["race_id"]!=selected):
                      raise ValueError("NO_BET_INTENT_OR_SELECTED_RACE_MISMATCH")
                  post=datetime.fromisoformat(i["scheduled_post_at"].replace("Z","+00:00"))
                  if not (post+timedelta(minutes=10)<=now<=post+timedelta(days=7)):continue
                  key=((i.get("jra_source") or {}).get("jra_meeting_key") or "")
                  rn=int(i["race_no"])
                  if len(str(key))!=10 or not 1<=rn<=12:continue
                  pending.append((post,path,i,t,key,rn))
              except (ValueError,KeyError,TypeError):
                  continue
          # Bounded official traffic; never request a future or missing result.
          # Current meeting first: unresolved older captures must not starve today.
          pending.sort(key=lambda p:p[0],reverse=True)
          captures=0
          for _,path,intent,t,key,rn in pending[:4]:
              try:
                  opener,referer,day_html,k,d=_open_day(intent["race_date"],key)
                  snap,parsed=_fetch_race(
                      opener,referer,day_html,k,d,rn,
                      (now+timedelta(minutes=10)).isoformat(),
                  )
                  if parsed.get("official") is not True or len(parsed.get("runners") or [])<3:
                      continue
                  captured={
                      "profile":"KM-JRA-OFFICIAL-POSTRESULT-OIDC-CAPTURE-v1-20261010",
                      "race_id":intent["race_id"],
                      "execution_id":path.stem,
                      "race_no":rn,
                      "original_prediction_cutoff":intent["prediction_cutoff"],
                      "result_capture_deadline":(now+timedelta(minutes=10)).isoformat(),
                      "result_capture_timestamp":now.isoformat(),
                      "classification":"POST_RACE_RESULT_ONLY / NOT_PREDICTION_EVIDENCE",
                      "source_snapshot":snap,
                      "official_result_detail":parsed,
                  }
                  out=Path("runtime_out/capture")/(path.stem+".json")
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_text(json.dumps(captured,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
                  captures+=1
              except Exception as exc:
                  print("JRA_OFFICIAL_POSTRESULT_NOT_READY",path.stem,str(exc)[:300])
                  continue
          with open(__import__("os").environ["GITHUB_OUTPUT"],"a") as f:
              f.write("captured="+("true" if captures else "false")+"\n")
          print("JRA_POSTRESULT_OFFICIAL_CAPTURED",captures)
          PY
      - uses: actions/attest-build-provenance@v2
        if: steps.capture.outputs.captured == 'true'
        with:
          subject-path: runtime_out/capture/*.json
      - name: Verify OIDC capture and NO_BET decision before learning
        id: settle
        if: steps.capture.outputs.captured == 'true'
        env:
          PYTHONPATH: runtime
          RACE_ID_FILTER: ${{ inputs.race_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          from hashlib import sha256
          from datetime import datetime,timezone
          from jra_no_bet_postresult_learning import (build_no_bet_learning,
              select_no_bet_paths,persist_no_bet_review_state,verify_no_bet_oidc,_hash)
          count=0
          selected=os.environ.get("RACE_ID_FILTER","")
          for path in select_no_bet_paths(Path("runtime_out/capture"),selected):
              terminal_path=Path("runtime/jra_no_bet_terminals")/path.name
              try:
                  source=json.loads(path.read_text(encoding="utf-8"))
                  terminal=json.loads((Path("runtime/jra_no_bet_terminals")/path.name).read_text(encoding="utf-8"))
                  if source["race_id"]!=terminal["race_id"] or source["execution_id"]!=path.stem or (selected and terminal["race_id"]!=selected):
                      raise ValueError("NO_BET_CAPTURE_OR_SELECTED_RACE_MISMATCH")
                  proofs={
                      "capture":verify_no_bet_oidc(path,kind="capture",source_digest=os.environ["GITHUB_SHA"],
                          not_before=source["result_capture_timestamp"],not_after=datetime.now(timezone.utc).isoformat()),
                      "terminal":verify_no_bet_oidc(terminal_path,kind="terminal",
                          not_before=terminal["created_at"],
                          not_after=terminal.get("prediction_cutoff") or source["original_prediction_cutoff"]),
                  }
                  for subject,parsed,proof in ((path,source,proofs["capture"]),(terminal_path,terminal,proofs["terminal"])):
                      raw=subject.read_bytes()
                      if sha256(raw).hexdigest()!=proof["artifact_file_sha256"] or json.loads(raw)!=parsed:
                          raise ValueError("NO_BET_VERIFIED_ARTIFACT_CONTENT_CHANGED")
                  result=source["official_result_detail"]
                  out=build_no_bet_learning(
                      terminal,result,
                      race_no=source["race_no"],
                      acquired_at=source["result_capture_timestamp"],
                      result_source_snapshot_sha256=source["source_snapshot"]["snapshot_sha256"],
                      official_capture_verified=True,
                  )
                  out["official_oidc_proofs"]=proofs
                  out["sha256"]=_hash({k:v for k,v in out.items() if k!="sha256"})
                  try:
                      projection=persist_no_bet_review_state(
                          ".",terminal,out,execution_id=path.stem,
                          effective_time=datetime.now(timezone.utc).isoformat(),
                          official_capture_verified=True,
                      )
                      dest=Path("runtime_out/learning")/path.name
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
                      for kind,value in (("reviews",projection["review"]),("states",projection["state"])):
                          saved=Path("runtime_out")/kind/path.name
                          saved.parent.mkdir(parents=True,exist_ok=True)
                          saved.write_text(json.dumps(value,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
                  except OSError as exc:
                      # Do not publish canonical files without their complete
                      # current-run OIDC subjects when another Race succeeds.
                      raise RuntimeError("NO_BET_PROJECTION_OUTPUT_WRITE_FAILED") from exc
                  count+=1
              except (ValueError,KeyError,TypeError,subprocess.SubprocessError,OSError) as exc:
                  print("NO_BET_LEARNING_BLOCKED",path.stem,type(exc).__name__,str(exc)[:160])
                  continue
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              fh.write("learned="+("true" if count else "false")+"\n")
          print("JRA_SIGNED_ZERO_EXPOSURE_RESULT_LEARNING",count)
          PY
      - uses: actions/attest-build-provenance@v2
        if: steps.settle.outputs.learned == 'true'
        with:
          subject-path: |
            runtime_out/learning/*.json
            runtime_out/reviews/*.json
            runtime_out/states/*.json
      - uses: actions/upload-artifact@v4
        if: steps.settle.outputs.learned == 'true'
        with:
          name: jra-zero-bet-official-result-learning-oidc
          path: |
            runtime_out/capture/*.json
            runtime_out/learning/*.json
            runtime_out/reviews/*.json
            runtime_out/states/*.json
          if-no-files-found: error
      - name: Persist immutable zero-bet Learning, exclude from PFS and OOS
        if: steps.settle.outputs.learned == 'true'
        env:
          PYTHONPATH: runtime
        run: |
          set -euo pipefail
          mkdir -p runtime/jra_no_bet_learning
          cp runtime_out/learning/*.json runtime/jra_no_bet_learning/
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/jra_no_bet_learning runtime/reviews_auto runtime/learning_states
          if ! git diff --cached --quiet; then
            git commit -m "learning: JRA OIDC attested zero-bet official result [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main; then
                # A FINAL on another path can arrive without a rebase conflict.
                # Recheck this run's exact targets after every successful rebase.
                python -c 'import json; from pathlib import Path; from jra_no_bet_postresult_learning import require_no_bet_final_absent; require_no_bet_final_absent(".",[json.loads(p.read_text())["race_id"] for p in Path("runtime_out/learning").glob("*.json")])'
                if git push origin HEAD:main; then exit 0; fi
              fi
              git rebase --abort || true
              sleep $((attempt*2))
            done
            exit 1
          fi
