name: LOCAL MEC-R5 Settlement Classification Acceptance

on:
  pull_request:
    paths:
      - 'runtime/local_mec_r5_shadow.py'
      - 'runtime/local_mec_r5_oos_tracker.py'
      - 'tests/test_local_mec_r5_shadow.py'
      - 'tests/test_local_mec_r5_oos_tracker.py'
      - '.github/workflows/km-local-result-from-signed-final.yml'
      - '.github/workflows/local-mec-r5-settlement-classification-acceptance.yml'
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and test R5 temporal classification
        run: |
          python -m pip install -q pytest
          python -m py_compile runtime/local_mec_r5_shadow.py runtime/local_mec_r5_oos_tracker.py
          pytest -q tests/test_local_mec_r5_shadow.py tests/test_local_mec_r5_oos_tracker.py
          grep -q 'signed_final_binding_valid=True' .github/workflows/km-local-result-from-signed-final.yml
          python - <<'PY'
          import json
          x=json.load(open("runtime/local_mec_r5_oos_status.json",encoding="utf-8"))
          assert x["status"]=="WAITING_30"
          assert x["eligible_races"]==0
          assert x["remaining_races"]==30
          assert x["production_effect"]=="NONE"
          print("LOCAL_MEC_R5_SETTLEMENT_CLASSIFICATION_PASS")
          PY
