name: KeibaMetrics Mac runner check
# One-shot environment check of the Owner's self-hosted Mac (no provider contact, no data writes).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /runtime/local_autopilot/
            /runtime/*.py
            /runtime/local_physical/nar_source_manifest.py
            /profiles/*.json
            /mapping/*.json
            /research/kametani/
            /research/nankan/
            /research/local_bvi/
            /tests/test_local_ticket_tree.py
            /tests/test_local_triple_umatan.py
      - name: Python, venv, deps, imports, TLS
        run: |
          set -uo pipefail
          PYBIN=""
          for c in python3.13 python3.12 /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 \
                   /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 /opt/homebrew/bin/python3 python3 python; do
            if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)'; then PYBIN="$c"; break; fi
          done
          echo "PYBIN=$PYBIN"; [ -n "$PYBIN" ] || { echo PYTHON_3_12_REQUIRED; exit 1; }
          "$PYBIN" -m venv "$RUNNER_TEMP/kmvenv" && . "$RUNNER_TEMP/kmvenv/bin/activate"
          python --version
          python -m pip install -q cryptography pytest
          python -c "import runtime.local_autopilot.run, runtime.local_autopilot.formal_rakuten, cryptography; print('imports OK')"
          python -c "import urllib.request,json; print('github TLS', urllib.request.urlopen('https://api.github.com/zen', timeout=15).status)"
          python -c "import urllib.request; print('JMA TLS', urllib.request.urlopen('https://www.jma.go.jp/bosai/amedas/const/amedastable.json', timeout=15).status)"
          python -c "print('float sum 3.12 semantics', sum([0.1]*10) == 1.0)"
          python -m pytest -q tests/test_local_ticket_tree.py tests/test_local_triple_umatan.py 2>&1 | tail -3
          git --version; curl --version | head -1; sw_vers || true
