name: JRA AKI v2.1 enacted mapping acceptance
on:
  pull_request:
    paths:
      - 'runtime/jra_aki*'
      - 'runtime/capital_policy.py'
      - 'runtime/jra_production_auto_handoff.py'
      - 'profiles/jra_aki_v21*'
      - 'profiles/KM_FAMILY_CURRENT_AUTHORITY_20261011_R50.json'
      - 'governance/JRA_AKI_V21_OWNER_ENACTMENT_20261011.json'
      - 'tests/test_jra_aki*'
      - '.github/workflows/km-formal-request-runner.yml'
      - '.github/workflows/km-jra-aki-v21-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/jra_aki*'
      - 'profiles/jra_aki_v21*'
      - 'profiles/KM_FAMILY_CURRENT_AUTHORITY_20261011_R50.json'
      - '.github/workflows/km-jra-aki-v21-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enacted-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest beautifulsoup4 cryptography
      - run: python -m pytest -q tests/test_jra_aki_v21.py tests/test_jra_aki_v21_enacted.py tests/test_jra_aki_capital_preflight.py tests/test_jra_production_auto_handoff.py tests/test_jra_static_owner_executable.py tests/test_minimum_efficient_coverage.py tests/test_jra_ticket_tree_renderer.py tests/test_jra_owner_authorized_rules.py
      - run: python tests/test_capital_policy.py
