name: Netkeiba Data Key Discovery
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-netkeiba-key-discovery.yml"
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,html
          from pathlib import Path
          url="https://race.netkeiba.com/race/data.html?race_id=202609040812"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja,en;q=0.3"})
          with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(5000000)
          s=raw.decode("euc-jp","ignore")
          links=[]
          for m in re.finditer(r'href=["\']([^"\']*surf_summary\.html\?[^"\']+)["\']',s,re.I):
              u=html.unescape(m.group(1))
              label=re.sub(r"<[^>]+>"," ",s[m.end():m.end()+300])
              label=re.sub(r"\s+"," ",html.unescape(label)).strip()
              links.append({"url":u,"label_tail":label[:120]})
          uniq=[];seen=set()
          for x in links:
              if x["url"] not in seen:seen.add(x["url"]);uniq.append(x)
          out={"source_sha256":__import__("hashlib").sha256(raw).hexdigest(),"links":uniq}
          p=Path("runtime/diagnostics/netkeiba_data_keys.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_data_keys.json
          git commit -m "diagnostic: discover netkeiba data keys [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
