name: LOCAL Physical Runtime Acceptance

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/local-physical-runtime-acceptance.yml"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify LOCAL physical runtime and signed E2E
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, datetime
          BASE="https://quorumprobe-production.up.railway.app/local"
          HSV=["base_competitive_ability","class_strength","condition_fit","distance_fit","surface_fit","gate_reliability","initial_acceleration","position_intent","inside_cut_ability","outside_press_ability","leader_need","stalk_acceptance","crowd_tolerance","early_position_hold","midrace_hold","progression_ceiling","progression_timing","corner_acceleration","traffic_escape","sustained_speed","pressure_tolerance","front_friction_tolerance","long_move_tolerance","final_reserve","deceleration_risk","training_state","bodyweight_state","layoff_uncertainty","comment_state","data_confidence"]
          STATIC=["tpi","zai_win","zai_place","sri","t3i","f3s","w_aki","p2_aki","p3_aki","asi","rsi"]
          def req(path,payload=None,method="POST",timeout=300):
              data=None if payload is None else json.dumps(payload,separators=(",",":")).encode()
              h={"content-type":"application/json"} if payload is not None else {}
              r=urllib.request.Request(BASE+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:
                      raw=x.read().decode(); return x.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: body=json.loads(raw)
                  except: body={"raw":raw}
                  return e.code,body

          hc,h=req("/health",None,"GET",60)
          print("LOCAL_HEALTH",hc,json.dumps(h,ensure_ascii=False))
          assert hc==200 and h["status"]=="READY" and h["family"]=="LOCAL"
          assert h["engine_version"]=="1.1.0"
          assert h["calibration_status"]=="PROVISIONAL_UNCALIBRATED"
          assert h["receipt_signer_key_id"]=="KM-LOCAL-RUNTIME-ED25519-20260922"

          def horse(no,base):
              hsv={k:base+((i%7)-3) for i,k in enumerate(HSV)}
              static={k:base+((i%5)-2) for i,k in enumerate(STATIC)}
              return {"horse_no":no,"name":f"LOCAL-TEST-{no}","gate_no":no,"hsv":hsv,"static":static,
                      "pzr":{"aggressive":1,"standard":2,"conservative":1},"static_roles":["W"] if no==1 else ["P2"]}
          krs_input={
              "race":{"race_id":"KM-LOCAL-PHYSICAL-ACCEPT-20260922-T01","prediction_id":"LOCAL-ACCEPT-T01","revision_no":1,
                      "engine_version":"1.1.0","parameter_map_version":"0.1-provisional"},
              "environment":{"course_family":"LOCAL-SYNTHETIC","surface":"dirt","distance":1400,"going":"good",
                             "field_size":3,"gci_confidence":80,"similar_condition_confidence":80,"freshness_confidence":100},
              "simulation":{"run_count":5000,"master_seed":20260922,"seed_replicates":1,"seed_stability_runs":500,"scenario_runs":500},
              "horses":[horse(1,72),horse(2,64),horse(3,58)]
          }
          freeze=datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload={
              "family_id":"LOCAL","race_id":"KM-LOCAL-PHYSICAL-ACCEPT-20260922-T01",
              "required_index_unresolved":0,"full_numerical_calculation":True,"static_prediction_frozen":True,
              "krs_input_data":krs_input,"run_count":5000,"seed":20260922,
              "final_prediction_package":{"ranking":[1,2,3],"roles":{"1":["W"],"2":["P2"],"3":["P3"]},"source":"LOCAL_SYNTHETIC_ACCEPTANCE"},
              "final_ticket":{"finalized":True,"total_investment":300,"tickets":[
                  {"bet_type":"WIN","selection":[1],"stake":100},
                  {"bet_type":"EXACTA","selection":[1,2],"orientation":"1>2","stake":100},
                  {"bet_type":"TRIFECTA","selection":[1,2,3],"orientation":"1>2>3","stake":100}
              ]},
              "final_freeze_timestamp":freeze
          }
          code,out=req("/formal",payload,"POST",600)
          print("LOCAL_FORMAL_HTTP",code)
          print("LOCAL_FORMAL_STATUS",out.get("receipt",{}).get("status"))
          print("LOCAL_FORMAL_RECEIPT",out.get("receipt_sha256"))
          assert code==200 and out.get("receipt",{}).get("status")=="FULL_FORMAL_E2E_PASS"
          art=out["artifact"]
          pre=art["pre_krs_receipt"]; run=art["krs_run_receipt"]; fin=art["final_receipt"]
          assert pre["receipt"]["status"]=="PASS"
          assert run["receipt"]["status"]=="EXECUTED"
          assert fin["receipt"]["status"]=="PASS"
          assert run["artifact"]["requested_run_count"]==5000
          assert run["artifact"]["actual_run_count"]==5000
          for label,env in [("PRE_KRS",pre),("KRS_RUN",run),("FINAL",fin),("FORMAL",out)]:
              vc,v=req("/verify",env,"POST",60)
              print("LOCAL_VERIFY",label,vc,json.dumps(v,ensure_ascii=False))
              assert vc==200 and v.get("valid") is True
          print("LOCAL_PHYSICAL_ACCEPTANCE_PASS",json.dumps({
              "runtime_revision":h["runtime_revision"],
              "runtime_app_sha256":h["runtime_app_sha256"],
              "engine_sha256":h["engine_sha256"],
              "parameter_map_sha256":h["parameter_map_sha256"],
              "signer":h["receipt_signer_key_id"],
              "public_key_b64":h["receipt_public_key_b64"],
              "requested_run_count":run["artifact"]["requested_run_count"],
              "actual_run_count":run["artifact"]["actual_run_count"],
              "pre_krs_receipt":pre["receipt_sha256"],
              "krs_receipt":run["receipt_sha256"],
              "final_receipt":fin["receipt_sha256"],
              "formal_receipt":out["receipt_sha256"]
          },ensure_ascii=False))
          PY
