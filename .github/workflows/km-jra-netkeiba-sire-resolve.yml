name: JRA Netkeiba Sire Resolve Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-sire-resolve.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,sys,re,html
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode
          out={}
          for sire in ["Kingman","クリソベリル","ディスクリートキャット","キズナ"]:
            url="https://db.netkeiba.com/?pid=horse_list&word="+urllib.parse.quote(sire)
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja"})
            with urllib.request.urlopen(req,timeout=25) as r:
              raw=r.read(3000000);ct=r.headers.get("content-type","")
            dec=_decode(raw,ct);links=[]
            for href,body in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',dec,re.I|re.S):
              label=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",body))).strip()
              if label==sire or sire in label:
                links.append({"href":html.unescape(href),"label":label})
            out[sire]={"url":url,"links":links[:20]}
          p=Path("runtime/diagnostics/netkeiba_sire_resolve.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime";git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_sire_resolve.json
          git commit -m "diagnostic: sire exact resolver [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
