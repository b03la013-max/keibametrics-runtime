name: JRA HSN12 v1.7 Frozen Source Adapter Coverage
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-hsn12-v17-adapter-coverage.yml"
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Reconnect current adapters to frozen pre-race identity
        run: |
          python - <<'PY'
          import copy,json,sys
          from pathlib import Path
          sys.path.insert(0,"runtime")
          sys.path.insert(0,"runtime/jra_source_runtime")
          from jra_registered_common import enrich_with_registered_common
          from jra_person_stats import enrich_with_person_stats
          from jra_source_to_evidence_features import compile_source_to_features
          from jra_zero_touch_source_index_orchestrator import build_source_runner_stubs

          env=json.load(open("runtime/executions/KM-JRA-HSN-20260926-R12-LIVE-R2/SOURCE/runs/36226047250/source_receipt_envelope.json",encoding="utf-8"))
          art=copy.deepcopy(env["artifact"])
          original_sha=art["source_snapshot_sha256"]
          # Diagnostic cutoff is intentionally post-race. Output is never eligible
          # for Production/OOS; this only tests current parser/adapter wiring.
          diag_cutoff="2026-09-27T00:00:00+09:00"
          art,werr=enrich_with_registered_common(art,diag_cutoff,require_workout=True)
          art,perr=enrich_with_person_stats(art,diag_cutoff,require_person_stats=False,max_workers=3)
          mapping=json.load(open("mapping/jra_base_index_evidence_mapping_v1.0_20260921.json",encoding="utf-8"))
          runners=build_source_runner_stubs(art)
          rep=compile_source_to_features(art,runners,mapping)
          rc=art.get("jra_registered_common") or {}
          ps=art.get("jra_official_person_stats") or {}
          out={
            "profile":"KM-JRA-HSN12-v1.7-FROZEN-SOURCE-ADAPTER-COVERAGE-20260926",
            "classification":"POST-START / MECHANICAL / NO-PRODUCTION / NO-OOS",
            "original_signed_source_snapshot_sha256":original_sha,
            "runner_count":len(runners),
            "registered_common_status":rc.get("status"),
            "workout_runner_count":((rc.get("workout") or {}).get("runner_count")),
            "speed_runner_count":((rc.get("speed") or {}).get("runner_count")),
            "workout_errors":werr,
            "person_status":ps.get("status"),
            "person_runner_count":ps.get("runner_count"),
            "matched_jockey_count":ps.get("matched_jockey_count"),
            "matched_trainer_count":ps.get("matched_trainer_count"),
            "direct_jockey_token_count":ps.get("direct_jockey_token_count"),
            "direct_trainer_token_count":ps.get("direct_trainer_token_count"),
            "person_errors":perr,
            "production_compiler_formal_base_ready_after_merge":rep.get("formal_base_ready_after_merge"),
            "production_compiler_missing_source_families":rep.get("missing_source_families"),
            "generated_feature_counts":{rid:r.get("generated_production_feature_count") for rid,r in rep["runners"].items()},
            "failed_indices":{rid:[k for k,v in (r.get("coverage",{}).get("indices") or {}).items() if not v.get("pass")] for rid,r in rep["runners"].items()},
            "source_only_failed_indices":{rid:[k for k,v in (r.get("source_only_coverage",{}).get("indices") or {}).items() if not v.get("pass")] for rid,r in rep["runners"].items()},
            "production_effect":"NONE"
          }
          assert out["runner_count"]==16,out
          assert out["registered_common_status"]=="PASS",out
          assert out["workout_runner_count"]==16,out
          p=Path("runtime/diagnostics/hsn12_v17_frozen_adapter_coverage.json")
          p.write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist diagnostic
        run: |
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/hsn12_v17_frozen_adapter_coverage.json
          git commit -m "diagnostic: persist HSN12 v1.7 adapter coverage [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 1
