name: JRA Netkeiba Workout Default Schema Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-workout-default-schema.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - run: |
          python - <<'PY'
          import json,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0,"runtime/jra_source_runtime")
          from source_acquisition import _decode,_html_tables
          url="https://race.netkeiba.com/race/oikiri.html?race_id=202609040812"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja"})
          with urllib.request.urlopen(req,timeout=30) as r:
            raw=r.read(8000000);ct=r.headers.get("content-type","")
          dec=_decode(raw,ct);tabs=_html_tables(dec)
          relevant=[t for t in tabs if t and any("馬" in str(x) and "番" in str(x) for x in t[0])]
          out={"tables":[t[:5] for t in relevant]}
          Path("runtime/diagnostics/netkeiba_workout_default_schema.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime";git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_workout_default_schema.json
          git commit -m "diagnostic: workout default schema [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
