name: JRA Netkeiba Sire Link Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-netkeiba-sire-link-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,html
          from pathlib import Path
          url="https://race.netkeiba.com/race/shutuba.html?race_id=202609040812"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"ja"})
          with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(6000000)
          dec=raw.decode("euc-jp","ignore")
          sires=["Kingman","クリソベリル","ディスクリートキャット","ビッグアーサー","コパノリッキー","アジアエクスプレス","ヘニーヒューズ","サンダースノー","リアルスティール","サトノアラジン","モズアスコット","ミッキーアイル","シニスターミニスター","パイロ","キズナ","ホッコータルマエ"]
          out={}
          for sire in sires:
            locs=[]
            for m in re.finditer(re.escape(sire),dec,re.I):
              frag=dec[max(0,m.start()-800):m.end()+800]
              links=re.findall(r'href=["\']([^"\']+)["\']',frag,re.I)
              locs.append({"links":links[-10:],"fragment":re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",html.unescape(frag)))[:1200]})
            out[sire]=locs[:3]
          p=Path("runtime/diagnostics/netkeiba_sire_links.json")
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"; git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/netkeiba_sire_links.json
          git commit -m "diagnostic: netkeiba sire links [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*2)); done
          exit 1
