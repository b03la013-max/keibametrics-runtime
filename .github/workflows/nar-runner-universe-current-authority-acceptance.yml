name: NAR Runner Universe Current Authority Acceptance

on:
  pull_request:
    paths:
      - 'governance/KM-LOCAL-INPUT-SOURCE-OPS-v1.6-20260924.md'
      - 'profiles/local_information_source_registry_v1.9_20260924.json'
      - 'profiles/KM_LOCAL_SUITE_MANIFEST_20260924_R7.json'
      - 'profiles/venue_chat_routes_20260924_R11.json'
      - 'profiles/family_runtime_contracts_20260924_R9.json'
      - 'profiles/KM_FAMILY_CURRENT_AUTHORITY_20260924_R9.json'
      - 'runtime/family_runtime_contract.py'
      - '.github/workflows/nar-runner-universe-current-authority-acceptance.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate official runner universe authority closure
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0,"runtime")
          import family_runtime_contract as frc
          P=pathlib.Path("profiles")
          auth=json.loads((P/"KM_FAMILY_CURRENT_AUTHORITY_20260924_R9.json").read_text())
          suite=json.loads((P/"KM_LOCAL_SUITE_MANIFEST_20260924_R7.json").read_text())
          route=json.loads((P/"venue_chat_routes_20260924_R11.json").read_text())
          reg=json.loads((P/"local_information_source_registry_v1.9_20260924.json").read_text())
          contract=frc.load_contracts()

          RUNTIME="KM-LOCAL-PHYSICAL-RUNTIME-v1.5-REV.6-20260924-OFFICIAL-WEATHER-POPULATION-EVIDENCE"
          UNIVERSE="KM-LOCAL-NAR-RUNNER-UNIVERSE-v1.0-20260923"
          CONTRACT="KM-FAMILY-RUNTIME-CONTRACTS-20260924-R9"

          assert contract["profile_id"]==CONTRACT
          assert contract["predecessor"]=="KM-FAMILY-RUNTIME-CONTRACTS-20260923-R8"
          assert auth["manifest_id"]=="KM-FAMILY-CURRENT-AUTHORITY-20260924-R9"
          assert auth["predecessor"]=="KM-FAMILY-CURRENT-AUTHORITY-20260923-R8"
          assert auth["common_family_components"]["family_runtime_contracts"]==CONTRACT
          assert auth["common_family_components"]["venue_routing"]=="KM-VENUE-CHAT-FORMAL-ROUTING-20260924-R11"

          la=auth["family_scoped_authority"]["LOCAL"]
          # Preserve Fifth-HQ-aligned numerical/measurement stack.
          assert la["production_suite"]=="KM-LOCAL-RENDERED-INTEGRITY-20260827-R3"
          assert la["production_numeric_status"].startswith("FROZEN")
          assert la["common_canon"]=="ケイバメトリクス地方版 v4.13 Rev.1"
          assert la["krs"]=="v1.7-KRS Rev.1"
          assert la["krs_ops"]=="v1.7 Rev.1"
          assert la["reflection"]=="v1.4 Rev.1"
          assert la["kms"]=="v1.4-KMS Rev.1"
          assert la["csl"]=="v1.1-CSL Rev.1"
          assert la["runtime"]==RUNTIME
          assert la["nar_runner_universe"]==UNIVERSE

          assert suite["manifest_id"]=="KM-LOCAL-SUITE-MANIFEST-20260924-R7"
          assert suite["production_numeric_suite"]["status"]=="FROZEN"
          assert suite["production_numeric_suite"]["numerical_change"] is False
          assert suite["runtime"]["contract"]==CONTRACT
          assert suite["runtime"]["runtime"]==RUNTIME
          assert suite["runner_universe"]["profile"]==UNIVERSE
          assert suite["runner_universe"]["external_pre_krs_hard_gate"] is True

          assert reg["profile_id"]=="KM-LOCAL-INFORMATION-SOURCE-REGISTRY-v1.9-20260924"
          assert reg["input_source_ops"]=="KM-LOCAL-INPUT-SOURCE-OPS-v1.6-20260924"
          assert reg["runner_universe"]["profile"]==UNIVERSE
          assert reg["runner_universe"]["request_match_required"] is True
          assert reg["runner_universe"]["external_pre_krs_match_required"] is True

          assert route["profile_id"]=="KM-VENUE-CHAT-FORMAL-ROUTING-20260924-R11"
          lr=route["family_routes"]["LOCAL"]
          assert lr["runtime_contract"]==CONTRACT
          assert lr["runtime_revision"]==RUNTIME
          assert lr["official_runner_universe_hard_gate"] is True
          assert route["formal_path"].index("OFFICIAL_RUNNER_UNIVERSE_BUILD") < route["formal_path"].index("FAMILY_NUMERICAL_MATERIALIZATION")
          assert route["formal_path"].index("PRE_KRS_OFFICIAL_RUNNER_UNIVERSE_MATCH") < route["formal_path"].index("PRE_KRS_VERIFIED")

          lc=contract["families"]["LOCAL"]
          assert lc["runtime"]==RUNTIME
          assert lc["nar_runner_universe"]==UNIVERSE
          assert lc["runner_universe_acceptance"]["direct_live_run_id"]==35769508360
          assert lc["runner_universe_acceptance"]["full_formal_run_id"]==35769640173
          assert lc["runner_universe_acceptance"]["numeric_coverage"]=={"required_count":348,"calculated_count":348,"unresolved_count":0}
          assert lc["runner_universe_acceptance"]["actual_run_count"]==5000
          assert lc["runner_universe_acceptance"]["verified"] is True

          resolved=frc.resolve_family_runtime({"family_id":"LOCAL"},contract)
          assert resolved["executable"] is True
          assert resolved["contract"]["runtime"]==RUNTIME

          # JRA/BAN remain isolated and unchanged in authority class.
          assert contract["families"]["JRA"]["external_endpoint"]=="https://quorumprobe-production.up.railway.app"
          assert contract["families"]["BAN"]["execution_status"]=="BLOCKED-PHYSICAL-RUNTIME-UNVERIFIED"

          print("NAR_RUNNER_UNIVERSE_CURRENT_AUTHORITY_ACCEPTANCE_PASS")
          PY
