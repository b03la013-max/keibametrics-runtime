name: Family LOCAL Correctness Measurement Acceptance

permissions:
  contents: read
  actions: read

on:
  pull_request:
    branches: [main, fix/jra-oct25-deadheat-lineage-closeout]
    paths:
      - "scripts/ohi_forward_shadow_snapshot.py"
      - "tests/test_ohi_forward_shadow_snapshot.py"
      - "scripts/ohi_paper_day_review.py"
      - "scripts/ohi_frozen_path_diagnostics.py"
      - "scripts/ohi_readonly_portfolio_diagnostics.py"
      - "tests/test_ohi_frozen_path_diagnostics.py"
      - "tests/test_ohi_readonly_portfolio_diagnostics.py"
      - "runtime/formal_execution_orchestrator.py"
      - "runtime/common_exact_continuity_shadow.py"
      - "runtime/family_conversion_diagnostics.py"
      - "runtime/non_jra_formal_runner.py"
      - "runtime/local_mec_r5_oos_tracker.py"
      - "profiles/KM_FAMILY_CURRENT_AUTHORITY_20261005_R40.json"
      - "governance/KM-FAMILY-LOCAL-CORRECTNESS-MEASUREMENT-20261005-R1.json"
      - "research/common/KM-FAMILY-OHI-20261005-DAY-REGRESSION-R1.json"
      - "research/common/KM-FAMILY-CONVERSION-DIAGNOSTICS-SHADOW-20261005-R1.json"
      - "tests/test_local_central_weekend_import.py"
      - "runtime/ohi_source_admission_candidate.py"
      - "profiles/ohi_personal_source_admission_candidate_20261026.json"
      - "tests/test_ohi_source_admission_candidate.py"
      - "tests/test_common_exact_continuity_shadow.py"
      - "tests/test_family_conversion_diagnostics.py"
      - "tests/test_local_mec_r5_shadow.py"
      - "tests/test_ohi_20261005_family_regression.py"
      - ".github/workflows/km-family-local-correctness-measurement-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "runtime/formal_execution_orchestrator.py"
      - "runtime/common_exact_continuity_shadow.py"
      - "runtime/local_mec_r5_oos_tracker.py"
      - "profiles/KM_FAMILY_CURRENT_AUTHORITY_20261005_R40.json"
      - "governance/KM-FAMILY-LOCAL-CORRECTNESS-MEASUREMENT-20261005-R1.json"
      - "research/common/KM-FAMILY-OHI-20261005-DAY-REGRESSION-R1.json"
      - ".github/workflows/km-family-local-correctness-measurement-acceptance.yml"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q pytest cryptography PyMuPDF fastapi
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            runtime/formal_execution_orchestrator.py \
            runtime/common_exact_continuity_shadow.py \
            runtime/family_conversion_diagnostics.py \
            runtime/non_jra_formal_runner.py \
            runtime/local_mec_r5_oos_tracker.py

      - name: Focused family regression tests
        run: |
          python -m pytest -q \
            tests/test_ohi_forward_shadow_snapshot.py \
            tests/test_ohi_frozen_path_diagnostics.py \
            tests/test_ohi_readonly_portfolio_diagnostics.py \
            tests/test_ohi_source_admission_candidate.py \
            tests/test_local_central_weekend_import.py \
            tests/test_common_exact_continuity_shadow.py \
            tests/test_family_conversion_diagnostics.py \
            tests/test_local_mec_r5_shadow.py \
            tests/test_ohi_20261005_family_regression.py \
            tests/test_formal_execution_orchestrator.py \
            tests/test_recovery_result_entry.py

      - name: Validate R40 authority
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"runtime")
          from family_authority_guard import selftest

          r39=json.load(open("profiles/KM_FAMILY_CURRENT_AUTHORITY_20261004_R39.json",encoding="utf-8"))
          r40=json.load(open("profiles/KM_FAMILY_CURRENT_AUTHORITY_20261005_R40.json",encoding="utf-8"))
          assert r40["predecessor"]==r39["manifest_id"]
          assert r40["common_family_components"]["mec"]==r39["common_family_components"]["mec"]
          assert r40["common_family_components"]["capital_policy"]==r39["common_family_components"]["capital_policy"]
          assert r40["family_scoped_authority"]["JRA"]==r39["family_scoped_authority"]["JRA"]
          assert r40["family_scoped_authority"]["BAN"]==r39["family_scoped_authority"]["BAN"]
          assert r40["supersession_declaration"]["predictive_model_formula_change"] is False
          assert r40["supersession_declaration"]["production_numerical_change"] is False
          assert r40["supersession_declaration"]["mec_r3_policy_change"] is False
          assert r40["supersession_declaration"]["capital_policy_change"] is False
          report=selftest("profiles/KM_FAMILY_CURRENT_AUTHORITY_20261005_R40.json")
          assert report["status"]=="PASS", report
          print("R40_LOCAL_CORRECTNESS_MEASUREMENT_PASS",report)
          PY

      - name: Lint workflow
        run: |
          ./actionlint -color .github/workflows/km-family-local-correctness-measurement-acceptance.yml


      - name: Package exact existing OHI entry code only
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/runtime
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys,tempfile,zipfile
          from pathlib import Path
          root=Path.cwd()
          manifest_path=root/'profiles/ohi_private_entry_code_transport_20261026.json'
          manifest=json.loads(manifest_path.read_text())
          assert manifest['code_ref']=='d61f5c563238be2c812ef4bf912bd5b872b84fed'
          assert manifest['private_inputs_included'] is False
          assert manifest['production_authority'] is False
          if subprocess.run(['git','cat-file','-e',manifest['code_ref']+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',manifest['code_ref']],check=True)
          destination=root/'ohi-code-transport'
          destination.mkdir()
          archive=destination/'ohi-existing-entry-code.zip'
          with zipfile.ZipFile(archive,'x',zipfile.ZIP_DEFLATED) as bundle:
              for item in manifest['files']:
                  relative=item['path']
                  p=Path(relative)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in ('runtime','mapping','profiles')
                  assert p.suffix in ('.py','.json') and 'executions' not in p.parts
                  expected=subprocess.check_output(['git','show',manifest['code_ref']+':'+relative])
                  assert len(expected)==item['bytes']
                  assert hashlib.sha256(expected).hexdigest()==item['sha256']
                  bundle.writestr(relative,expected)
              bundle.writestr('CODE_TRANSPORT_MANIFEST.json',json.dumps(manifest,sort_keys=True))
          with tempfile.TemporaryDirectory() as temporary:
              with zipfile.ZipFile(archive) as bundle:bundle.extractall(temporary)
              environment=dict(os.environ,PYTHONPATH=temporary+os.pathsep+str(Path(temporary)/'runtime'))
              subprocess.run([sys.executable,'-c','import runtime.ohi_single_race_research'],cwd=temporary,env=environment,check=True)
          (destination/'sha256.json').write_text(json.dumps({'code_ref':manifest['code_ref'],'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'file_count':len(manifest['files']),'private_inputs_included':False},indent=2))
          PY
      - name: Publish code transport without private SOURCE or predictions
        uses: actions/upload-artifact@v4
        with:
          name: ohi-existing-entry-code-${{ github.event.pull_request.head.sha || github.sha }}
          path: ohi-code-transport/
          retention-days: 7

