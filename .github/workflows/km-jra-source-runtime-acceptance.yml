name: KeibaMetrics JRA Source Runtime Acceptance

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/jra_source_runtime/**'
      - 'tests/test_jra_source_runtime.py'
      - 'tests/test_jra_horse_history.py'
      - 'tests/test_jra_cancelled_pdf_peer_column.py'
      - 'tests/test_jra_source_observed_fact_retention.py'
      - '.github/workflows/km-jra-source-runtime-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/jra_source_runtime/**'
      - 'tests/test_jra_source_runtime.py'
      - 'tests/test_jra_horse_history.py'
      - 'tests/test_jra_cancelled_pdf_peer_column.py'
      - 'tests/test_jra_source_observed_fact_retention.py'
      - '.github/workflows/km-jra-source-runtime-acceptance.yml'
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt pytest
      - name: Python compile
        run: |
          python -m py_compile runtime/jra_source_runtime/*.py
      - name: Unit acceptance
        run: python -m pytest -q tests/test_jra_source_runtime.py tests/test_jra_horse_history.py tests/test_jra_cancelled_pdf_peer_column.py tests/test_jra_source_observed_fact_retention.py
      - name: Persist acceptance marker
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          p={
            "profile":"KM-JRA-SOURCE-RUNTIME-ACCEPTANCE-v1.0-20260925",
            "status":"PASS",
            "workflow_run_id":os.environ["RUN_ID"],
            "source_sha":os.environ["SOURCE_SHA"],
            "verified_at":datetime.now(timezone.utc).isoformat(),
            "checks":["PYTHON_COMPILE","JRA_SOURCE_MANIFEST","JRA_RUNNER_UNIVERSE","TSL_PARSER","SOURCE_HOST_ALLOWLIST","OFFICIAL_HORSE_HISTORY_PARSER","CANCELLED_PRINTED_NUMBER_COLUMN","PRE_PARSE_PDF_RAW_RETENTION"]
          }
          os.makedirs("runtime/jra_source_runtime",exist_ok=True)
          json.dump(p,open("runtime/jra_source_runtime/acceptance_status.json","w",encoding="utf-8"),ensure_ascii=False,sort_keys=True,indent=2)
          PY
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/jra_source_runtime/acceptance_status.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: persist JRA source runtime acceptance PASS [skip ci]"
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              git fetch origin main
              sleep $((attempt * 2))
            done
            echo "acceptance marker persistence failed after retries" >&2
            exit 1
          fi
