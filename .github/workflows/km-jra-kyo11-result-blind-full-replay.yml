name: JRA Kyoto R11 Result-Blind Full Pipeline Replay
on:
  push:
    branches: [main]
    paths:
      - 'scripts/jra_kyo_20261012_r11_result_blind_replay.py'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install official JRA Source dependencies
        run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Full replay SOURCE to FINAL
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: runtime:runtime/jra_source_runtime
        run: |
          mkdir -p runtime_out/kyo11_replay
          python scripts/jra_kyo_20261012_r11_result_blind_replay.py --out runtime_out/kyo11_replay
      - name: OIDC-attest replay report
        if: always()
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: runtime_out/kyo11_replay/*.json
      - name: Upload all checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyo11-result-blind-replay-${{ github.run_id }}
          path: runtime_out/kyo11_replay/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist compact report separate from Production FINAL
        if: always()
        run: |
          if [ -f runtime_out/kyo11_replay/report.json ]; then
            mkdir -p runtime/acceptance_artifacts
            cp runtime_out/kyo11_replay/report.json runtime/acceptance_artifacts/KM-JRA-KYO-20261012-R11-RESULT-BLIND-REPLAY-R1.json
            git config user.name keibametrics-runtime
            git config user.email actions@users.noreply.github.com
            git add runtime/acceptance_artifacts/KM-JRA-KYO-20261012-R11-RESULT-BLIND-REPLAY-R1.json
            git commit -m "replay: persist Kyoto11 result-blind stage receipts [skip ci]" || exit 0
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort 2>/dev/null || true
            done
          fi
