name: KM Parameter Map v0.2 History Scan 20260920
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/km-param-v02-historyscan-20260920.yml"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every historical blob for canonical SHA
        shell: bash
        run: |
          set -euo pipefail
          TARGET="8bdeec86ddd163dd7594819f531d732bde5939f9cc0f2f991f2d6eba5f8cdee5"
          hit=0
          git rev-list --objects --all | while read -r obj path; do
            typ="$(git cat-file -t "$obj" 2>/dev/null || true)"
            [ "$typ" = blob ] || continue
            size="$(git cat-file -s "$obj")"
            # skip huge blobs > 5 MB
            [ "$size" -le 5242880 ] || continue
            tmp="$(mktemp)"
            git cat-file blob "$obj" > "$tmp"
            sha="$(sha256sum "$tmp" | awk '{print $1}')"
            if [ "$sha" = "$TARGET" ]; then
              echo "TARGET_FOUND_OBJECT=$obj PATH=$path SIZE=$size"
              echo "TARGET_B64_BEGIN"
              base64 -w0 "$tmp"
              echo
              echo "TARGET_B64_END"
              hit=1
            elif printf '%s' "$path" | grep -Eqi 'parameter.*map|adapter'; then
              echo "HIST_CANDIDATE_SHA=$sha OBJECT=$obj PATH=$path SIZE=$size"
            fi
            rm -f "$tmp"
          done
