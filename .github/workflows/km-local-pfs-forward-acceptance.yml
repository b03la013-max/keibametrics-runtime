name: LOCAL PFS Forward R41 Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest cryptography PyMuPDF fastapi httpx pyyaml
      - name: Conversion lifecycle and regression
        run: >-
          python -m pytest -q
          tests/test_pfs_forward_r41.py
          tests/test_family_conversion_diagnostics.py
          tests/test_local_mec_r5_shadow.py
          tests/test_local_mec_r5_oos_tracker.py
          tests/test_common_exact_continuity_shadow.py
          tests/test_ohi_20261005_family_regression.py
          tests/test_formal_execution_orchestrator.py
          tests/test_recovery_result_entry.py
      - name: Authority acceptance
        run: python runtime/family_authority_guard.py --selftest --authority-path profiles/KM_FAMILY_CURRENT_AUTHORITY_20261006_R41.json
      - name: Compile lifecycle
        run: python -m py_compile runtime/family_conversion_diagnostics.py runtime/local_result_from_signed_final.py runtime/non_jra_formal_runner.py runtime/local_candidate_postresult.py runtime/local_mec_r5_oos_tracker.py
