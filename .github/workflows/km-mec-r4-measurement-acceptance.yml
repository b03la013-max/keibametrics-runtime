name: KeibaMetrics MEC R4 Measurement Acceptance

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - "runtime/mec_r4_shadow.py"
      - "runtime/mec_r4_oos_tracker.py"
      - "runtime/pfs_grand_review.py"
      - "tests/test_mec_r4_shadow.py"
      - "tests/test_mec_r4_oos_tracker.py"
      - "tests/test_pfs_grand_review.py"
      - "research/mec/KM-FAMILY-MEC-R4-FORWARD-OOS-GRID-20260922-R1.json"
      - ".github/workflows/km-mec-r4-measurement-acceptance.yml"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python -m py_compile runtime/mec_r4_shadow.py runtime/mec_r4_oos_tracker.py runtime/pfs_grand_review.py
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Measurement tests
        run: |
          python -m pytest -q tests/test_mec_r4_shadow.py tests/test_mec_r4_oos_tracker.py tests/test_pfs_grand_review.py
      - name: Generate current measurement artifacts
        run: |
          python runtime/pfs_grand_review.py
          python runtime/mec_r4_oos_tracker.py
      - name: Assert frozen OOS governance
        run: |
          python - <<'PY'
          import json
          s=json.load(open("runtime/mec_r4_oos_status.json",encoding="utf-8"))
          assert s["candidate_id"]=="MEC-R4-CPSS-SHADOW-v0.1"
          assert s["target_eligible_races"]==30
          assert s["automatic_promotion"] is False
          assert s["production_effect"]=="NONE"
          assert "FORBIDDEN" in s["rule_change_during_window"]
          assert "PRODUCTION_BASELINE_R3" in s["aggregates"]
          assert "comparison_vs_production" in s
          p=json.load(open("runtime/pfs_grand_review/current.json",encoding="utf-8"))
          assert p["production_effect"]=="NONE"
          assert "FORMAL_PRE_RACE" in p["cohorts"]
          print("MEC_R4_MEASUREMENT_ACCEPTANCE=PASS")
          PY

      - name: Persist acceptance PASS marker
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p={
            "profile":"KM-MEC-R4-MEASUREMENT-ACCEPTANCE-v1.0",
            "status":"PASS",
            "workflow_run_id":os.environ["RUN_ID"],
            "source_sha":os.environ["SOURCE_SHA"],
            "verified_at":datetime.now(timezone.utc).isoformat(),
            "checks":[
              "PYTHON_SYNTAX",
              "MEC_R4_SHADOW_TEST",
              "MEC_R4_OOS_TRACKER_TEST",
              "PFS_GRAND_REVIEW_TEST",
              "OOS_GOVERNANCE_ASSERTIONS"
            ]
          }
          os.makedirs("runtime",exist_ok=True)
          json.dump(p,open("runtime/mec_r4_measurement_acceptance_status.json","w",encoding="utf-8"),ensure_ascii=False,sort_keys=True,indent=2)
          PY
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/mec_r4_measurement_acceptance_status.json runtime/mec_r4_oos_status.json runtime/pfs_grand_review/current.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: persist MEC R4 measurement acceptance PASS [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
