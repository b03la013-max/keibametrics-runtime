name: KAW v2.5 candidate regression
on:
  pull_request:
    paths:
      - 'runtime/kaw_v25_conversion_review.py'
      - 'tests/test_kaw_v25_conversion_review.py'
      - 'tools/kaw_v25_*.py'
      - 'evidence/kaw_v25_20261013/**'
      - '.github/workflows/km-kaw-v25-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest cryptography PyYAML
      - name: Restore verified result-only observations
        run: python tools/kaw_v25_restore_evidence.py
      - name: Signed fixture and unchanged Production regression
        run: >-
          python -m pytest -q tests/test_kaw_v25_conversion_review.py
          tests/test_local_jra_execution_guarantees.py
          tests/test_execution_workflow_contract.py
          tests/test_formal_execution_orchestrator.py
          tests/test_aki_adaptive_purchase_shadow.py
          tests/test_aki_adaptive_oos_tracker.py
      - name: Independent signed numerical and settlement audit
        run: python tools/kaw_v25_day_regression.py
