name: JRA JBIS Pedigree Link Probe
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/km-jra-jbis-pedigree-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,re,urllib.request,html
          from pathlib import Path
          url="https://www.jbis.or.jp/race/20260926/109/12/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 KeibaMetrics/1.0","Accept-Language":"ja"})
          with urllib.request.urlopen(req,timeout=30) as r:
            raw=r.read(8000000); ct=r.headers.get("content-type","")
          dec=raw.decode("utf-8","ignore")
          names=["スターウェーブ","レッドレベンディス","タイセイピューマ","ザウリ","ブルーノート","ゴールデンバランス","タイセイディアマン","インディゴアスール","シュバルツガイスト","ニホンピロカラット","キャッチアシーフ","アスゴッド","ランドスター","ヒットミー","ストロングボンド","ダズリングダンス"]
          out={"bytes":len(raw),"sha256":__import__("hashlib").sha256(raw).hexdigest(),"runners":{}}
          for n in names:
            m=re.search(re.escape(n),dec)
            if not m: out["runners"][n]={"found":False}; continue
            frag=dec[max(0,m.start()-2500):m.end()+5000]
            links=[html.unescape(x) for x in re.findall(r'href=["\']([^"\']+)["\']',frag,re.I)]
            sirelinks=[x for x in links if re.search(r"/horse/\d+/",x)]
            txt=html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",frag)))
            out["runners"][n]={"found":True,"horse_links":sirelinks[-20:],"fragment":txt[:2500]}
          p=Path("runtime/diagnostics/jbis_pedigree_probe.json");p.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - run: |
          git config user.name "keibametrics-runtime"; git config user.email "actions@users.noreply.github.com"
          git add runtime/diagnostics/jbis_pedigree_probe.json
          git commit -m "diagnostic: JBIS pedigree links [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*2)); done
          exit 1
