name: LOCAL Runtime Correctness Regression

on:
  push:
    branches: [main]
    paths:
      - 'runtime/local_physical/nar_runner_universe.py'
      - 'runtime/local_physical/nar_source_manifest.py'
      - 'runtime/local_physical/source_acquisition.py'
      - 'runtime/local_physical/app.py'
      - 'runtime/local_physical/app_v15.py'
      - 'tests/test_nar_runner_universe.py'
      - 'tests/test_nar_source_manifest.py'
      - 'runtime/local_numerical_authority_gate.py'
      - 'runtime/local_evidence_to_base_production.py'
      - 'tests/test_local_numerical_authority_gate.py'
      - 'tests/test_local_production_numerical_closure.py'
      - '.github/workflows/local-runtime-correctness-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run NAR source and runner-universe regressions
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_nar_runner_universe.py \
            tests/test_nar_source_manifest.py \
            tests/test_local_numerical_authority_gate.py \
            tests/test_local_production_numerical_closure.py
      - name: Compile LOCAL runtime modules
        run: |
          python -m py_compile             runtime/local_physical/app.py             runtime/local_physical/app_v15.py             runtime/local_physical/source_acquisition.py             runtime/local_physical/nar_source_manifest.py             runtime/local_physical/nar_runner_universe.py \
            runtime/local_numerical_authority_gate.py \
            runtime/local_evidence_to_base_production.py
