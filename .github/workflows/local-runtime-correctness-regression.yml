name: LOCAL Runtime Correctness Regression

on:
  push:
    branches: [main]
    paths:
      - 'runtime/local_physical/nar_runner_universe.py'
      - 'runtime/local_physical/nar_source_manifest.py'
      - 'runtime/local_physical/source_acquisition.py'
      - 'runtime/local_physical/app.py'
      - 'runtime/local_physical/app_v15.py'
      - 'tests/test_nar_runner_universe.py'
      - 'tests/test_nar_source_manifest.py'
      - 'runtime/local_numerical_authority_gate.py'
      - 'runtime/local_evidence_to_base_production.py'
      - 'tests/test_local_numerical_authority_gate.py'
      - 'tests/test_local_production_numerical_closure.py'
      - '.github/workflows/local-runtime-correctness-regression.yml'
  pull_request:
    paths: ['runtime/**', 'tests/**', 'research/utility/**', '.github/workflows/local-runtime-correctness-regression.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run NAR source and runner-universe regressions
        run: |
          python -m pip install --disable-pip-version-check -q pytest PyYAML cryptography
          python -m pytest -q \
            tests/test_source_acquisition.py \
            tests/test_source_acquisition_access_policy.py \
            tests/test_source_acquisition_consolidation.py \
            tests/test_urw_nankan_reference_source.py \
            tests/test_private_source_storage_boundary.py \
            tests/test_urw_owner_candidate.py \
            tests/test_local_source_first_entry.py \
            tests/test_local_production_static_owner.py \
            tests/test_minimum_efficient_coverage.py \
            tests/test_jra_static_owner_executable.py \
            tests/test_jra_production_auto_handoff.py \
            tests/test_nar_runner_universe.py \
            tests/test_sbo_runtime_acceptance_gateway.py \
            tests/test_nar_source_manifest.py \
            tests/test_local_numerical_authority_gate.py \
            tests/test_local_production_numerical_closure.py \
            tests/test_phase_b_utility.py \
            tests/test_phase_b1_forward.py \
            tests/test_phase_b2_authority.py \
            tests/test_local_fullnumerical_candidate_v01.py \
            tests/test_pfs_grand_review.py \
            tests/test_krs_prediction_utility.py \
            tests/test_krs_oos_promotion_gate.py \
            tests/test_common_exact_continuity_shadow.py \
            tests/test_family_pfs_improvement.py \
            tests/test_ohi_20261008_result_reflection_regression.py \
            tests/test_fnb_20261102_numeric_proof_grade.py \
            tests/test_fnb_20261102_r6_acceptance.py \
            tests/test_fnb_20261102_r7_plan_provenance.py \
            tests/test_fnb_20261102_r7_arithmetic_witness.py \
            tests/test_fnb_20261102_r7_ticket_disposition.py \
            tests/test_fnb_20261102_r8_semantics.py \
            tests/test_fnb_20261102_r8_arithmetic.py \
            tests/test_fnb_20261102_r8_delivery.py \
            tests/test_fnb_20261102_r8_missingness.py \
            tests/test_fnb_20261102_r8_official_changes.py \
            tests/test_fnb_20261102_r9_delivery.py \
            tests/test_fnb_20261102_r9_evidence_63.py \
            tests/test_fnb_20261102_r9_numeric_disposition.py \
            tests/test_fnb_20261102_r9_60r_observation.py \
            tests/test_nar_auxiliary_evidence.py
      - name: Compile LOCAL runtime modules
        run: |
          python -m py_compile             runtime/local_physical/app.py             runtime/local_physical/app_v15.py             runtime/local_physical/source_acquisition.py             runtime/local_physical/nar_source_manifest.py             runtime/local_physical/nar_runner_universe.py \
            runtime/local_numerical_authority_gate.py \
            runtime/local_race_key_gate.py \
            runtime/local_fnb_r6_readonly_acceptance.py \
            runtime/local_fnb_r6_numeric_readback.py \
            runtime/local_fnb_r7_plan_provenance.py \
            runtime/local_fnb_r7_arithmetic_witness.py \
            runtime/local_fnb_r7_ticket_disposition.py \
            runtime/local_fnb_r8_card_raw_check.py \
            runtime/local_fnb_r8_odds_raw_check.py \
            runtime/local_fnb_r8_single_race_semantics.py \
            runtime/local_fnb_r8_day_semantics.py \
            runtime/local_fnb_r8_arithmetic_first.py \
            runtime/local_fnb_r8_arithmetic_roles.py \
            runtime/local_fnb_r8_arithmetic_29.py \
            runtime/local_fnb_r8_delivery_completeness.py \
            runtime/local_fnb_r8_missingness_census.py \
            runtime/local_fnb_r9_method_audit.py \
            runtime/local_fnb_r9_evidence_63.py \
            runtime/local_fnb_r9_numeric_disposition.py \
            runtime/local_fnb_r9_60r_observation.py \
            runtime/local_evidence_to_base_production.py

      - name: FNB R9 historical signed-store numerical and feature receipts
        run: |
          python - <<'PY'
          import sys, json, hashlib
          from pathlib import Path
          sys.path.insert(0, str(Path('runtime').resolve()))
          from runtime import formal_execution_orchestrator as o
          from runtime.local_numeric_cell_integrity import attest_cell_grid
          from runtime.local_fnb_r7_arithmetic_witness import verify_arithmetic
          from local_fullnumerical_production import materialize_production
          eid = 'LOCAL-KM-LOCAL-FNB-20261002-R04-LIVE-R1-EXEC'
          phase = o.resolve_phase(eid, 'SOURCE')
          assert phase is not None
          env = o._load_checkpoint_json(phase, 'source_receipt_envelope.json')
          assert env['receipt']['status'] == 'SOURCE_FROZEN'
          intent = json.loads(Path('runtime/formal_intents/KM-LOCAL-FNB-20261002-R04-LIVE-R1.json').read_text())
          mat = materialize_production(env['artifact'], intent, intent['required_indices'])
          reg = json.loads(Path('mapping/local_evidence_feature_rule_registry_v1.1_production_numerical_20261008.json').read_text())
          mapping = json.loads(Path('mapping/local_full_numerical_mapping_v1.0_production_20261008.json').read_text())
          arithmetic = verify_arithmetic(mat, reg, mapping)
          from runtime.local_fnb_r8_arithmetic_29 import verify_29
          arithmetic29 = verify_29(mat, reg, mapping)
          from runtime.local_fnb_r8_missingness_census import census
          missingness = census(mat)
          from runtime.local_fnb_r9_evidence_63 import audit_63
          evidence63 = audit_63(mat, reg, intent, env['artifact'])
          assert evidence63['status'] == 'ALL_63_COMPONENT_RECORDS_LINEAGE_VERIFIED', evidence63['issues']
          assert missingness['ruled_neutral']==36 and missingness['calculated']==312
          assert arithmetic29['status'] == '29_OF_29_RECORDED_FEATURE_ARITHMETIC_PASS', arithmetic29['issues']
          cells = attest_cell_grid(mat, expected_indices=intent['required_indices'],
                   expected_runner_ids=[r['runner_id'] for r in intent['runners']])
          assert arithmetic['status'] == '12_OF_29_INDEPENDENT_ARITHMETIC_VERIFIED', arithmetic['issues']
          assert cells['status'] == 'CELL_GRID_CONSISTENT', cells['issues']
          assert mat['numeric_coverage']['required_count'] == 348
          authority = mat['production_numerical_authority']
          keys = ['prediction_consumption_authorized','krs_consumption_authorized',
                  'ticket_consumption_authorized','capital_consumption_authorized']
          assert all(authority[k] is False for k in keys)
          payload = {'classification':'RETROSPECTIVE_FNB_20261002_R04_NOT_20261102_LIVE_NOT_OOS',
              'execution_id':eid,'signed_source_status':'HISTORICAL_STORE_STATUS_NOT_FRESH_SIGNATURE_VERIFY',
              'numeric_counts':{k:v for k,v in mat['numeric_coverage'].items() if k!='unresolved'},
              'numeric_grid':cells,'independent_12_index_arithmetic':arithmetic, 'independent_29_index_arithmetic':arithmetic29, 'missingness_census':missingness, 'feature_63_record_lineage':evidence63,
              'consumer_permissions':{k:authority[k] for k in keys},
              'new_runtime_posts':0,'new_signed_final':False,'personal_delivery_ack':False}
          payload['receipt_sha256']=hashlib.sha256(json.dumps(payload,sort_keys=True,
              ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          Path('fnb-r9-historical-numerical-receipt.json').write_text(
              json.dumps(payload,sort_keys=True,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'source_race':eid,'required':348,
              'calculated':mat['numeric_coverage']['calculated_count'],
              'independent_arithmetic_cells':arithmetic['checked_cells'],
              'receipt_sha256':payload['receipt_sha256']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fnb-r9-historical-numerical-${{ github.run_id }}
          path: fnb-r9-historical-numerical-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: FNB R9 day 1 official-raw bound dated read-only acceptance
        run: |
          python -m runtime.local_fnb_r6_readonly_acceptance \
            --root . --date 2026-11-02 --output fnb-r9-readonly-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fnb-r9-readonly-${{ github.run_id }}
          path: fnb-r9-readonly-acceptance.json
          if-no-files-found: warn
          retention-days: 30
      - name: FNB R9 read-only five-day 60R repository receipt matrix
        run: |
          python -m runtime.local_fnb_r9_60r_observation \
            --root . --start-date 2026-11-02 --output fnb-r9-60r-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fnb-r9-60r-${{ github.run_id }}
          path: fnb-r9-60r-matrix.json
          if-no-files-found: warn
          retention-days: 30
