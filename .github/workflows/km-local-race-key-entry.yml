name: KM LOCAL Race-Key Single Entry (candidate)

# Authenticated GitHub Actions ingress with five scalar fields. No per-race
# GitHub file write is needed to START the signed SOURCE process.
on:
  workflow_dispatch:
    inputs:
      venue_id:
        description: 'NAR venue code (KAW, OHI, FNB etc.)'
        type: string
        required: true
      race_date:
        description: 'Race local date YYYY-MM-DD'
        type: string
        required: true
      race_no:
        description: 'Race number 1-12'
        type: string
        required: true
      scheduled_post_at:
        description: 'Official post e.g. 2026-10-15T16:15:00+09:00'
        type: string
        required: true
      prediction_cutoff:
        description: 'Pre-race freeze e.g. 2026-10-15T16:10:00+09:00'
        type: string
        required: true
  repository_dispatch:
    types: [km_local_race_key]
  push:
    branches: [main]
    paths:
      - 'runtime/race_key_requests/*.json'

permissions:
  contents: write
  actions: read

# runtime.local_fullnumerical_production imports existing legacy modules
# from runtime/ as top-level names. Without both roots, python -m fails.
env:
  PYTHONPATH: ${{ github.workspace }}/runtime:${{ github.workspace }}

concurrency:
  # Push has no workflow_dispatch inputs or repository_dispatch payload; scope it
  # to its immutable commit SHA so RESULT wait for another race cannot block
  # the next race's SOURCE acquisition before its prediction cutoff.
  group: km-local-race-key-${{ github.event_name == 'push' && github.sha || format('{0}-{1}-{2}', inputs.venue_id || github.event.client_payload.venue_id, inputs.race_date || github.event.client_payload.race_date, inputs.race_no || github.event.client_payload.race_no) }}
  cancel-in-progress: false

jobs:
  entry:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      execution_id: ${{ steps.gate.outputs.execution_id }}
      formal_ready: ${{ steps.gate.outputs.formal_ready }}
      source_verified: ${{ steps.gate.outputs.source_verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing runtime dependency
        run: python -m pip install -q cryptography
      - name: Resolve authorized five-field race request
        id: fields
        env:
          INPUT_VENUE: ${{ inputs.venue_id || github.event.client_payload.venue_id }}
          INPUT_DAY: ${{ inputs.race_date || github.event.client_payload.race_date }}
          INPUT_NO: ${{ inputs.race_no || github.event.client_payload.race_no }}
          INPUT_POST: ${{ inputs.scheduled_post_at || github.event.client_payload.scheduled_post_at }}
          INPUT_CUTOFF: ${{ inputs.prediction_cutoff || github.event.client_payload.prediction_cutoff }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python - <<'PY'
          import json, os, pathlib, subprocess
          paths = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"], text=True
          ).splitlines()
          candidates = [p for p in paths if p.startswith("runtime/race_key_requests/")
                        and p.endswith(".json")]
          if len(candidates) != 1:
              raise SystemExit("RACE_KEY_PUSH_EXACTLY_ONE_NEW_FILE_REQUIRED")
          path = pathlib.Path(candidates[0])
          data = json.loads(path.read_text(encoding="utf-8"))
          keys = ("venue_id", "race_date", "race_no", "scheduled_post_at", "prediction_cutoff")
          if set(data) != set(keys):
              raise SystemExit("RACE_KEY_PUSH_ONLY_FIVE_SCALAR_FIELDS")
          items = {k: data[k] for k in keys}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for k,v in items.items():
                  if not isinstance(v, (str,int)) or isinstance(v,bool):
                      raise SystemExit("RACE_KEY_VALUE_TYPE_INVALID")
                  f.write(f"{k}={v}\n")
          PY
          else
            {
              echo "venue_id=$INPUT_VENUE"
              echo "race_date=$INPUT_DAY"
              echo "race_no=$INPUT_NO"
              echo "scheduled_post_at=$INPUT_POST"
              echo "prediction_cutoff=$INPUT_CUTOFF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Build race-key SOURCE request from Current Authority
        id: intake
        env:
          VENUE_ID: ${{ steps.fields.outputs.venue_id }}
          RACE_DATE: ${{ steps.fields.outputs.race_date }}
          RACE_NO: ${{ steps.fields.outputs.race_no }}
          POST_AT: ${{ steps.fields.outputs.scheduled_post_at }}
          CUTOFF_AT: ${{ steps.fields.outputs.prediction_cutoff }}
        run: |
          set -euo pipefail
          mkdir -p entry-out
          python -m runtime.local_race_key_intake \
            --venue-id "$VENUE_ID" --race-date "$RACE_DATE" --race-no "$RACE_NO" \
            --scheduled-post-at "$POST_AT" --prediction-cutoff "$CUTOFF_AT" \
            --output entry-out/race_request.json
          python runtime/family_authority_guard.py --request entry-out/race_request.json
      - name: Verify canonical external Runtime
        run: |
          set -euo pipefail
          python runtime/execution_gateway.py health-check --family LOCAL --output entry-out/gateway_preflight.json
      - name: Signed SOURCE and existing frozen-Static handoff
        id: execute
        shell: bash
        run: |
          set +e
          python -m runtime.local_race_entry \
            --request entry-out/race_request.json \
            --output entry-out --run-id "race-key-${{ github.run_id }}" \
            --github-sha "${{ github.sha }}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify signed checkpoint and classify exact completion
        id: gate
        run: |
          set -euo pipefail
          python -m runtime.local_race_key_gate \
            --request entry-out/race_request.json \
            --report entry-out/entry_report.json \
            --output entry-out/gate_receipt.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Persist only verified SOURCE/FORMAL canonical records
        if: steps.gate.outputs.source_verified == 'true'
        env:
          EXECUTION_ID: ${{ steps.gate.outputs.execution_id }}
        run: |
          set -euo pipefail
          mkdir -p "runtime/execution_reports/$EXECUTION_ID"
          cp entry-out/gate_receipt.json "runtime/execution_reports/$EXECUTION_ID/race-key-${{ github.run_id }}.json"
          git config user.name keibametrics-runtime
          git config user.email actions@users.noreply.github.com
          test -f "runtime/executions/$EXECUTION_ID/SOURCE/LATEST.json"
          git add "runtime/executions/$EXECUTION_ID/SOURCE" "runtime/execution_reports/$EXECUTION_ID"
          if [ -f entry-out/generated_formal_intent.json ] && [ -f entry-out/production_static_owner.json ]; then
            test -f "runtime/formal_intents/$EXECUTION_ID.json"
            git add "runtime/formal_intents/$EXECUTION_ID.json"
            mkdir -p "runtime/local_production_static_owner_records"
            cp entry-out/production_static_owner.json "runtime/local_production_static_owner_records/$EXECUTION_ID.json"
            git add "runtime/local_production_static_owner_records/$EXECUTION_ID.json"
          fi
          if [ "${{ steps.gate.outputs.formal_ready }}" = "true" ]; then
            test -f "runtime/executions/$EXECUTION_ID/FORMAL/LATEST.json"
            git add "runtime/executions/$EXECUTION_ID/FORMAL"
          fi
          # Candidate Static is PRE-RESULT evidence only; persist separately
          # from canonical Signed FINAL and never overwrite a frozen shadow.
          if [ -f entry-out/shadow_prediction.json ]; then
            SHADOW_PATH="runtime/local_race_key_shadow/$EXECUTION_ID.json"
            mkdir -p runtime/local_race_key_shadow
            if [ -f "$SHADOW_PATH" ]; then
              # A race-key retry cannot silently rewrite its forward prediction.
              echo "SHADOW_ALREADY_FROZEN: $SHADOW_PATH"
            else
              cp entry-out/shadow_prediction.json "$SHADOW_PATH"
              git add "$SHADOW_PATH"
            fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m "execution: race-key signed checkpoints $EXECUTION_ID [skip ci]"
            python tools/persist_local_checkpoints.py --branch main
          fi
      - name: Upload Source/Static owner handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km-local-race-key-${{ github.run_id }}
          path: entry-out/
          if-no-files-found: warn
          retention-days: 90

  result:
    needs: entry
    if: needs.entry.outputs.formal_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    concurrency:
      group: km-local-race-key-result-${{ needs.entry.outputs.execution_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RESULT runtime dependencies
        run: python -m pip install --disable-pip-version-check -q cryptography
      - name: Verify durable FINAL before any RESULT polling
        env:
          EXECUTION_ID: ${{ needs.entry.outputs.execution_id }}
        run: |
          set -euo pipefail
          test -f "runtime/executions/$EXECUTION_ID/FORMAL/LATEST.json"
          test -f "runtime/formal_intents/$EXECUTION_ID.json"
      - name: Continue signed FINAL to official RESULT and Learning
        id: settle
        env:
          EXECUTION_ID: ${{ needs.entry.outputs.execution_id }}
        run: |
          set +e
          python runtime/formal_execution_orchestrator.py \
            --intent "runtime/formal_intents/$EXECUTION_ID.json" \
            --resume-official-result --result-wait-seconds 10800 \
            --run-id "race-key-${{ github.run_id }}" --github-sha "$(git rev-parse HEAD)"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist verified RESULT and forward measurement ledgers
        if: always()
        env:
          EXECUTION_ID: ${{ needs.entry.outputs.execution_id }}
        run: |
          set -euo pipefail
          if [ -d "runtime/executions/$EXECUTION_ID/RESULT" ]; then
            git config user.name keibametrics-runtime
            git config user.email actions@users.noreply.github.com
            git add "runtime/executions/$EXECUTION_ID/RESULT"
            for path in runtime/local_candidate_forward_measurements runtime/local_candidate_forward_status.json runtime/local_candidate_dual_oos_measurements runtime/local_candidate_dual_oos_status.json runtime/local_candidate_v03_oos_measurements runtime/local_candidate_v03_oos_status.json runtime/mec_shadow_results runtime/mec_shadow_lineage runtime/mec_r4_oos_status.json runtime/local_mec_r5_shadow_results runtime/local_mec_r5_shadow_lineage runtime/local_mec_r5_oos_status.json runtime/aki_adaptive_oos_status.json runtime/common_exact_continuity_shadow_results runtime/common_exact_continuity_shadow_lineage runtime/common_exact_continuity_oos_status.json; do
              if [ -e "$path" ]; then git add "$path"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m "execution: race-key RESULT $EXECUTION_ID [skip ci]"
              python tools/persist_local_checkpoints.py --branch main
            fi
          fi
      - name: Publish Result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km-local-race-key-result-${{ github.run_id }}
          path: runtime_out/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce RESULT completion
        if: always()
        env:
          RC: ${{ steps.settle.outputs.rc }}
        run: test "${RC:-2}" = "0"
