name: KeibaMetrics JRA Race-Day Autopilot
run-name: JRA race-day autopilot ${{ inputs.race_date || 'today' }}

# Dispatches the official race-intent resolver for every race listed in
# runtime/jra_race_day_plan/<date>.json when it enters the dispatch window
# (plan-defined, e.g. 55..30 min before the OFFICIAL post time, after body weights), exactly once per race.
permissions:
  contents: write
  actions: write

on:
  schedule:
    # Every 5 minutes, 09:00-16:55 JST.
    - cron: "*/5 0-7 * * *"
  workflow_dispatch:
    inputs:
      race_date:
        description: "YYYY-MM-DD (empty = today JST)"
        required: false
        type: string

concurrency:
  group: km-jra-race-day-autopilot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Skip quickly when no plan exists for the day
        id: plan
        env:
          RACE_DATE: ${{ inputs.race_date }}
        run: |
          D="${RACE_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          if [ -f "runtime/jra_race_day_plan/$D.json" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install JRA SOURCE runtime dependencies
        if: steps.plan.outputs.exists == 'true'
        run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Resolve official post times and dispatch due races
        if: steps.plan.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.plan.outputs.date }}
        run: |
          set -euo pipefail
          cd runtime/jra_source_runtime
          python jra_race_day_autopilot.py --repo-root ../.. --date "$D" | tee ../../autopilot.json
      - name: Persist dispatch state
        if: steps.plan.outputs.exists == 'true'
        env:
          D: ${{ steps.plan.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "runtime/jra_race_day_plan/$D.state.json" "runtime/jra_race_day_plan/$D.schedule.json"
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: race-day dispatch state $D [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*3))
          done
          exit 1
