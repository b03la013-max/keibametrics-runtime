name: KeibaMetrics JRA Race-Day Autopilot
run-name: JRA race-day autopilot ${{ inputs.race_date || 'today' }} ${{ inputs.mode || github.event.schedule }}

# Runs EVERY official JRA race of the day through the canonical Formal pipeline:
# the canonical race-intent resolver is dispatched exactly once per race when it
# enters the dispatch window (55..30 min before the OFFICIAL post time, after
# body weights, before the 5-minute cutoff). Publishes the per-race status index
# runtime/jra_race_day_status/<date>.{json,md} (FINAL tree / EVIDENCE_NO_BET
# cells / MISSED_WINDOW). One long loop run per day; the 5-minute ticks are a
# backup if the loop did not start (GitHub cron can be delayed or skipped).
permissions:
  contents: write
  actions: write

on:
  schedule:
    # Day loop: start 08:30 JST, tick every 2 min until 17:00 JST.
    - cron: "30 23 * * *"
    # Backup single ticks 09:00-16:55 JST, and status refresh until 21:55 JST.
    - cron: "*/5 0-12 * * *"
  workflow_dispatch:
    inputs:
      race_date:
        description: "YYYY-MM-DD (empty = today JST)"
        required: false
        type: string
      mode:
        description: "loop (until 17:00 JST) or tick"
        required: false
        default: loop
        type: choice
        options: [loop, tick]

concurrency:
  group: km-jra-race-day-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - name: Install JRA SOURCE runtime dependencies
        run: python -m pip install --disable-pip-version-check -q -r runtime/jra_source_runtime/requirements.txt
      - name: Plan every official race, dispatch due races, publish status index
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_DATE: ${{ inputs.race_date }}
          MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          D="${RACE_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          LOOP=()
          if [ "${MODE:-}" = "loop" ] || [ "${SCHEDULE:-}" = "30 23 * * *" ]; then
            LOOP=(--loop-until 17:00 --interval 120)
          fi
          cd runtime/jra_source_runtime
          python jra_race_day_autopilot.py --repo-root ../.. --date "$D" --all-races-default "${LOOP[@]}"
      - name: Persist final state and status index
        if: always()
        run: |
          set -euo pipefail
          D="${{ inputs.race_date }}"; D="${D:-$(TZ=Asia/Tokyo date +%F)}"
          git config user.name "keibametrics-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "runtime/jra_race_day_plan/$D.state.json" "runtime/jra_race_day_plan/$D.schedule.json" \
                  "runtime/jra_race_day_status/$D.json" "runtime/jra_race_day_status/$D.md" 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: race-day state and status $D [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*3))
          done
          exit 1
